# backends.conf — Single source of truth for CLI backends and model names.
#
# Every script that deals with backend/model names MUST source this file
# and use normalize_model_for_backend() instead of inline sed/regex.
#
# Format rules:
#   claude  → hyphens in version: claude-haiku-4-5, claude-opus-4-6
#   copilot → dots in version:    claude-haiku-4.5, claude-opus-4.6
#   others  → pass through unchanged
#
# Usage:
#   source /usr/local/etc/hive/backends.conf   (system)
#   source "$(dirname "$0")/../config/backends.conf"  (repo-relative)
#
#   model=$(normalize_model_for_backend "copilot" "claude-haiku-4-5")
#   # → claude-haiku-4.5
#
#   backend=$(detect_backend_from_model "gpt-5.3-codex")
#   # → copilot

# ── Supported backends ──────────────────────────────────────────────────
# BACKEND_NAME  BINARY   PERM_FLAG                    MODEL_FLAG
KNOWN_BACKENDS="claude copilot goose codex agy bob pi aider litellm opencode kilo"

# ── Backend → binary mapping ────────────────────────────────────────────
backend_binary() {
  case "$1" in
    claude)  echo "claude" ;;
    copilot) echo "copilot" ;;

    codex)   echo "codex" ;;
    agy)     echo "agy" ;;
    bob)     echo "bob" ;;
    goose)   echo "goose" ;;
    pi)      echo "pi" ;;
    aider)   echo "aider" ;;
    opencode) echo "opencode" ;;
    kilo)     echo "kilo" ;;
    # litellm runs Claude Code pointed at a LiteLLM proxy via ANTHROPIC_BASE_URL
    litellm) echo "claude" ;;
    *)       echo "$1" ;;
  esac
}

# ── Host-state denials for the claude family ────────────────────────────
#
# The claude CLI runs with permissions fully bypassed, as the operator's own
# user, directly on the operator's host: the tmux launch path has no container
# and no workspace confinement. That is deliberate for the WORKSPACE — an
# unattended agent that stops to ask permission just hangs, which is the failure
# the codex block below also exists to avoid — but it left nothing at all
# between an agent and the machine hive runs on.
#
# #4918 is what that costs. An agent doing correct work on an assigned
# third-party repo ran that repo's own test suite; a latent defect in two of its
# tests let a hook escape its stubs and call
# `rpm-ostree kargs --append-if-missing=...` against the operator's REAL
# deployment. Three polkit dialogs on the operator's desktop. Nothing was
# written, and the only reason is that the process happened to lack privilege.
#
# NOTE WHAT WOULD NOT HAVE HELPED: rpm-ostree never invoked sudo. It asked
# polkit directly. So denying escalation alone does not close this — the
# host-state tools that reach polkit on their own have to be named.
#
# DENY, NOT ASK. These are --disallowed-tools entries, so a match is refused
# outright and the agent moves on. A permission MODE change would instead make
# the CLI prompt, and nobody is attached to an unattended pane to answer it.
# Verified against Claude Code 2.1.231 that a deny still applies under
# `--dangerously-skip-permissions --permission-mode bypassPermissions` (it does;
# this is the same mechanism claudeGitHubWriteDenyFlags in
# src/pkg/agent/manager.go already relies on) and that matching is
# command-token-aware, so `su` does not also block `subl`.
#
# The list is deliberately minimal: privilege escalation, and the host
# boot/deployment tools that need no escalation to do damage. It is NOT an
# attempt to sandbox the host — that is the podman path (src/pkg/sandbox), and
# #4918 tracks the separate question of why that path is double-gated off by
# default. This is the floor, not the ceiling.
#
# ONE ARGV WORD, COMMA-SEPARATED. The caller word-splits this function's output
# (agent-launch.sh: `read -r -a PERM_ARGS <<< "$PERM_FLAG"`), so the patterns
# cannot be space-separated the way `claude --help` shows them — they would
# arrive as separate argv words and silently deny nothing.
CLAUDE_HOST_DENY_TOOLS='Bash(sudo:*),Bash(pkexec:*),Bash(doas:*),Bash(su:*),Bash(rpm-ostree:*),Bash(bootc:*),Bash(ostree:*),Bash(grubby:*),Bash(bootctl:*),Bash(efibootmgr:*)'

# claude_family_perm_flag emits the permission flags for every backend that
# launches the claude binary (claude, litellm).
claude_family_perm_flag() {
  local base="--dangerously-skip-permissions --permission-mode bypassPermissions"
  # ESCAPE HATCH, named after the codex one so the two read alike. An operator
  # who genuinely wants an agent to manage host state — the hive spoke upgrading
  # its own host, say — sets this and gets the pre-#4918 posture back.
  if is_truthy "${HIVE_CLAUDE_DANGEROUSLY_ALLOW_HOST_STATE:-}"; then
    echo "$base"
  else
    echo "$base --disallowed-tools ${CLAUDE_HOST_DENY_TOOLS}"
  fi
}

# claude_family_local_perm_flag_shell emits the stricter posture used only by
# `just contribute-hive <claude|litellm> local`. Unlike the hub/container paths,
# local mode has no outer container boundary, so Claude Code's native sandbox
# is the boundary. The compact settings JSON is a CLI argument (not a settings
# file the agent can rewrite) and the whole argv is shell-escaped for the tmux
# send-keys consumer.
#
# Network remains unrestricted for arbitrary third-party build/test suites;
# filesystem writes remain limited to HIVE_AGENT_CWD (Claude's cwd) and the
# exact workspace below. `dontAsk` makes any non-Bash tool request outside
# those roots fail instead of hanging an unattended pane for approval.
claude_family_local_perm_flag_shell() {
  if is_truthy "${HIVE_CLAUDE_DANGEROUSLY_BYPASS_APPROVALS_AND_SANDBOX:-}"; then
    backend_perm_flag_shell claude
    return
  fi
  if [[ -z "${HIVE_WORKSPACE_DIR:-}" ]]; then
    echo "ERROR: HIVE_WORKSPACE_DIR is required for the Claude local sandbox" >&2
    return 1
  fi
  if ! command -v jq >/dev/null 2>&1; then
    echo "ERROR: jq is required to configure the Claude local sandbox" >&2
    return 1
  fi

  local settings
  settings="$(jq -cn --arg workspace "$HIVE_WORKSPACE_DIR" '{
    sandbox: {
      enabled: true,
      failIfUnavailable: true,
      autoAllowBashIfSandboxed: true,
      allowUnsandboxedCommands: false,
      filesystem: {allowWrite: [$workspace]},
      network: {allowedDomains: ["*"]}
    }
  }')" || return

  local -a args=(
    --permission-mode dontAsk
    --settings "$settings"
    --add-dir "$HIVE_WORKSPACE_DIR"
  )
  if ! is_truthy "${HIVE_CLAUDE_DANGEROUSLY_ALLOW_HOST_STATE:-}"; then
    args+=(--disallowed-tools "$CLAUDE_HOST_DENY_TOOLS")
  fi

  local word out=""
  for word in "${args[@]}"; do
    out+="$(printf '%q' "$word") "
  done
  printf '%s\n' "${out% }"
}

# copilot_local_perm_flag_shell emits the stricter posture used only by
# `just contribute-hive copilot local`. Copilot CLI has its own OS-enforced
# sandbox (MXC: Seatbelt on macOS, bubblewrap on Linux — same underlying
# bubblewrap dependency the Claude local sandbox above already requires),
# turned on with the `--sandbox` flag introduced in copilot-cli 1.0.60 and
# usable in the headless `-p` mode contributor-relay.sh already launches
# Copilot with (`copilot: { flag: '-p' }` in bin/contributor-relay.sh).
# `--no-sandbox` is also a real flag, so a stale/older `copilot` binary
# silently ignoring `--sandbox` is not something to assume — this function
# verifies the installed CLI actually understands the flag before relying on
# it, and fails closed (falls through to the deny-list-only unconfined path
# below, loudly) rather than claim a boundary an old binary does not have.
#
# --add-dir grants exactly HIVE_WORKSPACE_DIR, same as the Claude/Codex
# grants above, so build/test tooling can still reach the assigned repo.
# Copilot's sandbox does not have a documented filesystem-allowlist flag of
# its own the way Claude's --settings JSON does — --sandbox plus --add-dir is
# the full extent of what the CLI exposes.
copilot_local_perm_flag_shell() {
  if is_truthy "${HIVE_COPILOT_DANGEROUSLY_BYPASS_SANDBOX:-}"; then
    backend_perm_flag_shell copilot
    return
  fi
  if ! copilot --help 2>&1 | grep -qe '--sandbox'; then
    echo "WARNING: installed copilot CLI has no --sandbox flag (needs copilot-cli >= 1.0.60)." >&2
    echo "         Falling back UNCONFINED — set HIVE_COPILOT_DANGEROUSLY_BYPASS_SANDBOX=1 to" >&2
    echo "         silence this warning, or upgrade copilot-cli to get local confinement." >&2
    backend_perm_flag_shell copilot
    return
  fi
  local -a args=(--sandbox --allow-all-tools)
  if [[ -n "${HIVE_WORKSPACE_DIR:-}" ]]; then
    args+=(--add-dir "$HIVE_WORKSPACE_DIR")
  fi

  local word out=""
  for word in "${args[@]}"; do
    out+="$(printf '%q' "$word") "
  done
  printf '%s\n' "${out% }"
}

# opencode_local_perm_flag_shell narrows opencode's local posture with the
# SAME host-state command family the claude deny-list covers, via opencode's
# own `permission.bash` pattern-match config (https://opencode.ai/docs/permissions/).
#
# THIS IS A FLOOR, NOT A SANDBOX — same honest limitation as
# CLAUDE_HOST_DENY_TOOLS above and the same as #4938's original claude
# denylist: opencode has no OS-enforced filesystem boundary of its own
# (confirmed against the current opencode CLI/docs: no bwrap/seatbelt
# integration, no workspace-write mode). "deny" rules are documented to stay
# enforced even under --auto ("auto mode only changes requests that would
# otherwise ask for approval"), so this is a real narrowing, not a no-op —
# but it is a command-name denylist like Claude's, not a filesystem
# boundary like Claude's or Copilot's --sandbox.
#
# OPENCODE_PERMISSION carries inline JSON (documented opencode env var) so no
# on-disk config file is mutated. Explicit deny wins because opencode
# evaluates patterns in order with "last matching rule wins", and this key is
# assembled with catch-all "allow" first, "*" host-state denials last.
OPENCODE_HOST_DENY_PATTERNS='sudo *:pkexec *:doas *:su *:rpm-ostree *:bootc *:ostree *:grubby *:bootctl *:efibootmgr *'

opencode_local_perm_flag_shell() {
  if is_truthy "${HIVE_OPENCODE_DANGEROUSLY_ALLOW_HOST_STATE:-}"; then
    backend_perm_flag_shell opencode
    return
  fi
  if ! command -v jq >/dev/null 2>&1; then
    echo "WARNING: jq not found; opencode local mode cannot apply host-state denials." >&2
    echo "         Falling back UNCONFINED for host-state commands. Install jq, or set" >&2
    echo "         HIVE_OPENCODE_DANGEROUSLY_ALLOW_HOST_STATE=1 to silence this warning." >&2
    backend_perm_flag_shell opencode
    return
  fi

  local bash_json
  bash_json="$(
    IFS=':'; set -- $OPENCODE_HOST_DENY_PATTERNS
    jq -cn --args '{"*": "allow"} + (($ARGS.positional) | map({(.): "deny"}) | add)' -- "$@"
  )" || return
  local perm_json
  perm_json="$(jq -cn --argjson bash "$bash_json" '{bash: $bash}')" || return

  # opencode reads OPENCODE_PERMISSION as inline JSON (no config file
  # mutation, no risk of an agent rewriting a persisted settings file).
  local -a args=(--auto)
  local word out
  out="OPENCODE_PERMISSION=$(printf '%q' "$perm_json") "
  for word in "${args[@]}"; do
    out+="$(printf '%q' "$word") "
  done
  printf '%s\n' "${out% }"
}

# ── Backends with no confinement mechanism at all ───────────────────────
#
# goose, agy, bob, pi, and aider expose no OS-level sandbox, no filesystem
# write-allowlist, and no bash-command deny mechanism analogous to
# opencode's `permission.bash` — verified against each CLI's own current
# documentation, not assumed:
#   - goose: GOOSE_MODE (auto/approve/chat/smart_approve) governs interactive
#     APPROVAL only; none of the four modes confines writes to a directory,
#     and only `auto` is usable unattended.
#   - agy (Google Antigravity CLI): execution modes (default/accept-edits/
#     plan) govern approval only, same as goose; --dangerously-skip-permissions
#     is already what hive passes and there is no lesser mode that still
#     confines the filesystem. agy 1.1.22 also advertises `--sandbox` ("Run in
#     a sandbox with terminal restrictions enabled"), but it is NOT a local
#     OS-level boundary hive can wire here: the binary's own strings show it
#     backed by Jetski's remote/cloud sandbox machinery (a
#     ListAllSandboxesRequest / Sandbox proto with a network endpoint+port,
#     the same shape as a hosted Antigravity cloud workspace), not a local
#     bubblewrap/seccomp/Landlock mechanism like Codex's or Copilot's
#     `--sandbox`. Treat it as unverified-and-likely-unrelated to host
#     confinement until someone confirms otherwise against a live account
#     (#5048's follow-up); do not wire it into backend_perm_flag on the
#     strength of the flag's help text alone — that is exactly the "sounds
#     like a boundary, isn't one" mistake opencode's deny-list already taught
#     this repo to check before trusting.
#   - bob (IBM bobshell): no sandbox, approval mode, or path-restriction
#     mechanism documented anywhere in bob's own docs.
#   - pi (@earendil-works/pi-coding-agent): ships with no sandbox by default;
#     directory confinement exists only via a third-party extension
#     (pi-permission-modes) hive does not install or depend on.
#   - aider: has no sandbox of any kind; runs directly against the
#     filesystem with no Docker/OS isolation option.
#
# An HONEST "unconfined, opt in to proceed" is the documented contract here
# (#4918's own ask: never claim confinement a backend does not have). Local
# mode for these backends REFUSES to launch without the explicit per-backend
# escape hatch below, matching the HIVE_CLAUDE_DANGEROUSLY_* / codex naming
# convention. Container mode remains the confined default for all of them.
unconfined_local_backend_env_var() {
  case "$1" in
    goose) echo "HIVE_GOOSE_DANGEROUSLY_RUN_UNCONFINED" ;;
    agy)   echo "HIVE_AGY_DANGEROUSLY_RUN_UNCONFINED" ;;
    bob)   echo "HIVE_BOB_DANGEROUSLY_RUN_UNCONFINED" ;;
    pi)    echo "HIVE_PI_DANGEROUSLY_RUN_UNCONFINED" ;;
    aider) echo "HIVE_AIDER_DANGEROUSLY_RUN_UNCONFINED" ;;
    *)     echo "" ;;
  esac
}

# unconfined_local_perm_flag_shell is the local-mode entry point for the five
# backends above. It refuses to emit a launch line at all unless the
# operator has set that backend's own escape-hatch env var — there is no
# confinement to fall back to, so silence is not an option (#4918's
# lesson: an unconfined default that says nothing is exactly the failure
# mode this whole change exists to close).
unconfined_local_perm_flag_shell() {
  local backend="$1" var
  var="$(unconfined_local_backend_env_var "$backend")"
  if [[ -z "$var" ]]; then
    # Not one of the five — caller error, not an operator-facing case.
    backend_perm_flag_shell "$backend"
    return
  fi
  if ! is_truthy "${!var:-}"; then
    echo "ERROR: ${backend} has no sandbox, no filesystem write-allowlist, and no" >&2
    echo "       command deny-list hive can wire on the local launch path (verified" >&2
    echo "       against ${backend}'s own current docs — this is not a placeholder)." >&2
    echo "       It would run as \$(id -un) on this machine with nothing standing" >&2
    echo "       between the agent and everything your user can reach." >&2
    echo "" >&2
    echo "       Refusing to launch. Either:" >&2
    echo "         - use container mode instead:  just contribute-hive ${backend}" >&2
    echo "         - or explicitly accept the unconfined risk on this host:" >&2
    echo "             ${var}=1" >&2
    return 1
  fi
  backend_perm_flag_shell "$backend"
}

# ── Backend → permission flag ───────────────────────────────────────────
backend_perm_flag() {
  case "$1" in
    claude)  claude_family_perm_flag ;;
    copilot) echo "--allow-all" ;;
    # bob (IBM bobshell). Mirrors the hub-side launcher (bobLaunchCmd in
    # src/pkg/agent/manager.go) so relay and pod agents behave identically:
    #   --accept-license      bob hard-errors before doing any work unless
    #                         licenseConsent is persisted; the prompt that
    #                         collects it is interactive and nobody is attached
    #                         to an unattended agent loop. Idempotent.
    #   --auth-method api-key bob otherwise defaults to W3ID browser SSO. The
    #                         relay is unattended, so it must use the API key
    #                         from BOBSHELL_API_KEY. The flag is HIDDEN from
    #                         `bob --help` (the bundle registers it then calls
    #                         t.hide()) but is live and validated — an invalid
    #                         value reports Choices: "sso", "api-key".
    #                         It is also the only input that outranks the
    #                         persisted security.auth.selectedType AND
    #                         suppresses bob's write-back of that value, so it
    #                         does NOT stomp a contributor's own ~/.bob config.
    #   --approval-mode yolo  without it bob reports `Auto-approve: Off` and
    #                         blocks forever on its first tool call. Note that
    #                         `-y`/`--yolo` is a BOOLEAN flag in bobshell 1.0.6
    #                         ([boolean] [default: false]), so the former
    #                         `-y yolo` spelling left `yolo` as a stray
    #                         positional argument — i.e. a prompt.
    #   --trust               bob otherwise treats the workdir as untrusted
    #                         and gates tool availability on it.
    # No --model is passed anywhere for bob: it auto-selects its own model and
    # any --model makes every prompt die. See the bob case in the MODEL_FLAG
    # block of bin/contributor-agent.sh.
    bob)     echo "--accept-license --auth-method api-key --approval-mode yolo --trust" ;;

    codex)
      if is_truthy "${HIVE_CODEX_DANGEROUSLY_BYPASS_APPROVALS_AND_SANDBOX:-}"; then
        echo "--dangerously-bypass-approvals-and-sandbox"
      else
        # Hive-delivered work is unattended even in the tmux-backed mode: no
        # operator is guaranteed to be watching the pane when Codex needs to
        # cross its sandbox boundary. Keep the workspace-write sandbox from
        # #3512, but route eligible escalations through Codex's bounded
        # automatic reviewer instead of surfacing an interactive prompt.
        printf -- '--ask-for-approval %s --sandbox %s' \
          "${HIVE_CODEX_APPROVAL_POLICY:-on-request}" \
          "${HIVE_CODEX_SANDBOX_MODE:-workspace-write}"

        # ESCAPE HATCH: ${VAR-default} WITHOUT the colon, so an explicitly
        # EMPTY HIVE_CODEX_APPROVALS_REVIEWER omits the -c key entirely while
        # an unset one still gets auto_review.
        #
        # This matters because `-c approvals_reviewer=` is a Codex CONFIG KEY,
        # and hive cannot prove every Codex release accepts it. If one rejects
        # an unknown -c key at startup, every codex contributor task fails at
        # launch. With `:-` there was no way to turn the key off — the only
        # escape was HIVE_CODEX_DANGEROUSLY_BYPASS_APPROVALS_AND_SANDBOX=1,
        # i.e. the exact unsandboxed posture this block exists to avoid. An
        # operator can now drop just the reviewer key and keep the sandbox.
        local _reviewer="${HIVE_CODEX_APPROVALS_REVIEWER-auto_review}"
        if [[ -n "$_reviewer" ]]; then
          printf -- ' -c approvals_reviewer=%s' "$_reviewer"
        fi

        # The CLI starts in HIVE_AGENT_CWD because that directory is stable and
        # contains no contributor credentials (#4046/#4168). Assigned repos
        # live under the separate HIVE_WORKSPACE_DIR, so make that exact tree a
        # second writable root rather than broadening the sandbox globally.
        #
        # Callers word-split this function's output (agent-launch.sh:
        # `read -r -a PERM_ARGS <<< "$PERM_FLAG"`), so the contract is
        # whitespace-separated and CANNOT carry a path containing whitespace:
        # `--add-dir /work space` would arrive as three argv words and grant
        # Codex the wrong directory. Refuse to emit a grant we cannot express
        # correctly, and say so, rather than silently corrupting argv.
        if [[ -n "${HIVE_WORKSPACE_DIR:-}" ]]; then
          if [[ "$HIVE_WORKSPACE_DIR" == *[[:space:]]* ]]; then
            echo "WARNING: HIVE_WORKSPACE_DIR contains whitespace (${HIVE_WORKSPACE_DIR});" \
                 "omitting Codex --add-dir because the flag string is word-split by the caller." \
                 "Move the workspace to a path without spaces to grant it." >&2
          else
            printf -- ' --add-dir %s' "$HIVE_WORKSPACE_DIR"
          fi
        fi
        printf '\n'
      fi
      ;;
    agy)     echo "--dangerously-skip-permissions" ;;
    goose)   echo "" ;;
    pi)      echo "" ;;
    aider)   echo "--yes" ;;
    # opencode has no OS sandbox of its own (unconfined, like goose/pi/bob) —
    # --auto is opencode's unattended auto-approve flag ("Automatically accept
    # all permissions", `opencode run --help`), the equivalent of agy's
    # --dangerously-skip-permissions. See kubestellar/hive#4970.
    opencode) echo "--auto" ;;
    # Kilo --auto approves prompts; it is not an OS sandbox.
    kilo)     echo "--auto" ;;
    # Same flags as claude — litellm launches the claude binary
    litellm) claude_family_perm_flag ;;
    *)       echo "" ;;
  esac
}

# backend_perm_flag_shell: the same flags, quoted for pasting into a SHELL
# COMMAND LINE (tmux send-keys, AGENT_LAUNCH_CMD env files) rather than
# word-split into argv.
#
# Why two spellings must exist: the claude deny list contains `(`, `)`, `*`
# and `,` — shell syntax. A consumer that word-splits into an argv array
# (agent-launch.sh's `read -r -a`) needs the characters RAW, one argv word,
# no quoting; a consumer that interpolates the string into a line bash will
# re-parse needs them ESCAPED, or the launch dies at the first paren:
#   -bash: syntax error near unexpected token `('
# No single spelling satisfies both: %q-escaping breaks `read -r -a` (with
# -r, backslashes survive into the pattern), and raw breaks the shell line.
# So the raw contract stays on backend_perm_flag, and every shell-line
# consumer uses this variant. Word count and word content are identical
# after the target shell strips the escapes — pinned by the contributor
# agent test suite.
backend_perm_flag_shell() {
  local flags word out=""
  flags="$(backend_perm_flag "$1")"
  [ -n "$flags" ] || { echo ""; return 0; }
  for word in $flags; do
    out+="$(printf '%q' "$word") "
  done
  printf '%s\n' "${out% }"
}

is_truthy() {
  case "${1:-}" in
    1|true|TRUE|yes|YES|on|ON) return 0 ;;
    *) return 1 ;;
  esac
}

# ── Model version format normalization ──────────────────────────────────
# Claude CLI uses hyphens (claude-haiku-4-5), copilot uses dots (4.5).
# All other backends pass through unchanged.
normalize_model_for_backend() {
  local backend="$1" model="$2"
  case "$backend" in
    copilot)
      # claude-haiku-4-5 → claude-haiku-4.5 (last hyphen before final digit → dot)
      echo "$model" | sed -E 's/([0-9]+)-([0-9]+)$/\1.\2/'
      ;;
    claude)
      # claude-haiku-4.5 → claude-haiku-4-5 (dot in version → hyphen)
      echo "$model" | sed -E 's/([0-9]+)\.([0-9]+)$/\1-\2/'
      ;;
    *)
      echo "$model"
      ;;
  esac
}

# ── Detect backend from model name ──────────────────────────────────────
# gpt-* → copilot, gemini-* → gemini, claude-* → could be either (prefer claude)
detect_backend_from_model() {
  local model="$1"
  case "$model" in
    gpt-*)    echo "copilot" ;;
    gemini-*) echo "gemini" ;;
    claude-*) echo "claude" ;;
    *)        echo "unknown" ;;
  esac
}

# ── Compare models ignoring format differences ─────────────────────────
# Returns 0 if models are the same after normalizing to claude format.
models_equal() {
  local a="$1" b="$2"
  local na nb
  na=$(echo "$a" | sed -E 's/([0-9]+)\.([0-9]+)$/\1-\2/')
  nb=$(echo "$b" | sed -E 's/([0-9]+)\.([0-9]+)$/\1-\2/')
  [ "$na" = "$nb" ]
}

# ── Known models (for validation) ───────────────────────────────────────
# canonical name (claude format)  → tier (for dashboard coloring)
model_tier() {
  case "$1" in
    claude-haiku-4-5*|claude-haiku-4.5*)     echo "haiku" ;;
    claude-sonnet-4-6*|claude-sonnet-4.6*)   echo "sonnet" ;;
    claude-opus-4-6*|claude-opus-4.6*)       echo "opus" ;;
    claude-opus-4-7*|claude-opus-4.7*)       echo "opus" ;;
    gpt-*)                                    echo "gpt" ;;
    gemini-*)                                 echo "gemini" ;;
    *)                                        echo "unknown" ;;
  esac
}
