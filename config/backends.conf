# backends.conf — Single source of truth for CLI backends and model names.
#
# Every script that deals with backend/model names MUST source this file
# and use normalize_model_for_backend() instead of inline sed/regex.
#
# Format rules:
#   claude  → hyphens in version: claude-haiku-4-5, claude-opus-4-6
#   copilot → dots in version:    claude-haiku-4.5, claude-opus-4.6
#   others  → pass through unchanged
#
# Usage:
#   source /usr/local/etc/hive/backends.conf   (system)
#   source "$(dirname "$0")/../config/backends.conf"  (repo-relative)
#
#   model=$(normalize_model_for_backend "copilot" "claude-haiku-4-5")
#   # → claude-haiku-4.5
#
#   backend=$(detect_backend_from_model "gpt-5.3-codex")
#   # → copilot

# ── Supported backends ──────────────────────────────────────────────────
# BACKEND_NAME  BINARY   PERM_FLAG                    MODEL_FLAG
KNOWN_BACKENDS="claude copilot goose codex agy bob pi aider litellm"

# ── Backend → binary mapping ────────────────────────────────────────────
backend_binary() {
  case "$1" in
    claude)  echo "claude" ;;
    copilot) echo "copilot" ;;

    codex)   echo "codex" ;;
    agy)     echo "agy" ;;
    bob)     echo "bob" ;;
    goose)   echo "goose" ;;
    pi)      echo "pi" ;;
    aider)   echo "aider" ;;
    # litellm runs Claude Code pointed at a LiteLLM proxy via ANTHROPIC_BASE_URL
    litellm) echo "claude" ;;
    *)       echo "$1" ;;
  esac
}

# ── Backend → provider mapping (#3958) ──────────────────────────────────
# Maps each backend CLI to its underlying upstream LLM account provider
# for cooldown and headroom tracking.
backend_provider() {
  case "$1" in
    claude)  echo "anthropic" ;;
    copilot) echo "openai" ;;
    codex)   echo "openai" ;;
    agy)     echo "google" ;;
    bob)     echo "ibm" ;;
    litellm) echo "anthropic" ;;
    goose)   echo "goose" ;;
    pi)      echo "pi" ;;
    aider)   echo "aider" ;;
    *)       echo "unknown" ;;
  esac
}

# ── Backend → permission flag ───────────────────────────────────────────
backend_perm_flag() {
  case "$1" in
    claude)  echo "--dangerously-skip-permissions --permission-mode bypassPermissions" ;;
    copilot) echo "--allow-all" ;;
    # bob (IBM bobshell). Mirrors the hub-side launcher (bobLaunchCmd in
    # src/pkg/agent/manager.go) so relay and pod agents behave identically:
    #   --accept-license      bob hard-errors before doing any work unless
    #                         licenseConsent is persisted; the prompt that
    #                         collects it is interactive and nobody is attached
    #                         to an unattended agent loop. Idempotent.
    #   --auth-method api-key bob otherwise defaults to W3ID browser SSO. The
    #                         relay is unattended, so it must use the API key
    #                         from BOBSHELL_API_KEY. The flag is HIDDEN from
    #                         `bob --help` (the bundle registers it then calls
    #                         t.hide()) but is live and validated — an invalid
    #                         value reports Choices: "sso", "api-key".
    #                         It is also the only input that outranks the
    #                         persisted security.auth.selectedType AND
    #                         suppresses bob's write-back of that value, so it
    #                         does NOT stomp a contributor's own ~/.bob config.
    #   --approval-mode yolo  without it bob reports `Auto-approve: Off` and
    #                         blocks forever on its first tool call. Note that
    #                         `-y`/`--yolo` is a BOOLEAN flag in bobshell 1.0.6
    #                         ([boolean] [default: false]), so the former
    #                         `-y yolo` spelling left `yolo` as a stray
    #                         positional argument — i.e. a prompt.
    #   --trust               bob otherwise treats the workdir as untrusted
    #                         and gates tool availability on it.
    # No --model is passed anywhere for bob: it auto-selects its own model and
    # any --model makes every prompt die. See the bob case in the MODEL_FLAG
    # block of bin/contributor-agent.sh.
    bob)     echo "--accept-license --auth-method api-key --approval-mode yolo --trust" ;;

    codex)
      if is_truthy "${HIVE_CODEX_DANGEROUSLY_BYPASS_APPROVALS_AND_SANDBOX:-}"; then
        echo "--dangerously-bypass-approvals-and-sandbox"
      else
        echo "--ask-for-approval ${HIVE_CODEX_APPROVAL_POLICY:-on-request} --sandbox ${HIVE_CODEX_SANDBOX_MODE:-workspace-write}"
      fi
      ;;
    agy)     echo "--dangerously-skip-permissions" ;;
    goose)   echo "" ;;
    pi)      echo "" ;;
    aider)   echo "--yes" ;;
    # Same flags as claude — litellm launches the claude binary
    litellm) echo "--dangerously-skip-permissions --permission-mode bypassPermissions" ;;
    *)       echo "" ;;
  esac
}

is_truthy() {
  case "${1:-}" in
    1|true|TRUE|yes|YES|on|ON) return 0 ;;
    *) return 1 ;;
  esac
}

# ── Model version format normalization ──────────────────────────────────
# Claude CLI uses hyphens (claude-haiku-4-5), copilot uses dots (4.5).
# All other backends pass through unchanged.
normalize_model_for_backend() {
  local backend="$1" model="$2"
  case "$backend" in
    copilot)
      # claude-haiku-4-5 → claude-haiku-4.5 (last hyphen before final digit → dot)
      echo "$model" | sed -E 's/([0-9]+)-([0-9]+)$/\1.\2/'
      ;;
    claude)
      # claude-haiku-4.5 → claude-haiku-4-5 (dot in version → hyphen)
      echo "$model" | sed -E 's/([0-9]+)\.([0-9]+)$/\1-\2/'
      ;;
    *)
      echo "$model"
      ;;
  esac
}

# ── Detect backend from model name ──────────────────────────────────────
# gpt-* → copilot, gemini-* → gemini, claude-* → could be either (prefer claude)
detect_backend_from_model() {
  local model="$1"
  case "$model" in
    gpt-*)    echo "copilot" ;;
    gemini-*) echo "gemini" ;;
    claude-*) echo "claude" ;;
    *)        echo "unknown" ;;
  esac
}

# ── Compare models ignoring format differences ─────────────────────────
# Returns 0 if models are the same after normalizing to claude format.
models_equal() {
  local a="$1" b="$2"
  local na nb
  na=$(echo "$a" | sed -E 's/([0-9]+)\.([0-9]+)$/\1-\2/')
  nb=$(echo "$b" | sed -E 's/([0-9]+)\.([0-9]+)$/\1-\2/')
  [ "$na" = "$nb" ]
}

# ── Known models (for validation) ───────────────────────────────────────
# canonical name (claude format)  → tier (for dashboard coloring)
model_tier() {
  case "$1" in
    claude-haiku-4-5*|claude-haiku-4.5*)     echo "haiku" ;;
    claude-sonnet-4-6*|claude-sonnet-4.6*)   echo "sonnet" ;;
    claude-opus-4-6*|claude-opus-4.6*)       echo "opus" ;;
    claude-opus-4-7*|claude-opus-4.7*)       echo "opus" ;;
    gpt-*)                                    echo "gpt" ;;
    gemini-*)                                 echo "gemini" ;;
    *)                                        echo "unknown" ;;
  esac
}
