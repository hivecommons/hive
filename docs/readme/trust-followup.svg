<svg xmlns="http://www.w3.org/2000/svg" width="720" height="252" viewBox="0 0 720 252" role="img" aria-labelledby="trust-followup-title trust-followup-description"><title id="trust-followup-title">A response to review</title><desc id="trust-followup-description">Pull requests revised, then approved: 369 of 563 (65.5%). Of 563 pull requests sent back for changes, 369 had an updated version approved. The other 194 had no later approval recorded. Approval does not prove the code is right.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f0f6fc}.muted{fill:#a4adb8}.track,.axis{stroke:#3d444d}</style><rect width="720" height="252" rx="10" fill="#161b22"/><circle class="track" cx="132" cy="126" r="88" fill="none" stroke-width="24"/><circle cx="132" cy="126" r="88" fill="none" stroke="#8250df" stroke-width="24" pathLength="100" stroke-dasharray="65.54174067495559 34.45825932504441" transform="rotate(-90 132 126)"/><text x="132" y="135" font-size="34" font-weight="700" text-anchor="middle">65.5%</text><text x="260" y="91" font-size="21" font-weight="600">Pull requests revised, then</text><text x="260" y="120" font-size="21" font-weight="600">approved</text><text x="260" y="170" class="muted" font-size="19">369 of 563</text></svg>