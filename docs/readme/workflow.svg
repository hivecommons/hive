<svg xmlns="http://www.w3.org/2000/svg" width="720" height="224" viewBox="0 0 720 224" role="img" aria-labelledby="workflow-title workflow-description"><title id="workflow-title">What Hive adds to your agents</title><desc id="workflow-description">People bring their own agents. Hive connects shared work, task claims, permissions and review records across GitHub, GitHub Enterprise, GitHub Projects, Linear and Jira.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f0f6fc}.muted{fill:#a4adb8}.track,.axis{stroke:#3d444d}</style><rect width="720" height="224" rx="10" fill="#161b22"/><defs><marker id="workflow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c959f"/></marker></defs><rect x="8" y="12" width="208" height="198" rx="10" fill="none" stroke="#8250df" stroke-width="2"/><text x="112" y="58" font-size="21" font-weight="700" text-anchor="middle">People + agents</text><text x="112" y="103" font-size="16" text-anchor="middle">Your team</text><text x="112" y="134" font-size="16" text-anchor="middle">Your chosen agents</text><text x="112" y="165" font-size="16" text-anchor="middle">Outside contributors</text><rect x="252" y="12" width="208" height="198" rx="10" fill="none" stroke="#bf8700" stroke-width="2"/><text x="356" y="58" font-size="21" font-weight="700" text-anchor="middle">Hive</text><text x="356" y="103" font-size="16" text-anchor="middle">Shared work queue</text><text x="356" y="134" font-size="16" text-anchor="middle">Claims + permissions</text><text x="356" y="165" font-size="16" text-anchor="middle">Review records</text><rect x="496" y="12" width="208" height="198" rx="10" fill="none" stroke="#8250df" stroke-width="2"/><text x="600" y="58" font-size="21" font-weight="700" text-anchor="middle">Your tools</text><text x="600" y="103" font-size="16" text-anchor="middle">GitHub + Enterprise</text><text x="600" y="134" font-size="16" text-anchor="middle">GitHub Projects</text><text x="600" y="165" font-size="16" text-anchor="middle">Linear + Jira</text><path d="M216 111H242" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#workflow-arrow)"/><path d="M460 111H486" fill="none" stroke="#8c959f" stroke-width="2" marker-end="url(#workflow-arrow)"/></svg>