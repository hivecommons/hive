# Ingress backends must live in the same namespace as the Ingress. The
# `legacy-redirect` Deployment/Service (src/deploy/legacy-redirect/) runs in
# `hive-hub`, and 03-dibs-kubestellar-redirect.yaml's Ingress lives in `dibs`.
# Rather than deploy a second copy of the redirect backend into `dibs`, this
# stages an ExternalName Service named `legacy-redirect` in `dibs` that simply
# resolves to the existing hive-hub Service — the simpler of the two options
# discussed in #6430. ingress-nginx forwards the original Host header
# (dibs.kubestellar.io) through unchanged, so the shared backend's
# dibs.kubestellar.io server block still handles it correctly.
#
# Do NOT apply this (or 03-) until the dibs cutover (#5925) resumes; the dibs
# namespace is held on Let's Encrypt quota.
apiVersion: v1
kind: Service
metadata:
  name: legacy-redirect
  namespace: dibs
spec:
  type: ExternalName
  externalName: legacy-redirect.hive-hub.svc.cluster.local
  ports:
    - name: http
      port: 80
      # 80, NOT the backend pod's 8080. ingress-nginx connects to an
      # ExternalName Service on the port it resolves from the Service, and the
      # name this resolves to — legacy-redirect.hive-hub.svc.cluster.local — is
      # itself a ClusterIP Service listening on 80 and forwarding to the pod's
      # 8080. Naming 8080 here reached the hive-hub Service's ClusterIP on a
      # port nothing listens on, so every legacy request hung until
      # ingress-nginx gave up:
      #
      #   upstream timed out (110: Operation timed out) while connecting to
      #   upstream, server: dibs.kubestellar.io, upstream:
      #   "http://10.96.127.61:8080/ideas/42?x=1"
      #
      # which the browser saw as a slow generic page rather than a redirect —
      # a silently broken legacy link, not a loud failure. The pod's port is
      # the other Service's business, not this one's.
      targetPort: 80
