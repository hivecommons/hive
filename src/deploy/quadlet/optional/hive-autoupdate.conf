# OPT-IN health-aware auto-update for hive.container (#4411).
#
# NOT INSTALLED BY DEFAULT, per #4188. Nothing polls a registry or acts on its
# own until an operator puts this file in place:
#
#     bin/hive-podman-update.sh autoupdate on              # rootless
#     bin/hive-podman-update.sh autoupdate on --rootful    # rootful
#
# which copies it to <quadlet dir>/hive.container.d/20-autoupdate.conf, runs
# daemon-reload, restarts the unit so the container carries the label, and
# enables podman-auto-update.timer. `autoupdate off` reverses all of it.
#
# ── WHY THIS IS ONE LINE AND NOT A UNIT CHANGE ──────────────────────────────
#
# #4378 measured that hive.service NEVER READS `failed`: Restart=always moves it
# from a TimeoutStartSec expiry straight to activating/auto-restart, so
# `systemctl is-failed` reports `activating` at every point during a bad update.
# The open question for #4411 was whether that also defeats
# `podman auto-update --rollback`, which decides an update went bad by
# restarting the unit and seeing the restart fail.
#
# It does not. They are different signals, and the distinction is the whole
# result: podman restarts the unit over D-Bus and reads the START JOB RESULT.
# A TimeoutStartSec expiry makes that job result `timeout`, not `done`, and
# podman rolls back on anything that is not `done`. `ActiveState` never has to
# reach `failed` for that to work.
#
# Measured end to end against a bad-but-startable image — one that runs forever
# and never becomes healthy, not one that fails to pull. See
# src/docs/podman-auto-update.md for the timeline. Restart=always is KEPT,
# unchanged: it never even fires (NRestarts stayed 0), because podman's rollback
# restart lands before RestartSec elapses.
#
# ── WHAT IT COSTS, WHICH IS THE PART TO READ BEFORE ENABLING IT ─────────────
#
#  1. A bad update costs ONE FULL TimeoutStartSec of downtime, every time.
#     Podman cannot know the image is bad until the start job times out, and
#     hive.container budgets 300s. Measured 36s against a scaled
#     TimeoutStartSec=30, so on the shipped unit expect ~5-6 minutes down,
#     then automatic recovery to the previous image.
#
#  2. IT DOES NOT REMEMBER. Podman does not record that it rolled a digest back,
#     so the NEXT timer firing pulls the same bad tag and repeats the whole
#     outage. Measured: a second run with nothing changed in the registry
#     reported `rolled back` again, at full cost. Until the bad image is
#     replaced upstream, this is a recurring outage on the timer's schedule
#     (podman-auto-update.timer is daily by default), not a one-off.
#
#  3. THE UNIT'S OWN STATE IS NOT THE ALARM. During all of it `is-failed` says
#     `activating`, `ActiveState` never reaches `failed`, and NRestarts stays 0.
#     Monitoring keyed on any of those does not fire — that is #4378's finding
#     and it is unchanged. The signal is the auto-update run's own output:
#     the UPDATED column reads `rolled back`. Note `podman auto-update` still
#     EXITS 0 in that case, so podman-auto-update.service succeeding tells you
#     nothing either.
#
#  4. A DIGEST PIN SILENTLY WINS. If #4378's 10-image.conf pins a digest, this
#     policy still applies but has nothing to poll: auto-update reports
#     UPDATED=false, exits 0, and does not touch the unit — indistinguishable
#     in its output from "already up to date". A host left pinned after a manual
#     rollback therefore has an auto-update timer reporting success daily while
#     updating nothing. `autoupdate on` refuses to proceed while a pin is in
#     place for exactly this reason, and `status` flags the combination.
#     Worse case, measured: if the pinned digest is no longer resolvable in the
#     registry, auto-update exits 125 and the WHOLE run fails — including for
#     every other auto-update container on the host.
#
# The manual path (bin/hive-podman-update.sh pin/rollback) stays available and
# is unchanged; #4188 requires it to exist either way. Auto-update is an
# addition to it, not a replacement.

[Container]
AutoUpdate=registry
