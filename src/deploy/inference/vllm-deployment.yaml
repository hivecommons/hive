---
apiVersion: v1
kind: Namespace
metadata:
  name: hive-inference
---
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: hive-inference
type: Opaque
stringData:
  token: "placeholder"
---
# vLLM-compatible inference backend using llama.cpp server.
# llama.cpp provides the same OpenAI Chat Completions API that vLLM does,
# but runs natively on ARM64 CPU without CUDA dependencies.
# The proxy translation layer (Anthropic <-> OpenAI) works identically.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: hive-inference
  labels:
    app: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      initContainers:
        - name: model-download
          image: curlimages/curl:8.13.0
          command:
            - /bin/sh
            - -c
            - |
              echo "[model-download] Downloading Qwen2.5-0.5B-Instruct GGUF..."
              # URL is pinned to a specific HF repo revision (commit 9217f5d) rather than
              # "main" so the artifact cannot change out from under the checksum below.
              curl -L -o /models/qwen2.5-0.5b-instruct-q4_k_m.gguf \
                "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/9217f5db79a29953eb74d5343926648285ec7e67/qwen2.5-0.5b-instruct-q4_k_m.gguf"
              ls -lh /models/
              echo "[model-download] Verifying checksum..."
              # Expected SHA-256 sourced from the HF LFS metadata (lfs.oid) for this file
              # at the pinned revision above. To refresh: bump the revision commit and
              # update this hash from
              #   curl -s https://huggingface.co/api/models/Qwen/Qwen2.5-0.5B-Instruct-GGUF/tree/main
              echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  /models/qwen2.5-0.5b-instruct-q4_k_m.gguf" | sha256sum -c - || {
                echo "[model-download] Checksum verification FAILED, deleting corrupted file." >&2
                rm -f /models/qwen2.5-0.5b-instruct-q4_k_m.gguf
                exit 1
              }
              echo "[model-download] Done."
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-server
          # Pinned by digest for supply-chain integrity (the "server" tag is mutable
          # and moves on every llama.cpp release). To refresh after a deliberate bump:
          #   TOK=$(curl -s "https://ghcr.io/token?scope=repository:ggml-org/llama.cpp:pull" | jq -r .token)
          #   curl -sI -H "Authorization: Bearer $TOK" \
          #     -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
          #     "https://ghcr.io/v2/ggml-org/llama.cpp/manifests/server" | grep -i docker-content-digest
          image: ghcr.io/ggml-org/llama.cpp:server@sha256:c88223e4bd7b7791aac2bb6945dd9b6d6dccdf191b5cabc3a73cee67ffc966ff
          args:
            - "--model"
            - "/models/qwen2.5-0.5b-instruct-q4_k_m.gguf"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--ctx-size"
            - "8192"
            - "--threads"
            - "2"
            - "--chat-template"
            - "chatml"
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "3"
              memory: 6Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: models
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-svc
  namespace: hive-inference
  labels:
    app: vllm
spec:
  selector:
    app: vllm
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  type: ClusterIP
