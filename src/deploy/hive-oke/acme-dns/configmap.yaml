# Authoritative-only Knot DNS for the delegated zone acme.hive.hivecommons.dev.
# Dynamic updates: TSIG key `acme-dns-tsig` only, TXT only, and only on the
# three challenge names the CNAMEs in README.md point at.
apiVersion: v1
kind: ConfigMap
metadata:
  name: acme-dns-knot
  namespace: acme-dns
data:
  knot.conf: |
    server:
        listen: [ 0.0.0.0@53, "::@53" ]
        rundir: /rundir
    # Defines key `acme-dns-tsig` from the Secret; the secret never sits in git.
    include: /secret/tsig-key.conf
    log:
      - target: stdout
        any: info
    acl:
      - id: acme-update
        key: acme-dns-tsig
        action: update
        update-type: [ TXT ]
        update-owner: name
        update-owner-match: equal
        update-owner-name: [ hive, lke-hive, dibs ]
    # Response rate limiting. This server is internet-facing and authoritative,
    # so it must not be usable as a reflector/amplifier for spoofed-source UDP
    # floods. Per-source limit of 20 UDP responses/s; slip 2 answers about half
    # of the excess with a truncated (TC) reply so a real client retries over
    # TCP, and drops the rest. mod-rrl is built into knotd 3.x (no shared
    # module path needed). Limits UDP only, so TSIG updates over TCP are unaffected.
    mod-rrl:
      - id: default
        rate-limit: 20
        slip: 2
    template:
      - id: default
        global-module: mod-rrl/default
        storage: /zones
        zonefile-sync: -1
        # The zone file is re-seeded on every start and there is no journal, so
        # load it whole (differential loading needs a journal to diff against).
        zonefile-load: whole
        # No journal: DDNS changes live in memory only and are lost on a pod or
        # container restart (the zone is re-seeded; cert-manager re-creates
        # challenge records). Acceptable because challenge TXTs are short-lived.
        journal-content: none
    zone:
      - domain: acme.hive.hivecommons.dev
        file: acme.hive.hivecommons.dev.zone
        acl: acme-update
  acme.hive.hivecommons.dev.zone: |
    $ORIGIN acme.hive.hivecommons.dev.
    $TTL 60
    @   IN SOA ns-acme.hive.hivecommons.dev. hostmaster.hivecommons.dev. ( 1 3600 600 86400 30 )
    @   IN NS  ns-acme.hive.hivecommons.dev.
