# TEMPLATE ONLY, not in kustomization.yaml. Create the real Secrets out of band:
#   KEY=$(openssl rand -base64 32)
#   kubectl -n acme-dns create secret generic acme-dns-tsig \
#     --from-literal=tsig-key.conf="key:
#     - id: acme-dns-tsig
#       algorithm: hmac-sha256
#       secret: $KEY"
#   kubectl -n cert-manager create secret generic acme-dns-tsig \
#     --from-literal=tsig-secret="$KEY"
# cert-manager reads its copy from its cluster resource namespace (cert-manager).
apiVersion: v1
kind: Secret
metadata:
  name: acme-dns-tsig
  namespace: acme-dns
type: Opaque
stringData:
  tsig-key.conf: |
    key:
      - id: acme-dns-tsig
        algorithm: hmac-sha256
        secret: REPLACE_WITH_BASE64_KEY
