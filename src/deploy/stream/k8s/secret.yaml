# TEMPLATES ONLY — both Secrets are created out of band and never committed:
#
#   kubectl -n hive-stream create secret generic twitch-stream \
#     --from-literal=TWITCH_STREAM_KEY='live_xxxxxxxx_yyyyyyyyyyyyyyyyyyyyyyyyyyyyyy'
#
#   # copy the spoke's shared dashboard token from its own namespace
#   kubectl -n hive-stream create secret generic dashboard-token \
#     --from-literal=DASHBOARD_TOKEN="$(kubectl -n <hive namespace> get secret hive-secrets \
#       -o jsonpath='{.data.dashboard-token}' | base64 -d)"
#
# (or, for the public route, DASHBOARD_TOKEN = a GitHub token of a user with
# access to the hive on the hub — see src/docs/streaming-the-activity-monitor.md)
#
# They are listed here so `kubectl apply -k` fails loudly if they are missing
# rather than starting a pod that streams a login page.
apiVersion: v1
kind: Secret
metadata:
  name: twitch-stream
  namespace: hive-stream
  annotations:
    hive.hivecommons.dev/template: "replace with kubectl create secret; do not apply this file"
type: Opaque
stringData:
  TWITCH_STREAM_KEY: "REPLACE-ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-token
  namespace: hive-stream
  annotations:
    hive.hivecommons.dev/template: "replace with kubectl create secret; do not apply this file"
type: Opaque
stringData:
  DASHBOARD_TOKEN: "REPLACE-ME"
