# TEMPLATE ONLY — the Secret is created out of band by the owner and never
# committed; no value belongs in source, config, docs or issue comments:
#
#   kubectl -n hive-stream-fleet create secret generic twitch-stream-hivecommonsfleet \
#     --from-literal=TWITCH_STREAM_KEY="$(read -rs k; printf %s "$k")"
#
# (paste the hivecommonsfleet Primary Stream key at the silent prompt).
# There is no dashboard-token Secret: the public-safe stream is anonymous.
apiVersion: v1
kind: Secret
metadata:
  name: twitch-stream-hivecommonsfleet
  namespace: hive-stream-fleet
  annotations:
    hive.hivecommons.dev/template: "replace with kubectl create secret; do not apply this file"
type: Opaque
stringData:
  TWITCH_STREAM_KEY: "REPLACE-ME"
