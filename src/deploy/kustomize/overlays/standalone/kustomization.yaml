apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Standalone / self-hosted overlay — the hub-less "Joe" scenario.
#
# This is for an operator running their OWN Hive against their OWN repos, with
# NO connection to the kubestellar hub. It layers on TWO bases:
#
#   ../../../k8s        the core Hive workload (namespace/configmap/secret/pvc/
#                       rbac/deployment/service)
#   ../../../inference  an in-cluster OpenAI-compatible inference backend
#                       (llama.cpp serving Qwen2.5-0.5B) + EPP RBAC, so a
#                       self-hosted user gets a working model endpoint without
#                       wiring an external provider.
#
# Everything operator-specific (org/repo, owner login, storage class, OAuth
# client id, litellm endpoint) is a PLACEHOLDER you swap. See README.md for the
# full swap list and install/upgrade commands. A concrete, filled-in copy of
# this overlay lives in ./example-joe-spyre for reference.

resources:
  - ../../../k8s
  - ../../../inference

# The base image tracks the `stable` channel. For a self-hosted deployment pin
# a reviewed DIGEST (see README "Pinning / upgrading the image" for how to
# resolve `stable` to one) by running, from this directory:
#   kustomize edit set image ghcr.io/hivecommons/hive=ghcr.io/hivecommons/hive@sha256:<digest>
# which writes the `images:` block below into this file (git-tracked).
#
# Do NOT assume `newTag: vX.Y.Z` works: ghcr.io/hivecommons/hive only carries
# channel tags (stable/candidate/edge/v4-latest) plus short-SHA tags on every
# merge, and a `vX.Y.Z` IMAGE tag exists only when the automated tagged-release
# workflow (.github/workflows/tagged-release.yml) has cut that version. In particular
# there is no `:v4.0.0` image — pinning it is an ImagePullBackOff. Check the
# tag exists (README) before using one.
# images:
#   - name: ghcr.io/hivecommons/hive
#     newName: ghcr.io/hivecommons/hive
#     digest: sha256:<digest>   # or newTag: vX.Y.Z once confirmed to exist

patches:
  # 1. Rewrite hive.yaml for the hub-less scenario (org/repo, owner, backend,
  #    hub disabled, ACMM level). Replaces the whole ConfigMap data.
  - path: patch-configmap.yaml

  # 2. Storage class placeholder for the hive-data PVC. The base PVC is
  #    ReadWriteOnce — correct for the single replica; RWX is NOT required.
  - path: patch-pvc-storageclass.yaml

  # 3. NET_ADMIN escape hatch (COMMENTED OUT by default). Uncomment ONLY on a
  #    locked-down cluster that DENIES NET_ADMIN — see README "The NET_ADMIN
  #    decision". Leaving it commented keeps the fail-CLOSED security gate.
  #    On OpenShift, prefer the real fix: have a cluster-admin apply the
  #    ../openshift-netadmin overlay (dedicated `hive-netadmin` SCC) so the
  #    full gate comes up instead of degrading to advisory mode.
  # - path: patch-advisory-mode.yaml
