apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-redirect
  namespace: hive-hub
  labels:
    app: legacy-redirect
spec:
  replicas: 2
  selector:
    matchLabels:
      app: legacy-redirect
  template:
    metadata:
      labels:
        app: legacy-redirect
      annotations:
        # Bump this on every ConfigMap content change to force a rollout; the
        # ConfigMap is mounted as a volume and kubelet's propagation delay
        # otherwise leaves stale Pods serving an old redirect target.
        checksum/config: "1"
    spec:
      containers:
        - name: nginx
          image: nginx:1-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: conf
          configMap:
            name: legacy-redirect-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-redirect
  namespace: hive-hub
  labels:
    app: legacy-redirect
spec:
  selector:
    app: legacy-redirect
  ports:
    - name: http
      port: 80
      targetPort: 8080
