# hivecommons/hive#7206 — point the runners at the image that carries the CI
# toolchain.
#
# Strategic-merge patch against the live RunnerDeployment/hivecommons-hive-runners
# in namespace `arc-systems`. Kept as a patch, not a full manifest, for the same
# reason as runnerdeployment-patch.yaml: the RunnerDeployment is not otherwise
# managed from this repository, and committing the whole object would invite a
# `kubectl apply` that clobbers replica counts and the GitHub credentials wiring.
#
# Build and push the image first (see README.md § "Baking the CI toolchain"),
# then:
#
#   kubectl -n arc-systems patch runnerdeployment hivecommons-hive-runners \
#     --type merge --patch-file src/deploy/ci-runners/runner-image-patch.yaml
#
# Applying this rolls all runner pods, so do it while runners are idle.
#
# ── The tag below is already the published one ──────────────────────────────
#
# hivecommons/hive#7398: this file used to carry a `REPLACE_ME` placeholder, so
# applying the command above verbatim put every runner pod into
# ImagePullBackOff. `ci-runner-image.yml` run 35215122771 published
# ghcr.io/hivecommons/hive-ci-runner:v2.337.0-ubuntu-24.04-toolchain-1
# (digest sha256:5a26c5dd7c4bbfd7d2707c99ed51b3fb6115b44f5532569452ad036b35c31224),
# so the concrete reference lives here and the patch is copy-pasteable.
#
# When a rebuild publishes a new tag (the workflow refuses to overwrite an
# existing one — bump `tag_suffix`), update this line in the same change.
# Always use an immutable tag or a digest, never `:latest`: ARC does not
# re-pull on a tag that has not changed, so a mutable tag makes "which
# toolchain is on the runners?" unanswerable from the cluster.
#
# ── Rollback ────────────────────────────────────────────────────────────────
#
# Remove the image override to fall back to the stock image:
#
#   kubectl -n arc-systems patch runnerdeployment hivecommons-hive-runners \
#     --type json -p '[{"op":"remove","path":"/spec/template/spec/image"}]'
#
# CI keeps working after a rollback — ci-install-tool.sh simply goes back to
# installing gcc over the network, with the #6648/#6870 failure mode it has
# always had. Nothing in .github/ depends on this image existing.
spec:
  template:
    spec:
      # Published by ci-runner-image.yml run 35215122771 — see note above.
      image: ghcr.io/hivecommons/hive-ci-runner:v2.337.0-ubuntu-24.04-toolchain-1
