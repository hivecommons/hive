# TEMPLATE ONLY — not listed in kustomization.yaml (#11776). Create
# `hive-secrets` yourself, outside `kubectl apply -k`, for example:
#
#   kubectl -n hive create secret generic hive-secrets \
#     --from-literal=HIVE_GITHUB_TOKEN=ghp_... \
#     --from-literal=HIVE_DASHBOARD_TOKEN="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The keys below are the ones the Deployment reads. Do not add this file back
# to the kustomization: a kustomize-managed Secret with no keys makes every
# re-run of `kubectl apply -k` delete the keys you created.
apiVersion: v1
kind: Secret
metadata:
  name: hive-secrets
  namespace: hive
  labels:
    app.kubernetes.io/name: hive
type: Opaque
stringData:
  # GitHub App authentication (preferred)
  # gh-app-key.pem: |
  #   -----BEGIN RSA PRIVATE KEY-----
  #   ...
  #   -----END RSA PRIVATE KEY-----

  # OR: GitHub PAT (simpler, less secure)
  # HIVE_GITHUB_TOKEN: ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

  # Dashboard auth token (for mutation endpoints via proxy). dashboard-token is
  # the mounted file key used by hosted spokes; HIVE_DASHBOARD_TOKEN is the
  # legacy env key and remains supported.
  # dashboard-token: your-dashboard-token-here
  # HIVE_DASHBOARD_TOKEN: your-dashboard-token-here

  # Prometheus metrics bearer token: NOT read from this Secret. Both the base
  # Deployment (k8s/deployment.yaml) and the opt-in monitoring component
  # (src/deploy/kustomize/components/monitoring/) read HIVE_METRICS_TOKEN from
  # the dedicated hive-metrics-token Secret (template at the end of this file),
  # so the scraper can be granted read access to that token alone and never to
  # hive-secrets.

  # IBM bobshell API key — REQUIRED for agents with backend "bob".
  # bob's default auth opens a browser and polls a localhost callback, which
  # cannot work in a pod, so without a key those agents refuse to launch.
  # This surfaces at /secrets/bob_api_key (the default api_key_file path), so
  # no hive.yaml change is needed. Never put the key value in hive.yaml.
  # bob_api_key: your-bobshell-api-key-here

---
# Dedicated metrics bearer token Secret (template). Create it with:
#   kubectl -n hive create secret generic hive-metrics-token \
#     --from-literal=HIVE_METRICS_TOKEN="$(openssl rand -hex 32)"
# Both the Deployment env and the monitoring ServiceMonitor reference it; the
# Deployment ref is optional, so a missing Secret makes /metrics fail closed
# with 403 rather than crash-looping the pod.
# apiVersion: v1
# kind: Secret
# metadata:
#   name: hive-metrics-token
#   namespace: hive
# type: Opaque
# stringData:
#   HIVE_METRICS_TOKEN: your-metrics-token-here
