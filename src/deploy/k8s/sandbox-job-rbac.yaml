# Lets the spoke run a sandboxed agent kick as a Kubernetes Job in its own
# namespace (sandbox.runtime: job, #6311; pkg/kubejob). The spoke creates the
# Job, polls it, reads the pod's log and exit code, and deletes it.
# Namespace-scoped: no exec, no secrets, no NetworkPolicies. The Job's own
# secrets are referenced by name in the pod template and resolved by
# Kubernetes; hive never reads them.
#
# What this Role still grants, so you can weigh it:
#  - `jobs` create is a strong grant. In a namespace that enforces Pod
#    Security `privileged`, whoever can create a Job can start a privileged
#    pod with a hostPath mount, which is root on the node. Hive's own Jobs do
#    not ask for that, but the service account can. If you cannot run Jobs in
#    a namespace that enforces `baseline`, limit the pod spec this service
#    account may create with an admission policy.
#  - Using it means the spoke pod mounts a service-account token, and every
#    process in that pod can read it, agents that run outside a sandbox
#    included. If your spoke sets automountServiceAccountToken: false, mount
#    a projected token (a serviceAccountToken volume with a short
#    expirationSeconds) into the hive container only.
#
# workspace_transport: copy needs more (a per-Job Secret and NetworkPolicy,
# and patch on jobs). That is NOT here: it is the separate Role in
# sandbox-job-copy-rbac.yaml, which you bind on purpose, and
# sandbox-job-copy-admission.yaml is a sample policy that limits it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hive-sandbox-jobs
  namespace: hive
  labels:
    app.kubernetes.io/name: hive
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  # Names of the Job service account's imagePullSecrets (#18819). Optional:
  # without it hive warns and uses job.image_pull_secrets only.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hive-sandbox-jobs
  namespace: hive
  labels:
    app.kubernetes.io/name: hive
subjects:
  - kind: ServiceAccount
    name: hive
    namespace: hive
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hive-sandbox-jobs
