# Lets the spoke run a sandboxed agent kick as a Kubernetes Job in its own
# namespace (sandbox.runtime: job, #6311; pkg/kubejob). The spoke creates the
# Job, polls it, reads the pod's log and exit code, and deletes it.
# Namespace-scoped and nothing more: no exec, no secrets read. The Job's own
# secrets are referenced by name in the pod template and resolved by
# Kubernetes; hive never reads them. The one secret grant is write-only
# (create, delete; no get/list): workspace_transport: copy creates a per-Job
# bridge token Secret and deletes it with the Job. Per-Job NetworkPolicies
# (network none, copy mode) are likewise create/delete only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hive-sandbox-jobs
  namespace: hive
  labels:
    app.kubernetes.io/name: hive
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  # Names of the Job service account's imagePullSecrets (#18819). Optional:
  # without it hive warns and uses job.image_pull_secrets only.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
  # Per-Job bridge token Secret for workspace_transport: copy. Write-only.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
  # Per-Job deny-all NetworkPolicy, created and deleted with the Job.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hive-sandbox-jobs
  namespace: hive
  labels:
    app.kubernetes.io/name: hive
subjects:
  - kind: ServiceAccount
    name: hive
    namespace: hive
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hive-sandbox-jobs
