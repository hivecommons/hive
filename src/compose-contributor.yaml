# ClankeR — the contributor relay. Runs a contributor's CLI agent locally and
# connects it to a Hive hub over WebSocket.
services:
  contributor:
    build:
      context: ..
      dockerfile: src/Dockerfile.contributor
    container_name: hive-contributor
    restart: "no"
    stdin_open: true
    tty: true
    volumes:
      - ${HOME}/.config/hive:/home/dev/.config/hive:ro
      - ${HOME}/.claude:/home/dev/.claude:ro
      - ${HOME}/.config/claude-code:/home/dev/.config/claude-code:ro
    environment:
      - HIVE_HUB=${HIVE_HUB:-wss://hive.hivecommons.dev/contribute}
      - AGENT_BACKEND=${AGENT_BACKEND:-claude}
      - AGENT_MODEL=${AGENT_MODEL:-}
      - AGENT_REASONING_EFFORT=${AGENT_REASONING_EFFORT:-}
      # Optional session label for multi-session-per-account (#5605). Bare
      # passthrough form on purpose: unset on the host must stay unset in the
      # container (the relay then defaults the session to the backend name),
      # while an explicit empty string is the opt-out and must be forwarded.
      - HIVE_SESSION
      # Task-delivery mode (kubestellar/hive#2538): interactive (default, tmux)
      # or headless (one-shot CLI, no TTY). This compose file keeps stdin/tty on
      # for the default interactive path; a headless deployment (a future K8s
      # Job/Deployment, #2549) would set CONTRIBUTOR_MODE=headless and needs no
      # TTY.
      - CONTRIBUTOR_MODE=${CONTRIBUTOR_MODE:-interactive}
