<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="768" viewBox="0 0 880 384" role="img" aria-label="Also: consistent, readable, efficient, fast" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<title>Also: consistent, readable, efficient, fast</title>
<rect x="0.5" y="0.5" width="879" height="383" rx="20" fill="#0f0d0a" stroke="#28231c"/>
<text x="48" y="60" fill="#8a8174" font-size="12" font-weight="500" letter-spacing="2.4">ALSO · (oct &#39;26)</text>
<text x="48" y="108" fill="#fffaf0" font-size="28" font-weight="700">Every pull request gets the same AI review. It</text>
<text x="48" y="146" fill="#fffaf0" font-size="28" font-weight="700">adds about 15 minutes.</text>
<text x="48" y="200" fill="#8a8174" font-size="12" font-weight="500" letter-spacing="2.4">CONSISTENT</text>
<text x="48" y="256" fill="#f0b429" font-size="40" font-weight="700">15,054</text>
<text x="48" y="292" fill="#d9d1c4" font-size="15">reviews, every pull</text>
<text x="48" y="314" fill="#d9d1c4" font-size="15">request against the</text>
<text x="48" y="336" fill="#d9d1c4" font-size="15">same checklist</text>
<text x="244" y="200" fill="#8a8174" font-size="12" font-weight="500" letter-spacing="2.4">READABLE</text>
<text x="244" y="256" fill="#f0b429" font-size="40" font-weight="700">1 line</text>
<text x="244" y="292" fill="#d9d1c4" font-size="15">per finding,</text>
<text x="244" y="314" fill="#d9d1c4" font-size="15">written in your</text>
<text x="244" y="336" fill="#d9d1c4" font-size="15">style guide&#39;s voice</text>
<text x="440" y="200" fill="#8a8174" font-size="12" font-weight="500" letter-spacing="2.4">EFFICIENT</text>
<text x="440" y="256" fill="#f0b429" font-size="40" font-weight="700">$2</text>
<text x="440" y="292" fill="#d9d1c4" font-size="15">per merged pull</text>
<text x="440" y="314" fill="#d9d1c4" font-size="15">request, estimate;</text>
<text x="440" y="336" fill="#d9d1c4" font-size="15">jobs stop when done</text>
<text x="636" y="200" fill="#8a8174" font-size="12" font-weight="500" letter-spacing="2.4">FAST</text>
<text x="636" y="256" fill="#f0b429" font-size="40" font-weight="700">+15 min</text>
<text x="636" y="292" fill="#d9d1c4" font-size="15">typical open to</text>
<text x="636" y="314" fill="#d9d1c4" font-size="15">merge: 12 without</text>
<text x="636" y="336" fill="#d9d1c4" font-size="15">review, 27 with</text>
</svg>
