<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1106" viewBox="0 0 880 553" role="img" aria-label="Also: consistent, readable, efficient, fast" font-family="IBM Plex Mono">
<title>Also: consistent, readable, efficient, fast</title>
<!-- raster: v1; regular: 6a3412f058c7d8dfd9170c41e85ade48e5156ecb89356110ca57a0a27734af46; bold: ac27abd6450a64dd94467580a02fe6235156d5b92f2926ebbc8e7489df64e0be -->
<rect x="0" y="0" width="880" height="553" rx="16" fill="#2a251f"/>
<rect x="1" y="1" width="878" height="551" rx="15" fill="#0f0d0a"/>
<text x="48" y="59" fill="#8b949e" font-size="11">ALSO · (oct &#39;26)</text>
<text x="48" y="99" fill="#fffaf0" font-size="32" font-weight="700">Every pull request gets the same AI</text>
<text x="48" y="141" fill="#fffaf0" font-size="32" font-weight="700">review. It adds about 15 minutes.</text>
<text x="48" y="191" fill="#8b949e" font-size="15">CONSISTENT</text>
<text x="48" y="243" fill="#f0b429" font-size="30" font-weight="700">15,054</text>
<text x="48" y="271" fill="#ece5d8" font-size="14">reviews, one checklist, one shared</text>
<text x="48" y="291" fill="#ece5d8" font-size="14">style guide</text>
<text x="440" y="191" fill="#8b949e" font-size="15">READABLE</text>
<text x="440" y="243" fill="#f0b429" font-size="30" font-weight="700">4 parts</text>
<text x="440" y="271" fill="#ece5d8" font-size="14">to every review: what, problem, fix,</text>
<text x="440" y="291" fill="#ece5d8" font-size="14">if skipped</text>
<text x="48" y="381" fill="#8b949e" font-size="15">EFFICIENT</text>
<text x="48" y="433" fill="#f0b429" font-size="30" font-weight="700">On demand</text>
<text x="48" y="461" fill="#ece5d8" font-size="14">jobs start on work and stop when done</text>
<text x="440" y="381" fill="#8b949e" font-size="15">FAST</text>
<text x="440" y="409" fill="#8b949e" font-size="12">merged without review</text>
<rect x="440" y="418" width="140" height="8" rx="4" fill="#3a342c"/>
<text x="588" y="426" fill="#fffaf0" font-size="13" font-weight="700">12 min</text>
<text x="440" y="449" fill="#8b949e" font-size="12">reviewed by Hive</text>
<rect x="440" y="458" width="316" height="8" rx="4" fill="#f0b429"/>
<text x="764" y="466" fill="#fffaf0" font-size="13" font-weight="700">27 min</text>
<text x="440" y="493" fill="#ece5d8" font-size="14">review adds about 15 minutes</text>
</svg>
