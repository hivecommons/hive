<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="734" viewBox="0 0 880 367" role="img" aria-label="Also: consistent, readable, efficient, fast" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<title>Also: consistent, readable, efficient, fast</title>
<defs>
<linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f0b429"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
<filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect x="0.5" y="0.5" width="879" height="366" rx="16" fill="#0f0d0a" stroke="#2a251f"/>
<text x="40" y="51" fill="#8b949e" font-size="11" font-weight="500" letter-spacing="2.2">ALSO · (oct &#39;26)</text>
<text x="40" y="91" fill="#fffaf0" font-size="32">Every pull request gets the same AI</text>
<text x="40" y="133" fill="#fffaf0" font-size="32">review. It adds about 15 minutes.</text>
<text x="40" y="183" fill="#8b949e" font-size="15" font-weight="500" letter-spacing="2.2">CONSISTENT</text>
<text x="40" y="235" fill="#f0b429" font-size="30" font-weight="700" filter="url(#glow)" opacity="0.35">15,054</text>
<text x="40" y="235" fill="url(#amber)" font-size="30" font-weight="700">15,054</text>
<text x="40" y="263" fill="#ece5d8" font-size="14">reviews, one</text>
<text x="40" y="283" fill="#ece5d8" font-size="14">checklist, one</text>
<text x="40" y="303" fill="#ece5d8" font-size="14">shared style guide</text>
<text x="240" y="183" fill="#8b949e" font-size="15" font-weight="500" letter-spacing="2.2">READABLE</text>
<text x="240" y="235" fill="#f0b429" font-size="30" font-weight="700" filter="url(#glow)" opacity="0.35">4 parts</text>
<text x="240" y="235" fill="url(#amber)" font-size="30" font-weight="700">4 parts</text>
<text x="240" y="263" fill="#ece5d8" font-size="14">to every review:</text>
<text x="240" y="283" fill="#ece5d8" font-size="14">what, problem, fix,</text>
<text x="240" y="303" fill="#ece5d8" font-size="14">if skipped</text>
<text x="440" y="183" fill="#8b949e" font-size="15" font-weight="500" letter-spacing="2.2">EFFICIENT</text>
<text x="440" y="235" fill="#f0b429" font-size="30" font-weight="700" filter="url(#glow)" opacity="0.35">On demand</text>
<text x="440" y="235" fill="url(#amber)" font-size="30" font-weight="700">On demand</text>
<text x="440" y="263" fill="#ece5d8" font-size="14">jobs start on work</text>
<text x="440" y="283" fill="#ece5d8" font-size="14">and stop when done</text>
<text x="640" y="183" fill="#8b949e" font-size="15" font-weight="500" letter-spacing="2.2">FAST</text>
<text x="640" y="211" fill="#8b949e" font-size="12">merged without review</text>
<rect x="640" y="220" width="55" height="8" rx="4" fill="#3a342c"/>
<text x="703" y="228" fill="#fffaf0" font-size="13" font-weight="700">12 min</text>
<text x="640" y="251" fill="#8b949e" font-size="12">reviewed by Hive</text>
<rect x="640" y="260" width="124" height="8" rx="4" fill="url(#amber)"/>
<text x="772" y="268" fill="#fffaf0" font-size="13" font-weight="700">27 min</text>
<text x="640" y="295" fill="#ece5d8" font-size="14">review adds about 15</text>
<text x="640" y="315" fill="#ece5d8" font-size="14">minutes</text>
</svg>
