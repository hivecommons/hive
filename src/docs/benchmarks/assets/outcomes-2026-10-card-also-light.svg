<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="844" viewBox="0 0 880 422" role="img" aria-label="Also consistent, readable, efficient and fast." font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<title>Also consistent, readable, efficient and fast.</title>
<rect x="0.5" y="0.5" width="879" height="421" rx="20" fill="#fbf8f2" stroke="#e2dbcd"/>
<text x="48" y="60" fill="#7a7165" font-size="12" font-weight="500" letter-spacing="2.4">AND THE REST · (oct &#39;26)</text>
<text x="48" y="108" fill="#1a1612" font-size="28" font-weight="700">Every pull request gets the same one-line</text>
<text x="48" y="146" fill="#1a1612" font-size="28" font-weight="700">review, in your style guide&#39;s voice. It adds</text>
<text x="48" y="184" fill="#1a1612" font-size="28" font-weight="700">about 15 minutes to a merge.</text>
<text x="48" y="238" fill="#7a7165" font-size="12" font-weight="500" letter-spacing="2.4">CONSISTENT</text>
<text x="48" y="294" fill="#a3640c" font-size="40" font-weight="700">15,054</text>
<text x="48" y="330" fill="#3b342c" font-size="15">reviews, all</text>
<text x="48" y="352" fill="#3b342c" font-size="15">against the same</text>
<text x="48" y="374" fill="#3b342c" font-size="15">checklist</text>
<text x="244" y="238" fill="#7a7165" font-size="12" font-weight="500" letter-spacing="2.4">READABLE</text>
<text x="244" y="294" fill="#a3640c" font-size="40" font-weight="700">1 line</text>
<text x="244" y="330" fill="#3b342c" font-size="15">per finding, in</text>
<text x="244" y="352" fill="#3b342c" font-size="15">your style guide&#39;s</text>
<text x="244" y="374" fill="#3b342c" font-size="15">voice</text>
<text x="440" y="238" fill="#7a7165" font-size="12" font-weight="500" letter-spacing="2.4">EFFICIENT</text>
<text x="440" y="294" fill="#a3640c" font-size="40" font-weight="700">$2</text>
<text x="440" y="330" fill="#3b342c" font-size="15">a merge, our</text>
<text x="440" y="352" fill="#3b342c" font-size="15">estimate. Jobs stop</text>
<text x="440" y="374" fill="#3b342c" font-size="15">when done</text>
<text x="636" y="238" fill="#7a7165" font-size="12" font-weight="500" letter-spacing="2.4">FAST</text>
<text x="636" y="294" fill="#a3640c" font-size="40" font-weight="700">+15 min</text>
<text x="636" y="330" fill="#3b342c" font-size="15">a typical merge</text>
<text x="636" y="352" fill="#3b342c" font-size="15">takes 27 minutes,</text>
<text x="636" y="374" fill="#3b342c" font-size="15">12 without review</text>
</svg>
