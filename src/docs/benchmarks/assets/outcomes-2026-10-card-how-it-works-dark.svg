<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1146" viewBox="0 0 880 573" role="img" aria-label="How Hive works: scan, claim, work, verify, merge, credit" font-family="IBM Plex Mono">
<title>How Hive works: scan, claim, work, verify, merge, credit</title>
<!-- raster: v1; regular: 6a3412f058c7d8dfd9170c41e85ade48e5156ecb89356110ca57a0a27734af46; bold: ac27abd6450a64dd94467580a02fe6235156d5b92f2926ebbc8e7489df64e0be -->
<rect x="0" y="0" width="880" height="573" rx="16" fill="#2a251f"/>
<rect x="1" y="1" width="878" height="571" rx="15" fill="#0f0d0a"/>
<text x="48" y="59" fill="#8b949e" font-size="11">HOW IT WORKS · EVERY TASK</text>
<text x="48" y="99" fill="#fffaf0" font-size="32" font-weight="700">A coding agent does the work. A review</text>
<text x="48" y="141" fill="#fffaf0" font-size="32" font-weight="700">agent and your CI gate the merge.</text>
<text x="48" y="215" fill="#f0b429" font-size="24" font-weight="700">01</text>
<text x="96" y="215" fill="#fffaf0" font-size="15" font-weight="700">Scan</text>
<text x="278" y="215" fill="#ece5d8" font-size="15">Reads open issues, pull requests, failing checks.</text>
<text x="278" y="237" fill="#8b949e" font-size="12">like a webhook trigger</text>
<rect x="48" y="245" width="784" height="1" rx="0" fill="#1c1814"/>
<text x="48" y="271" fill="#f0b429" font-size="24" font-weight="700">02</text>
<text x="96" y="271" fill="#fffaf0" font-size="15" font-weight="700">Claim</text>
<text x="278" y="271" fill="#ece5d8" font-size="15">One agent takes one task.</text>
<text x="278" y="293" fill="#8b949e" font-size="12">one job per task</text>
<rect x="48" y="301" width="784" height="1" rx="0" fill="#1c1814"/>
<text x="48" y="327" fill="#f0b429" font-size="24" font-weight="700">03</text>
<text x="96" y="327" fill="#fffaf0" font-size="15" font-weight="700">Work</text>
<text x="278" y="327" fill="#ece5d8" font-size="15">A short-lived agent does it, then stops.</text>
<text x="278" y="349" fill="#8b949e" font-size="12">ephemeral runner</text>
<rect x="48" y="357" width="784" height="1" rx="0" fill="#1c1814"/>
<text x="48" y="383" fill="#f0b429" font-size="24" font-weight="700">04</text>
<text x="96" y="383" fill="#fffaf0" font-size="15" font-weight="700">Verify</text>
<text x="278" y="383" fill="#ece5d8" font-size="15">AI review plus your CI must pass.</text>
<text x="278" y="405" fill="#8b949e" font-size="12">both are required checks</text>
<rect x="48" y="413" width="784" height="1" rx="0" fill="#1c1814"/>
<text x="48" y="439" fill="#f0b429" font-size="24" font-weight="700">05</text>
<text x="96" y="439" fill="#fffaf0" font-size="15" font-weight="700">Merge</text>
<text x="278" y="439" fill="#ece5d8" font-size="15">Held for a human, or merged on green.</text>
<text x="278" y="461" fill="#8b949e" font-size="12">PRs only → merge on green</text>
<rect x="48" y="469" width="784" height="1" rx="0" fill="#1c1814"/>
<text x="48" y="495" fill="#f0b429" font-size="24" font-weight="700">06</text>
<text x="96" y="495" fill="#fffaf0" font-size="15" font-weight="700">Credit</text>
<text x="278" y="495" fill="#ece5d8" font-size="15">The issue opener is named on the merge.</text>
<text x="278" y="517" fill="#8b949e" font-size="12">co-author trailer</text>
</svg>
