<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1402" viewBox="0 0 880 701" role="img" aria-label="How Hive works: scan, claim, work, verify, merge, credit" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<title>How Hive works: scan, claim, work, verify, merge, credit</title>
<defs>
<linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f0b429"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
<filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect x="0.5" y="0.5" width="879" height="700" rx="16" fill="#0f0d0a" stroke="#2a251f"/>
<text x="40" y="51" fill="#8b949e" font-size="11" font-weight="500" letter-spacing="2.2">HOW IT WORKS · EVERY TASK</text>
<text x="40" y="91" fill="#fffaf0" font-size="32">An agent does the work. A reviewer checks</text>
<text x="40" y="133" fill="#fffaf0" font-size="32">it before it merges.</text>
<text x="40" y="207" fill="#f0b429" font-size="24" font-weight="700" filter="url(#glow)" opacity="0.35">01</text>
<text x="40" y="207" fill="url(#amber)" font-size="24" font-weight="700">01</text>
<text x="88" y="207" fill="#fffaf0" font-size="15" font-weight="700">Scan</text>
<text x="184" y="207" fill="#ece5d8" font-size="15">Hive reads your open issues, pull requests</text>
<text x="184" y="229" fill="#ece5d8" font-size="15">and failing checks.</text>
<text x="840" y="207" fill="#8b949e" font-size="13" text-anchor="end">Work comes from your backlog</text>
<line x1="40" y1="259" x2="840" y2="259" stroke="#1c1814"/>
<text x="40" y="285" fill="#f0b429" font-size="24" font-weight="700" filter="url(#glow)" opacity="0.35">02</text>
<text x="40" y="285" fill="url(#amber)" font-size="24" font-weight="700">02</text>
<text x="88" y="285" fill="#fffaf0" font-size="15" font-weight="700">Claim</text>
<text x="184" y="285" fill="#ece5d8" font-size="15">One agent claims one task, so nothing is</text>
<text x="184" y="307" fill="#ece5d8" font-size="15">done twice.</text>
<text x="840" y="285" fill="#8b949e" font-size="13" text-anchor="end">No duplicate work</text>
<line x1="40" y1="337" x2="840" y2="337" stroke="#1c1814"/>
<text x="40" y="363" fill="#f0b429" font-size="24" font-weight="700" filter="url(#glow)" opacity="0.35">03</text>
<text x="40" y="363" fill="url(#amber)" font-size="24" font-weight="700">03</text>
<text x="88" y="363" fill="#fffaf0" font-size="15" font-weight="700">Work</text>
<text x="184" y="363" fill="#ece5d8" font-size="15">A fresh, short-lived agent does the job</text>
<text x="184" y="385" fill="#ece5d8" font-size="15">and then stops.</text>
<text x="840" y="363" fill="#8b949e" font-size="13" text-anchor="end">Nothing runs for hours unattended</text>
<line x1="40" y1="415" x2="840" y2="415" stroke="#1c1814"/>
<text x="40" y="441" fill="#f0b429" font-size="24" font-weight="700" filter="url(#glow)" opacity="0.35">04</text>
<text x="40" y="441" fill="url(#amber)" font-size="24" font-weight="700">04</text>
<text x="88" y="441" fill="#fffaf0" font-size="15" font-weight="700">Verify</text>
<text x="184" y="441" fill="#ece5d8" font-size="15">CI runs, a separate reviewer checks the</text>
<text x="184" y="463" fill="#ece5d8" font-size="15">change, and planted instructions are</text>
<text x="184" y="485" fill="#ece5d8" font-size="15">screened out.</text>
<text x="840" y="441" fill="#8b949e" font-size="13" text-anchor="end">Problems are found before merge</text>
<line x1="40" y1="515" x2="840" y2="515" stroke="#1c1814"/>
<text x="40" y="541" fill="#f0b429" font-size="24" font-weight="700" filter="url(#glow)" opacity="0.35">05</text>
<text x="40" y="541" fill="url(#amber)" font-size="24" font-weight="700">05</text>
<text x="88" y="541" fill="#fffaf0" font-size="15" font-weight="700">Merge</text>
<text x="184" y="541" fill="#ece5d8" font-size="15">Trust level decides: hold for a human, or</text>
<text x="184" y="563" fill="#ece5d8" font-size="15">merge once every check passes.</text>
<text x="840" y="541" fill="#8b949e" font-size="13" text-anchor="end">Humans keep the decisions</text>
<line x1="40" y1="593" x2="840" y2="593" stroke="#1c1814"/>
<text x="40" y="619" fill="#f0b429" font-size="24" font-weight="700" filter="url(#glow)" opacity="0.35">06</text>
<text x="40" y="619" fill="url(#amber)" font-size="24" font-weight="700">06</text>
<text x="88" y="619" fill="#fffaf0" font-size="15" font-weight="700">Credit</text>
<text x="184" y="619" fill="#ece5d8" font-size="15">The person who opened the issue is</text>
<text x="184" y="641" fill="#ece5d8" font-size="15">credited on the merge.</text>
<text x="840" y="619" fill="#8b949e" font-size="13" text-anchor="end">The asker is credited</text>
</svg>
