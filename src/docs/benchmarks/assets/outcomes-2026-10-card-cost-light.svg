<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="838" viewBox="0 0 880 419" role="img" aria-label="about $2 of agent spend per merged pull request" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<title>about $2 of agent spend per merged pull request</title>
<defs>
<linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a5f0b"/><stop offset="1" stop-color="#b8741a"/></linearGradient>
<filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect x="0.5" y="0.5" width="879" height="418" rx="16" fill="#fbf8f2" stroke="#ddd6c8"/>
<text x="40" y="51" fill="#6b6459" font-size="11" font-weight="500" letter-spacing="2.2">COST · 2,869 MERGED PULL REQUESTS · AUG 2026 TO OCT 2026</text>
<text x="40" y="91" fill="#1a1612" font-size="32">Agents spent about $6,125 to merge 2,869</text>
<text x="40" y="133" fill="#1a1612" font-size="32">pull requests. That is about $2 each.</text>
<text x="40" y="257" fill="url(#amber)" font-size="88" font-weight="700">$2</text>
<text x="40" y="287" fill="#2b2620" font-size="15">about $2 per merged pull request, Aug</text>
<text x="40" y="309" fill="#2b2620" font-size="15">2026 to Oct 2026.</text>
<text x="440" y="257" fill="url(#amber)" font-size="88" font-weight="700">$6,125</text>
<text x="440" y="287" fill="#2b2620" font-size="15">estimated agent spend across 2,869 merged</text>
<text x="440" y="309" fill="#2b2620" font-size="15">pull requests.</text>
<line x1="40" y1="343" x2="840" y2="343" stroke="#e8e2d6"/>
<text x="40" y="365" fill="#6b6459" font-size="12">Estimate from provider list prices; some models are unpriced. Each agent card in the</text>
