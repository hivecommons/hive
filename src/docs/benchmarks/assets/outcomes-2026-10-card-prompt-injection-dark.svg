<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="838" viewBox="0 0 880 419" role="img" aria-label="97% of prompt-injection attempts were caught before reaching an agent, with 1 false alarm in 12 harmless requests" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<title>97% of prompt-injection attempts were caught before reaching an agent, with 1 false alarm in 12 harmless requests</title>
<defs>
<linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f0b429"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
<filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect x="0.5" y="0.5" width="879" height="418" rx="16" fill="#0f0d0a" stroke="#2a251f"/>
<text x="40" y="51" fill="#8b949e" font-size="11" font-weight="500" letter-spacing="2.2">SECURITY · HIVE&#39;S OWN TEST SET · OCT 2026</text>
<text x="40" y="91" fill="#fffaf0" font-size="32">We planted 63 prompt-injection attacks in</text>
<text x="40" y="133" fill="#fffaf0" font-size="32">our own test set. The scanner caught 61.</text>
<text x="40" y="257" fill="#f0b429" font-size="88" font-weight="700" filter="url(#glow)" opacity="0.35">97%</text>
<text x="40" y="257" fill="url(#amber)" font-size="88" font-weight="700">97%</text>
<text x="40" y="287" fill="#ece5d8" font-size="15">of the planted attacks were caught before</text>
<text x="40" y="309" fill="#ece5d8" font-size="15">an agent read them. Of 63.</text>
<text x="440" y="257" fill="#f0b429" font-size="88" font-weight="700" filter="url(#glow)" opacity="0.35">1 in 12</text>
<text x="440" y="257" fill="url(#amber)" font-size="88" font-weight="700">1 in 12</text>
<text x="440" y="287" fill="#ece5d8" font-size="15">harmless texts wrongly flagged. Of 12.</text>
<line x1="40" y1="343" x2="840" y2="343" stroke="#1c1814"/>
<text x="40" y="365" fill="#8b949e" font-size="12">Hive&#39;s own test set, not production traffic. A planted attack is text in an issue or</text>
<text x="40" y="383" fill="#8b949e" font-size="12">file that tries to redirect the agent.</text>
</svg>
