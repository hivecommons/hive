<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1532" viewBox="0 0 880 766" role="img" aria-label="hivecommons/hive #13523 was sent back once and merged 16 minutes after opening." font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<title>hivecommons/hive #13523 was sent back once and merged 16 minutes after opening.</title>
<rect x="0.5" y="0.5" width="879" height="765" rx="20" fill="#fbf8f2" stroke="#e2dbcd"/>
<text x="48" y="60" fill="#7a7165" font-size="12" font-weight="500" letter-spacing="2.4">BEFORE / AFTER · ONE REAL PULL REQUEST · (oct &#39;26)</text>
<text x="48" y="108" fill="#1a1612" font-size="28" font-weight="700">A coding agent opened a pull request. The</text>
<text x="48" y="146" fill="#1a1612" font-size="28" font-weight="700">review agent sent it back once. It merged,</text>
<text x="48" y="184" fill="#1a1612" font-size="28" font-weight="700">green, 16 minutes after opening.</text>
<text x="48" y="242" fill="#7a7165" font-size="16" font-weight="700">Without Hive</text>
