<text x="68" y="286" fill="#7a7165" font-size="12" font-weight="500" letter-spacing="2.4">ISSUE</text>
<text x="68" y="310" fill="#3b342c" font-size="16">A failing check or an open issue</text>
<text x="68" y="334" fill="#3b342c" font-size="16">waits for someone to pick it up.</text>
<circle cx="52" cy="370" r="4" fill="#d6cfc2"/>
<text x="68" y="374" fill="#7a7165" font-size="12" font-weight="500" letter-spacing="2.4">PULL REQUEST</text>
<text x="68" y="398" fill="#3b342c" font-size="16">Someone writes the fix when they</text>
<text x="68" y="422" fill="#3b342c" font-size="16">have time.</text>
<circle cx="52" cy="458" r="4" fill="#d6cfc2"/>
<text x="68" y="462" fill="#7a7165" font-size="12" font-weight="500" letter-spacing="2.4">REVIEW</text>
<text x="68" y="486" fill="#3b342c" font-size="16">Someone else reads it when they have</text>
<text x="68" y="510" fill="#3b342c" font-size="16">time.</text>
<circle cx="52" cy="546" r="4" fill="#d6cfc2"/>
<text x="68" y="550" fill="#7a7165" font-size="12" font-weight="500" letter-spacing="2.4">MERGE</text>
<text x="68" y="574" fill="#3b342c" font-size="16">Thursday, maybe.</text>
<text x="464" y="242" fill="#a3640c" font-size="16" font-weight="700">With Hive · hivecommons/hive #13523</text>
<circle cx="468" cy="282" r="4" fill="#a3640c"/>
<text x="484" y="286" fill="#7a7165" font-size="12" font-weight="500" letter-spacing="2.4">PULL REQUEST</text>
<text x="484" y="310" fill="#3b342c" font-size="16">A coding agent opened it.</text>
<circle cx="468" cy="346" r="4" fill="#a3640c"/>
<text x="484" y="350" fill="#7a7165" font-size="12" font-weight="500" letter-spacing="2.4">SENT BACK AT 4 MIN</text>
<text x="484" y="374" fill="#3b342c" font-size="16">The changelog note was written as a</text>
<text x="484" y="398" fill="#3b342c" font-size="16">sentence, not a list entry, so the</text>
<text x="484" y="422" fill="#3b342c" font-size="16">release build would have rejected</text>
<text x="484" y="446" fill="#3b342c" font-size="16">it. A second, duplicate note was</text>
<text x="484" y="470" fill="#3b342c" font-size="16">also added.</text>
<circle cx="468" cy="506" r="4" fill="#1a7f37"/>
<text x="484" y="510" fill="#7a7165" font-size="12" font-weight="500" letter-spacing="2.4">FIXED AT 8 MIN</text>
<text x="484" y="534" fill="#3b342c" font-size="16">The coding agent pushed a fix and</text>
<text x="484" y="558" fill="#3b342c" font-size="16">the review agent approved it.</text>
<circle cx="468" cy="594" r="4" fill="#1a7f37"/>
<text x="484" y="598" fill="#7a7165" font-size="12" font-weight="500" letter-spacing="2.4">MERGED AT 16 MIN</text>
<text x="484" y="622" fill="#3b342c" font-size="16">CI was green and a human merged it.</text>
