<text x="48" y="59" fill="#8b949e" font-size="11">BEFORE / AFTER · ONE REAL PULL REQUEST · (oct &#39;26)</text>
<text x="48" y="99" fill="#fffaf0" font-size="32" font-weight="700">A coding agent opened a pull request.</text>
<text x="48" y="141" fill="#fffaf0" font-size="32" font-weight="700">The review agent sent it back once. It</text>
<text x="48" y="183" fill="#fffaf0" font-size="32" font-weight="700">merged, green, 16 minutes after opening.</text>
<text x="48" y="237" fill="#8b949e" font-size="17">Without Hive</text>
<rect x="48" y="287" width="8" height="8" rx="4" fill="#3a342c"/>
<text x="66" y="295" fill="#8b949e" font-size="11">ISSUE</text>
<text x="66" y="317" fill="#ece5d8" font-size="15">A failing check or an open issue</text>
<text x="66" y="339" fill="#ece5d8" font-size="15">waits for someone to pick it up.</text>
<rect x="48" y="365" width="8" height="8" rx="4" fill="#3a342c"/>
<text x="66" y="373" fill="#8b949e" font-size="11">PULL REQUEST</text>
<text x="66" y="395" fill="#ece5d8" font-size="15">Someone writes the fix when they</text>
<text x="66" y="417" fill="#ece5d8" font-size="15">have time.</text>
<rect x="48" y="443" width="8" height="8" rx="4" fill="#3a342c"/>
<text x="66" y="451" fill="#8b949e" font-size="11">REVIEW</text>
<text x="66" y="473" fill="#ece5d8" font-size="15">Someone else reads it when they have</text>
<text x="66" y="495" fill="#ece5d8" font-size="15">time.</text>
<rect x="48" y="521" width="8" height="8" rx="4" fill="#3a342c"/>
<text x="66" y="529" fill="#8b949e" font-size="11">MERGE</text>
<text x="66" y="551" fill="#ece5d8" font-size="15">Thursday, maybe.</text>
<text x="464" y="237" fill="#f0b429" font-size="17">With Hive: hivecommons/hive #13523</text>
<rect x="464" y="287" width="8" height="8" rx="4" fill="#f0b429"/>
<text x="482" y="295" fill="#8b949e" font-size="11">PULL REQUEST</text>
<text x="482" y="317" fill="#ece5d8" font-size="15">A coding agent opened it.</text>
<rect x="464" y="343" width="8" height="8" rx="4" fill="#f0b429"/>
<text x="482" y="351" fill="#8b949e" font-size="11">SENT BACK AT 4 MIN</text>
<text x="482" y="373" fill="#ece5d8" font-size="15">The changelog note was written as a</text>
<text x="482" y="395" fill="#ece5d8" font-size="15">sentence, not a list entry, so the</text>
<text x="482" y="417" fill="#ece5d8" font-size="15">release build would have rejected</text>
<text x="482" y="439" fill="#ece5d8" font-size="15">it; a second, duplicate note was</text>
<text x="482" y="461" fill="#ece5d8" font-size="15">also added.</text>
<rect x="464" y="487" width="8" height="8" rx="4" fill="#2da44e"/>
<text x="482" y="495" fill="#8b949e" font-size="11">FIXED AT 8 MIN</text>
<text x="482" y="517" fill="#ece5d8" font-size="15">The coding agent pushed a fix; the</text>
<text x="482" y="539" fill="#ece5d8" font-size="15">review agent approved it.</text>
<rect x="464" y="565" width="8" height="8" rx="4" fill="#2da44e"/>
<text x="482" y="573" fill="#8b949e" font-size="11">MERGED AT 16 MIN</text>
<text x="482" y="595" fill="#ece5d8" font-size="15">CI green, a human merged it.</text>
<rect x="48" y="629" width="784" height="1" rx="0" fill="#1c1814"/>
<text x="48" y="651" fill="#8b949e" font-size="12">Same shape: hivecommons/pluk #328, sent back at 6 min, fixed at 16, merged at 23.</text>
