<svg xmlns="http://www.w3.org/2000/svg" width="880" height="269" viewBox="0 0 880 269" role="img" aria-label="Two real pull requests where the reviewer caught a problem before merge" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Two real pull requests where the reviewer caught a problem before merge</title>
<rect x="0.5" y="0.5" width="879" height="268" rx="12" fill="#121922" stroke="#263545"/>
<text x="20" y="32" fill="#a8b3c2" font-size="10" font-weight="600" letter-spacing="1.2">ACCURACY · TWO REAL PULL REQUESTS</text>
<a href="https://github.com/hivecommons/hive/pull/13523"><text x="20" y="62" fill="#f4c75f" font-size="15" font-weight="700">hivecommons/hive #13523</text></a>
<circle cx="24" cy="80" r="4" fill="#f4c75f"/>
<text x="36" y="84" fill="#a8b3c2" font-size="10" font-weight="600">CAUGHT</text>
<text x="36" y="100" fill="#f6f8fb" font-size="13">The changelog note was written as a sentence, not a list</text>
<text x="36" y="117" fill="#f6f8fb" font-size="13">entry, so the release build would have rejected it; a</text>
<text x="36" y="134" fill="#f6f8fb" font-size="13">second, duplicate note was also added.</text>
<circle cx="24" cy="157" r="4" fill="#74df9a"/>
<text x="36" y="161" fill="#a8b3c2" font-size="10" font-weight="600">FIXED</text>
<text x="36" y="177" fill="#f6f8fb" font-size="13">The author fixed it; the new version was approved 4 minutes later.</text>
<circle cx="24" cy="200" r="4" fill="#74df9a"/>
<text x="36" y="204" fill="#a8b3c2" font-size="10" font-weight="600">MERGED</text>
<text x="36" y="220" fill="#f6f8fb" font-size="13">Merged 16 minutes after the pull request was opened.</text>
<a href="https://github.com/hivecommons/pluk/pull/328"><text x="450" y="62" fill="#f4c75f" font-size="15" font-weight="700">hivecommons/pluk #328</text></a>
<circle cx="454" cy="80" r="4" fill="#f4c75f"/>
<text x="466" y="84" fill="#a8b3c2" font-size="10" font-weight="600">CAUGHT</text>
<text x="466" y="100" fill="#f6f8fb" font-size="13">An apostrophe inside a quoted message ended the string</text>
<text x="466" y="117" fill="#f6f8fb" font-size="13">early, so the project would not compile and no tests could</text>
<text x="466" y="134" fill="#f6f8fb" font-size="13">run.</text>
<circle cx="454" cy="157" r="4" fill="#74df9a"/>
<text x="466" y="161" fill="#a8b3c2" font-size="10" font-weight="600">FIXED</text>
<text x="466" y="177" fill="#f6f8fb" font-size="13">The author fixed it; the new version was approved 10 minutes later.</text>
<circle cx="454" cy="200" r="4" fill="#74df9a"/>
<text x="466" y="204" fill="#a8b3c2" font-size="10" font-weight="600">MERGED</text>
<text x="466" y="220" fill="#f6f8fb" font-size="13">Merged 23 minutes after the pull request was opened.</text>
<text x="20" y="253" fill="#a8b3c2" font-size="10">Times from the review records Hive keeps. Click a title to open the pull request.</text>
</svg>
