<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1138" viewBox="0 0 880 569" role="img" aria-label="How Hive works: scan, claim, work, verify, merge, credit" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<title>How Hive works: scan, claim, work, verify, merge, credit</title>
<defs>
<linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a5f0b"/><stop offset="1" stop-color="#b8741a"/></linearGradient>
<filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect x="0.5" y="0.5" width="879" height="568" rx="16" fill="#fbf8f2" stroke="#ddd6c8"/>
<text x="40" y="51" fill="#6b6459" font-size="11" font-weight="500" letter-spacing="2.2">HOW IT WORKS · EVERY TASK</text>
<text x="40" y="91" fill="#1a1612" font-size="32">A coding agent does the work. A review</text>
<text x="40" y="133" fill="#1a1612" font-size="32">agent and your CI gate the merge.</text>
<text x="40" y="207" fill="url(#amber)" font-size="24" font-weight="700">01</text>
<text x="88" y="207" fill="#1a1612" font-size="15" font-weight="700">Scan</text>
<text x="184" y="207" fill="#2b2620" font-size="15">Reads open issues, pull requests, failing</text>
<text x="184" y="229" fill="#2b2620" font-size="15">checks.</text>
<text x="840" y="207" fill="#6b6459" font-size="13" text-anchor="end">like a webhook trigger</text>
<line x1="40" y1="259" x2="840" y2="259" stroke="#e8e2d6"/>
<text x="40" y="285" fill="url(#amber)" font-size="24" font-weight="700">02</text>
<text x="88" y="285" fill="#1a1612" font-size="15" font-weight="700">Claim</text>
<text x="184" y="285" fill="#2b2620" font-size="15">One agent takes one task.</text>
<text x="840" y="285" fill="#6b6459" font-size="13" text-anchor="end">one job per task</text>
<line x1="40" y1="315" x2="840" y2="315" stroke="#e8e2d6"/>
<text x="40" y="341" fill="url(#amber)" font-size="24" font-weight="700">03</text>
<text x="88" y="341" fill="#1a1612" font-size="15" font-weight="700">Work</text>
<text x="184" y="341" fill="#2b2620" font-size="15">A short-lived agent does it, then stops.</text>
<text x="840" y="341" fill="#6b6459" font-size="13" text-anchor="end">ephemeral runner</text>
<line x1="40" y1="371" x2="840" y2="371" stroke="#e8e2d6"/>
<text x="40" y="397" fill="url(#amber)" font-size="24" font-weight="700">04</text>
<text x="88" y="397" fill="#1a1612" font-size="15" font-weight="700">Verify</text>
<text x="184" y="397" fill="#2b2620" font-size="15">AI review plus your CI must pass.</text>
<text x="840" y="397" fill="#6b6459" font-size="13" text-anchor="end">both are required checks</text>
<line x1="40" y1="427" x2="840" y2="427" stroke="#e8e2d6"/>
<text x="40" y="453" fill="url(#amber)" font-size="24" font-weight="700">05</text>
<text x="88" y="453" fill="#1a1612" font-size="15" font-weight="700">Merge</text>
<text x="184" y="453" fill="#2b2620" font-size="15">Held for a human, or merged on green.</text>
<text x="840" y="453" fill="#6b6459" font-size="13" text-anchor="end">PRs only → merge on green</text>
<line x1="40" y1="483" x2="840" y2="483" stroke="#e8e2d6"/>
<text x="40" y="509" fill="url(#amber)" font-size="24" font-weight="700">06</text>
<text x="88" y="509" fill="#1a1612" font-size="15" font-weight="700">Credit</text>
<text x="184" y="509" fill="#2b2620" font-size="15">The issue opener is named on the merge.</text>
<text x="840" y="509" fill="#6b6459" font-size="13" text-anchor="end">co-author trailer</text>
</svg>
