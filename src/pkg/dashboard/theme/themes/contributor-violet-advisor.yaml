id: contributor-violet-advisor
name: Violet advisor
description: Contributor profile skin with a violet advisor accent.
author: Hive contributors
scopes: [dashboard, contributor]
dark: true
tokens:
  "--bg": "#0d1117"
  "--bg-soft": "#010409"
  "--panel": "#161b22"
  "--panel-strong": "#21262d"
  "--text": "#e6edf3"
  "--muted": "#8b949e"
  "--line": "#30363d"
  "--line-strong": "#21262d"
  "--amber": "#d29922"
  "--blue": "#58a6ff"
  "--red": "#f85149"
  "--green": "#3fb950"
  "--yellow": "#d29922"
  "--orange": "#db6d28"
  "--cyan": "#79c0ff"
  "--purple": "#bc8cff"
  "--font-ui": "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
  "--font-mono": "ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
  "--accent": "#a371f7"
fonts:
  ui: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
  mono: "ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
custom_css: |
  .me-card { --me-accent: #a371f7; --me-accent-soft: rgba(163,113,247,.15); }
