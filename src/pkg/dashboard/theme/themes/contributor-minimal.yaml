id: contributor-minimal
name: Minimal
description: Restrained contributor profile skin that reduces ornamentation.
author: Hive contributors
scopes: [dashboard, contributor]
dark: true
tokens:
  "--bg": "#0d1117"
  "--bg-soft": "#010409"
  "--panel": "#161b22"
  "--panel-strong": "#21262d"
  "--text": "#e6edf3"
  "--muted": "#8b949e"
  "--line": "#30363d"
  "--line-strong": "#21262d"
  "--amber": "#d29922"
  "--blue": "#58a6ff"
  "--red": "#f85149"
  "--green": "#3fb950"
  "--yellow": "#d29922"
  "--orange": "#db6d28"
  "--cyan": "#79c0ff"
  "--purple": "#bc8cff"
  "--font-ui": "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
  "--font-mono": "ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
  "--accent": "var(--cc-muted)"
fonts:
  ui: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
  mono: "ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace"
custom_css: |
  .me-card { --me-accent: var(--cc-muted); --me-accent-soft: rgba(139,148,158,.12); }
  .me-card .dz-identity{min-height:0}
  .me-card .me-emblem{display:none}
  .me-card .dz-medallion{background:var(--cc-bg)}
