id: terminal
name: Terminal
description: Green-on-black mono theme for operators who live in shells.
author: Hive contributors
scopes: [dashboard, contributor]
dark: true
tokens:
  "--bg": "#000000"
  "--bg-soft": "#020602"
  "--panel": "#031003"
  "--panel-strong": "#062006"
  "--text": "#c8ffc8"
  "--muted": "#7bd87b"
  "--line": "#145214"
  "--line-strong": "#25d825"
  "--amber": "#afff5a"
  "--accent": "#00ff66"
  "--blue": "#66ffcc"
  "--red": "#ff6666"
  "--green": "#00ff66"
  "--yellow": "#afff5a"
  "--orange": "#d0ff66"
  "--cyan": "#66ffcc"
  "--purple": "#99ff99"
  "--terminal-bg": "#000000"
  "--terminal-fg": "#00ff66"
  "--terminal-muted": "#7bd87b"
  "--terminal-line": "#145214"
  "--font-ui": "'SF Mono', 'Cascadia Code', monospace"
  "--font-mono": "'SF Mono', 'Cascadia Code', monospace"
fonts:
  ui: "'SF Mono', 'Cascadia Code', monospace"
  mono: "'SF Mono', 'Cascadia Code', monospace"
