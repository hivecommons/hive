id: hive-dark
name: Hive Dark
description: Hub-aligned dark dashboard palette with cool blue accents.
author: Hive contributors
scopes: [dashboard, contributor]
dark: true
tokens:
  "--bg": "#080b0f"
  "--bg-soft": "#0d1218"
  "--panel": "#121922"
  "--panel-strong": "#17212d"
  "--text": "#f6f8fb"
  "--muted": "#a8b3c2"
  "--line": "#263545"
  "--line-strong": "#263545"
  "--amber": "#f4c75f"
  "--accent": "#80bfff"
  "--blue": "#80bfff"
  "--red": "#ff7e7e"
  "--green": "#74df9a"
  "--yellow": "#d29922"
  "--orange": "#e38b2c"
  "--cyan": "#7bd8cd"
  "--purple": "#c0a6f0"
  "--font-ui": "Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
  "--font-mono": "'SF Mono', 'Cascadia Code', 'Fira Code', monospace"
fonts:
  ui: "Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
  mono: "'SF Mono', 'Cascadia Code', 'Fira Code', monospace"
