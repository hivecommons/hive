id: contributor-rank-metal
name: Rank metal
description: Contributor profile skin that follows the viewer ceremony rank metal.
author: Hive contributors
scopes:
- dashboard
- contributor
dark: true
tokens:
  --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif
  --font-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace
  --surface-0: '#0d1117'
  --surface-1: '#010409'
  --surface-2: '#161b22'
  --surface-3: '#21262d'
  --line-subtle: '#30363d'
  --line-strong: '#21262d'
  --text: '#e6edf3'
  --text-muted: '#8b949e'
  --brand: '#d29922'
  --accent: var(--me-metal,#58a6ff)
  --status-ok: '#3fb950'
  --status-warn: '#d29922'
  --status-attention: '#db6d28'
  --status-error: '#f85149'
  --status-info: '#58a6ff'
  --acmm-level-2: '#79c0ff'
  --acmm-level-5: '#bc8cff'
fonts:
  ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif
  mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace
custom_css: '.me-card { --me-accent: var(--me-metal,#58a6ff); --me-accent-soft: var(--me-metal-soft,rgba(88,166,255,.14)); }

  '
