level: 1
name: Inception
description: >
  Project inception. Inception (spek) sessions turn raw ideas into specs,
  plans and a starting project; brainstorm proposes ideas as advisory beads
  while guide provides interactive documentation and setup advice. Both agents remain advisory and conversational; no GitHub write
  actions or feedback loops run without a human.
governor:
  modes: none
  merge_policy: manual
  eval_interval_s: 600
  cadences:
    quiet:
      guide: 2h
    idle:
      guide: 4h
agents:
  - name: guide
    display_name: guide
    role: guide
    description: >
      Interactive advisor that queries the community knowledge base for
      scaffolding patterns. Helps create repos, initial structure, and test
      stubs. No autonomous actions — everything is conversational.
    emoji: "🧭"
    color: "#8e44ad"
    sort_order: 10
    backend: copilot
    model: claude-sonnet-4-6
    bead_role: worker
    mode: ADVISORY
    kick_template: guide-advisory.md
    include_repos: false
    stale_timeout: 28800  # 8h — must exceed longest cadence (4h idle)
    interactions: "Standalone. Responds to user queries only."
    knowledge_use: >
      Heavy consumer — reads community wiki, project patterns, and scaffolding
      templates. Does not produce knowledge entries at this level.

  - name: brainstorm
    display_name: brainstorm
    role: brainstorm
    description: >
      Ideation agent. Proposes features, architecture directions, and
      strategic improvements as advisory beads. (Turning a raw idea into a
      project now happens in Inception (spek) sessions.)
    emoji: "💡"
    color: "#f39c12"
    sort_order: 5
    backend: copilot
    model: claude-sonnet-4-6
    bead_role: worker
    mode: ADVISORY
    kick_template: brainstorm-advisory.md
    clear_on_kick: true
    on_demand: true
    include_repos: false
    stale_timeout: 7200
    interactions: "Standalone. Kicked on request."
    knowledge_use: >
      Heavy consumer of community wiki patterns, scaffolding templates, and
      language-specific defaults. PRODUCES ideation facts (idea, vision,
      constitution, requirement, constraint, stakeholder, acceptance) into the
      project KB layer. These facts persist into L2+ and inform all future
      agent behavior.
