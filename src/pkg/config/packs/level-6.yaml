level: 6
name: Fully Autonomous
description: 'Multi-loop with external orchestration. Agents open issues, create PRs,
  and auto-merge on green CI. No hold label. Adds outreach agent (+outreach) for community
  engagement and external-facing actions. Nine agents total. Highest trust — governor
  at fastest cadence.

  '
governor:
  modes: SURGE, BUSY, QUIET, IDLE
  # High-trust level: decomposed epic plans are approved automatically, so their
  # child sub-tasks become claimable without a human plan-review step.
  plan_auto_approve: true
  merge_policy: 'Auto-merge on green CI. No hold label.

    '
  eval_interval_s: 120
  thresholds:
    surge: 10
    busy: 5
    quiet: 2
    idle: 0
  cadences:
    surge:
      supervisor: 1m
      scanner: 5m
      ci-maintainer: 5m
      quality: 10m
      architect: 15m
      outreach: 30m
      sec-check: 15m
      strategist: 30m
    busy:
      supervisor: 2m
      scanner: 10m
      ci-maintainer: 10m
      quality: 15m
      architect: 30m
      outreach: 1h
      sec-check: 30m
      strategist: 1h
    quiet:
      supervisor: 3m
      scanner: 20m
      ci-maintainer: 20m
      quality: 30m
      architect: 1h
      outreach: 2h
      sec-check: 1h
      strategist: 2h
    idle:
      supervisor: 5m
      scanner: 30m
      ci-maintainer: 30m
      quality: 1h
      architect: 2h
      outreach: 4h
      sec-check: 2h
      strategist: 4h
agents:
- name: supervisor
  display_name: Supervisor
  role: supervisor
  description: 'Full autonomous oversight. Self-healing: restarts stalled agents,
    triggers rollbacks on deploy failures.

    '
  emoji: 👑
  color: '#e74c3c'
  sort_order: 1
  backend: copilot
  model: claude-sonnet-4-6
  bead_role: supervisor
  mode: ADVISORY
  kick_template: supervisor-nogithub.md
  include_repos: true
  clear_on_kick: false
  stale_timeout: 600
  interactions: 'Full autonomous oversight of all agents. Triggers self-healing actions
    without human intervention.

    '
  knowledge_use: 'Reads agent health history. Produces sweep reports and self-healing
    action logs.

    '
- name: scanner
  display_name: scanner
  role: scanner
  description: 'Creates and auto-merges PRs on green CI. No hold label. Full SLA enforcement
    with 30-minute response time.

    '
  emoji: 🔍
  color: '#3498db'
  sort_order: 20
  backend: copilot
  model: claude-opus-4-6
  bead_role: worker
  mode: ISSUES_PRS_MERGE
  kick_template: scanner-automerge.md
  include_repos: true
  stale_timeout: 3600  # 1h — must exceed longest cadence (30m idle)
  lane_keywords:
  - bug
  - triage
  - fix
  - issue
  interactions: 'Creates and merges PRs autonomously.

    '
  knowledge_use: 'Full access to all project knowledge.

    '
- name: ci-maintainer
  display_name: ci-maintainer
  role: ci-maintainer
  description: 'Full CI pipeline ownership. Creates and auto-merges CI improvement
    PRs.

    '
  emoji: 🔧
  color: '#2ecc71'
  sort_order: 30
  backend: copilot
  model: claude-sonnet-4-6
  bead_role: worker
  mode: ISSUES_AND_PRS
  kick_template: ci-maintainer-full.md
  include_repos: true
  stale_timeout: 3600  # 1h — must exceed longest cadence (30m idle)
  lane_keywords:
  - ci
  - build
  - pipeline
  - workflow
  - dependency
  interactions: 'Owns CI pipeline. Coordinates with supervisor.

    '
  knowledge_use: 'Full CI history.

    '
- name: quality
