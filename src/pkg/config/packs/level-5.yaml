level: 5
name: Semi-Autonomous
description: 'Multi-loop feedback (formerly ''Semi-Automated''). Agents open issues AND pull requests. All agent
  PRs get a ''hold'' label automatically — humans batch-review and approve. Adds architect
  (+architect) for RFCs and strategist (+strategist) for cross-agent coordination.
  Eight agents total. The system proposes; it does not merge autonomously.

  '
governor:
  modes: SURGE, BUSY, QUIET, IDLE
  # High-trust level: decomposed epic plans are approved automatically, so their
  # child sub-tasks become claimable without a human plan-review step.
  plan_auto_approve: true
  merge_policy: 'Hold-gated — all agent PRs get ''hold'' label. Human batch-approves.

    '
  eval_interval_s: 300
  thresholds:
    surge: 10
    busy: 5
    quiet: 2
    idle: 0
  cadences:
    surge:
      supervisor: 5m
      scanner: 4h
      ci-maintainer: 4h
      quality: 2h
      guide: 4h
      sec-check: 4h
      architect: 4h
      strategist: 4h
    busy:
      supervisor: 5m
      scanner: 4h
      ci-maintainer: 4h
      quality: 2h
      guide: 4h
      sec-check: 4h
      architect: 4h
      strategist: 4h
    quiet:
      supervisor: 5m
      scanner: 4h
      ci-maintainer: 4h
      quality: 2h
      guide: 4h
      sec-check: 4h
      architect: 4h
      strategist: 4h
    idle:
      supervisor: 5m
      scanner: 4h
      ci-maintainer: 4h
      quality: 2h
      guide: 4h
      sec-check: 4h
      architect: 4h
      strategist: 4h
agents:
- name: supervisor
  display_name: Supervisor
  role: supervisor
  description: 'Agent health monitoring, sweep analysis, and escalation. Watches all
    other agents for stalls, rate limits, and anomalies.

    '
  emoji: 👑
  color: '#e74c3c'
  sort_order: 1
  backend: copilot
  model: claude-sonnet-4-6
  bead_role: supervisor
  mode: ADVISORY
  kick_template: supervisor-nogithub.md
  include_repos: true
  clear_on_kick: false
  stale_timeout: 1800
  interactions: 'Monitors all agents. Escalates issues to human operators.

    '
  knowledge_use: 'Reads agent health history. Produces sweep reports.

    '
- name: scanner
  display_name: scanner
  role: scanner
  description: 'Opens issues AND hold-gated PRs. All PRs get ''hold'' label automatically.
    Human reviews in batches.

    '
  emoji: 🔍
  color: '#3498db'
  sort_order: 20
  backend: copilot
  model: claude-opus-4-6
  bead_role: worker
  mode: ISSUES_AND_PRS
  kick_template: scanner-holdgated.md
  include_repos: true
  stale_timeout: 28800  # 8h — must exceed longest cadence (4h)
  lane_keywords:
  - bug
  - triage
  - fix
  - issue
  interactions: 'Creates hold-gated PRs. Quality validates but does not approve.

    '
  knowledge_use: 'Full project history access. Produces fix records.

    '
- name: ci-maintainer
  display_name: ci-maintainer
  role: ci-maintainer
  description: 'Opens issues AND hold-gated PRs for CI improvements. Workflow optimization
    and dependency updates.

    '
  emoji: 🔧
  color: '#2ecc71'
  sort_order: 30
  backend: copilot
  model: claude-sonnet-4-6
  bead_role: worker
  mode: ISSUES_AND_PRS
  kick_template: ci-maintainer-holdgated.md
  include_repos: true
  stale_timeout: 28800  # 8h — must exceed longest cadence (4h)
  lane_keywords:
  - ci
  - build
  - pipeline
  - workflow
  - dependency
  interactions: 'Creates CI-related issues and hold-gated PRs.

    '
  knowledge_use: 'Reads CI history. Produces workflow health reports.

    '
- name: quality
  display_name: quality
  role: quality
  description: 'Opens issues about testing AND hold-gated PRs for test improvements.
    Reviews scanner PRs for coverage.

    '
  emoji: 🧪
  color: '#e67e22'
  sort_order: 25
  backend: copilot
  model: claude-opus-4-6
  bead_role: worker
  mode: ISSUES_AND_PRS
  kick_template: quality-holdgated.md
  include_repos: true
  stale_timeout: 14400  # 4h — must exceed longest cadence (2h)
  interactions: 'Reviews scanner PRs for coverage. Creates test PRs with hold label.

    '
  knowledge_use: 'Reads test patterns and coverage history.

    '
- name: guide
  display_name: guide
  role: guide
  description: 'Opens issues about documentation AND hold-gated PRs for doc improvements.
    Reviews PRs on request.

    '
  emoji: 🧭
  color: '#8e44ad'
  sort_order: 10
  backend: copilot
  model: claude-sonnet-4-6
  bead_role: worker
  mode: ISSUES_AND_PRS
  kick_template: guide-holdgated.md
  include_repos: true
  stale_timeout: 28800  # 8h — must exceed longest cadence (4h)
  interactions: 'Creates documentation issues and hold-gated PRs.

    '
  knowledge_use: 'Reads community wiki and project patterns.

    '
- name: sec-check
  display_name: security
  role: sec-check
  description: 'Opens issues AND hold-gated PRs for security fixes. CVE tracking and
    vulnerability monitoring.

    '
  emoji: 🛡
  color: '#1abc9c'
  sort_order: 60
  backend: copilot
  model: claude-sonnet-4-6
  bead_role: worker
  mode: ISSUES_AND_PRS
  kick_template: sec-check-holdgated.md
  include_repos: true
  stale_timeout: 28800  # 8h — must exceed longest cadence (4h)
  lane_keywords:
  - security
  - cve
  - vulnerability
  - audit
  interactions: 'Creates security issues and hold-gated PRs.

    '
  knowledge_use: 'Reads vulnerability databases and past security fixes.

    '
- name: architect
  display_name: architect
  role: architect
  description: 'Architecture agent. Produces RFCs, refactors, and new features. Opens
    hold-gated PRs for structural changes.

    '
  emoji: 🏗
  color: '#9b59b6'
  sort_order: 40
  backend: copilot
  model: claude-opus-4-6
  bead_role: worker
  mode: ISSUES_AND_PRS
  kick_template: architect-holdgated.md
  include_repos: true
  stale_timeout: 28800  # 8h — must exceed longest cadence (4h)
  lane_keywords:
  - refactor
  - architecture
  - rfc
  - design
  - feature
  interactions: 'Receives complex issues from scanner. Produces RFCs and hold-gated
    PRs.

    '
  knowledge_use: 'Heavy consumer and producer of architecture decisions and patterns.

    '
- name: strategist
  display_name: strategist
  role: strategist
  description: 'Strategic planning, roadmap alignment, and cross-agent coordination.
    Analyzes trends across all agents.

    '
  emoji: 🧠
  color: '#f39c12'
  sort_order: 70
  backend: copilot
  model: claude-sonnet-4-6
  bead_role: worker
  mode: ISSUES_AND_PRS
  kick_template: strategist-holdgated.md
  include_repos: false
  stale_timeout: 28800  # 8h — must exceed longest cadence (4h)
  lane_keywords:
  - strategy
  - roadmap
  - planning
  interactions: 'Reads all agent outputs. Produces strategic insights.

    '
  knowledge_use: 'Heavy consumer of all agent knowledge.

    '
- name: brainstorm
  display_name: brainstorm
  role: brainstorm
  description: 'Ongoing ideation agent. Proposes features, architecture improvements,
    and strategic directions based on project patterns and community KB. Produces
    KB facts and advisory beads.

    '
  emoji: 💡
  color: '#f39c12'
  sort_order: 30
  backend: copilot
  model: claude-sonnet-4-6
  bead_role: worker
  mode: ADVISORY
  kick_template: brainstorm-advisory.md
  on_demand: true
  include_repos: false
  stale_timeout: 7200
  interactions: Standalone. Produces ideation beads for human review.
  knowledge_use: 'Heavy consumer of community wiki patterns. Produces ideation facts
    (feature proposals, architecture decisions, strategic direction) into the project
    KB layer.

    '
  clear_on_kick: true
- name: reviewer
  display_name: reviewer
  role: reviewer
  description: 'Repo-grounded PR reviewer. Wakes when a change is proposed and judges
    THAT change, rather than hunting on a cadence. Reads the repository at the PR''s
    merge-base and must cite file:line evidence for every finding. Produces structured
    review verdicts consumed by the review swarm aggregator and, at L6, by the
    approval desk as withhold-only input to a merge.

    '
  emoji: 🔬
  color: '#34495e'
  sort_order: 26
  backend: copilot
  model: claude-opus-4-6
  bead_role: worker
  # ADVISORY, deliberately. The reviewer's product is a structured verdict
  # written as an agent report, not a GitHub PR review — so it needs no GitHub
  # write scope, and its authority sits strictly below the hive's ACMM level.
  # Posting an actual PR review would require ModeIssuesAndPRs (proxy/rules.go:115
  # gates POST .../pulls/{n}/reviews on that mode), which at L3 would mean a
  # SECOND write-capable agent alongside quality — a change not justified by the
  # evidence, since a verdict a human reads in the batch queue is worth the same
  # as one posted to the PR.
  mode: ADVISORY
  kick_template: reviewer-advisory.md
  # PR-triggered, not cadence-triggered. on_demand keeps the governor from ever
  # kicking this agent on a timer (governor.go gates agentsDueForKick,
  # event-kicks, and AllowResumeKick on it); the review dispatcher wakes it per
  # PR instead. Every other agent hunts; this one judges what it is handed.
  on_demand: true
  # The reviewer must be able to read the tree it is judging. This is the
  # measured active ingredient, not a convenience: a diff-only reviewer scored
  # 17% hits at 3.6 false positives/PR, while the same reviewer with repo access
  # at the merge-base scored 67% hits at 1.4 FPs/PR.
  include_repos: true
  stale_timeout: 7200
  interactions: 'Woken per-PR by the review dispatcher. Verdicts aggregate into
    review-verdicts.json, which gates merge eligibility when review.require_approval
    is set.

    '
  knowledge_use: 'Reads the repository at the PR merge-base. Produces structured
    review verdicts with file:line-cited findings.

    '
  clear_on_kick: true
