level: 2
name: Advisory
description: >
  Advisory feedback with a review-first entry point. Supervisor, guide,
  scanner, quality, and brainstorm observe the hive and publish advisory beads
  or tracking summaries; reviewer posts COMMENT-only PR reviews. No agent
  creates GitHub issues, opens PRs, or merges; humans decide what to act on.
governor:
  modes: SURGE, BUSY, QUIET, IDLE
  merge_policy: manual
  eval_interval_s: 600
  cadences:
    surge:
      supervisor: 5m
      guide: 4h
      scanner: 4h
      quality: 6h
      reviewer: 30m
    busy:
      supervisor: 5m
      guide: 4h
      scanner: 4h
      quality: 6h
      reviewer: 30m
    quiet:
      supervisor: 5m
      guide: 4h
      scanner: 4h
      quality: 6h
      reviewer: 30m
    idle:
      supervisor: 5m
      guide: 4h
      scanner: 4h
      quality: 6h
      reviewer: 30m
agents:
  - name: supervisor
    display_name: Supervisor
    role: supervisor
    description: >
      Agent health monitoring, sweep analysis, and escalation. Watches all
      other agents for stalls, rate limits, and anomalies.
    emoji: "👑"
    color: "#e74c3c"
    sort_order: 1
    backend: copilot
    model: claude-sonnet-4-6
    bead_role: supervisor
    mode: ADVISORY
    kick_template: supervisor-nogithub.md
    include_repos: true
    clear_on_kick: false
    stale_timeout: 1800
    interactions: >
      Monitors all agents. Escalates issues to human operators. Coordinates
      agent restarts and health checks.
    knowledge_use: >
      Reads agent health history and operational patterns. Produces sweep
      reports and health assessments.
  - name: guide
    display_name: guide
    role: guide
    description: >
      Audits project documentation and onboarding experience. At L2, reports
      findings to the advisory issue — does NOT create PRs or push code.
    emoji: "🧭"
    color: "#8e44ad"
    sort_order: 10
    backend: copilot
    model: claude-sonnet-4-6
    bead_role: worker
    mode: ADVISORY
    kick_template: guide-advisory.md
    include_repos: true
    stale_timeout: 28800  # 8h — must exceed longest cadence (4h)
    interactions: "Works alongside scanner. Reviews scanner's suggestions when asked."
    knowledge_use: >
      Reads community wiki and project patterns. Starts contributing review
      insights as knowledge entries.
  - name: scanner
    display_name: scanner
    role: scanner
    description: >
      Scans code for issues and suggests fixes, but does NOT create PRs or
      issues. Reports findings to the user for manual action.
    emoji: "🔍"
    color: "#3498db"
    sort_order: 20
    backend: copilot
    model: claude-sonnet-4-6
    bead_role: worker
    mode: ADVISORY
    kick_template: scanner-advisory.md
    include_repos: true
    stale_timeout: 28800  # 8h — must exceed longest cadence (4h)
    lane_keywords: [bug, triage, fix]
    interactions: "Produces findings that guide can review. No autonomous actions."
    knowledge_use: >
      Reads project patterns and known issues. Produces findings as knowledge
      entries for the team to review.
  - name: quality
    display_name: quality
    role: quality
    description: >
      Analyzes test coverage gaps and suggests test strategies. At L2, reports
      findings to the advisory issue — does NOT create PRs or push code.
    emoji: "🧪"
    color: "#e67e22"
    sort_order: 25
    backend: copilot
    model: claude-sonnet-4-6
    bead_role: worker
    mode: ADVISORY
    kick_template: quality-advisory.md
    include_repos: true
    stale_timeout: 43200  # 12h — must exceed longest cadence (6h)
    interactions: "Complements scanner findings with targeted tests. Guide reviews test quality."
    knowledge_use: >
      Reads test patterns, coverage rules, and known regressions from the
      knowledge base to prioritize which code needs tests most.
  - name: brainstorm
    display_name: brainstorm
    role: brainstorm
    description: >
      Ongoing ideation agent. Proposes features, architecture improvements,
      and strategic directions based on project patterns and community KB.
      Produces KB facts and advisory beads.
    emoji: "💡"
    color: "#f39c12"
    sort_order: 30
    backend: copilot
    model: claude-sonnet-4-6
    bead_role: worker
    mode: ADVISORY
    kick_template: brainstorm-advisory.md
    clear_on_kick: true
    on_demand: true
    include_repos: false
    stale_timeout: 7200
    interactions: "Standalone. Produces ideation beads for human review."
    knowledge_use: >
      Heavy consumer of community wiki patterns. Produces ideation facts
      (feature proposals, architecture decisions, strategic direction) into
      the project KB layer.
  - name: reviewer
    display_name: reviewer
    role: reviewer
    description: 'Repo-grounded PR reviewer. Wakes on a cadence, works the open PR queue,
      and posts review comments that help a human decide. Reads the repository at the
      PR head and must cite file:line evidence for every finding. Flags duplicate PRs,
      changes that should not land, and work the author was not equipped for, then
      routes to a human. Never merges, approves, or closes.

      '
    emoji: 🔬
    color: '#34495e'
    sort_order: 26
    backend: copilot
    model: claude-fable-5
    review_models:
      pool:
      - backend: copilot
        model: gpt-5.6-terra
      - backend: copilot
        model: gemini-3.7-flash
      - backend: copilot
        model: claude-opus-4-6
      exclude_author_model: true
      exclude_author_family: true
      fallback: pinned
    bead_role: worker
    mode: ADVISORY
    converse: true
    kick_template: reviewer-queue.md
    include_repos: true
    clear_on_kick: true
    on_demand: false
    stale_timeout: 3600  # 1h — must exceed the 30m cadence
    interactions: 'Reviews open PRs and routes requires_human / reject verdicts to a
      maintainer via the triage label. Never merges.

      '
    knowledge_use: 'Reads the repository at the PR head; cites file:line evidence.

      '
