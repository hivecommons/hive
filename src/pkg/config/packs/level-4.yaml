level: 4
name: Security-Aware
description: 'Closed-loop feedback (formerly ''Adaptive''). Existing delivery agents open GitHub issues — not just quality.
  Scanner files bug reports, guide files documentation gaps, ci-maintainer files workflow
  issues, sec-check files vulnerabilities. No PRs yet — issues only. Adds security
  agent (+sec-check). Nine agents total, including opt-in telemetry and operations.

  '
governor:
  modes: SURGE, BUSY, QUIET, IDLE
  merge_policy: hold-gated
  eval_interval_s: 300
  thresholds:
    surge: 10
    busy: 5
    quiet: 2
    idle: 0
  cadences:
    # SURGE = the queue is overloaded, so the issue/PR-producing agents must
    # keep RUNNING to drain it — pausing them here was a self-tightening trap: a
    # hive that tripped the threshold paused every worker, so the queue never
    # drained and it stayed in SURGE forever (nothing created, e.g. a fresh L4
    # hive whose first repo scan exceeds threshold=10). Keep the workers on their
    # busy cadences during surge; only the non-draining/advisory agents pause.
    surge:
      supervisor: 5m
      scanner: 4h
      ci-maintainer: 4h
      quality: 2h
      guide: 4h
      sec-check: 4h
      telemetry: paused
      operations: paused
    busy:
      supervisor: 5m
      scanner: 4h
      ci-maintainer: 4h
      quality: 2h
      guide: 4h
      sec-check: 4h
      telemetry: paused
      operations: paused
    quiet:
      supervisor: 5m
      scanner: 4h
      ci-maintainer: 4h
      quality: 2h
      guide: 4h
      sec-check: 4h
      telemetry: paused
      operations: paused
    idle:
      supervisor: 5m
      scanner: 4h
      ci-maintainer: 4h
      quality: 2h
      guide: 4h
      sec-check: 4h
      telemetry: paused
      operations: paused
agents:
- name: supervisor
  display_name: Supervisor
  role: supervisor
  description: 'Agent health monitoring, sweep analysis, and escalation. Watches all
    other agents for stalls, rate limits, and anomalies.

    '
  emoji: 👑
  color: '#e74c3c'
  sort_order: 1
  backend: copilot
  model: claude-sonnet-4-6
  bead_role: supervisor
  mode: ADVISORY
  kick_template: supervisor-nogithub.md
  include_repos: true
  clear_on_kick: false
  stale_timeout: 1800
  interactions: 'Monitors all agents. Escalates issues to human operators. Coordinates
    agent restarts and health checks.

    '
  knowledge_use: 'Reads agent health history and operational patterns. Produces sweep
    reports and health assessments.

    '
- name: scanner
  display_name: scanner
  role: scanner
  description: 'Opens GitHub issues for bugs and code problems found during scans.
    Does NOT create PRs. Reports findings as both issues and advisory beads.

    '
  emoji: 🔍
  color: '#3498db'
  sort_order: 20
  backend: copilot
  model: claude-sonnet-4-6
  bead_role: worker
  mode: ISSUES_ONLY
  kick_template: scanner-issues.md
  include_repos: true
  stale_timeout: 28800  # 8h — must exceed longest cadence (4h)
  lane_keywords:
  - bug
  - triage
  - fix
  - issue
  interactions: 'Creates issues. Produces advisory beads. No PRs.

    '
  knowledge_use: 'Reads project patterns and known issues. Produces findings as issues
    and advisory beads.

    '
- name: ci-maintainer
  display_name: ci-maintainer
  role: ci-maintainer
  description: 'Opens GitHub issues and hold-gated PRs about CI health, workflow failures,
    and build problems. PRs get ''hold'' label; never merges.

    '
  emoji: 🔧
  color: '#2ecc71'
  sort_order: 30
  backend: copilot
  model: claude-sonnet-4-6
  bead_role: worker
  mode: ISSUES_AND_PRS
  kick_template: ci-maintainer-holdgated.md
  include_repos: true
  stale_timeout: 28800  # 8h — must exceed longest cadence (4h)
  lane_keywords:
  - ci
  - build
  - pipeline
  - workflow
  interactions: 'Creates CI-related issues. Produces advisory beads. No PRs.

    '
  knowledge_use: 'Reads CI patterns and past failures. Produces CI health issues and
    advisory beads.

    '
- name: quality
  display_name: quality
  role: quality
  description: 'Opens GitHub issues and hold-gated PRs about testing gaps, coverage,
    and test infrastructure. PRs get ''hold'' label; never merges.

    '
  emoji: 🧪
  color: '#e67e22'
  sort_order: 25
  backend: copilot
  model: claude-opus-4-6
  bead_role: worker
  mode: ISSUES_AND_PRS
  kick_template: quality-holdgated.md
  include_repos: true
  stale_timeout: 14400  # 4h — must exceed longest cadence (2h)
  interactions: 'Creates testing-related issues. Produces advisory beads. No PRs.

    '
  knowledge_use: 'Reads test patterns, coverage rules, and known regressions to prioritize
    which code needs tests most.

    '
- name: guide
  display_name: guide
  role: guide
  description: 'Opens GitHub issues about documentation gaps and onboarding problems.
    Does NOT create PRs. Also produces advisory beads.

    '
  emoji: 🧭
  color: '#8e44ad'
  sort_order: 10
  backend: copilot
  model: claude-sonnet-4-6
  bead_role: worker
  mode: ISSUES_ONLY
  kick_template: guide-issues.md
  include_repos: true
  stale_timeout: 28800  # 8h — must exceed longest cadence (4h)
  interactions: 'Creates documentation issues. Produces advisory beads. No PRs.

    '
  knowledge_use: 'Reads community wiki and project patterns. Produces findings as
    issues and advisory beads.

    '
- name: sec-check
  display_name: security
  role: sec-check
  description: 'Security scanning, dependency audit, and vulnerability monitoring.
    Opens GitHub issues and hold-gated PRs for vulnerabilities and security gaps.
    PRs get ''hold'' label; never merges.

    '
  emoji: 🛡
  color: '#1abc9c'
  sort_order: 60
  backend: copilot
  model: claude-sonnet-4-6
  bead_role: worker
  mode: ISSUES_AND_PRS
  kick_template: sec-check-holdgated.md
  include_repos: true
  stale_timeout: 28800  # 8h — must exceed longest cadence (4h)
  lane_keywords:
  - security
  - cve
  - vulnerability
  - audit
  interactions: 'Creates security issues. Reports critical findings to supervisor
    for escalation. Produces advisory beads.

    '
  knowledge_use: 'Reads vulnerability databases and past security fixes. Produces
    security audit reports and issues.

    '
- name: brainstorm
  display_name: brainstorm
  role: brainstorm
  description: 'Ongoing ideation agent. Proposes features, architecture improvements,
    and strategic directions based on project patterns and community KB. Produces
    KB facts and advisory beads.

    '
  emoji: 💡
  color: '#f39c12'
  sort_order: 30
  backend: copilot
  model: claude-sonnet-4-6
  bead_role: worker
  mode: ADVISORY
  kick_template: brainstorm-advisory.md
  on_demand: true
  include_repos: false
  stale_timeout: 7200
  interactions: Standalone. Produces ideation beads for human review.
  knowledge_use: 'Heavy consumer of community wiki patterns. Produces ideation facts
    (feature proposals, architecture decisions, strategic direction) into the project
    KB layer.

    '
  clear_on_kick: true
- name: telemetry
  display_name: telemetry
  role: telemetry
  description: Audits managed-project instrumentation and observability backends; reports findings only.
  emoji: 📡
  color: '#00a8cc'
  sort_order: 65
  backend: copilot
  model: claude-sonnet-4-6
  bead_role: worker
  mode: ADVISORY
  kick_template: telemetry-advisory.md
  include_repos: true
  stale_timeout: 28800
  lane_keywords: [observability, opentelemetry, prometheus, grafana, tracing, metrics, structured-logging, servicemonitor, podmonitor]
  interactions: Reports instrumentation and telemetry gaps without changing repositories.
  knowledge_use: Reads project stack and observability conventions from the knowledge base.
- name: operations
  display_name: operations
  role: operations
  description: Audits managed-project health checks, SLOs, runbooks, alerts, and rollback practice; reports findings only.
  emoji: 🚨
  color: '#d35400'
  sort_order: 66
  backend: copilot
  model: claude-sonnet-4-6
  bead_role: worker
  mode: ADVISORY
  kick_template: operations-advisory.md
  include_repos: true
  stale_timeout: 28800
  lane_keywords: [healthz, readyz, readiness, slo, sli, runbook, incident-response, rollback, alerting]
  interactions: Reports operational-practice gaps without changing repositories.
  knowledge_use: Reads reliability goals and operational conventions from the knowledge base.
