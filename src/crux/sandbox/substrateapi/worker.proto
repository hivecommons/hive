// Trimmed subset of api/ateapi/v1/ateapi.proto from
// https://github.com/agent-substrate/substrate (tag v1.0.0). Package, service,
// message names and field numbers match upstream so the generated client is
// wire-compatible with ate-api-server; only the RPCs and fields hive's
// Substrate sandbox launcher uses are kept, split across files so each
// generated *.pb.go stays under the crux 800-line file ratchet. Importing
// go.ate.dev/substrate directly would pull a go 1.27 toolchain requirement and
// a vendored cloud-SDK tree into crux. Regenerate with ./generate.sh.

syntax = "proto3";

package substrate.ateapi.v1;

import "common.proto";

option go_package = "github.com/hivecommons/hive/crux/sandbox/substrateapi;substrateapi";

message Worker {
  ResourceMetadata metadata = 1;
  string worker_namespace = 2;
  string worker_pool = 3;
  string worker_pod = 4;
  string worker_pod_uid = 5;
  string node_name = 6;
  string worker_spiffe_id = 7;
  map<string, string> labels = 8;
  WorkerStatus status = 9;
}

enum WorkerState {
  WORKER_STATE_UNSPECIFIED = 0;
  WORKER_STATE_ACTIVE = 1;
  WORKER_STATE_DRAINING = 2;
  WORKER_STATE_UNAVAILABLE = 3;
}

message WorkerStatus {
  WorkerState state = 1;
  repeated WorkerSandboxClass sandbox_classes = 5;
}

message WorkerSandboxClass {
  string sandbox_class = 1;
}

message ListWorkersRequest {
  ListOptions options = 1;
}

message ListWorkersResponse {
  repeated Worker workers = 1;
  string next_page_token = 2;
}
