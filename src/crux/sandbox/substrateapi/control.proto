// Trimmed subset of api/ateapi/v1/ateapi.proto from
// https://github.com/agent-substrate/substrate (tag v1.0.0). Package, service,
// message names and field numbers match upstream so the generated client is
// wire-compatible with ate-api-server; only the RPCs and fields hive's
// Substrate sandbox launcher uses are kept, split across files so each
// generated *.pb.go stays under the crux 800-line file ratchet. Importing
// go.ate.dev/substrate directly would pull a go 1.27 toolchain requirement and
// a vendored cloud-SDK tree into crux. Regenerate with ./generate.sh.

syntax = "proto3";

package substrate.ateapi.v1;

import "actor.proto";
import "actor_rpc.proto";
import "egress.proto";
import "template.proto";
import "worker.proto";

option go_package = "github.com/hivecommons/hive/crux/sandbox/substrateapi;substrateapi";

// Control is the Agent Substrate control-plane API served by ate-api-server.
service Control {
  rpc GetActor(GetActorRequest) returns (Actor) {}
  rpc CreateActor(CreateActorRequest) returns (Actor) {}
  rpc SuspendActor(SuspendActorRequest) returns (SuspendActorResponse) {}
  rpc ResumeActor(ResumeActorRequest) returns (ResumeActorResponse) {}
  rpc DeleteActor(DeleteActorRequest) returns (Actor) {}
  rpc CreateActorEgressPolicy(CreateActorEgressPolicyRequest) returns (EgressPolicy) {}
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse) {}
  rpc CreateActorTemplate(CreateActorTemplateRequest) returns (ActorTemplate) {}
  rpc GetActorTemplate(GetActorTemplateRequest) returns (ActorTemplate) {}
  rpc DeleteActorTemplate(DeleteActorTemplateRequest) returns (ActorTemplate) {}
}
