name: Contributor story
description: Share a Hive Commons contributor story for hivecommons.dev/stories
title: "📖 contributor story: "
labels: [contributor-story, docs]
assignees: ""
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your story. Maintainers review issues with the `contributor-story` label and may promote verified stories to hivecommons.dev/stories.

        <!--
        FOR MAINTAINERS AND AGENTS PICKING THIS ISSUE UP — where the story goes:

        * Published page: https://hivecommons.dev/stories/
        * Source of that page: repository hivecommons/hivecommons.github.io,
          file stories/index.html, section "Stories we can link today"
          (<h2 id="real-stories-title">). It is a hand-edited static GitHub
          Pages site (no build step); copy an existing story card verbatim and
          fill in name, profile link, avatar (https://github.com/<handle>.png),
          project, role, PR/issue link, and the quote (only if "Can we quote
          you by name?" is checked). Run scripts/check-links.sh and
          node --test scripts/*.test.mjs there, then open a PR against main
          referencing this issue. It goes live when that PR merges.
        * Do NOT add stories to this repository (hivecommons/hive): not to the
          hub's static pages, not to src/docs. There is no stories page here
          and one must not be created (see #10644 / #10653).
        -->
  - type: input
    id: name
    attributes:
      label: Name or handle
      description: What should maintainers call you while reviewing this story?
      placeholder: "@octocat or Ada Lovelace"
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: GitHub, GitLab, or other profile URL
      placeholder: "https://github.com/octocat"
    validations:
      required: false
  - type: input
    id: project
    attributes:
      label: Project or hive you contributed to
      placeholder: "Hive, Project Bluefin, KubeStellar Console, ..."
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Role
      options:
        - first-time contributor
        - returning contributor
        - maintainer
        - operator
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: Your story
      description: Share what you tried to do, what Hive or the relay did, and what changed for you.
      placeholder: |
        What did you try to do?
        What did Hive or the relay do?
        What changed for you afterward?
    validations:
      required: true
  - type: checkboxes
    id: quote_ok
    attributes:
      label: Can we quote you by name?
      options:
        - label: "Yes"
          required: false
  - type: input
    id: link
    attributes:
      label: Link to the PR or issue
      description: Public links help maintainers verify and publish the story.
      placeholder: "https://github.com/hivecommons/hive/pull/1492"
    validations:
      required: false
