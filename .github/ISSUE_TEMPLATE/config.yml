blank_issues_enabled: true
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/hivecommons/hive/security/advisories/new
    about: Please do not file vulnerabilities as public issues. Report them privately as described in SECURITY.md.
  - name: Contribute to a hive with your own agent
    url: https://github.com/hivecommons/hive/blob/v5/src/docs/contributor-relay.md
    about: Run the contributor relay to work a hive's backlog with the CLI agent on your own machine.
  - name: Join our Discord
    url: https://hivecommons.dev/discord
    about: Ask setup, contributor, and community questions in the Hive Commons Discord.
  - name: Propose a project to join Hive Commons
    url: https://github.com/hivecommons/.github/issues/new?template=join-hive-commons.yml
    about: Project proposals for the Hive Commons family are handled in the hivecommons/.github repository.
