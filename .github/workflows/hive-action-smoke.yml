name: Hive action smoke

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to receive the manual @hive status smoke comment or OIDC dispatch context.
        required: true
        type: number
      prompt:
        description: Optional prompt text after status.
        required: false
        type: string
        default: manual smoke from workflow_dispatch
      transport:
        description: Dispatch transport.
        required: false
        type: choice
        default: comment
        options:
          - comment
          - oidc
      hub_url:
        description: Hub URL for transport=oidc.
        required: false
        type: string
      audience:
        description: OIDC audience for transport=oidc.
        required: false
        type: string
        default: hive

permissions:
  id-token: write
  issues: write
  pull-requests: write

jobs:
  status:
    name: Relay @hive status
    runs-on: ubuntu-latest
    steps:
      - name: Check out action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Dispatch manual hive status
        uses: ./.github/actions/hive
        with:
          command: status
          issue: ${{ inputs.issue }}
          prompt: ${{ inputs.prompt }}
          transport: ${{ inputs.transport }}
          hub_url: ${{ inputs.hub_url }}
          audience: ${{ inputs.audience }}
