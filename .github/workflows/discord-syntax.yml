name: Discord Syntax Check

# Check that all JavaScript files in discord/ pass node --check to catch
# syntax errors (like unquoted hyphenated object keys) before they reach
# production.

on:
  push:
    paths:
      - 'discord/**'
  pull_request:
    paths:
      - 'discord/**'

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ${{ fromJSON(vars.HIVE_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Check JavaScript syntax in discord/
        run: find discord -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
