name: SUID + NET_ADMIN Contract

# Static contract check for two image invariants (see
# src/scripts/check-suid-contract.sh):
#  1. C6/CWE-250/269: su-exec stays pinned-by-SHA + SHA256-verified and chmod
#     4750 root:hive-launch (launcher-group-only), never world-exec 4755.
#  2. #3760: the hive binary carries NO file capability (a file cap EPERMs on
#     exec wherever the bounding set lacks NET_ADMIN); NET_ADMIN is instead
#     raised by the entrypoint as a bounding-set-gated AMBIENT capability.
#
#  3. #3866/CWE-250/732: the image ships exactly ONE setuid/setgid binary —
#     su-exec. The eleven world-executable ones node:26-slim and the
#     passwd/util-linux packages leave behind are stripped, because the pod
#     cannot switch them off with no_new_privs without breaking su-exec.
#
# plus three runtime jobs that boot a container and prove what a grep cannot:
# ambient-cap-runtime (#3874), manifest-cap-runtime (#4379) and
# image-suid-inventory (#3866).

on:
  push:
    branches:
      - v2
      - v4
    paths:
      - 'src/Dockerfile'
      - 'src/deploy/entrypoint.sh'
      - 'src/scripts/check-suid-contract.sh'
      - 'src/deploy/test_ambient_cap_runtime.sh'
      - 'src/deploy/test_image_suid_inventory.sh'
      # #4379: the manifest capability set is DERIVED from these, so a change to
      # any of them changes what the runtime job boots.
      - 'src/deploy/k8s/deployment.yaml'
      - 'src/deploy/kustomize/overlays/openshift-netadmin/scc-hive-netadmin.yaml'
      - 'src/pkg/hub/saas_provision.go'
      - 'src/deploy/test_manifest_caps_runtime.sh'
      - '.github/workflows/suid-contract.yml'
  pull_request:
    branches:
      - v2
      - v4
    paths:
      - 'src/Dockerfile'
      - 'src/deploy/entrypoint.sh'
      - 'src/scripts/check-suid-contract.sh'
      - 'src/deploy/test_ambient_cap_runtime.sh'
      - 'src/deploy/test_image_suid_inventory.sh'
      # #4379: the manifest capability set is DERIVED from these, so a change to
      # any of them changes what the runtime job boots.
      - 'src/deploy/k8s/deployment.yaml'
      - 'src/deploy/kustomize/overlays/openshift-netadmin/scc-hive-netadmin.yaml'
      - 'src/pkg/hub/saas_provision.go'
      - 'src/deploy/test_manifest_caps_runtime.sh'
      - '.github/workflows/suid-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-check:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","hive"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run SUID + NET_ADMIN static contract check
        run: bash src/scripts/check-suid-contract.sh src/Dockerfile src/deploy/entrypoint.sh

  # RUNTIME assertion (#3874). The static check above cannot catch the bug that
  # caused the fleet-wide outage: `setpriv --ambient-caps +net_admin` EXITS 0 but
  # leaves CapAmb=0x0 unless --inh-caps is raised in the same call. Only actually
  # performing the privilege drop and reading /proc/self/status proves it.
  # This runs the real setpriv from the real base image, with NET_ADMIN in the
  # bounding set (--cap-add), and asserts bit 12 survives the drop to dev.
  ambient-cap-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert ambient CAP_NET_ADMIN survives the privilege drop
        run: bash src/deploy/test_ambient_cap_runtime.sh

  # RUNTIME assertion (#4379). The job above boots with docker's DEFAULT bounding
  # set plus NET_ADMIN — a strictly wider set than the pod gets. This one boots
  # the capability set src/deploy/k8s/deployment.yaml actually ships
  # (`--cap-drop=ALL` plus its exact add list, derived from the manifest at run
  # time, never restated) and drives the whole privilege chain through it: the
  # entrypoint's root->dev setpriv drop, the gosu fallback, the SUID su-exec hop
  # to a per-agent UID, the per-agent chown, a DAC_OVERRIDE write and the ACMM
  # iptables egress gate. It then removes each capability in turn and requires the
  # chain to break, so none of those assertions can pass for the wrong reason.
  #
  # This is the coverage #3895 did not have: that PR proposed dropping
  # SETUID/SETGID, which breaks agent launch in the pod, and CI stayed green.
  manifest-cap-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Boot the manifest's exact capability set and exercise it
        run: bash src/deploy/test_manifest_caps_runtime.sh

  # RUNTIME assertion (#3866). The static check reads src/Dockerfile and can only
  # see what the Dockerfile SAYS. It cannot see what the base image ships, and
  # that is where the surface came from: node:26-slim plus passwd/util-linux
  # leave eleven world-executable setuid/setgid binaries in the image, every one
  # of them execable by an agent UID. `allowPrivilegeEscalation: false` would
  # neutralise them via no_new_privs but would also disable su-exec and break
  # agent launch, so the fix is in the image and this job is what confirms it.
  #
  # It builds the fixture TWICE — once without the Dockerfile's strip block and
  # once with it — and requires the un-stripped build to show the eleven. A
  # check that has never been observed to fail is not evidence. It then execs
  # su-exec as `dev` to prove the one surviving setuid bit still switches UID,
  # and as an agent UID to prove the hive-launch gate still refuses.
  image-suid-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert the image ships exactly one setuid binary
        run: bash src/deploy/test_image_suid_inventory.sh
