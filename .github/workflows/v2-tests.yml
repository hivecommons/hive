name: v2 Tests

on:
  schedule:
    # Hourly, at :30 — deliberately offset from coverage-hourly.yml's :00 run
    # so the two scheduled nets alternate every half hour instead of firing
    # together. This schedule is the post-merge safety net for the default
    # branch (there is no push trigger; pull_request below is the real gate),
    # and it is what keeps create-issue-on-failure armed. It ran every 15
    # minutes until #4650: ~96 runs/day at ~3m15s each — ~5 runner-hours/day —
    # almost all on an unchanged, already-gated SHA, while coverage-hourly
    # re-ran the identical suite with the same floors every hour anyway.
    - cron: '30 * * * *'
  workflow_dispatch:
  # Gate PRs, not just the cron. `go test ./pkg/...` runs nowhere else — v2-ci.yml
  # builds and vets but never runs the unit tests — so before this, a Go
  # regression test could only fail AFTER merge, as a cron-filed ci-failure
  # issue. That is the wrong end of the loop for security regressions: the test
  # proving a fix works has to be able to block the PR that breaks it again.
  #
  # create-issue-on-failure below stays gated on `github.event_name == 'schedule'`,
  # so a red PR fails the check without also filing an issue.
  pull_request:
    branches: [v2, v4]
    # Several package tests police shipped files outside src/: contributor
    # scripts under bin/, the shared shell backend config, and Justfile recipes.
    # Those files must trigger the tests that guard them; otherwise a change to
    # the guarded side of a parity assertion skips the assertion entirely.
    # dashboard/openapi.json is the same class: its route/schema guards live in
    # src/pkg/dashboard, but the published contract does not. The contract test
    # in pkg/github/ci_trigger_contract_test.go pins this complete relationship.
    paths:
      - 'src/**'
      - 'bin/**'
      - 'config/**'
      - 'Justfile'
      - 'dashboard/openapi.json'
      - '.github/workflows/v2-tests.yml'
      # The slowest-tests reporter runs in every shard; an edit to it must run
      # the job that executes it (same rule dashboard-lint applies to its
      # checker, #5388).
      - '.github/scripts/slowest-tests.sh'

permissions:
  contents: read
  issues: write

env:
  # The race-enabled shards require cgo even on lean self-hosted runner images.
  CGO_ENABLED: '1'
  # Self-hosted runners sit inside OpenShift; keep these hermetic unit tests from auto-discovering that cluster.
  KUBERNETES_SERVICE_HOST: ''
  KUBERNETES_SERVICE_PORT: ''


# Cancel superseded PR runs only (#4623). A new push to a PR makes the
# in-flight run's verdict irrelevant, so cancelling it is pure runner-minute
# savings. Scheduled and workflow_dispatch runs must NEVER be cancelable:
# the scheduled run feeds create-issue-on-failure (the merge-race/flake
# auto-filer) — cancelling one blinds it for that window. Keying the non-PR
# group on run_id gives every such run its own group, so they can neither
# cancel each other nor queue behind one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ── Sharding layout (#4118) ──────────────────────────────────────────────────
# The suite is split so PR wall-clock ≈ the slowest single piece, not the sum.
# Measured on CI (v4, ubuntu-latest, -short -race): pkg/hub ≈ 117s and
# pkg/agent ≈ 429s of TEST time each — every other package is ≤ 51s and they
# all run concurrently inside one `go test` invocation. Round-robin over the
# 840 sorted agent test names measures a worst slice of ~127s at N=5. So:
#
#   test (hub i/H)     ./pkg/hub              H jobs, each running a
#                                             deterministic 1/H slice of the
#                                             package's test FUNCTIONS via -run
#                                             (one ~2,700-function package at
#                                             ~125s serial: it was the PR gate's
#                                             critical path until sliced the
#                                             same way as agent) — starts
#                                             immediately, self-partitions
#   test (agent i/N)   ./pkg/agent            N jobs, each running a
#                                             deterministic 1/N slice of the
#                                             package's test FUNCTIONS via -run
#                                             (the package is a serial 429s
#                                             monolith; package-level sharding
#                                             cannot help it) — starts
#                                             immediately, self-partitions
#   list-packages      go list minus hub/agent, greedily bucketed by measured
#                      weight into R balanced groups (job outputs → matrix)
#   test (rest i/R)    one bucket each
#
# Every shard uses the exact same flags: -short -race -count=1 (untouched),
# plus -coverprofile for the parse-only coverage gate below, plus:
#  - -v, with the `=== RUN/PAUSE/CONT` lines stripped before tee, so the log
#    carries a per-test-function duration and .github/scripts/slowest-tests.sh
#    can rank the slice's slowest tests into the step summary. That table is
#    how a slow shard gets diagnosed without a local reproduction.
#  - -shuffle=on on every NON-pull_request run (the hourly schedule and manual
#    dispatches). Order-dependent tests (#5102's golden splash race, the
#    package-var seams in #4795) pass in a fixed order and only fail when the
#    order moves; shuffling the post-merge net finds them and files an issue
#    with the seed in the log, while the PR gate stays deterministic so a
#    contributor is never failed by an ordering their change did not cause.
#  - pkg/dashboard additionally gets a dedicated shuffled lane on EVERY event,
#    PRs included (#5570): it is the package with a record of package-level
#    cache leaks (#5553's cachedHealth), and a leak merged today otherwise
#    fails weeks later on whichever scheduled run draws a hostile order. The
#    lane bounds parallelism and surfaces the failing seed — see
#    test-dashboard-shuffle below for why both bounds are load-bearing.
#
# Completeness invariants (nothing can be silently untested):
#  - rest buckets are computed by EXCLUDING exactly pkg/hub and pkg/agent from
#    the full `go list` and PARTITIONING the remainder — a new package always
#    lands in a bucket (a future subpackage of either sliced package included,
#    since the slices run the bare package path), a removed one just
#    disappears from its bucket.
#  - hub and agent slices partition the sorted `go test -list` output round-robin —
#    a new test function always lands in a slice. Anchored full-name regexes
#    (^(A|B|...)$) make slices pairwise disjoint and jointly exhaustive.
#  - the aggregate `test` job (the required-check name) fails closed: it
#    requires list-packages AND every shard to succeed.
jobs:
  # pkg/hub is one package of ~2,700 test functions that takes ~125s serially
  # under -race — after #4118 sliced pkg/agent, this single job was the PR
  # gate's critical path (~3.3 min wall clock against ~2.4 min for the widest
  # rest bucket). It is sliced exactly like test-agent below: each job derives
  # the same sorted `go test -list` output and runs rows where NR mod H ==
  # idx-1. The coverage job merges the H partial profiles before scoring the
  # hub floor. Adding a hub test no longer moves the gate's wall clock by its
  # full duration — only by 1/H of it.
  test-hub:
    name: test (hub ${{ matrix.idx }}/3)
    strategy:
      fail-fast: false
      matrix:
        idx: [1, 2, 3]
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","hive"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: src/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Prepare cgo toolchain for race tests
        run: |
          set -euo pipefail
          if command -v gcc >/dev/null 2>&1; then
            gcc --version | head -n1
            exit 0
          fi
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gcc libc6-dev
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq gcc libc6-dev
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache gcc musl-dev
          else
            echo "::error::gcc is required for -race but no supported package manager is available" >&2
            exit 1
          fi
          gcc --version | head -n1

      - name: Test slice of pkg/hub
        env:
          IDX: ${{ matrix.idx }}
          TOTAL: ${{ strategy.job-total }}
          # The converted skips in pkg/hub gate on repo files being present in
          # the checkout (deploy/k8s/error-pages.yaml) — a precondition
          # actions/checkout above GUARANTEES here, so a skip at a converted
          # site means the test broke, not that the environment is unsuitable
          # (#5388). Only testutil.SkipUnlessRequired sites become fatal;
          # plain t.Skip capability gates are unaffected.
          HIVE_TEST_REQUIRE_BEHAVIOURAL: '1'
        run: |
          set -o pipefail
          go test ./pkg/hub -short -list '.*' | grep -E '^(Test|Example|Fuzz)' | LC_ALL=C sort > all-tests.txt
          if [ ! -s all-tests.txt ]; then
            echo "::error::go test -list produced no test functions for pkg/hub — refusing to run an empty slice (fail closed)"
            exit 1
          fi
          awk -v n="$TOTAL" -v i="$IDX" 'NR % n == i - 1' all-tests.txt > slice.txt
          echo "slice $IDX/$TOTAL: $(wc -l < slice.txt) of $(wc -l < all-tests.txt) test functions"
          RUN="^($(paste -sd'|' slice.txt))$"
          SHUFFLE=""
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then SHUFFLE="-shuffle=on"; fi
          go test ./pkg/hub -short -race -count=1 -v $SHUFFLE -run "$RUN" -coverprofile=coverage-hub-"$IDX".out \
            2>&1 | grep --line-buffered -vE '^=== (RUN|PAUSE|CONT) ' | tee test-hub-"$IDX".log

      - name: Slowest tests in this slice
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/slowest-tests.sh" "hub ${{ matrix.idx }}/3" test-hub-${{ matrix.idx }}.log

      # Uploaded even on failure so the coverage job (and humans) can inspect
      # the raw `go test` output. `warn` not `error`: on a compile failure the
      # coverprofile is never written, and this upload must not mask the real
      # test failure with an artifact error.
      - name: Upload shard coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-shard-hub-${{ matrix.idx }}
          path: |
            src/coverage-hub-${{ matrix.idx }}.out
            src/test-hub-${{ matrix.idx }}.log
          if-no-files-found: warn
          retention-days: 1

  # pkg/agent is a single package whose tests take ~429s serially on CI — it
  # was the entire "rest" shard's wall clock. Package-granular sharding cannot
  # split a package, so each of these jobs runs a deterministic 1/N slice of
  # the package's test functions. The slice is computed INSIDE the job (no
  # dependency on list-packages, so these start at t=0): every job derives the
  # same sorted `go test -list` output from the same commit and takes rows
  # where NR mod N == idx-1 — pairwise disjoint, jointly exhaustive, and a new
  # test function always lands in exactly one slice. N is ${{ strategy.job-total }},
  # so adding an index to the matrix rebalances automatically.
  #
  # Each slice produces a PARTIAL coverage profile for pkg/agent; the coverage
  # job below merges them by summing per-block counts before scoring, so the
  # agent floor is applied to the union, never to a partial run.
  test-agent:
    name: test (agent ${{ matrix.idx }}/5)
    strategy:
      fail-fast: false
      matrix:
        idx: [1, 2, 3, 4, 5]
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","hive"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: src/go.sum

      - name: Prepare cgo toolchain for race tests
        run: |
          set -euo pipefail
          if command -v gcc >/dev/null 2>&1; then
            gcc --version | head -n1
            exit 0
          fi
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gcc libc6-dev
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq gcc libc6-dev
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache gcc musl-dev
          else
            echo "::error::gcc is required for -race but no supported package manager is available" >&2
            exit 1
          fi
          gcc --version | head -n1

      # tmux is what makes HIVE_TEST_REQUIRE_BEHAVIOURAL legitimate below.
      # ubuntu-latest happens to ship it, but "happens to" is not a guarantee —
      # a runner image change would silently turn ~50 pkg/agent tests back into
      # skips, which is the exact failure #5388 exists to prevent. Install it
      # explicitly and fail the job if it is absent, so the flag below is
      # asserting something this lane actually enforces.
      - name: Install tmux (precondition for the behavioural gate)
        run: |
          set -euo pipefail
          if ! command -v tmux >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq tmux
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y -qq tmux
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache tmux
            else
              echo "::error::tmux is required but no supported package manager is available" >&2
              exit 1
            fi
          fi
          tmux -V

      - name: Test slice of pkg/agent
        env:
          IDX: ${{ matrix.idx }}
          TOTAL: ${{ strategy.job-total }}
          # This lane GUARANTEES the preconditions the pkg/agent skips gate on:
          # tmux is installed and verified above, and the rest are t.TempDir()
          # writes and TestMain-built fixtures. So a skip at a converted site
          # here means the test broke, not that the environment is unsuitable —
          # make it fatal (#5388). Only sites judged guaranteed were converted;
          # genuine capability gates (tmuxAvailable() itself) stay permissive,
          # matching the shell half's treatment of docker/tmux gates.
          HIVE_TEST_REQUIRE_BEHAVIOURAL: '1'
        run: |
          set -o pipefail
          # -list compiles the test binary (cached for the run below) and
          # prints top-level Test/Example/Fuzz function names. All three kinds
          # are included so none can fall out of every slice; Benchmarks are
          # not run by `go test` without -bench, matching the unsharded run.
          go test ./pkg/agent -short -list '.*' | grep -E '^(Test|Example|Fuzz)' | LC_ALL=C sort > all-tests.txt
          if [ ! -s all-tests.txt ]; then
            echo "::error::go test -list produced no test functions for pkg/agent — refusing to run an empty slice (fail closed)"
            exit 1
          fi
          awk -v n="$TOTAL" -v i="$IDX" 'NR % n == i - 1' all-tests.txt > slice.txt
          echo "slice $IDX/$TOTAL: $(wc -l < slice.txt) of $(wc -l < all-tests.txt) test functions"
          RUN="^($(paste -sd'|' slice.txt))$"
          SHUFFLE=""
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then SHUFFLE="-shuffle=on"; fi
          go test ./pkg/agent -short -race -count=1 -v $SHUFFLE -run "$RUN" -coverprofile=coverage-agent-"$IDX".out \
            2>&1 | grep --line-buffered -vE '^=== (RUN|PAUSE|CONT) ' | tee test-agent-"$IDX".log

      - name: Slowest tests in this slice
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/slowest-tests.sh" "agent ${{ matrix.idx }}/5" test-agent-${{ matrix.idx }}.log

      - name: Upload shard coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-shard-agent-${{ matrix.idx }}
          path: |
            src/coverage-agent-${{ matrix.idx }}.out
            src/test-agent-${{ matrix.idx }}.log
          if-no-files-found: warn
          retention-days: 1

  # Partition everything EXCEPT pkg/hub and pkg/agent (which have dedicated
  # jobs above) into R balanced buckets, published as a matrix for test-rest.
  # Greedy longest-processing-time assignment over static weight hints
  # (measured seconds on CI under -short -race; unlisted packages default to
  # 3s — they are all ≤ 8s). The hints only affect BALANCE, never MEMBERSHIP:
  # a stale weight makes a bucket slower, not a package untested.
  list-packages:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","hive"]') || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.partition.outputs.matrix }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: src/go.sum

      - name: Prepare cgo toolchain for race tests
        run: |
          set -euo pipefail
          if command -v gcc >/dev/null 2>&1; then
            gcc --version | head -n1
            exit 0
          fi
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gcc libc6-dev
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq gcc libc6-dev
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache gcc musl-dev
          else
            echo "::error::gcc is required for -race but no supported package manager is available" >&2
            exit 1
          fi
          gcc --version | head -n1

      - name: Partition packages into balanced buckets
        id: partition
        run: |
          R=3
          # Anchored: drops exactly pkg/hub and exactly pkg/agent — the sliced
          # jobs run those two bare package paths. A subpackage of either
          # would land here, never nowhere. pkg/hubbackup et al. stay here.
          # ./internal/... carries the shared test helpers (internal/testutil)
          # and their contract tests, such as the time.Sleep ratchet in
          # sleep_ratchet_test.go.
          go list ./pkg/... ./cmd/... ./internal/... \
            | grep -Ev '^github\.com/hivecommons/hive/pkg/hub$' \
            | grep -Ev '^github\.com/hivecommons/hive/pkg/agent$' \
            | LC_ALL=C sort > rest-pkgs.txt
          if [ ! -s rest-pkgs.txt ]; then
            echo "::error::go list produced no rest packages — failing closed"
            exit 1
          fi

          weight() {
            case "$1" in
              */pkg/github)    echo 51 ;;
              */pkg/dashboard) echo 48 ;;
              */pkg/proxy)     echo 47 ;;
              */pkg/hubbackup) echo 29 ;;
              */pkg/config)    echo 23 ;;
              */cmd/hive)      echo 16 ;;
              */pkg/discord)   echo 15 ;;
              *)               echo 3  ;;
            esac
          }

          # Deterministic greedy LPT: stable-sort by weight desc (name asc on
          # ties), assign each package to the currently lightest bucket
          # (lowest index on ties).
          while read -r p; do
            echo "$(weight "$p") $p"
          done < rest-pkgs.txt | sort -k1,1nr -k2,2 > weighted.txt

          declare -a LOAD BUCKET
          for ((i=0; i<R; i++)); do LOAD[i]=0; BUCKET[i]=""; done
          while read -r w p; do
            best=0
            for ((i=1; i<R; i++)); do
              if [ "${LOAD[i]}" -lt "${LOAD[best]}" ]; then best=$i; fi
            done
            BUCKET[best]="${BUCKET[best]} $p"
            LOAD[best]=$(( LOAD[best] + w ))
          done < weighted.txt

          INCLUDE=""
          for ((i=0; i<R; i++)); do
            pkgs="${BUCKET[i]# }"
            echo "bucket $((i+1))/$R (weight ${LOAD[i]}): $pkgs"
            [ -n "$INCLUDE" ] && INCLUDE="$INCLUDE,"
            INCLUDE="$INCLUDE{\"idx\":$((i+1)),\"total\":$R,\"pkgs\":\"$pkgs\"}"
          done
          echo "matrix={\"include\":[$INCLUDE]}" >> "$GITHUB_OUTPUT"

  test-rest:
    name: test (rest ${{ matrix.idx }}/${{ matrix.total }})
    needs: list-packages
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.list-packages.outputs.matrix) }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","hive"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: src/go.sum

      - name: Prepare cgo toolchain for race tests
        run: |
          set -euo pipefail
          if command -v gcc >/dev/null 2>&1; then
            gcc --version | head -n1
            exit 0
          fi
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gcc libc6-dev
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq gcc libc6-dev
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache gcc musl-dev
          else
            echo "::error::gcc is required for -race but no supported package manager is available" >&2
            exit 1
          fi
          gcc --version | head -n1

      # ./cmd/... is included in the partition deliberately. It used to be
      # ./pkg/... only, so no workflow anywhere ran the cmd tests — four cmd/bd
      # tests were consequently merged already-failing and stayed red on the
      # default branch, undetected. All of ./cmd/... passes under -short -race.
      - name: Test
        env:
          PKGS: ${{ matrix.pkgs }}
          # The converted skips in the rest packages gate on repo files being
          # present in the checkout (deploy/entrypoint.sh, Dockerfile,
          # deploy/nginx.conf, config/backends.conf, bin/gh-app-token.sh,
          # bin/hive-open-pr.sh) — a precondition actions/checkout above
          # GUARANTEES here, so a skip at a converted site means the test
          # broke, not that the environment is unsuitable (#5388). Only
          # testutil.SkipUnlessRequired sites become fatal; plain t.Skip
          # capability gates (root, symlinks, git, /data writability, tool
          # availability) are unaffected and stay permissive.
          HIVE_TEST_REQUIRE_BEHAVIOURAL: '1'
        run: |
          set -o pipefail
          if [ -z "$PKGS" ]; then
            echo "::error::empty package bucket — failing closed"
            exit 1
          fi
          # shellcheck disable=SC2086 # PKGS is a deliberate word-split list
          SHUFFLE=""
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then SHUFFLE="-shuffle=on"; fi
          go test $PKGS -short -race -count=1 -v $SHUFFLE -coverprofile=coverage-rest-${{ matrix.idx }}.out \
            2>&1 | grep --line-buffered -vE '^=== (RUN|PAUSE|CONT) ' | tee test-rest-${{ matrix.idx }}.log

      - name: Slowest tests in this bucket
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/slowest-tests.sh" "rest ${{ matrix.idx }}/${{ matrix.total }}" test-rest-${{ matrix.idx }}.log

      - name: Upload shard coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-shard-rest-${{ matrix.idx }}
          path: |
            src/coverage-rest-${{ matrix.idx }}.out
            src/test-rest-${{ matrix.idx }}.log
          if-no-files-found: warn
          retention-days: 1

  # Dedicated shuffled-order lane for pkg/dashboard (#5570). The rest bucket
  # above shuffles only on NON-pull_request runs, so an order-dependent test
  # merged today fails weeks later on an unlucky scheduled run — #5553 was
  # exactly that shape (a cachedHealth cache leak that passed five runs before
  # and after the one hostile ordering). This lane also runs at PR time, with
  # the two bounds the #5570 investigation showed the lane needs to stay
  # signal rather than noise:
  #  - parallelism is constrained: the package stands up hundreds of httptest
  #    servers, and unconstrained parallel fan-out exhausts ephemeral ports on
  #    a loaded machine — that noise (`connect: can't assign requested
  #    address`) is what inflated #5570's original "83 failures" figure. A
  #    flaky detector gets ignored, which is worse than no detector.
  #  - the seed is surfaced in the failure annotation: -shuffle=on draws a
  #    fresh seed each run, and without the seed a real order-dependence
  #    finding is unreproducible.
  # No -coverprofile here: pkg/dashboard's coverage floor is scored from the
  # rest-bucket profile; this lane exists only to vary the execution order.
  test-dashboard-shuffle:
    name: test (dashboard shuffle)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","hive"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: src/go.sum

      - name: Prepare cgo toolchain for race tests
        run: |
          set -euo pipefail
          if command -v gcc >/dev/null 2>&1; then
            gcc --version | head -n1
            exit 0
          fi
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gcc libc6-dev
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq gcc libc6-dev
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache gcc musl-dev
          else
            echo "::error::gcc is required for -race but no supported package manager is available" >&2
            exit 1
          fi
          gcc --version | head -n1

      - name: Test pkg/dashboard in shuffled order
        run: |
          set -o pipefail
          # Bound on concurrent t.Parallel tests inside the package: high
          # enough to keep the lane fast, low enough that the package's many
          # httptest servers cannot exhaust ephemeral ports (see job comment).
          PARALLEL_TESTS=4
          if go test ./pkg/dashboard -short -race -count=1 -v -shuffle=on -p 1 -parallel "$PARALLEL_TESTS" \
            2>&1 | grep --line-buffered -vE '^=== (RUN|PAUSE|CONT) ' | tee test-dashboard-shuffle.log; then
            exit 0
          fi
          # The test binary prints "-test.shuffle <seed>" as its first line;
          # put the seed in the annotation so the failure is reproducible.
          SEED=$(grep -m1 -E '^-test\.shuffle [0-9]+' test-dashboard-shuffle.log | awk '{print $2}')
          echo "::error::pkg/dashboard failed under shuffled order. Reproduce from src/ with: go test ./pkg/dashboard -short -race -count=1 -p 1 -parallel $PARALLEL_TESTS -shuffle=${SEED:-<seed line missing from log>}"
          exit 1

      - name: Slowest tests in this lane
        if: always()
        run: bash "$GITHUB_WORKSPACE/.github/scripts/slowest-tests.sh" "dashboard shuffle" test-dashboard-shuffle.log

      - name: Upload shuffle log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-dashboard-shuffle-log
          path: src/test-dashboard-shuffle.log
          if-no-files-found: warn
          retention-days: 1

  # Stable aggregate context named "test", preserved from the pre-shard job so
  # anything keyed on the check name (branch protection, tide, humans' muscle
  # memory) keeps working. Fails closed: every shard AND the partition job
  # must succeed — a failed/skipped partition means packages may not have run.
  test:
    if: always()
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","hive"]') || 'ubuntu-latest' }}
    needs: [list-packages, test-hub, test-agent, test-rest, test-dashboard-shuffle]
    steps:
      - name: Check shard results
        run: |
          echo "list-packages:          ${{ needs.list-packages.result }}"
          echo "test-hub:               ${{ needs.test-hub.result }}"
          echo "test-agent:             ${{ needs.test-agent.result }}"
          echo "test-rest:              ${{ needs.test-rest.result }}"
          echo "test-dashboard-shuffle: ${{ needs.test-dashboard-shuffle.result }}"
          [ "${{ needs.list-packages.result }}" = "success" ]
          [ "${{ needs.test-hub.result }}" = "success" ]
          [ "${{ needs.test-agent.result }}" = "success" ]
          [ "${{ needs.test-rest.result }}" = "success" ]
          [ "${{ needs.test-dashboard-shuffle.result }}" = "success" ]

  # Per-package coverage-floor gate (#4112): parse-only, consumes the shard
  # artifacts — it runs no tests, so PRs run the suite exactly once. PR-only:
  # on the hourly schedule the coverage-hourly workflow remains the
  # monitoring + issue-filing authority.
  #
  # Scoring is computed from the coverage PROFILES, not from the `ok ...
  # coverage: X%` log lines: the agent slices each emit a PARTIAL percentage
  # for pkg/agent, so per-block counts from ALL shard profiles are merged
  # (summed) first and every package is scored on the union. For unsplit
  # packages this yields the identical number `go test` prints. The logs are
  # still parsed for the two states a profile cannot express: FAIL and
  # `? ... [no test files]` — both hard failures, as before.
  coverage:
    if: github.event_name == 'pull_request'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","hive"]') || 'ubuntu-latest' }}
    needs: [test-hub, test-agent, test-rest]
    steps:
      - name: Download shard coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-shard-*
          path: shards
          merge-multiple: true

      - name: Check per-package coverage
        working-directory: shards
        run: |
          THRESHOLD=90
          FAILED=""
          BROKEN=""
          REPORT=""

          # Per-package threshold overrides. A handful of packages are heavily
          # coupled to the live runtime (fixed /data,/proc,/var/run paths, real
          # github.com/platform.claude.com device-flow, a live tmux agent buffer,
          # an in-cluster k8s serviceaccount) and cannot be exercised hermetically
          # in CI without invasive production seams. They get a documented lower
          # floor so the gate still catches regressions below their real ceiling,
          # rather than blocking forever on untestable code. Raise these toward 90
          # as seams are added; do not add new entries without justification here.
          #
          # KEEP IN SYNC with coverage-hourly.yml, which applies the same floors
          # on its hourly scheduled run.
          declare -A PKG_THRESHOLD=(
            [dashboard]=84   # 86.2% on 2026-09-01; the residue is the inception tmux watcher + copilot/claude device-flow + /data file I/O + k8s
            [hub]=87         # kubectl-shelling + live-GitHub paths; see #2355. Was 89 against v2's 89.9%; v4 measures 87.6%.
            [agent]=89       # pre-existing shortfall inherited from #2350, NOT a new regression. See #2355.

            # ── Floors recorded when the gate moved from v2 to v4 (#3903) ─────
            # A RATCHET, NOT A TARGET — see coverage-hourly.yml for the full
            # rationale. Raise these toward 90 as tests land; never raise one to
            # paper over a drop.
            #
            # ── Ratchet turned for #4570 ─────────────────────────────────────
            # sandbox/ioscan/pushbroker: tests added in the same PR, so the
            #   floors move with the gain (67.6→98.5, 71.0→97.1, 72.8→100.0).
            # intent/tracing/dashboard: NO code change — these had drifted far
            #   above floors recorded at d89121f5 and were no longer catching
            #   anything. Re-measured on v4 at cd8aee5d and moved up to what
            #   they actually hold, with ~1 point of headroom.
            # scheduler (90.4) and escalation (93.2) now clear the 90% default
            #   and no longer need an entry at all.
            [intent]=87
            [tracing]=85
            [review]=80
            [retro]=82
            [github]=89      # 91.8% on 2026-09-01
            [hivectl]=88
            [knowledge]=89
            [proxy]=89
            [ioscan]=96
            [sandbox]=98
            [pushbroker]=99

            # ── ./cmd/... floors (#4701) ─────────────────────────────────────
            # See coverage-hourly.yml for the rationale. cmd keys are prefixed
            # ("cmd/<name>") so cmd/hivectl can never collide with
            # pkg/hivectl's floor. Recorded just below what v4 measures after
            # #4700/#4719 so the ratchet can turn as CLI tests land.
            # ── Ratchet turned 2026-09-01 ────────────────────────────────────
            # cmd/bd, cmd/hive, cmd/hive-backup, dashboard, github: NO code
            #   change — each had drifted 4–20 points above its recorded floor
            #   (cmd/hive most of all: 18.8 → 37.5 as eval-cycle helpers grew
            #   tests) and the gate was no longer catching a drop. Re-measured
            #   on the 2026-09-01 hourly run and moved to ~2–4 points under
            #   what they hold. cmd/apiproxy is unchanged at 13.9%.
            [cmd/bd]=75       # 78.8% on 2026-09-01 (60.4% after #4700's kb-CLI tests)
            [cmd/hive]=35     # 37.5% on 2026-09-01 (18.8% after #4719); bulk is main()/run-loop wiring
            [cmd/apiproxy]=13 # 14.7%
            [cmd/hive-backup]=78 # 81.9% on 2026-09-01 (71.1% after #4736's CLI entry-point tests)
          )

          # Thin flag-parsing mains with no test files, wrapping packages the
          # gate already floors. KEEP IN SYNC with coverage-hourly.yml. Any NEW
          # untested cmd package still hard-fails.
          UNTESTED_CMD_MAINS='cmd/hivectl'

          # Merge every shard profile: per-block counts are summed, so the N
          # partial pkg/agent profiles combine into the package's true
          # coverage. Blocks are keyed by (location, statement count); package
          # = the directory of the block's file. Emits "pkg pct" lines plus a
          # TOTAL over ./pkg/... — the same statements-covered/statements
          # definition `go test -cover` prints, so floors are unchanged.
          awk '
            FNR == 1 { next }              # skip each file'\''s "mode:" line
            {
              file = $1; sub(/:[^:]*$/, "", file)
              pkg = file; sub(/\/[^\/]+$/, "", pkg)
              key = pkg "|" $1 "|" $2
              stmts[key] = $2; owner[key] = pkg
              count[key] += $3
            }
            END {
              for (k in count) {
                p = owner[k]
                tot[p] += stmts[k]
                if (count[k] > 0) cov[p] += stmts[k]
              }
              gt = 0; gc = 0
              for (p in tot) {
                printf "%s %.1f\n", p, cov[p] * 100 / tot[p]
                if (p ~ /^github\.com\/kubestellar\/hive\/pkg\//) {
                  gt += tot[p]; gc += cov[p]
                }
              }
              if (gt > 0) printf "TOTAL %.1f\n", gc * 100 / gt
            }
          ' coverage-*.out > pkg-pcts.txt

          TOTAL=$(awk '$1 == "TOTAL" {print $2 "%"}' pkg-pcts.txt)
          echo "Total coverage (./pkg/...): ${TOTAL:-unavailable}"

          # Classify every package exactly once from the combined logs.
          # ./cmd/... is scored too (#4701): the shards have run cmd tests
          # since the partition change, but coverage floors previously applied
          # to ./pkg/... only, so a CLI package could lose all its tests
          # without the gate noticing. The TOTAL line remains ./pkg/...-only
          # for trend continuity.
          cat test-*.log > cover-run.log
          grep -E '^(ok|FAIL|\?)' cover-run.log \
            | awk '$2 ~ /^github\.com\/kubestellar\/hive\/(pkg|cmd)\// {print $1, $2}' \
            | LC_ALL=C sort -u > pkg-states.txt

          # Floor-map key: cmd packages get a "cmd/" prefix so cmd/hivectl can
          # never resolve to pkg/hivectl's floor; pkg keeps the bare basename.
          floor_key() {
            case "$1" in
              */cmd/*) echo "cmd/${1##*/}" ;;
              *)       echo "${1##*/}" ;;
            esac
          }

          while read -r state pkgpath; do
            pkg=$(floor_key "$pkgpath")
            case "$state" in
              ok)
                # A package that also has a FAIL line anywhere is broken; the
                # FAIL branch handles it. (An agent slice could be ok while
                # another failed — but any FAIL also fails that shard job.)
                pct=$(awk -v p="$pkgpath" '$1 == p {print $2}' pkg-pcts.txt)
                if [ -z "$pct" ]; then continue; fi
                int_pct=${pct%.*}
                pkg_threshold=${PKG_THRESHOLD[$pkg]:-$THRESHOLD}
                if [ "$int_pct" -lt "$pkg_threshold" ]; then
                  FAILED="${FAILED}${pkg}: ${pct}% (floor ${pkg_threshold}%)\n"
                fi
                REPORT="${REPORT}${pkg}: ${pct}%\n"
                ;;
              FAIL)
                BROKEN="${BROKEN}${pkg}: TESTS FAILING\n"
                REPORT="${REPORT}${pkg}: FAIL\n"
                ;;
              \?)
                case " $UNTESTED_CMD_MAINS " in
                  *" $pkg "*)
                    REPORT="${REPORT}${pkg}: no tests (exempt thin main)\n"
                    ;;
                  *)
                    BROKEN="${BROKEN}${pkg}: NO TEST FILES\n"
                    REPORT="${REPORT}${pkg}: no tests\n"
                    ;;
                esac
                ;;
            esac
          done < pkg-states.txt

          {
            echo "## Per-package coverage"
            echo ""
            echo "Total (./pkg/...): ${TOTAL:-unavailable}"
            echo ""
            echo -e "${REPORT}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$BROKEN" ] || [ -n "$FAILED" ]; then
            {
              [ -n "$BROKEN" ] && echo -e "### Packages that cannot be scored\n${BROKEN}"
              [ -n "$FAILED" ] && echo -e "### Packages below their floor\n${FAILED}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo ""
            echo "COVERAGE GATE FAILED:"
            [ -n "$BROKEN" ] && echo -e "${BROKEN}"
            [ -n "$FAILED" ] && echo -e "${FAILED}"
            exit 1
          fi

          echo "All packages meet their coverage floor" >> "$GITHUB_STEP_SUMMARY"

  create-issue-on-failure:
    if: (failure() || cancelled()) && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: [list-packages, test-hub, test-agent, test-rest, test-dashboard-shuffle]
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create issue for test failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.substring(0, 7);
            // The scheduled run executes on the DEFAULT branch (v4) — name the
            // real branch instead of the workflow's historical "v2" label,
            // which sent operators to the retired v2 line (#4569).
            const branch = context.ref.replace('refs/heads/', '');
            const results = [
              '${{ needs.test-hub.result }}',
              '${{ needs.test-agent.result }}',
              '${{ needs.test-rest.result }}',
              '${{ needs.test-dashboard-shuffle.result }}',
              '${{ needs.list-packages.result }}',
            ];
            const wasCancelled = results.includes('cancelled');
            const kind = wasCancelled ? 'cancelled (likely timed out)' : 'failure';
            const title = `[Tests] ${branch} test ${wasCancelled ? 'cancelled' : 'failure'} on ${sha}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 10,
            });
            const dup = existing.data.find(i => i.title.startsWith(`[Tests] ${branch} test`) || i.title.startsWith('[Tests] v2 test'));
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body: `Another ${kind} on \`${sha}\`: ${runUrl}`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `## Test ${wasCancelled ? 'Cancelled' : 'Failure'}\n\n- **Commit:** \`${context.sha}\`\n- **Run:** ${runUrl}\n- **Branch:** ${branch}\n\nScheduled test run was ${kind}. See the [workflow run](${runUrl}) for details.`,
              labels: ['ci-failure', 'kind/bug'],
            });
