      fail-fast: false
      matrix:
        idx: [1, 2, 3]
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HIVE_RUNNER_LABELS || '["ubuntu-latest"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src
    steps:
      # Affected-package selection (#12454): when this lane has nothing to
      # test on a PR it still runs and reports success, so no context the
      # aggregates or branch protection wait on can go missing. Anything but
      # an explicit "nothing selected" runs the lane (fail toward testing).
      - name: Affected-package selection
        id: select
        working-directory: .
        env:
          SELECTION: ${{ needs.list-packages.outputs.selection }}
          RUN_LANE: ${{ needs.list-packages.outputs.run-dashboard }}
        run: |
          if [ "$SELECTION" = partial ] && [ "$RUN_LANE" = false ]; then
            echo "Affected-package selection: pkg/dashboard is not affected by this diff; reporting success without running tests. Push and scheduled runs test it in full."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.select.outputs.run == 'true'

      # Populate the shared node-local Go tool cache under the runner pods'
      # node-wide lock before setup-go, so parallel jobs on a cold cache (a
      # src/go.mod bump) stop clobbering each other's rm -rf + copy (#11175,
      # #10234). Never fails the job.
      - name: Warm shared Go tool cache (serialize the cold-cache population)
        if: steps.select.outputs.run == 'true'
        run: bash "$GITHUB_WORKSPACE/.github/scripts/go-toolcache-guard.sh"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.select.outputs.run == 'true'
        with:
          cache: false
          go-version-file: src/go.mod
      # Dashboard tests execute JavaScript even on runners without preinstalled Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.select.outputs.run == 'true'
        with:
          node-version: '22'
      - name: Guard shared node tool cache (repair a half-written entry)
        # setup-node reports "Found in cache" for a node/<ver>/x64 entry whose
        # .complete marker exists but bin/npm does not (#10505, #10518). The
        # canary repairs this too, but its cron is starved to a ~5h cadence, so
        # heal the node from the hot path: drop the marker (never the directory,
        # a sibling job may be mid-run) so the next job re-extracts.
        if: ${{ steps.select.outputs.run == 'true' && (always()) }}
        run: |
          set -u
          command -v npm >/dev/null 2>&1 && exit 0
          for marker in "${RUNNER_TOOL_CACHE:-/nonexistent}"/node/*/x64.complete; do
            [ -e "$marker" ] || continue
            dir="${marker%.complete}"
            [ -x "$dir/bin/npm" ] && continue
            echo "::warning::node tool cache $dir has a .complete marker but no executable bin/npm; removing the marker so the next job on $RUNNER_NAME rebuilds it"
            rm -f "$marker"
          done
          echo "::error::npm is not on PATH after actions/setup-node on $RUNNER_NAME (half-written shared tool cache, see #10518); marker removed, re-run this job"
          exit 1
      - name: Guard shared Go cache (fall back when the runner volume is full)
        if: steps.select.outputs.run == 'true'
        run: bash "$GITHUB_WORKSPACE/.github/scripts/go-cache-guard.sh"
      # Fill GOMODCACHE up front with bounded retries so a transient
      # proxy.golang.org stream reset (INTERNAL_ERROR, #14976) cannot fail the
      # job's first module-fetching step; see .github/actions/go-mod-download-retry.
      - name: Download Go modules (retry transient proxy resets)
        if: steps.select.outputs.run == 'true'
        uses: ./.github/actions/go-mod-download-retry

      - name: Install gotestsum
        if: steps.select.outputs.run == 'true'
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install gotest.tools/gotestsum@v1.13.0
          "$(go env GOPATH)/bin/gotestsum" --version

      # Warm compile cache (#7480 follow-up): the warm-build-cache job on every
      # v4 push compiles the whole tree (race + norace) and saves GOCACHE keyed
      # by SHA; PR jobs restore the nearest ancestor via the prefix restore-key,
      # turning the ~2-minute per-job -race recompile into an incremental one.
      # Restore-only in PR jobs: balance/miss costs seconds, never correctness.
      - name: Restore warm Go build cache
        if: ${{ steps.select.outputs.run == 'true' && (!contains(vars.HIVE_RUNNER_LABELS, 'hive-runners')) }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: hive-go-build-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            hive-go-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore cgo toolchain package cache
        if: steps.select.outputs.run == 'true'
        id: restore-cgo-apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci/apt-cache/cgo-race
          key: hive-cgo-race-apt-${{ runner.os }}-${{ runner.arch }}-gcc-libc6-dev-v2
          restore-keys: |
            hive-cgo-race-apt-${{ runner.os }}-${{ runner.arch }}-gcc-libc6-dev-
            hive-cgo-race-apt-${{ runner.os }}-${{ runner.arch }}-
            hive-cgo-race-apt-

      # Bounded + annotated by .github/scripts/ci-install-tool.sh (#6648/#6870/#6935):
      # skip apt when the tool already exists, install restored .debs offline
      # when possible, retry short egress flakes with backoff, and fail loudly
      # with a ::error:: if neither cache nor mirrors can provide the tool.
      - name: Prepare cgo toolchain for race tests
        if: steps.select.outputs.run == 'true'
        id: prepare-cgo-toolchain
        env:
          HIVE_CI_APT_CACHE_DIR: ${{ github.workspace }}/.ci/apt-cache/cgo-race
          HIVE_CI_MISSING_TOOLCHAIN_SOFT_FAIL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/ci-install-tool.sh" \
            --require gcc --for '-race tests' \
            --apt 'gcc libc6-dev' --apk 'gcc musl-dev' --verify 'gcc --version'

      - name: Save cgo toolchain package cache
        if: ${{ steps.select.outputs.run == 'true' && (always() && steps.restore-cgo-apt-cache.outputs.cache-hit != 'true' && steps.prepare-cgo-toolchain.outputs.apt-cache-populated == 'true') }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci/apt-cache/cgo-race
          key: hive-cgo-race-apt-${{ runner.os }}-${{ runner.arch }}-gcc-libc6-dev-v2

      - name: Test pkg/dashboard in shuffled order
        if: ${{ steps.select.outputs.run == 'true' && (steps.prepare-cgo-toolchain.outputs.toolchain-ready == 'true') }}
        env:
          IDX: ${{ matrix.idx }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          set -o pipefail
          # Sliced like test-hub (NR mod N — pairwise disjoint, jointly
          # exhaustive) so no single job carries the whole ~6-minute lane;
          # -shuffle still varies order within each slice every run.
          ROOT="$PWD"
          export TEST_PACKAGE=github.com/hivecommons/hive/pkg/dashboard
          export TEST_DIR="$ROOT/pkg/dashboard"
          export TEST_BINARY="$ROOT/dashboard.test"
          go test -c -race -o "$TEST_BINARY" ./pkg/dashboard
          (cd "$TEST_DIR" && "$TEST_BINARY" -test.short -test.list '.*') | grep -E '^(Test|Example|Fuzz)' | LC_ALL=C sort > all-tests.txt
          if [ ! -s all-tests.txt ]; then
            echo "::error::go test -list produced no test functions for pkg/dashboard — refusing to run an empty slice (fail closed)"
            exit 1
          fi
          awk -v n="$TOTAL" -v i="$IDX" 'NR % n == i - 1' all-tests.txt > slice.txt
          echo "slice $IDX/$TOTAL: $(wc -l < slice.txt) of $(wc -l < all-tests.txt) test functions"
          if [ ! -s slice.txt ]; then
            echo "::error::empty dashboard slice — failing closed"
            exit 1
          fi
          export CHUNK_DIR
          CHUNK_DIR=$(mktemp -d "$ROOT/test-chunks.XXXXXX")
          split -l 1000 slice.txt "$CHUNK_DIR/chunk-"
          # raw-command preserves one JUnit/flake report across all chunks.
          # gotestsum appends -test.run and package arguments on reruns.
          cat > "$CHUNK_DIR/run.sh" <<'RUNNER'
          #!/usr/bin/env bash
          set -uo pipefail
          export LC_ALL=C # ${#RUN} must count bytes, not Unicode characters.
          cd "$TEST_DIR" || exit 1
          run_chunk() {
            local RUN="$1"
            # MAX_ARG_STRLEN is 131072 bytes; fail clearly before execve.
            if [ "${#RUN}" -gt 120000 ]; then
              echo "::error::chunk regex exceeds 120000 bytes; reduce chunk size" >&2
              return 1
            fi
            # Bound t.Parallel to avoid exhausting httptest ephemeral ports.
            go tool test2json -t -p "$TEST_PACKAGE" "$TEST_BINARY" \
              -test.short -test.count=1 -test.v=test2json -test.timeout=10m \
              -test.shuffle=on -test.parallel=4 "$RUN"
          }
          if [ "$#" -gt 0 ]; then
            run_chunk "$1"
            exit $?
          fi
          status=0
          for chunk in "$CHUNK_DIR"/chunk-*; do
            RUN="-test.run=^($(paste -sd'|' "$chunk"))$"
            run_chunk "$RUN" || status=1
          done
          exit "$status"
          RUNNER
          if gotestsum --format=standard-verbose --rerun-fails=2 --rerun-fails-max-failures=5 \
            --rerun-fails-report=flaky-tests-dashboard-shuffle-"$IDX".txt \
            --junitfile junit-dashboard-shuffle-"$IDX".xml --raw-command -- bash "$CHUNK_DIR/run.sh" \
            2>&1 | grep --line-buffered -vE '^=== (RUN|PAUSE|CONT) ' | tee test-dashboard-shuffle-"$IDX".log; then
            exit 0
          fi
          # Each chunk prints its own -test.shuffle seed immediately before
          # its tests; do not report the first chunk's seed for a later failure.
          echo "::error::pkg/dashboard failed (slice $IDX/$TOTAL); see the failing chunk's -test.shuffle seed in test-dashboard-shuffle-$IDX.log. Reproduce the failing test with: go test ./pkg/dashboard -short -race -count=1 -p 1 -parallel 4 -run '^TestName$' -shuffle=<seed>"
          exit 1

      - name: Surface flaky reruns
