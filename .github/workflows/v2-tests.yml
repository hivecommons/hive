name: v2 Tests

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  # Gate PRs, not just the cron. `go test ./pkg/...` runs nowhere else — v2-ci.yml
  # builds and vets but never runs the unit tests — so before this, a Go
  # regression test could only fail AFTER merge, as a cron-filed ci-failure
  # issue. That is the wrong end of the loop for security regressions: the test
  # proving a fix works has to be able to block the PR that breaks it again.
  #
  # create-issue-on-failure below stays gated on `github.event_name == 'schedule'`,
  # so a red PR fails the check without also filing an issue.
  pull_request:
    branches: [v2, v4]
    paths: ['v2/**', '.github/workflows/v2-tests.yml']

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: v2/go.sum

      - name: Test
        run: go test ./pkg/... -short -race -count=1

  create-issue-on-failure:
    if: (failure() || cancelled()) && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create issue for test failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.substring(0, 7);
            const wasCancelled = '${{ needs.test.result }}' === 'cancelled';
            const kind = wasCancelled ? 'cancelled (likely timed out)' : 'failure';
            const title = `[Tests] v2 test ${wasCancelled ? 'cancelled' : 'failure'} on ${sha}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 10,
            });
            const dup = existing.data.find(i => i.title.startsWith('[Tests] v2 test'));
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body: `Another ${kind} on \`${sha}\`: ${runUrl}`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `## Test ${wasCancelled ? 'Cancelled' : 'Failure'}\n\n- **Commit:** \`${context.sha}\`\n- **Run:** ${runUrl}\n- **Branch:** v2\n\nScheduled test run was ${kind}. See the [workflow run](${runUrl}) for details.`,
              labels: ['ci-failure', 'kind/bug'],
            });
