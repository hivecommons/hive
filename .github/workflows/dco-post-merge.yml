name: Post-merge DCO trailer check

on:
  push:
    branches:
      - v4
      - v5
  # The checker itself is in scope, not just the history it checks. Until this
  # filter was added, src/scripts/test-check-dco-trailers.sh existed but no
  # workflow ever ran it — a change to the checker (or to the waiver logic that
  # decides which protected-branch history is accepted) shipped with nothing
  # exercising it. Same reasoning as the Dashboard Lint workflow's #5388 note.
  pull_request:
    paths:
      - 'src/scripts/check-dco-trailers.sh'
      - 'src/scripts/test-check-dco-trailers.sh'
      - '.github/workflows/dco-post-merge.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      commit_limit:
        description: Number of recent commits to inspect on each branch
        required: false
        default: '50'

permissions:
  contents: read
  issues: write

env:
  DCO_COMMIT_LIMIT: ${{ inputs.commit_limit || '50' }}
  # Empty by default on purpose: the normal rule is that Signed-off-by must use
  # the commit author's email. Add maintainer override emails here only when the
  # project has explicitly accepted that identity as a post-merge DCO exception.
  #
  # raul.mturrubiates@gmail.com: @mendezr signs off with this address while
  # GitHub records the author as mendezr@users.noreply.github.com (privacy
  # email). Same person; accepted by maintainer disposition in #6554.
  DCO_ALLOWLIST_EMAILS: 'raul.mturrubiates@gmail.com'
  # Per-commit maintainer DCO dispositions, by FULL SHA. This is the record
  # src/docs/v5-sync-policy.md asks for — "listing every affected SHA and the
  # reason the override is acceptable" — and the only instrument that can clear
  # a commit with NO trailer at all, which no email allowlist can reach.
  #
  # A waived commit is still printed on every run (WAIVED, not hidden), and a
  # waiver whose commit starts passing is reported as STALE-WAIVER so it gets
  # removed. Unlike DCO_ALLOWLIST_EMAILS, a SHA cannot widen: it names history
  # that already exists, so it can never pre-approve a future commit.
  #
  # b798382a4d98ada28b0cb813644a595db0c58b08 — "fix: update
  # src/pkg/terminalassert/terminal_key_fallback_test.go for issue #6552",
  # authored by Aditya Waghamare, landed on v4 with no Signed-off-by trailer.
  # It cannot be repaired: rewriting a contributor's commit or adding a
  # sign-off on their behalf is forbidden by #6329 and v5-sync-policy.md, and
  # the branch is protected. Accepted by maintainer disposition in #6576.
  #
  # 8fe6bb34626af4277394fcd87de2cd7eb797cc52 — "feat: credit issue authors on
  # hive PR commits" (#6592). The Signed-off-by IS present and matches the
  # author, but a blank line separates it from a trailing Co-authored-by, so
  # `git interpret-trailers --parse` sees only the last block. Cosmetic;
  # accepted by maintainer disposition in #6605. Root cause fixed in #6606.
  #
  # 7e01fee4a2c1a37f4a4072bf2d17e76e27113d01 — "📖 Revise security
  # self-assessment after CNCF TAG-Security review" (#6692). Same person,
  # two addresses: authored as andy@clubanderson.com, signed off as
  # clubanderson@gmail.com (both the maintainer's own). Sign-off intent is
  # unambiguous; branch is protected, so the trailer cannot be repaired
  # in place. Accepted by maintainer disposition in #6703.
  #
  # 5cd49b2285af11fe6e6d8bfa9da16c7e4365a692 — "📖 Record OpenSSF Best
  # Practices Badge in security self-assessment" (#6697). The same
  # two-addresses-one-person case as 7e01fee4 above, in its other direction:
  # authored as andy@clubanderson.com, signed off as
  # clubanderson@users.noreply.github.com — GitHub's noreply address for that
  # very account, so the identity is verifiable rather than merely plausible.
  # Sign-off intent is unambiguous; the branch is protected, so the trailer
  # cannot be repaired in place. Reported by the monitor in #6716.
  #
  # 65b9c67341962834e27c28b0d833b8b03fe91ac9 — "docs(security): the compliance
  # list still says the badge is not held" (#6698).
  # cfaf4988779ed52a03670d0b6824a3517117be82 — "fix(contributor): review the
  # PRs the contributor has, not one repo's" (#6694).
  # Both authored by Danathar as doug.baggett@gmail.com and signed off as
  # danathar@users.noreply.github.com — GitHub's noreply address for the very
  # account that authored them, so the identity is verifiable rather than
  # merely plausible, and the pre-merge DCO app accepted both on that basis.
  # Rewriting a contributor's commit or signing off on their behalf is
  # forbidden by #6329, and v4 is protected, so a waiver is the only available
  # disposition. Reported by the monitor in #6716.
  #
  # These two are not a new failure mode — they are the FOURTH and FIFTH
  # instance of one: our checker is stricter than the pre-merge DCO app, which
  # treats a GitHub noreply address as the author's own. Waiving each occurrence
  # does not converge. #6721 tracks teaching the checker that rule so the
  # monitor stops paging for sign-offs that were already accepted at merge time.
  #
  # 4601f926ffab6386fb07c3bc624b18041ec338d7 - "Make OpenSSF badge status
  # consistent across the self-assessment" (#6715). Authored by Andy Anderson
  # as andy@clubanderson.com, signed off as clubanderson@users.noreply.github.com
  # - the same account's GitHub noreply address, exactly like 5cd49b22 above.
  # Reported by the monitor in #6729.
  #
  # This is the SIXTH instance, and it arrived within a day of the fifth, which
  # is the whole argument of #6721: the waiver list grows once per merge cycle
  # and never converges, because nothing here is actually wrong. Every one of
  # these sign-offs was accepted by the pre-merge DCO app. When #6721 lands,
  # the noreply entries become STALE-WAIVER and should be deleted wholesale.
  DCO_WAIVED_COMMITS: 'b798382a4d98ada28b0cb813644a595db0c58b08 8fe6bb34626af4277394fcd87de2cd7eb797cc52 7e01fee4a2c1a37f4a4072bf2d17e76e27113d01 5cd49b2285af11fe6e6d8bfa9da16c7e4365a692 65b9c67341962834e27c28b0d833b8b03fe91ac9 cfaf4988779ed52a03670d0b6824a3517117be82 4601f926ffab6386fb07c3bc624b18041ec338d7'
  # Tide/tagged-release failures discussed in #6276 came from human squash
  # commits and release metadata, not bot-authored commits. Skip bots here so
  # release automation is not paged for bracketed bot-address edge cases that
  # the separate pre-merge DCO/probot checks already cover.
  DCO_SKIP_BOT_AUTHORS: 'true'

jobs:
  # Exercises check-dco-trailers.sh against a throwaway repository with good,
  # missing-trailer, mismatched-trailer and waived commits. This gates the
  # instrument that decides which protected-branch history is accepted, so it
  # runs on every PR that touches the checker, its tests, or this workflow.
  checker-selftest:
    name: Self-test the DCO checker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run check-dco-trailers self-tests
        run: bash src/scripts/test-check-dco-trailers.sh

  dco-post-merge:
    name: Check ${{ matrix.branch }} recent commits
    # A pull_request run is checking the CHECKER, not protected-branch history
    # (the PR's own commits are covered by the pre-merge DCO check), so the
    # monitor half sits out and only the self-test above runs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        branch: [v4, v5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'push' || matrix.branch == github.ref_name
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Check recent DCO trailers
        id: dco
        if: github.event_name != 'push' || matrix.branch == github.ref_name
        run: |
          set +e
          src/scripts/check-dco-trailers.sh "${DCO_COMMIT_LIMIT}" HEAD > dco-report.txt 2>&1
          rc=$?
          cat dco-report.txt
          measured_sha=$(git rev-parse HEAD)
          {
            if [ "$rc" -eq 0 ]; then
              echo 'failed=false'
            else
              echo 'failed=true'
            fi
            echo "measured_sha=${measured_sha}"
            echo 'report<<EOF'
            cat dco-report.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Create or update DCO issue
        if: (github.event_name != 'push' || matrix.branch == github.ref_name) && steps.dco.outputs.failed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const branch = '${{ matrix.branch }}';
            const measuredSha = '${{ steps.dco.outputs.measured_sha }}';
            const shortSha = measuredSha.substring(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const report = fs.readFileSync('dco-report.txt', 'utf8').trim();
            const title = `[DCO] post-merge trailer failures on ${branch}`;
            const label = 'ci-dco';

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'b60205',
                description: 'Post-merge DCO trailer monitor',
              });
            }

            const body = `## Post-merge DCO trailer check failed\n\n`
              + `- **Branch:** \`${branch}\`\n`
              + `- **Measured:** \`${measuredSha}\`\n`
              + `- **Run:** ${runUrl}\n`
              + `- **Commit window:** last ${process.env.DCO_COMMIT_LIMIT} commits\n\n`
              + `The protected branch contains non-merge commits whose \`Signed-off-by:\` trailer is missing or whose email does not match the commit author email. `
              + `This usually means a squash merge template dropped the trailer or retained a trailer for a different identity.\n\n`
              + `### Offending commits\n\n\`\`\`\n${report}\n\`\`\`\n\n`
              + `Close this issue after the offending protected-branch history has an accepted maintainer DCO disposition and the monitor is green again.`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 20,
            });
            const dup = existing.data.find(i => i.title === title);
            if (dup) {
              // The monitor runs hourly AND on every push to a protected
              // branch, so an unfixable failure used to add a comment every
              // time it fired — #6554 collected six identical bot comments in
              // 35 minutes, burying the maintainer triage that was the only
              // useful content on the thread. Comment only when the SET OF
              // FAILING COMMITS CHANGES, which is the only event a human needs
              // to see: a NEW failure appearing, or one clearing. Repeats of a
              // known state are silent (the run still fails, so the signal is
              // not lost — it is just not re-narrated).
              const failingSet = (body) => (body || '')
                .split('\n')
                .filter(l => l.startsWith('FAIL '))
                .map(l => l.split(/\s+/)[1])
                .sort()
                .join(',');
              const current = failingSet(report);

              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                per_page: 100,
              });
              // Walk backwards to the most recent monitor comment; maintainer
              // triage comments in between carry no FAIL lines and must not be
              // mistaken for the last reported state.
              const marker = 'DCO monitor still failing on';
              const last = [...comments.data].reverse()
                .find(c => (c.body || '').includes(marker));
              const previous = last ? failingSet(last.body) : failingSet(dup.body);

              if (previous === current) {
                core.info(`DCO failure set unchanged (${current}); not adding a duplicate comment.`);
                return;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body: `DCO monitor still failing on \`${branch}\` @ \`${shortSha}\`, with a CHANGED failure set: ${runUrl}\n\n\`\`\`\n${report}\n\`\`\``,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: [label],
            });

      - name: Fail when DCO trailers are invalid
        if: (github.event_name != 'push' || matrix.branch == github.ref_name) && steps.dco.outputs.failed == 'true'
        run: exit 1
