name: Spektacular real-CLI smoke

# Scheduled canary for hivecommons/hive#10074's last confirmed gap: "nothing
# in the repo exercises the pinned release binary". Every pkg/spektacular
# test drives the Runner through the in-tree shell fake
# (testdata/spektacular-fake/spektacular) or a scripted Exec stub, so a
# mismatch between those stand-ins and the real 0.22.0 release could pass
# `go test ./pkg/spektacular/...` indefinitely. This workflow runs
# TestRealSpektacularCLISmoke (build tag `integration`) against the release
# pinned by `ARG SPEKTACULAR_VERSION` in src/Dockerfile.contributor, downloaded
# and checksum-verified straight from the spektacular release page so the job
# always exercises the pin in the checked-out tree.
#
# It also runs on pull requests that touch the Spektacular contract surface
# (the package, its fake, the pinned version in the contributor Dockerfile,
# or this workflow), so a change that only the fake agrees with cannot merge
# green on fake-backed tests alone; the nightly schedule still catches a
# re-published release asset drifting from what the fake encodes.
#
# This is a read-only smoke against a throwaway `.spektacular` store the test
# creates under its own temp dir; it needs no secrets and nothing it does
# persists past the job.

on:
  schedule:
    - cron: '48 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/pkg/spektacular/**'
      - 'src/Dockerfile.contributor'
      - '.github/workflows/spektacular-real-cli-smoke.yml'

permissions:
  contents: read

concurrency:
  group: spektacular-real-cli-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    if: github.repository == 'hivecommons/hive'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod

      - name: Download the pinned spektacular release
        # The pin is read from the checked-out src/Dockerfile.contributor
        # (`ARG SPEKTACULAR_VERSION`), so a PR that bumps it is smoked
        # against the binary it pins rather than whatever a previously
        # published contributor image happens to ship. Same asset naming and
        # checksums.txt verification as the Dockerfile.
        run: |
          VERSION="$(sed -n 's/^ARG SPEKTACULAR_VERSION=//p' src/Dockerfile.contributor | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "::error::could not read ARG SPEKTACULAR_VERSION from src/Dockerfile.contributor"
            exit 1
          fi
          ASSET="spektacular_${VERSION}_linux_x86_64.tar.gz"
          BASE="https://github.com/hivecommons/spektacular/releases/download/${VERSION}"
          BIN_DIR="${RUNNER_TEMP}/spektacular-${VERSION}"
          mkdir -p "$BIN_DIR"
          cd "$BIN_DIR"
          curl -fsSL --retry 5 --retry-delay 5 -o "$ASSET" "${BASE}/${ASSET}"
          curl -fsSL --retry 5 --retry-delay 5 -o checksums.txt "${BASE}/checksums.txt"
          grep "  ${ASSET}$" checksums.txt | sha256sum -c -
          tar -xzf "$ASSET" spektacular
          chmod 0755 spektacular
          ./spektacular --version
          echo "SPEKTACULAR_REAL_CLI_BIN=${BIN_DIR}/spektacular" >> "$GITHUB_ENV"
          echo "SPEKTACULAR_EXPECTED_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Real-CLI smoke
        working-directory: src
        run: |
          set -o pipefail
          go test -tags integration ./pkg/spektacular -run TestRealSpektacularCLISmoke -v -count=1 |& tee ../smoke.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spektacular-real-cli-smoke
          path: smoke.log
          if-no-files-found: ignore

  create-issue-on-failure:
    if: failure() && github.event_name == 'schedule'
    runs-on: ${{ fromJSON(vars.HIVE_RUNNER_LABELS || '["ubuntu-latest"]') }}
    needs: [smoke]
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `[spektacular-real-cli-smoke] failure on ${context.sha.substring(0, 7)}`;
            const existing = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'spektacular-real-cli-smoke', per_page: 20});
            const dup = existing.data.find(i => i.title.startsWith('[spektacular-real-cli-smoke]'));
            const body = `Scheduled spektacular real-CLI smoke failed on ${context.sha}.\n\nRun: ${runUrl}\n\nPart of #10074.`;
            if (dup) await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: dup.number, body});
            else await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['spektacular-real-cli-smoke', 'ci-failure', 'kind/bug']});
