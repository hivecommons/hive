name: v6 Top-up

# Keeps the v6 development line level with v5 (#7563, Track 7).
#
# v6 was cut from v5 to host dashboard-optional-operation work while v5 soaks
# toward GA. v5 itself is topped up from v4 after every v4 release
# (v5-topup.yml), so without this workflow v6 would silently fall behind BOTH
# lines and every v6 feature branch would age against a stale base.
#
# WHY IT TRIGGERS ON PUSH TO v5. v5 only moves when a v4→v5 top-up merges or a
# v5-targeted PR lands — both infrequent, human-mediated events. Chaining
# directly off the push means v6 is topped up within minutes of v5 moving, at
# exactly the cadence v5 itself changes, with no thrash. The daily schedule is
# a safety net only.
#
# CONFLICTS ARE A HUMAN SIGNAL, NOT A RETRY — same policy as v5-topup.yml
# (#7199 precedent): on conflict the workflow inventories the damage, pushes
# nothing, and fails loudly for a human to resolve.

on:
  push:
    branches: [v5]
  schedule:
    # Daily safety net for anything the push trigger missed.
    - cron: '47 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  top-up:
    runs-on: ${{ fromJSON(vars.HIVE_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      # #7930: re-run the PR's own 0-job startup failures.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a forward-merge needs both lines' commits, and a
          # shallow clone makes every merge look like an unrelated history.
          fetch-depth: 0
          # #7959: GITHUB_TOKEN can never push a commit that touches
          # .github/workflows/** ("refusing to allow a GitHub App to create
          # or update workflow ... without `workflows` permission") and no
          # `permissions:` key grants it, so every dependabot action-pin bump
          # on v5 made this job red until a human carried the sync by hand.
          # TOPUP_PUSH_TOKEN is a fine-grained PAT (Contents: write +
          # Workflows: write on this repo) that the push step uses when set;
          # unset, the job keeps GITHUB_TOKEN and the preflight below turns
          # the server-side rejection into an actionable error instead.
          token: ${{ secrets.TOPUP_PUSH_TOKEN != '' && secrets.TOPUP_PUSH_TOKEN || github.token }}

      - name: Identify the committer
        run: |
          git config user.name "hive-release[bot]"
          git config user.email "hive-release@hive.kubestellar.io"

      - name: Check whether v6 is behind v5
        id: drift
        run: |
          set -euo pipefail
          git fetch --quiet origin v5 v6
          behind="$(git rev-list --count origin/v6..origin/v5)"
          echo "behind=${behind}" >> "$GITHUB_OUTPUT"
          if [ "${behind}" -eq 0 ]; then
            echo "v6 is already level with v5 — nothing to top up."
          else
            echo "v6 is ${behind} commit(s) behind v5."
          fi

      - name: Ensure gh CLI is available
        if: steps.drift.outputs.behind != '0'
        run: |
          set -euo pipefail
          command -v gh >/dev/null 2>&1 && exit 0
          VER=2.63.2
          # #7976: pin and verify unconditionally (the v2-ci.yml `just`
          # convention). This job's checkout persists a push credential — a
          # workflows-write PAT when TOPUP_PUSH_TOKEN is set — so an
          # unverified binary here would run with the repo's most powerful
          # CI token in its working tree. Values from gh_${VER}_checksums.txt.
          SHA256_amd64=912fdb1ca29cb005fb746fc5d2b787a289078923a29d0f9ec19a0b00272ded00
          SHA256_arm64=0f31e2a8549c64b5c1679f0b99ce5e0dac7c91da9e86f6246adb8805b0f0b4bb
          ARCH="$(dpkg --print-architecture 2>/dev/null || uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          case "$ARCH" in
            amd64) SHA256="$SHA256_amd64" ;;
            arm64) SHA256="$SHA256_arm64" ;;
            *) echo "::error::no pinned gh checksum for arch ${ARCH}"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/cli/cli/releases/download/v${VER}/gh_${VER}_linux_${ARCH}.tar.gz" -o /tmp/gh.tgz
          echo "${SHA256}  /tmp/gh.tgz" | sha256sum -c -
          tar -xzf /tmp/gh.tgz -C /tmp
          mkdir -p "$HOME/.local/bin"
          install "/tmp/gh_${VER}_linux_${ARCH}/bin/gh" "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # #18931: v5 -> v6 only stays conflict-free while every top-up lands on v6
      # with a MERGE COMMIT. A squash or rebase keeps v5's content but drops its
      # history, so the merge base stays at the previous top-up and the next
      # forward-merge replays the whole range (#18689 was squashed: 109
      # conflicted files, 17 add/add, on every v5 push afterwards). Each top-up
      # PR body records the v5 head it carried; this step finds the newest
      # merged one and checks that head is still an ancestor of origin/v6.
      - name: Check v5 ancestry on v6 (#18931)
        id: ancestry
        if: steps.drift.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Run from a copy taken off the triggering ref: the merge step
          # checks out v6's tree, which may not carry this script yet.
          cp .github/scripts/v6-topup-ancestry.sh "$RUNNER_TEMP/v6-topup-ancestry.sh"
          anc="$RUNNER_TEMP/v6-topup-ancestry.sh"
          owner="${GITHUB_REPOSITORY%%/*}"
          carried=""
          source_pr=""
          prs="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=v6&head=${owner}:sync/v5-to-v6&per_page=30" \
            --jq '[.[] | select(.merged_at != null)] | sort_by(.merged_at) | reverse | .[0] // empty')"
          if [ -n "$prs" ]; then
            number="$(jq -r .number <<<"$prs")"
            author_id="$(jq -r .user.id <<<"$prs")"
            author_type="$(jq -r .user.type <<<"$prs")"
            jq -r '.body // ""' <<<"$prs" > "$RUNNER_TEMP/last-topup-body.md"
            marked="$("$anc" marker "$RUNNER_TEMP/last-topup-body.md")"
            if [ -z "$marked" ]; then
              echo "Newest merged top-up PR #${number} has no carried-head marker; ancestry cannot be checked."
            # A marker in a PR body is only a claim: only the workflow's own
            # bot may have written one, and it must match that PR's real head.
            elif [ "$author_id" != "41898282" ] || [ "$author_type" != "Bot" ]; then
              echo "::warning::Ignoring the carried-head marker on #${number}: not opened by the top-up workflow."
            else
              pr_head="$(jq -r .head.sha <<<"$prs")"
              merged_sha="$(jq -r .merge_commit_sha <<<"$prs")"
              git fetch --quiet origin "+refs/pull/${number}/head:refs/remotes/pull/${number}/head" || true
              if "$anc" verify "$marked" "$pr_head" "$merged_sha"; then
                carried="$marked"
                source_pr="$number"
              else
                echo "::warning::Ignoring the carried-head marker on #${number}: it does not match that PR's head commit."
              fi
            fi
          fi
          state="$("$anc" classify "$carried")"
          {
            echo "state=${state}"
            echo "carried=${carried}"
            echo "source_pr=${source_pr}"
          } >> "$GITHUB_OUTPUT"
          case "$state" in
            level)
              echo "v5 ancestry intact: ${carried} (carried by #${source_pr}) is an ancestor of origin/v6." ;;
            unknown)
              echo "No verified carried v5 head on record; merging origin/v5 as is." ;;
            lost)
              echo "::warning::v5 ancestry was lost: ${carried}, carried by top-up PR #${source_pr}, is not an ancestor of origin/v6, so #${source_pr} was squash- or rebase-merged. Top-up PRs must land with a merge commit. Restoring the ancestry with an ours-merge of ${carried} (no file changes) before merging origin/v5."
              {
                echo "### v5 ancestry was lost"
                echo ""
                echo "Top-up PR #${source_pr} carried \`${carried}\`, but that commit is not an ancestor of \`origin/v6\`: the PR was squash- or rebase-merged. Top-up PRs must be merged with a merge commit. The workflow restores the ancestry with an ours-merge of \`${carried}\` before merging \`origin/v5\`."
              } >> "$GITHUB_STEP_SUMMARY" ;;
            unrecoverable)
              echo "::error::v5 ancestry was lost and cannot be restored automatically: ${carried}, carried by top-up PR #${source_pr}, is not an ancestor of origin/v5 (v5 history was rewritten)."
              echo "Nothing was pushed. Carry the top-up by hand and merge it with a merge commit."
              exit 1 ;;
          esac

      - name: Forward-merge v5 into the top-up branch
        id: merge
        if: steps.drift.outputs.behind != '0'
        env:
          ANCESTRY_STATE: ${{ steps.ancestry.outputs.state }}
          CARRIED: ${{ steps.ancestry.outputs.carried }}
          SOURCE_PR: ${{ steps.ancestry.outputs.source_pr }}
        run: |
          set -euo pipefail
          # Always rebuild the branch from v6's tip. Reusing a stale top-up
          # branch would replay an older merge and could resurrect commits v6
          # has since had reverted.
          cp .github/scripts/v6-topup-autoresolve.sh "$RUNNER_TEMP/v6-topup-autoresolve.sh"
          git checkout -B sync/v5-to-v6 origin/v6

          # #18931: a previous top-up was squash/rebase-merged, so its v5 head
          # is not on v6's history. Record it as merged (an ours-merge keeps
          # v6's tree: that content is already on v6) so the merge below only
          # has to carry what v5 gained since. Signed off by this bot, for its
          # own merge commit only.
          if [ "${ANCESTRY_STATE}" = "lost" ]; then
            git merge -s ours --no-ff --signoff "${CARRIED}" \
              -m "🩹 Restore v5 ancestry: record ${CARRIED:0:9} (carried by #${SOURCE_PR}) as merged"
          fi

          # --signoff because the DCO audits treat a merge commit as a commit
          # like any other.
          if git merge --no-ff --signoff origin/v5 \
               -m "🌱 Forward-merge v5 into v6 (${{ steps.drift.outputs.behind }} commits)"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          # Known, mechanically resolvable conflicts get auto-resolved
          # instead of paging a human every time (the resolver's header lists
          # them with their history):
          #   - discord/ + discord-syntax.yml modify/delete: keep v6's
          #     deletion (#9277, #11551).
          #   - CHANGELOG.md: both lines prepend release sections, keep both.
          #   - integration-governance.cjs TRUSTED_SCRIPTS_TREE literal only:
          #     re-pin to the merged src/scripts tree.
          #   - static/index.html: regenerate from static-src/manifest.txt.
          # When the ONLY conflicts match those patterns, resolve them and
          # finish the merge. Anything else (other content conflicts, other
          # deletions, other hunks in the pin file) still fails loudly below.
          # src/pkg/config/config.go is deliberately NOT auto-resolved: v6
          # split it, so keeping v6's side would silently drop v5's change.
          # The resolver runs from the copy taken off the triggering ref
          # before the checkout, not from v6's tree.
          elif bash "$RUNNER_TEMP/v6-topup-autoresolve.sh"; then
            # --cleanup=strip: --no-edit would otherwise keep the "# Conflicts:"
            # comment lines git leaves in MERGE_MSG.
            git commit --no-edit --signoff --cleanup=strip
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            # Inventory the conflict BEFORE aborting (#7337): hunk and line
            # counts per file so the human sizing the resolution doesn't
            # rediscover the numbers by hand.
            git diff --name-only --diff-filter=U > /tmp/conflicted.txt || true

            : > /tmp/conflict-rows.tsv
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              # Delete/modify conflicts leave no working-tree file; count them
              # as zero-hunk rows rather than letting grep exit 2 under set -e.
              hunks=0
              lines=0
              if [ -f "$f" ]; then
                hunks=$(grep -c "^<<<<<<<" "$f" < /dev/null 2>/dev/null) || hunks=0
                lines=$(awk "/^<<<<<<</,/^>>>>>>>/" "$f" 2>/dev/null | wc -l | tr -d " ") || lines=0
              fi
              printf "%s\t%s\t%s\n" "${hunks:-0}" "${lines:-0}" "$f" >> /tmp/conflict-rows.tsv
            done < /tmp/conflicted.txt
            LC_ALL=C sort -rn -k2 /tmp/conflict-rows.tsv -o /tmp/conflict-rows.tsv

            files=$(wc -l < /tmp/conflicted.txt | tr -d " ")
            total=$(awk -F"\t" "{s+=\$2} END{print s+0}" /tmp/conflict-rows.tsv)

            {
              echo "### v5 -> v6 forward-merge conflicts"
              echo ""
              echo "${{ steps.drift.outputs.behind }} commit(s) behind. Conflicting files, largest first:"
              echo ""
              echo "| conflicts | lines | file |"
              echo "| ---: | ---: | --- |"
              while IFS="$(printf "\t")" read -r hunks lines f; do
                [ -n "$f" ] || continue
                echo "| $hunks | $lines | \`$f\` |"
              done < /tmp/conflict-rows.tsv
              echo ""
              echo "**$files** conflicting file(s), **$total** conflicted line(s) in total."
              echo ""
              echo "Merge base of v5 and v6: \`$(git merge-base origin/v5 origin/v6)\` ($(git log -1 --format=%cs "$(git merge-base origin/v5 origin/v6)")). If that is far behind v5, a previous top-up lost v5's ancestry (it was squash- or rebase-merged); check that first (see below)."
            } > /tmp/conflict-report.md

            cat /tmp/conflict-report.md >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/conflict-report.md

            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report a conflicting top-up and stop
        if: steps.merge.outputs.conflict == 'true'
        env:
          CARRIED: ${{ steps.ancestry.outputs.carried }}
        run: |
          echo "::error::v5 -> v6 forward-merge conflicts and needs a human (see #7199 for the precedent)."
          echo "Nothing was pushed. Check the ancestry FIRST: a squash- or rebase-merged top-up (#18931) makes"
          echo "every later merge conflict on files it already carried, hundreds of them, and no resolver can fix that."
          echo "  git fetch origin v5 v6"
          echo "  git merge-base --is-ancestor <v5 head the last top-up PR carried${CARRIED:+, ${CARRIED}}> origin/v6 && echo intact || echo LOST"
          echo "Then resolve locally:"
          echo "  git checkout -B sync/v5-to-v6 origin/v6"
          echo "  # only if the ancestry check said LOST (records history, changes no file):"
          echo "  git merge -s ours --no-ff --signoff <that v5 head>"
          echo "  git merge --no-ff --signoff origin/v5"
          echo "  # resolve, then push and open a PR against v6; merge it with a MERGE COMMIT, never squash or rebase"
          exit 1

      - name: Refuse a workflow-file delta the push credential cannot carry (#7959)
        if: steps.merge.outputs.conflict == 'false'
        env:
          HAS_PUSH_TOKEN: ${{ secrets.TOPUP_PUSH_TOKEN != '' }}
          ANCESTRY_STATE: ${{ steps.ancestry.outputs.state }}
        run: |
          set -euo pipefail
          [ "${HAS_PUSH_TOKEN}" = "true" ] && exit 0
          touched="$(git diff --name-only origin/v6...HEAD -- .github/workflows/ || true)"
          [ -z "${touched}" ] && exit 0
          echo "::error::v5 -> v6 top-up touches workflow files and TOPUP_PUSH_TOKEN is not set — GITHUB_TOKEN cannot push them (#7959)."
          echo "Files: $(echo "${touched}" | tr '\n' ' ')"
          echo "Nothing was pushed. Either add repo secret TOPUP_PUSH_TOKEN (fine-grained PAT, Contents: write + Workflows: write) or carry the sync by hand"
          echo "(check the v5 ancestry first, see the conflict report above; this top-up's state was: ${ANCESTRY_STATE:-unknown}):"
          echo "  git checkout -B sync/v5-to-v6 origin/v6"
          echo "  git merge --no-ff --signoff origin/v5"
          echo "  git push -u origin sync/v5-to-v6  # then open a PR against v6, to be merged with a MERGE COMMIT"
          exit 1

      - name: Push the top-up branch
        if: steps.merge.outputs.conflict == 'false'
        run: git push --force-with-lease origin sync/v5-to-v6

      - name: Open or refresh the top-up PR
        if: steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEHIND: ${{ steps.drift.outputs.behind }}
          ANCESTRY_STATE: ${{ steps.ancestry.outputs.state }}
          CARRIED: ${{ steps.ancestry.outputs.carried }}
          SOURCE_PR: ${{ steps.ancestry.outputs.source_pr }}
        run: |
          set -euo pipefail
          # The v5 head this PR carries is the top-up merge's second parent:
          # the next run checks it is on v6 (#18931). Recorded on every push,
          # so the body always names what the branch currently carries.
          carried_now="$(git rev-parse --verify HEAD^2)"
          {
            printf '%s\n' \
              "Automated v5 → v6 top-up (#7563, Track 7)." \
              "" \
              "Carries ${BEHIND} commit(s) from v5 onto v6." \
              "" \
              "**Merge this PR with a merge commit, never a squash or a rebase.** A squash keeps v5's content but drops its history, and every later top-up then re-conflicts on everything this one carried (#18931)." \
              "" \
              "This runs on every push to v5 (v5 only moves when a v4→v5 top-up or a v5 PR merges), plus a daily safety net, so v6 feature work never ages against a stale base." \
              "" \
              "Opened by .github/workflows/v6-topup.yml. If this merge conflicts the workflow fails instead of opening it — a conflicting forward-merge is a human decision (see #7199)."
            if [ "${ANCESTRY_STATE}" = "lost" ]; then
              printf '%s\n' \
                "" \
                "The first commit restores v5 ancestry that was lost when #${SOURCE_PR} was squash- or rebase-merged: an ours-merge of ${CARRIED}, which records history and changes no file." \
                "" \
                "DCO: the native queue's prow-DCO path for top-ups (#17030) only covers a PR whose commits are all v5 history plus one merge of v5 onto v6, so this PR falls back to requiring the probot DCO check. Inherited v5 commits whose author and sign-off names differ must be remediated by their own authors under .github/dco.yml; nobody signs off on another author's behalf."
            fi
            printf '\n'
            "$RUNNER_TEMP/v6-topup-ancestry.sh" marker-line "$carried_now"
          } > "$RUNNER_TEMP/v6-topup-body.md"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=v6&head=${GITHUB_REPOSITORY%%/*}:sync/v5-to-v6" \
            --jq '.[0] | select(. != null) | "\(.number) \(.user.id) \(.user.type)"')"
          if [ -n "$existing" ]; then
            read -r number author_id author_type <<<"$existing"
            if [ "$author_id" = "41898282" ] && [ "$author_type" = "Bot" ]; then
              # REST, not `gh pr edit`: the latter reads the PR through a
              # GraphQL query that can fail on the repo's classic-project state.
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${number}" \
                -f title="🌱 Forward-merge v5 into v6 (${BEHIND} commits)" \
                -F body=@"$RUNNER_TEMP/v6-topup-body.md" >/dev/null
              echo "PR #${number} already open for this top-up; the force-push refreshed it and its carried-head marker."
            else
              echo "::warning::PR #${number} on sync/v5-to-v6 was not opened by this workflow; its body was left alone, so no carried-head marker is recorded."
            fi
            exit 0
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base v6 --head sync/v5-to-v6 \
            --title "🌱 Forward-merge v5 into v6 (${BEHIND} commits)" \
            --body-file "$RUNNER_TEMP/v6-topup-body.md"

      # #7930: a pull_request opened or refreshed by GITHUB_TOKEN can die at
      # workflow resolution with 0 jobs and the misleading "workflow file
      # issue" banner. Re-run those startup failures so the PR shows test
      # evidence; real failures keep their jobs and are left alone.
      - name: Re-run top-up PR startup failures (#7930)
        if: steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          rerun=0
          for attempt in 1 2 3 4 5 6; do
            sleep 20
            pending="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=${head}&per_page=100" \
              --jq '.workflow_runs[] | select(.conclusion == "failure" and .run_attempt == 1) | "\(.id) \(.conclusion)"')"
            [ -n "$pending" ] || { [ "$attempt" -ge 3 ] && break || continue; }
            while read -r id conclusion; do
              [ -n "$id" ] || continue
              if [ "$conclusion" = "failure" ]; then
                jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${id}/jobs" --jq '.total_count')"
                if [ "$jobs" = "0" ]; then
                  gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/${id}/rerun" >/dev/null && { echo "re-ran 0-job startup failure ${id}"; rerun=$((rerun+1)); }
                fi
              fi
            done <<< "$pending"
          done
          echo "re-ran ${rerun} startup-failure run(s) for ${head}"
