name: Podman Rootless Contract

# Static contract check for the rootless-Podman handling in Justfile's
# contribute-hive recipe (#2535 Option C — CI seam, not a live rootless run).
# See src/docs/podman-rootless-ci.md for what this covers and what a future
# live-runner test would add. Does NOT change the runtime auto-detect
# default (Option A is explicitly deferred pending broader coverage).

# Triggers cover both maintained branches. This workflow used to name `v2`
# alone; mainline moved to `v4` and it stopped running entirely (#4339) — a
# guard that never executes reports green forever, which is the one failure
# mode a guard cannot have. The branch list and the self-referencing path entry
# below mirror .github/workflows/suid-contract.yml, the sibling static contract
# check. The branch list is no longer trusted to stay correct by hand: it is
# asserted against .github/release-lines.yml by release-line-guard.yml (#4405),
# so cutting the next release line fails CI until this block is updated too.
on:
  # v5 (hivecommons/hive#4000/#4001/#4002 implementation line) intentionally NOT
  # added here: this contract has only ever run on v2, was never extended to v4
  # when development moved there, and this task's scope is "mirror v4's CI onto
  # v5" — there is no v4 behavior to mirror for this workflow.
  push:
    branches:
      - v2
      - v4
      - v5
    paths:
      - 'Justfile'
      - 'src/scripts/check-podman-contract.sh'
      - 'src/docs/podman-rootless-ci.md'
      - '.github/workflows/podman-contract.yml'
  pull_request:
    branches:
      - v2
      - v4
      - v5
    paths:
      - 'Justfile'
      - 'src/scripts/check-podman-contract.sh'
      - 'src/docs/podman-rootless-ci.md'
      - '.github/workflows/podman-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run rootless-Podman static contract check
        run: bash src/scripts/check-podman-contract.sh Justfile
