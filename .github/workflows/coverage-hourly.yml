name: Coverage Hourly

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  # No pull_request trigger anymore (#4112). The pre-merge half of this gate —
  # added in #2350's aftermath and moved to v4 in #3903 — now lives in
  # v2-tests.yml's `coverage` job, which parses the coverprofile emitted by the
  # SAME sharded `go test -short -race -count=1` run that gates the PR, so PRs
  # run the test suite exactly once instead of twice. This workflow remains the
  # scheduled hourly monitor for the v4 branch, including the
  # create-issue-on-coverage-drop machinery below.
  #
  # v5 is covered by the pre-merge half too: v2-tests.yml's `pull_request`
  # filter is `branches: [v2, v4, v5]`, so the coverage floor still gates every
  # v5 PR. v5 was added to the (now removed) trigger here in the #4058 top-up;
  # #4112 relocated the whole pre-merge job rather than the branch list, so
  # there is nothing v5-specific left to carry in this file.
  #
  # KEEP THE FLOORS IN SYNC: PKG_THRESHOLD below is duplicated in
  # v2-tests.yml's coverage job; a floor change must land in both.

permissions:
  contents: read
  issues: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    # Hard cap so a hung runner / stuck -race build auto-fails instead of
    # blocking PR merges indefinitely (the go test -timeout only bounds the test
    # step, not checkout/setup/build/post-processing or a wedged runner). #3615.
    timeout-minutes: 20
    # Surfaced so create-issue-on-coverage-drop can report WHAT failed and on
    # WHICH commit (#3903). Without these the filed issue could only say
    # "packages below 90%" and quote github.sha — the SHA of the branch that
    # TRIGGERED the run, not the one the checkout above measured.
    outputs:
      below_threshold: ${{ steps.coverage.outputs.below_threshold }}
      failed_packages: ${{ steps.coverage.outputs.failed_packages }}
      total: ${{ steps.coverage.outputs.total }}
      measured_sha: ${{ steps.coverage.outputs.measured_sha }}
      measured_ref: ${{ steps.coverage.outputs.measured_ref }}
    defaults:
      run:
        working-directory: src
    steps:
      # On `schedule`/`workflow_dispatch` there is no PR ref, so pin explicitly
      # to the branch whose floor this gate reports on hourly.
      #
      # That branch is now v4 (#3903). It was v2, and v2 is sunset — the fleet
      # runs v4 and v2 is no longer a merge target, so the gate was measuring a
      # branch nobody can fix. The practical effect was worse than "stale
      # numbers": v4 carries 14 packages that do not exist on v2 at all
      # (ioscan, sandbox, intent, pushbroker, tracing, review, retro,
      # escalation, forge, mint, planning, timeline, agentparse, outputschema),
      # so every one of them had never been subject to any floor.
      #
      # On `schedule`/`workflow_dispatch` there is no PR ref, so pin explicitly
      # to the branch whose floor this gate reports on hourly.
      #
      # That branch is now v4 (#3903). It was v2, and v2 is sunset — the fleet
      # runs v4 and v2 is no longer a merge target, so the gate was measuring a
      # branch nobody can fix. The practical effect was worse than "stale
      # numbers": v4 carries 14 packages that do not exist on v2 at all
      # (ioscan, sandbox, intent, pushbroker, tracing, review, retro,
      # escalation, forge, mint, planning, timeline, agentparse, outputschema),
      # so every one of them had never been subject to any floor.
      #
      # (This workflow no longer runs on pull_request — the pre-merge floor
      # check lives in v2-tests.yml now, see #4112 — so the ref can be pinned
      # unconditionally.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 'v4'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: src/go.sum

      # The coverage run must NOT abort this job on a test failure: the
      # per-package check below is what turns a failure into a readable report.
      # Previously a failing package exited non-zero here and the check step was
      # `skipped` entirely, so the gate never actually ran (see the comment on
      # the parsing loop).
      - name: Test with coverage
        id: cover
        continue-on-error: true
        run: |
          go test ./pkg/... ./cmd/... ./internal/... -short -race -coverprofile=coverage.out -count=1 -timeout 600s \
            2>&1 | tee race-run.log
          exit "${PIPESTATUS[0]}"

      - name: Check per-package coverage
        id: coverage
        run: |
          THRESHOLD=90
          FAILED=""
          BROKEN=""
          REPORT=""

          # Per-package threshold overrides. A handful of packages are heavily
          # coupled to the live runtime (fixed /data,/proc,/var/run paths, real
          # github.com/platform.claude.com device-flow, a live tmux agent buffer,
          # an in-cluster k8s serviceaccount) and cannot be exercised hermetically
          # in CI without invasive production seams. They get a documented lower
          # floor so the gate still catches regressions below their real ceiling,
          # rather than blocking forever on untestable code. Raise these toward 90
          # as seams are added; do not add new entries without justification here.
          #
          # KEEP IN SYNC with the copy of this map in v2-tests.yml's coverage
          # job (the pre-merge half of this gate, #4112).
          declare -A PKG_THRESHOLD=(
            [dashboard]=82   # ~17% is inception tmux watcher + copilot/claude device-flow + /data file I/O + k8s
            [hub]=87         # kubectl-shelling + live-GitHub paths; see #2355. Was 89 against v2's 89.9%; v4 measures 87.6%.
            [agent]=89       # pre-existing shortfall inherited from #2350, NOT a new regression. See #2355.

            # ── Floors recorded when the gate moved from v2 to v4 (#3903) ─────
            #
            # These are a RATCHET, NOT A TARGET. Every entry below is a package
            # the gate had never measured: either it does not exist on v2 at all
            # (the gate's old ref), or it grew on v4 while the gate watched v2.
            # None of this is a regression that slipped past the gate — the gate
            # was pointed somewhere else.
            #
            # Each floor is the value measured on v4 at d89121f5, rounded DOWN to
            # the integer the check compares, so the gate starts catching further
            # slippage immediately instead of blocking every v4 PR on day one.
            # The alternative — switching to v4 with the bare 90% default — turns
            # CI red for 14 packages at once and blocks work that has nothing to
            # do with coverage, which is how a gate gets disabled rather than
            # satisfied.
            #
            # Raise these toward 90 as tests land; never raise one to paper over
            # a drop. A package that improves should have its floor moved up in
            # the same PR, so the ratchet only turns one way.
            #
            # ── Ratchet turned for #4570 ─────────────────────────────────────
            # sandbox/ioscan/pushbroker: tests added in the same PR, so the
            #   floors move with the gain (67.6→98.5, 71.0→97.1, 72.8→100.0).
            # intent/tracing/dashboard: NO code change — these had drifted far
            #   above floors recorded at d89121f5 and were no longer catching
            #   anything. Re-measured on v4 at cd8aee5d and moved up to what
            #   they actually hold, with ~1 point of headroom.
            # scheduler (90.4) and escalation (93.2) now clear the 90% default
            #   and no longer need an entry at all.
            [intent]=87
            [tracing]=85
            [review]=80
            [retro]=82
            [github]=88
            [hivectl]=88
            [knowledge]=89
            [proxy]=89
            [ioscan]=96
            [sandbox]=98
            [pushbroker]=99

            # ── Stale module-path parser repaired on v5 (#6066) ─────────────
            # These packages were pre-existing below-default floors that became
            # visible again when the v2-tests coverage classifier was corrected
            # from the old github.com/kubestellar/hive module path to
            # github.com/hivecommons/hive. Record their current ceilings so the
            # parser fix can gate new packages (pkg/effects, pkg/hub/spoke)
            # without turning unrelated backlog into a blocker.
            [mutation]=86   # 86.7% on PR #6076
            [webstatic]=88  # 88.9% on PR #6076
            [automerge]=88  # 88.6% on PR #6076
            [mint]=89       # 89.1% on PR #6076
            [turn]=87       # 87.1% on PR #6076

            # ── ./cmd/... floors (#4701) ─────────────────────────────────────
            # CI never ran ./cmd/... at all before #4701 — four cmd/bd tests
            # were merged already-failing and stayed red undetected. cmd keys
            # are prefixed ("cmd/<name>") so cmd/hivectl can never collide with
            # pkg/hivectl's floor. Recorded just below what v4 measures after
            # #4700/#4719 so the ratchet can turn as CLI tests land.
            [cmd/bd]=58       # 60.4% after #4700's kb-CLI tests
            [cmd/hive]=17     # 18.8% after #4719's merge-authz tests; bulk is main()/run-loop wiring
            [cmd/apiproxy]=13 # 14.7%
            [cmd/hive-backup]=68 # 71.1% after #4736's CLI entry-point tests
          )

          # Thin flag-parsing mains with no test files, wrapping packages the
          # gate already floors (pkg/hivectl at 88, pkg/hubbackup at the 90
          # default). Exempt from the NO TEST FILES hard failure by name so any
          # NEW untested cmd package still fails the gate. Remove an entry the
          # moment its package gains a test file.
          UNTESTED_CMD_MAINS='cmd/hivectl'

          # Capture the full `go test -cover` output ONCE, then classify every
          # line. The previous version piped through `grep '^ok'`, which silently
          # dropped two categories that matter most:
          #
          #   FAIL  <pkg>                    -> a broken package scored nothing
          #   ?     <pkg> [no test files]    -> an untested package scored nothing
          #
          # Both were therefore incapable of failing the gate, so adding a
          # package with zero tests was the one guaranteed way to stay green.
          # They are now hard failures in their own right.
          go test -cover ./pkg/... ./cmd/... ./internal/... -short -count=1 -timeout 600s 2>&1 | tee cover-run.log || true

          # Floor-map key for a package import path: cmd packages are keyed
          # with a "cmd/" prefix so cmd/hivectl can never resolve to
          # pkg/hivectl's floor (#4701); everything else keeps the historical
          # bare-basename key.
          floor_key() {
            case "$1" in
              */cmd/*) echo "cmd/${1##*/}" ;;
              *)       echo "${1##*/}" ;;
            esac
          }

          while IFS= read -r line; do
            case "$line" in
              ok*)
                pkgpath=$(echo "$line" | awk '{print $2}')
                pkg=$(floor_key "$pkgpath")
                pct=$(echo "$line" | grep -o '[0-9]*\.[0-9]*%' | tr -d '%')
                if [ -z "$pct" ]; then continue; fi
                int_pct=$(echo "$pct" | cut -d. -f1)
                pkg_threshold=${PKG_THRESHOLD[$pkg]:-$THRESHOLD}
                if [ "$int_pct" -lt "$pkg_threshold" ]; then
                  FAILED="${FAILED}${pkg}: ${pct}% (floor ${pkg_threshold}%)\n"
                fi
                REPORT="${REPORT}${pkg}: ${pct}%\n"
                ;;
              FAIL*)
                pkgpath=$(echo "$line" | awk '{print $2}')
                # Ignore the bare trailing "FAIL" summary line, which has no pkg.
                if [ -n "$pkgpath" ] && [ "$pkgpath" != "FAIL" ]; then
                  pkg=$(floor_key "$pkgpath")
                  BROKEN="${BROKEN}${pkg}: TESTS FAILING\n"
                  REPORT="${REPORT}${pkg}: FAIL\n"
                fi
                ;;
              \?*)
                pkgpath=$(echo "$line" | awk '{print $2}')
                pkg=$(floor_key "$pkgpath")
                case " $UNTESTED_CMD_MAINS " in
                  *" $pkg "*)
                    REPORT="${REPORT}${pkg}: no tests (exempt thin main)\n"
                    ;;
                  *)
                    BROKEN="${BROKEN}${pkg}: NO TEST FILES\n"
                    REPORT="${REPORT}${pkg}: no tests\n"
                    ;;
                esac
                ;;
            esac
          done < cover-run.log

          TOTAL=$(go tool cover -func=coverage.out 2>/dev/null | grep '^total:' | awk '{print $3}')
          echo "Total coverage: ${TOTAL:-unavailable}"
          echo "total=${TOTAL:-unavailable}" >> "$GITHUB_OUTPUT"

          # Report the commit that was actually MEASURED, read from the working
          # tree rather than from github.sha (#3903). On a schedule these differ:
          # github.sha is the default branch's head, while the checkout above
          # pinned an explicit ref. The filed issue used to quote github.sha, so
          # it named a commit the run had never tested — anyone bisecting from it
          # was looking at the wrong tree.
          MEASURED_SHA=$(git rev-parse HEAD 2>/dev/null || echo unknown)
          MEASURED_REF=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown)
          echo "Measured ${MEASURED_REF} @ ${MEASURED_SHA}"
          echo "measured_sha=${MEASURED_SHA}" >> "$GITHUB_OUTPUT"
          echo "measured_ref=${MEASURED_REF}" >> "$GITHUB_OUTPUT"

          {
            echo "## Per-package coverage"
            echo ""
            echo -e "${REPORT}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$BROKEN" ] || [ -n "$FAILED" ]; then
            echo "below_threshold=true" >> "$GITHUB_OUTPUT"
            {
              [ -n "$BROKEN" ] && echo -e "### Packages that cannot be scored\n${BROKEN}"
              [ -n "$FAILED" ] && echo -e "### Packages below their floor\n${FAILED}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo -e "failed_packages<<EOF\n${BROKEN}${FAILED}EOF" >> "$GITHUB_OUTPUT"
            echo -e "full_report<<EOF\n${REPORT}EOF" >> "$GITHUB_OUTPUT"
            echo ""
            echo "COVERAGE GATE FAILED:"
            [ -n "$BROKEN" ] && echo -e "${BROKEN}"
            [ -n "$FAILED" ] && echo -e "${FAILED}"
            # Exit non-zero so the gate actually BLOCKS. The previous version
            # computed this report and then exited 0 regardless, so even a
            # correctly-detected shortfall never failed anything.
            exit 1
          fi

          echo "below_threshold=false" >> "$GITHUB_OUTPUT"
          echo "All packages meet their coverage floor" >> "$GITHUB_STEP_SUMMARY"

  create-issue-on-coverage-drop:
    # Scheduled runs only. The bare `failure()` here previously fired on ANY
    # job failure regardless of cause, which is why issue #2191 accumulated 41
    # comments titled "packages below 90% threshold" when the real cause was a
    # test failure aborting the run. Now that the gate also runs on
    # pull_request, an unscoped condition would additionally file an issue for
    # every contributor's red PR.
    if: always() && github.event_name == 'schedule' && needs.coverage.result != 'success'
    runs-on: ubuntu-latest
    needs: coverage
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create or update coverage issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Report what the coverage job MEASURED, not what triggered the run
            // (#3903). On a schedule, context.sha is the default branch's head
            // while the job checks out an explicit ref — the old body quoted
            // context.sha and hardcoded "Branch: v2", so #3903 was filed naming
            // a v4 commit for a run that had measured v2. Anyone starting from
            // that SHA was reading the wrong tree.
            const measuredSha = '${{ needs.coverage.outputs.measured_sha }}' || context.sha;
            const measuredRef = '${{ needs.coverage.outputs.measured_ref }}' || 'unknown';
            const failing = `${{ needs.coverage.outputs.failed_packages }}`.trim();
            const total = '${{ needs.coverage.outputs.total }}' || 'unavailable';
            const shortSha = measuredSha.substring(0, 7);

            // The gate fails for two DIFFERENT reasons and they need different
            // fixes: a package under its floor, or a package that could not be
            // scored at all (tests failing / no test files). Conflating them is
            // how #2191 collected 41 comments about coverage when the cause was
            // a broken test, and how #3903 was titled "below 90%" when nothing
            // was below its floor. State the cause up front.
            const cannotScore = /TESTS FAILING|NO TEST FILES/.test(failing);
            const cause = cannotScore
              ? 'One or more packages **could not be scored** (tests failing, or no test files). That is a broken-test problem, not a coverage shortfall — fix the tests first; the floor cannot be evaluated until they run.'
              : 'One or more packages are **below their coverage floor**.';
            const detail = failing
              ? `\n\n### What the gate reported\n\n\`\`\`\n${failing}\n\`\`\``
              : '';

            const title = `[Coverage] packages below 90% threshold`;
            const body = `## Coverage gate failed\n\n`
              + `- **Measured:** \`${measuredRef}\` @ \`${measuredSha}\`\n`
              + `- **Run:** ${runUrl}\n`
              + `- **Total coverage:** ${total}\n`
              + `- **Default threshold:** 90% per package (see PKG_THRESHOLD in the workflow for documented per-package floors)\n\n`
              + `${cause}${detail}\n\n`
              + `Close this issue when the gate is green again.`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-coverage',
              per_page: 10,
            });
            const dup = existing.data.find(i => i.title.startsWith('[Coverage]'));
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body: `Gate still failing on \`${measuredRef}\` @ \`${shortSha}\`: ${runUrl}${detail}`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci-coverage', 'kind/bug'],
            });
