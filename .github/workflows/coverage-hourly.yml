name: Coverage Hourly

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  # The floor is only meaningful if it runs BEFORE code lands. Without this the
  # gate was hourly-only, so a PR could drop a package below its floor and merge
  # green — which is exactly what happened in #2350.
  pull_request:
    branches: [v2]
    paths: ['v2/**']

permissions:
  contents: read
  issues: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      # On `schedule`/`workflow_dispatch` there is no PR ref, so pin to v2 —
      # that is the branch whose floor this gate reports on hourly.
      #
      # On `pull_request` we must NOT pin to v2: `ref: v2` makes the runner do
      # `git checkout --force -B v2 refs/remotes/origin/v2` and measure the
      # BASE branch, so the gate reports v2's numbers no matter what the PR
      # changes. That made the gate simultaneously useless and misleading — a
      # PR that fixed coverage still failed, and a PR that broke it would still
      # have passed. Leaving `ref` empty checks out the PR merge commit, which
      # is the code that is actually about to land.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'v2' }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: v2/go.sum

      # The coverage run must NOT abort this job on a test failure: the
      # per-package check below is what turns a failure into a readable report.
      # Previously a failing package exited non-zero here and the check step was
      # `skipped` entirely, so the gate never actually ran (see the comment on
      # the parsing loop).
      - name: Test with coverage
        id: cover
        continue-on-error: true
        run: |
          go test ./pkg/... -short -race -coverprofile=coverage.out -count=1 -timeout 600s \
            2>&1 | tee race-run.log
          exit "${PIPESTATUS[0]}"

      - name: Check per-package coverage
        id: coverage
        run: |
          THRESHOLD=90
          FAILED=""
          BROKEN=""
          REPORT=""

          # Per-package threshold overrides. A handful of packages are heavily
          # coupled to the live runtime (fixed /data,/proc,/var/run paths, real
          # github.com/platform.claude.com device-flow, a live tmux agent buffer,
          # an in-cluster k8s serviceaccount) and cannot be exercised hermetically
          # in CI without invasive production seams. They get a documented lower
          # floor so the gate still catches regressions below their real ceiling,
          # rather than blocking forever on untestable code. Raise these toward 90
          # as seams are added; do not add new entries without justification here.
          declare -A PKG_THRESHOLD=(
            [dashboard]=78   # ~20% is inception tmux watcher + copilot/claude device-flow + /data file I/O + k8s
            [hub]=89         # kubectl-shelling + live-GitHub paths; see #2355. Raise to 90 once seams land.
            [agent]=89       # pre-existing shortfall inherited from #2350, NOT a new regression. See #2355.
          )

          # Capture the full `go test -cover` output ONCE, then classify every
          # line. The previous version piped through `grep '^ok'`, which silently
          # dropped two categories that matter most:
          #
          #   FAIL  <pkg>                    -> a broken package scored nothing
          #   ?     <pkg> [no test files]    -> an untested package scored nothing
          #
          # Both were therefore incapable of failing the gate, so adding a
          # package with zero tests was the one guaranteed way to stay green.
          # They are now hard failures in their own right.
          go test -cover ./pkg/... -short -count=1 -timeout 600s 2>&1 | tee cover-run.log || true

          while IFS= read -r line; do
            case "$line" in
              ok*)
                pkg=$(echo "$line" | awk '{print $2}' | sed 's/.*\///')
                pct=$(echo "$line" | grep -o '[0-9]*\.[0-9]*%' | tr -d '%')
                if [ -z "$pct" ]; then continue; fi
                int_pct=$(echo "$pct" | cut -d. -f1)
                pkg_threshold=${PKG_THRESHOLD[$pkg]:-$THRESHOLD}
                if [ "$int_pct" -lt "$pkg_threshold" ]; then
                  FAILED="${FAILED}${pkg}: ${pct}% (floor ${pkg_threshold}%)\n"
                fi
                REPORT="${REPORT}${pkg}: ${pct}%\n"
                ;;
              FAIL*)
                pkg=$(echo "$line" | awk '{print $2}' | sed 's/.*\///')
                # Ignore the bare trailing "FAIL" summary line, which has no pkg.
                if [ -n "$pkg" ] && [ "$pkg" != "FAIL" ]; then
                  BROKEN="${BROKEN}${pkg}: TESTS FAILING\n"
                  REPORT="${REPORT}${pkg}: FAIL\n"
                fi
                ;;
              \?*)
                pkg=$(echo "$line" | awk '{print $2}' | sed 's/.*\///')
                BROKEN="${BROKEN}${pkg}: NO TEST FILES\n"
                REPORT="${REPORT}${pkg}: no tests\n"
                ;;
            esac
          done < cover-run.log

          TOTAL=$(go tool cover -func=coverage.out 2>/dev/null | grep '^total:' | awk '{print $3}')
          echo "Total coverage: ${TOTAL:-unavailable}"
          echo "total=${TOTAL:-unavailable}" >> "$GITHUB_OUTPUT"

          {
            echo "## Per-package coverage"
            echo ""
            echo -e "${REPORT}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$BROKEN" ] || [ -n "$FAILED" ]; then
            echo "below_threshold=true" >> "$GITHUB_OUTPUT"
            {
              [ -n "$BROKEN" ] && echo -e "### Packages that cannot be scored\n${BROKEN}"
              [ -n "$FAILED" ] && echo -e "### Packages below their floor\n${FAILED}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo -e "failed_packages<<EOF\n${BROKEN}${FAILED}EOF" >> "$GITHUB_OUTPUT"
            echo -e "full_report<<EOF\n${REPORT}EOF" >> "$GITHUB_OUTPUT"
            echo ""
            echo "COVERAGE GATE FAILED:"
            [ -n "$BROKEN" ] && echo -e "${BROKEN}"
            [ -n "$FAILED" ] && echo -e "${FAILED}"
            # Exit non-zero so the gate actually BLOCKS. The previous version
            # computed this report and then exited 0 regardless, so even a
            # correctly-detected shortfall never failed anything.
            exit 1
          fi

          echo "below_threshold=false" >> "$GITHUB_OUTPUT"
          echo "All packages meet their coverage floor" >> "$GITHUB_STEP_SUMMARY"

  create-issue-on-coverage-drop:
    # Scheduled runs only. The bare `failure()` here previously fired on ANY
    # job failure regardless of cause, which is why issue #2191 accumulated 41
    # comments titled "packages below 90% threshold" when the real cause was a
    # test failure aborting the run. Now that the gate also runs on
    # pull_request, an unscoped condition would additionally file an issue for
    # every contributor's red PR.
    if: always() && github.event_name == 'schedule' && needs.coverage.result != 'success'
    runs-on: ubuntu-latest
    needs: coverage
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create or update coverage issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.substring(0, 7);
            const title = `[Coverage] packages below 90% threshold`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-coverage',
              per_page: 10,
            });
            const dup = existing.data.find(i => i.title.startsWith('[Coverage]'));
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body: `Coverage still below threshold on \`${sha}\`: ${runUrl}`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `## Coverage Below Threshold\n\n- **Commit:** \`${context.sha}\`\n- **Run:** ${runUrl}\n- **Branch:** v2\n- **Threshold:** 90% per package\n\nOne or more packages dropped below the 90% coverage threshold. See the [workflow run](${runUrl}) for details.\n\nClose this issue when all packages are back above 90%.`,
              labels: ['ci-coverage', 'kind/bug'],
            });
