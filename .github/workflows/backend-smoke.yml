# Backend smoke — scheduled live canary for the contributor CLI backends.
#
# The vendor coding-agent CLIs hive drives (claude, codex) are an integration
# surface hive does not control: vendors ship updates on their own schedule,
# and what breaks is the seam — completion detection (#5376), CODEX_HOME
# handling (#5335), readiness regexes that matched nothing on real codex
# output. Every in-repo test pins that seam against captured fixtures, so a
# vendor change ships green and fails in production. This workflow runs
# bin/test_backend_smoke.sh — the real relay against a fake hub, driving the
# REAL backend CLI on a one-line task — on a schedule, and files a deduplicated
# issue when a backend integration breaks.
#
# Two lanes, deliberately, with distinct issue titles so their meanings never
# blur:
#   latest — installs the vendor's current CLI release on the runner. A red
#            here means vendor drift is incoming: the next pin bump will break,
#            but shipped images still work.
#   pinned — runs the suite inside ghcr.io/hivecommons/hive-contributor:latest,
#            against the CLI versions hive actually ships. A red here means
#            contributors are broken TODAY.
#
# This is the only workflow in the repo holding model credentials, which is
# exactly why it is its own file: the podman arm64 lane's documented contract
# is "no secrets", and nothing here may be folded into it. Credentials are
# scoped per matrix arm — claude arms never see codex credentials and vice
# versa — and come in two forms, either of which is sufficient:
#   ANTHROPIC_API_KEY / OPENAI_API_KEY — metered API keys; never expire, the
#     preferred form for an unattended schedule.
#   HIVE_SMOKE_CLAUDE_CREDENTIALS_B64 / HIVE_SMOKE_CODEX_AUTH_B64 — base64 of
#     a subscription login (~/.claude/.credentials.json from Claude Pro/Max,
#     ~/.codex/auth.json from a ChatGPT sign-in), for projects funding the
#     smoke from a flat-rate account instead. Two caveats, accepted: the OAuth
#     refresh chain rotates, so the stored secret goes stale eventually and a
#     maintainer re-captures it from a fresh login (the per-lane issue dedupe
#     keeps a stale-credential red from spamming the tracker); and the smoke
#     shares the account's rate limits with its human, so a heavy usage day
#     can red a run without a hive bug. API keys have neither problem.
#
# Cost control: 4 runs/day × 2 backends × 2 lanes × 2 single-turn calls on the
# cheapest model tier (haiku / mini). The suite's live task is one line with no
# file access. NOT merge-gating — the keyless subset of the same suite runs in
# v2-ci instead.
name: Backend smoke

on:
  schedule:
    # Every 6h at :45 — the :00 (coverage-hourly) and :30 (v2-tests) hourly
    # slots are taken, and the offsets are deliberate repo-wide.
    - cron: '45 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      backends:
        description: 'Space-separated backends to smoke'
        default: 'claude codex'
        type: string
      lane:
        description: 'Which lane(s) to run'
        type: choice
        options: [both, latest, pinned]
        default: 'both'

permissions:
  contents: read

concurrency:
  group: backend-smoke
  cancel-in-progress: false

jobs:
  smoke:
    # Forks have no model credentials; a scheduled run there would only
    # produce a permanently red workflow.
    # Match BOTH homes: the repo is moving hivecommons/hive → hivecommons/hive
    # (split-consensus + CNCF Sandbox prep). An equality guard on the old name
    # would make this job skip SILENTLY on transfer day — smoke coverage gone
    # with no red anywhere. Both names listed explicitly (rather than
    # github.repository_owner) so forks still skip as before.
    if: github.repository == 'hivecommons/hive' || github.repository == 'hivecommons/hive'
    # PER-LANE RUNNER (#5883). #5862 moved this workflow to the self-hosted
    # fleet to relieve the hosted-runner queue, and kept the image-heavy jobs
    # (docker, overlayfs-exec-guard) on ubuntu-latest for exactly the reason
    # that applies here too — the fleet image is not built to pull and run
    # container images. The PINNED lane is image-heavy by definition: it runs
    # the suite INSIDE ghcr.io/hivecommons/hive-contributor, so it needs podman
    # on the runner, and the fleet has none. Every scheduled run failed at the
    # pull step in ~7s with `podman: command not found` (exit 127).
    #
    # The LATEST lane is not image-heavy — node, tmux and an npm-installed CLI
    # on the bare runner — and passes on the fleet today, so it stays there and
    # keeps the queue relief #5862 was after.
    #
    # `runs-on` can read the matrix context (the job-level `if` cannot — see the
    # note on the lane list below), so the split is expressed here rather than
    # by forking the job.
    runs-on: ${{ matrix.lane == 'pinned' && 'ubuntu-latest' || fromJSON('["self-hosted","hive"]') }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        backend: [claude, codex]
        # The dispatch lane filter lives HERE, not in the job-level `if`: that
        # `if` is evaluated before the matrix expands, so `matrix` is not in
        # scope there and GitHub rejects the whole file (#5550). Selecting the
        # lane list up front also means an unwanted lane never schedules a
        # runner at all, rather than starting one that immediately no-ops.
        lane: >-
          ${{ (github.event_name == 'workflow_dispatch' && inputs.lane != 'both')
              && fromJSON(format('["{0}"]', inputs.lane))
              || fromJSON('["latest","pinned"]') }}
    env:
      # Per-arm credential scoping: each backend arm gets only its own
      # vendor's credential, in whichever form the repo provisioned (see the
      # header). The suite prefers the API key when both are set.
      ANTHROPIC_API_KEY: ${{ matrix.backend == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
      OPENAI_API_KEY: ${{ matrix.backend == 'codex' && secrets.OPENAI_API_KEY || '' }}
      HIVE_SMOKE_CLAUDE_CREDENTIALS_B64: ${{ matrix.backend == 'claude' && secrets.HIVE_SMOKE_CLAUDE_CREDENTIALS_B64 || '' }}
      HIVE_SMOKE_CODEX_AUTH_B64: ${{ matrix.backend == 'codex' && secrets.HIVE_SMOKE_CODEX_AUTH_B64 || '' }}
      SMOKE_BACKENDS: ${{ github.event_name == 'workflow_dispatch' && inputs.backends || 'claude codex' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restrict to this arm's backend
        id: scope
        run: |
          # The matrix already splits by backend; intersect with the dispatch
          # input so `backends: claude` skips the codex arms cleanly.
          case " ${SMOKE_BACKENDS} " in
            *" ${{ matrix.backend }} "*) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # ── latest lane: current vendor releases on the bare runner ────────────
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.scope.outputs.run == 'true' && matrix.lane == 'latest'
        with:
          node-version: '22'

      - name: Install tmux and the latest ${{ matrix.backend }} CLI
        if: steps.scope.outputs.run == 'true' && matrix.lane == 'latest'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tmux
          case "${{ matrix.backend }}" in
            claude) npm install -g @anthropic-ai/claude-code@latest ;;
            codex)  npm install -g @openai/codex@latest ;;
          esac

      - name: Backend smoke (latest ${{ matrix.backend }})
        if: steps.scope.outputs.run == 'true' && matrix.lane == 'latest'
        run: |
          HIVE_TEST_REQUIRE_BACKEND_SMOKE=1 \
          HIVE_SMOKE_BACKENDS='${{ matrix.backend }}' \
            bash bin/test_backend_smoke.sh |& tee smoke.log

      # ── pinned lane: the CLI versions hive ships, inside the image ─────────
      # A missing container engine is an ENVIRONMENT fault, and it has to say so
      # itself (#5883). Without this step the lane died on a bare
      # `podman: command not found` / exit 127, and the failure-issue job then
      # announced that "the CLI versions hive SHIPS in the contributor image
      # failed the smoke — contributors are likely broken right now" — about a
      # suite that never executed. Naming the real cause here, and writing it
      # into smoke.log so the evidence artifact is not empty, is what lets the
      # issue job tell the two apart.
      - name: Require a container engine
        if: steps.scope.outputs.run == 'true' && matrix.lane == 'pinned'
        run: |
          if command -v podman >/dev/null 2>&1; then
            podman --version
            exit 0
          fi
          {
            echo "SUITE DID NOT RUN — this runner has no container engine."
            echo
            echo "The pinned lane runs the smoke INSIDE"
            echo "ghcr.io/hivecommons/hive-contributor, so it needs podman on the"
            echo "runner. Nothing here says anything about the shipped CLIs."
            echo
            echo "Runner: ${RUNNER_NAME:-unknown} (${RUNNER_OS:-unknown}, ${RUNNER_ARCH:-unknown})"
          } | tee smoke.log
          echo "::error::the pinned backend-smoke lane needs podman and this runner has none, so the smoke did not run — this says nothing about the CLIs hive ships (#5883)"
          exit 1

      - name: Pull the contributor image
        if: steps.scope.outputs.run == 'true' && matrix.lane == 'pinned'
        run: podman pull ghcr.io/hivecommons/hive-contributor:latest

      - name: Backend smoke (pinned ${{ matrix.backend }}, in-container)
        if: steps.scope.outputs.run == 'true' && matrix.lane == 'pinned'
        run: |
          # The CHECKOUT's suite and relay run against the IMAGE's pinned CLI
          # binaries. Secrets are forwarded by name only — never in argv.
          podman run --rm --entrypoint /bin/bash \
            -e HIVE_TEST_REQUIRE_BACKEND_SMOKE=1 \
            -e HIVE_SMOKE_BACKENDS='${{ matrix.backend }}' \
            -e ANTHROPIC_API_KEY \
            -e OPENAI_API_KEY \
            -e HIVE_SMOKE_CLAUDE_CREDENTIALS_B64 \
            -e HIVE_SMOKE_CODEX_AUTH_B64 \
            -v "${GITHUB_WORKSPACE}:/opt/hive-src:ro,Z" \
            ghcr.io/hivecommons/hive-contributor:latest \
            -lc 'bash /opt/hive-src/bin/test_backend_smoke.sh' |& tee smoke.log

      - name: Upload evidence
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-smoke-${{ matrix.backend }}-${{ matrix.lane }}
          path: smoke.log
          if-no-files-found: ignore

  create-issue-on-failure:
    # Schedule-gated, like coverage-hourly and v2-tests: a red triage dispatch
    # must never file (the unscoped version of this gate gave issue #2191 a
    # 41-comment pileup). Dedupe is per LANE — "vendor drift incoming" and
    # "contributors broken today" are different problems with different
    # urgency, and must never collapse into one issue thread.
    if: failure() && github.event_name == 'schedule'
    runs-on: [self-hosted, hive]
    needs: [smoke]
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: File or update per-lane issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.substring(0, 7);

            // Which matrix arms actually failed — job names look like
            // "smoke (claude, latest)".
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            // A failed ARM and a failed SUITE are not the same thing (#5883).
            // The suite runs in the step named "Backend smoke (...)"; anything
            // that fails before it — a missing container engine, a checkout, an
            // image pull — means the smoke never executed, so nothing was
            // learned about the CLIs. Reporting that as "contributors are
            // likely broken right now" is a false accusation, and it is what
            // this job did on the day the workflow moved to the self-hosted
            // fleet: the runner had no podman, the lane died at the pull step
            // in 7s, and the issue blamed the shipped CLIs.
            //
            // The step list is already in the payload fetched above, so telling
            // them apart costs no extra API call.
            const failed = jobs
              .filter(j => j.name.startsWith('smoke (') && j.conclusion === 'failure')
              .map(j => {
                const m = j.name.match(/^smoke \(([^,]+), ([^)]+)\)$/);
                if (!m) return null;
                const steps = j.steps || [];
                const suiteRan = steps.some(
                  s => s.name.startsWith('Backend smoke') && s.conclusion === 'failure');
                // Name the step that actually broke, so an environment failure
                // is actionable without opening the run.
                const brokeAt = (steps.find(s => s.conclusion === 'failure') || {}).name || 'an unknown step';
                return { backend: m[1], lane: m[2], suiteRan, brokeAt };
              })
              .filter(Boolean);
            if (failed.length === 0) return;

            // Dedupe splits on the same principle the lane split already uses:
            // "the shipped CLIs are broken" and "the runner could not start the
            // suite" have different owners and different urgency, so they must
            // not pile into one thread either.
            const lanes = [...new Set(failed.map(f => `${f.lane}\u0000${f.suiteRan ? 'suite' : 'env'}`))];
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'backend-smoke',
              per_page: 20,
            });

            for (const key of lanes) {
              const [lane, kind] = key.split('\u0000');
              const suiteRan = kind === 'suite';
              const arms = failed.filter(f => f.lane === lane && (f.suiteRan ? 'suite' : 'env') === kind);
              const backends = arms.map(f => f.backend);
              const prefix = suiteRan
                ? `[Backend smoke: ${lane}]`
                : `[Backend smoke: ${lane} — environment]`;
              const brokeAt = [...new Set(arms.map(f => f.brokeAt))].join(', ');
              const meaning = !suiteRan
                ? `The smoke DID NOT RUN: the job failed at **${brokeAt}**, before the suite started. `
                  + 'This says nothing about the CLIs hive ships or about the vendor releases — it is a '
                  + 'runner/environment fault, and the fix belongs to whoever owns the runner, not to the '
                  + 'backend integration.'
                : lane === 'pinned'
                ? 'The CLI versions hive SHIPS in the contributor image failed the smoke — contributors are likely broken right now.'
                : "The vendor's LATEST CLI release failed the smoke against hive's relay — shipped images still work, but the next pin bump will break. Fix the integration before bumping.";
              const dup = existing.data.find(i => i.title.startsWith(prefix));
              if (dup) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: dup.number,
                  body: `Another scheduled failure (${backends.join(', ')}) on \`${sha}\`: ${runUrl}`,
                });
                continue;
              }
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${prefix} ${backends.join(', ')} failure on ${sha}`,
                body: [
                  '## Backend smoke failure',
                  '',
                  `- **Lane:** ${lane}`,
                  `- **Backend(s):** ${backends.join(', ')}`,
                  `- **Commit:** \`${context.sha}\``,
                  `- **Run:** ${runUrl}`,
                  '',
                  meaning,
                  '',
                  suiteRan
                    ? 'The run log carries the suite\'s evidence block (relay log tail, fake-hub '
                      + 'wire messages, tmux pane capture) for each failed scenario, and the '
                      + '`backend-smoke-<backend>-<lane>` artifact holds the full suite output.'
                    : 'There is no suite evidence to read — the run stopped before the suite '
                      + 'produced any. The run log shows the failing step.',
                ].join('\n'),
                labels: ['backend-smoke', 'ci-failure', 'kind/bug'],
              });
            }
