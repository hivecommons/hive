      run: "set -o pipefail\nif [ -z \"$PKGS\" ]; then\n  echo \"::error::empty package bucket \u2014 failing closed\"\n  exit 1\nfi\n# -timeout=20m: kept from when pkg/dashboard lived in these buckets\n# and nearly exhausted go test's default 10m on loaded PR runners\n# (#12113); a loaded runner can still stretch pkg/hub/spoke.\nSHUFFLE=\"\"\nif [ \"$GITHUB_EVENT_NAME\" != \"pull_request\" ]; then SHUFFLE=\"-shuffle=on\"; fi\n# shellcheck disable=SC2086 # PKGS and SHUFFLE are deliberate word-split lists\nbash \"$GITHUB_WORKSPACE/.github/scripts/ci-gotestsum-preserve-coverprofile.sh\" \\\n  gotestsum --format=standard-verbose --rerun-fails=2 --rerun-fails-max-failures=5 \\\n  --rerun-fails-report=flaky-tests-rest-${{ matrix.idx }}.txt \\\n  --packages=\"$PKGS\" --junitfile junit-rest-${{ matrix.idx }}.xml \\\n  -- -short -race -count=1 -timeout=20m -v $SHUFFLE -coverprofile=coverage-rest-${{ matrix.idx }}.out \\\n  2>&1 | grep --line-buffered -vE '^=== (RUN|PAUSE|CONT) ' | tee test-rest-${{ matrix.idx }}.log\n"
    - name: Surface flaky reruns
