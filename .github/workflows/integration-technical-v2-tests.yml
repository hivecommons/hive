S in\n      # affected-go-packages.sh); a failure here falls back to the\n      # unnarrowed selection.\n      if go list ./crux/... \\\n           ./internal/... ./pkg/config ./pkg/rotation > ../crux-pkgs.txt 2>/dev/null \\\n         && [ -s ../crux-pkgs.txt ]; then\n        grep -Fx -f ../crux-pkgs.txt \"$sel\" > \"$sel.crux\" || true\n        echo \"crux-only diff: narrowing $(grep -c . \"$sel\" || true) selected packages to $(grep -c . \"$sel.crux\" || true) Crux/always-on packages; hub, dashboard and scheduler slices and the dashboard shuffle lane will not run\"\n        mv \"$sel.crux\" \"$sel\"\n      else\n        echo \"::warning::crux-only diff but go list of the Crux set failed; keeping the unnarrowed selection\"\n        crux_scope=mixed\n      fi\n      ;;\n    none)\n      # Drop crux/agent from the selection too: the coverage job\n      # requires every selected package to have produced a result,\n      # and the agent slices are the only lane that tests it.\n      run_agent=false\n      grep -Fxv \"$mod/crux/agent\" \"$sel\" > \"$sel.nocrux\" || true\n      mv \"$sel.nocrux\" \"$sel\"\n      echo \"no Crux package changed: agent slices will not run\"\n      ;;\n    mixed|full) ;;\n    *)\n      echo \"::warning::unexpected crux-scope verdict '$crux_scope'; treating as mixed\"\n      crux_scope=mixed\n      ;;\n  esac\nfi\n{\n  echo \"selection=$selection\"\n  echo \"selected=$(paste -sd' ' \"$sel\")\"\n  echo \"run-hub=$run_hub\"\n  echo \"run-agent=$run_agent\"\n  echo \"run-dashboard=$run_dashboard\"\n  echo \"run-scheduler=$run_scheduler\"\n  echo \"crux-scope=$crux_scope\"\n} >> \"$GITHUB_OUTPUT\"\n{\n  echo \"## Go test selection\"\n  echo \"\"\n  if [ \"$selection\" = full ]; then\n    echo \"Full suite.\"\n  else\n    echo \"Affected packages only ($(grep -c . \"$sel\" || true)); crux-scope=$crux_scope; hub=$run_hub agent=$run_agent dashboard=$run_dashboard scheduler=$run_scheduler.\"\n    echo \"\"\n    sed 's/^/- /' \"$sel\"\n  fi\n} >> \"$GITHUB_STEP_SUMMARY\"\necho \"selection=$selection crux-scope=$crux_scope hub=$run_hub agent=$run_agent dashboard=$run_dashboard scheduler=$run_scheduler\"\n"
    - name: Partition packages into balanced buckets
      id: partition
      run: "R=4\n# Drop only the monolithic packages that have function-sliced jobs\n# of their own: pkg/hub (test-hub), pkg/dashboard and pkg/scheduler\n# (test-sliced). All their subpackages belong in the rest buckets\n# so coverage floors and the no-test-files gate apply to them too.\n# pkg/hubbackup, pkg/dashboard/webstatic et al. stay here.\n# ./internal/... carries the shared test helpers (internal/testutil)\n# and their contract tests, such as the time.Sleep ratchet in\n# sleep_ratchet_test.go. ./crux/... is the nested Crux module\n# (#13536), reachable from src/ through src/go.work; its manager\n# package crux/agent has the dedicated agent slices.\ngo list ./pkg/... ./cmd/... ./internal/... ./crux/... \\\n  | awk '$0 == \"github.com/hivecommons/hive/pkg/hub\" { next }\n         $0 == \"github.com/hivecommons/hive/pkg/dashboard\" { next }\n         $0 == \"github.com/hivecommons/hive/pkg/scheduler\" { next }\n         { print }' \\\n  | grep -Ev '^github\\.com/hivecommons/hive/crux/agent$' \\\n  | LC_ALL=C sort > rest-pkgs.txt\nif [ ! -s rest-pkgs.txt ]; then\n  echo \"::error::go list produced no rest packages \u2014 failing closed\"\n  exit 1\nfi\n# Affected-package selection narrows membership only after the\n# fail-closed check above ran on the full list. The bucket count\n# stays R, so every `test (rest i/R)` context still reports; a\n# bucket left empty succeeds without running (see test-rest).\nif [ \"$(head -n1 ../affected-pkgs.txt)\" != all ]; then\n  grep -Fx -f ../affected-pkgs.txt rest-pkgs.txt > rest-selected.txt || true\n  echo \"affected-package selection: $(wc -l < rest-selected.txt) of $(wc -l < rest-pkgs.txt) rest packages\"\n  mv rest-selected.txt rest-pkgs.txt\nfi\n\n# Weights = measured -short -race package wall seconds on the\n# hive-runners fleet, mean of two v5 push runs (40383615331 and\n# 40382244011, 2026-10-26, rounded). Re-measure with: for each\n# `test (rest i/R)` job log, grep the\n# `ok  github.com/hivecommons/hive/<pkg>  <N>s` lines. Anything\n# under ~5s is noise and takes the 1s default. Packages inside a\n# bucket run concurrently under one go test, so a bucket's wall\n# clock is its heaviest package plus compile time \u2014 the table\n# mainly has to keep the big ones apart, and the sum-based greedy\n# below does that while spreading the compile load. pkg/hub/spoke\n# is the floor now that pkg/dashboard and pkg/scheduler are sliced\n# (test-sliced above): the widest bucket can never be faster than\n# it. pkg/dashboard and pkg/scheduler are listed so a stale\n# exclusion above still yields a sane partition. pkg/github is\n# ~1s with ~1% coverage on push runs but 70s on pull requests (PR\n# 14407's run 40387365403), where it is weighed \u2014 measure it from a\n# PR run, not a push run.\nweight() {\n  case \"$1\" in\n    */pkg/dashboard)  echo 219 ;;\n    */pkg/scheduler)  echo 199 ;;\n    */pkg/hub/spoke)  echo 85 ;;\n    */pkg/config)     echo 82 ;;\n    */pkg/github)     echo 70 ;;\n    */cmd/hive)       echo 69 ;;\n    */crux/proxy)     echo 56 ;;\n    */pkg/dashboard/webstatic) echo 35 ;;\n    */pkg/hubbackup)  echo 30 ;;\n    */pkg/advisory)   echo 29 ;;\n    */internal/testutil) echo 22 ;;\n    */pkg/ioscan)     echo 16 ;;\n    */pkg/hivectl)    echo 15 ;;\n    */pkg/tui)        echo 14 ;;\n    */pkg/discord)    echo 12 ;;\n    */pkg/fleetreport) echo 11 ;;\n    */pkg/hivectl/commands) echo 10 ;;\n    */pkg/stageengine) echo 10 ;;\n    */pkg/apphealth)  echo 9 ;;\n    */pkg/rotation)   echo 9 ;;\n    */pkg/beads)      echo 8 ;;\n    */pkg/github/automerge) echo 8 ;;\n    */crux/api/callback) echo 6 ;;\n    */crux/inference) echo 6 ;;\n    */cmd/hive-backup) echo 5 ;;\n    */pkg/mint)       echo 5 ;;\n    */pkg/policies)   echo 5 ;;\n    *)                echo 1  ;;\n  esac\n}\n\n# Deterministic greedy LPT: stable-sort by weight desc (name asc on\n# ties), assign each package to the currently lightest bucket\n# (lowest index on ties).\nwhile read -r p; do\n  echo \"$(weight \"$p\") $p\"\ndone < rest-pkgs.txt | sort -k1,1nr -k2,2 > weighted.txt\n\ndeclare -a LOAD BUCKET\nfor ((i=0; i<R; i++)); do LOAD[i]=0; BUCKET[i]=\"\"; done\nwhile read -r w p; do\n  best=0\n  for ((i=1; i<R; i++)); do\n    if [ \"${LOAD[i]}\" -lt \"${LOAD[best]}\" ]; then best=$i; fi\n  done\n  BUCKET[best]=\"${BUCKET[best]} $p\"\n  LOAD[best]=$(( LOAD[best] + w ))\ndone < weighted.txt\n\nINCLUDE=\"\"\nfor ((i=0; i<R; i++)); do\n  pkgs=\"${BUCKET[i]# }\"\n  echo \"bucket $((i+1))/$R (weight ${LOAD[i]}): $pkgs\"\n  [ -n \"$INCLUDE\" ] && INCLUDE=\"$INCLUDE,\"\n  INCLUDE=\"$INCLUDE{\\\"idx\\\":$((i+1)),\\\"total\\\":$R,\\\"pkgs\\\":\\\"$pkgs\\\"}\"\ndone\necho \"matrix={\\\"include\\\":[$INCLUDE]}\" >> \"$GITHUB_OUTPUT\"\n"
  test-rest:
    if: ${{ (needs.required-context-scope.result != 'success' || needs.required-context-scope.outputs.run-tests == 'true') && !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-gate/')) }}
    name: test (rest ${{ matrix.idx }}/${{ matrix.total }})
    needs:
    - required-context-scope
    - list-packages
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.list-packages.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src
    steps:
    - name: Affected-package selection
      id: select
      working-directory: .
      env:
        SELECTION: ${{ needs.list-packages.outputs.selection }}
        PKGS: ${{ matrix.pkgs }}
      run: |
        if [ "$SELECTION" = partial ] && [ -z "$PKGS" ]; then
          echo "Affected-package selection: no affected package landed in this bucket; reporting success without running tests. Push and scheduled runs test it in full."
          echo "run=false" >> "$GITHUB_OUTPUT"
        else
          echo "run=true" >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      if: steps.select.outputs.run == 'true'
