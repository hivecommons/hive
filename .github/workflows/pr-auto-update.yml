name: Post-merge PR Auto-update

on:
  push:
    branches: [v5, v6]
  issues:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  update-open-prs:
    if: github.event_name == 'push' || github.event.issue.state_reason != 'not_planned'
    runs-on: ${{ fromJSON(vars.HIVE_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Update stale open PR branches
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          # A PR's exact marker is the durable record that this issue was a
          # shared-CI incident; no new label taxonomy is required.
          SHARED_CI_INCIDENT: ${{ github.event_name == 'issues' && github.event.issue.number || '' }}
        run: .github/scripts/pr-auto-update.sh
