name: Prune GHCR untagged images

# Docker builds push per-arch digests and attestation manifests that become
# untagged once the <branch>-latest manifest list is created. These orphaned
# versions accumulate fast (thousands/day) and bury the real -latest tags in
# the registry tag list. Prune old UNTAGGED versions only; never touch tagged
# ones (v2-latest, v3-latest, mk-latest, SHA tags, and their live per-arch
# children are all tagged/referenced and thus spared).
#
# NOTE: deleting org-owned package versions requires a PAT (classic) with the
# `delete:packages` scope, stored as secret GHCR_PRUNE_TOKEN. The default
# GITHUB_TOKEN cannot delete versions of an organization package.
on:
  schedule:
    - cron: '17 4 * * *'   # daily, 04:17 UTC — off-peak
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be deleted without deleting'
        type: boolean
        default: true

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Prune untagged hive images
        # v3.1.0+ AUTOMATICALLY protects per-architecture child manifests that
        # are referenced by a tagged multi-arch manifest list (fail-closed: if
        # it can't read a tag's manifest it skips deletion entirely). v3.0.0 did
        # NOT — with tag-selection: untagged it deleted the arm64/amd64 children
        # of live tagged images (only the manifest LIST is tagged; its per-arch
        # children are untagged), which left every -latest / SHA tag dangling and
        # made fresh multi-arch pulls fail with "manifest unknown" (404) on the
        # child. Cached images kept running, which masked it, but any new node /
        # fresh pull broke daily right after this 04:17 UTC prune. Do NOT pin
        # back below v3.1.0.
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: kubestellar
          token: ${{ secrets.GHCR_PRUNE_TOKEN }}
          image-names: "hive hive-hub hive-contributor"
          tag-selection: untagged
          cut-off: 3h              # untagged digests are unreachable by name; only
                                  # spare the last few hours so an in-flight build's
                                  # per-arch children aren't deleted before their
                                  # manifest list is created. (Belt-and-suspenders
                                  # on top of the v3.1.0 multi-arch protection.)
          dry-run: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}

  # Prune <branch>-latest tags whose branch no longer exists. The docker
  # workflow now only pushes images for long-lived branches, but tags from
  # branches that WERE built before that policy (and merged+deleted) linger as
  # dead-end targets in the hub's branch switcher. This removes any *-latest
  # tag with no matching live branch, sparing SHA tags (7 hex chars) and the
  # long-lived branches themselves.
  prune-orphan-branch-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Delete orphaned <branch>-latest tags
        env:
          GH_TOKEN: ${{ secrets.GHCR_PRUNE_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
        run: |
          set -euo pipefail
          # Live branch names -> their sanitized tag form (/ -> -), the same
          # transform the docker workflow applies to build <branch>-latest.
          mapfile -t BRANCHES < <(
            gh api --paginate /repos/kubestellar/hive/branches --jq '.[].name'
          )
          declare -A LIVE
          for b in "${BRANCHES[@]}"; do LIVE["${b//\//-}"]=1; done
          echo "Live branches: ${#LIVE[@]}"

          for image in hive hive-hub hive-contributor; do
            echo "=== image: $image ==="
            # A <branch>-latest tag and its <sha> tag share ONE version (the
            # docker workflow tags the manifest with both). GHCR can only delete
            # a whole version, not an individual tag — so the co-located SHA tag
            # must NOT block deletion (the PR-branch SHA is itself orphaned once
            # the branch is squash-merged). The rule:
            #   * version has >=1 <branch>-latest tag AND every such tag's branch
            #     is dead  -> DELETE (spares v2-latest / v3-latest / mk-latest,
            #     whose branches are live).
            #   * version has NO -latest tag (pure SHA) -> KEEP (may be pinned;
            #     small; untagged pruning handles genuine garbage).
            gh api --paginate \
              "/orgs/kubestellar/packages/container/$image/versions" \
              --jq '.[] | {id: .id, tags: .metadata.container.tags}' \
            | jq -c '.' | while read -r row; do
                id=$(echo "$row" | jq -r '.id')
                tags=$(echo "$row" | jq -r '.tags[]?')
                [ -z "$tags" ] && continue
                has_latest=false
                all_latest_dead=true
                while IFS= read -r t; do
                  case "$t" in
                    *-latest)
                      has_latest=true
                      base="${t%-latest}"
                      [ -n "${LIVE[$base]:-}" ] && all_latest_dead=false ;;
                  esac
                done <<< "$tags"
                if [ "$has_latest" = true ] && [ "$all_latest_dead" = true ]; then
                  echo "orphan version $id tags=[$(echo "$tags" | tr '\n' ',')]"
                  if [ "$DRY_RUN" != "true" ]; then
                    gh api -X DELETE \
                      "/orgs/kubestellar/packages/container/$image/versions/$id" \
                      && echo "  deleted $id" || echo "  FAILED $id"
                  fi
                fi
              done
          done
          [ "$DRY_RUN" = "true" ] && echo "(dry-run: nothing deleted above)" || true
