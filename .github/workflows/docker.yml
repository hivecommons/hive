name: Build and Push Docker Image

on:
  push:
    # Run on every branch so a PR's image still BUILDS as a CI gate (proving it
    # compiles), but only long-lived branches PUSH to GHCR — see the "Push
    # policy" step below. Exclude bot branches so dependency PRs don't consume
    # image CI; they build on the base branch when merged.
    branches:
      - '**'
      - '!dependabot/**'
      - '!copilot/**'
  workflow_dispatch:

# Serialize Docker builds per branch so concurrent merges don't race. Do NOT
# cancel in-progress builds: on a fast-merging release branch (v2 saw ~34 merges
# in 2h), cancel-in-progress meant every build was killed by the next merge and
# NONE ever completed, freezing <branch>-latest and blocking all deploys. With
# cancel-in-progress:false the builds queue and each runs to completion, so
# <branch>-latest always advances to the newest merged commit.
concurrency:
  group: docker-build-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Decide once whether this run pushes images to GHCR, and expose it as an
  # output every other job consumes (needs.gate.outputs.push). Only long-lived
  # branches that a hive can be assigned to via the hub's branch switcher push:
  # the release lines and standing experimental branches. Every OTHER branch
  # still BUILDS (the image is a per-PR CI gate) but does not push — otherwise a
  # temporary PR branch leaves an orphaned <branch>-latest tag on GHCR when it
  # merges and is deleted. workflow_dispatch always pushes so a throwaway branch
  # can be published for a hive on demand before merge.
  #
  # The long-lived branch set is defined ONCE below (LONG_LIVED). To add or
  # remove one, edit only that list — the whole workflow derives from this job's
  # output, so nothing else changes.
  gate:
    runs-on: ubuntu-latest
    outputs:
      push: ${{ steps.decide.outputs.push }}
    steps:
      - name: Decide push policy
        id: decide
        env:
          LONG_LIVED: "v2 v4 mk dd"
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          push=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            push=true
          else
            for b in $LONG_LIVED; do
              if [ "$b" = "$REF_NAME" ]; then push=true; break; fi
            done
          fi
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "Push to GHCR: $push (branch=$REF_NAME event=$EVENT)"

  build:
    needs: gate
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Platform slug
        id: slug
        run: echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      # src/Dockerfile's Go steps use BuildKit cache mounts (id=hive-go-build /
      # hive-go-mod) so the always-re-executed compile (no-cache-filters, the
      # #3760 defense) is incremental instead of from-scratch. Cache MOUNT
      # contents are NOT transported by cache-from/cache-to type=gha — the gha
      # backend only carries layer cache (moby/buildkit#1512) — so on an
      # ephemeral runner the mounts would start empty every build. Persist them
      # with actions/cache plus the inject/extract helper builds below.
      # Key on the commit with a slug-scoped restore-key so every build saves
      # its warmed cache and the next one starts from the newest prior state.
      - name: Restore Go compile caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/gocache
          key: docker-gocache-${{ steps.slug.outputs.slug }}-${{ github.sha }}
          restore-keys: |
            docker-gocache-${{ steps.slug.outputs.slug }}-

      # Copy the restored host directories INTO the builder's cache mounts.
      # Uses the same digest-pinned golang image as src/Dockerfile's builder
      # stage (no new supply-chain surface). --no-cache: these two throwaway
      # builds must always execute; the cache mounts themselves are unaffected
      # by layer-cache settings. continue-on-error: this is a pure
      # optimization — if injection breaks, the mounts start empty and the
      # build is merely slower, so it must never block publishing an image.
      - name: Inject Go caches into BuildKit cache mounts
        continue-on-error: true
        run: |
          mkdir -p "${{ runner.temp }}/gocache/go-build" "${{ runner.temp }}/gocache/go-mod"
          docker buildx build --no-cache --file - "${{ runner.temp }}/gocache" <<'EOF'
          FROM golang:1.26-alpine@sha256:3889b425f035be855a72fb4755265311293b6d414521f0a519d819df32222d83
          COPY . /cache-in
          RUN --mount=type=cache,id=hive-go-build,target=/cache/go-build \
              --mount=type=cache,id=hive-go-mod,target=/cache/go-mod \
              cp -a /cache-in/go-build/. /cache/go-build/ && \
              cp -a /cache-in/go-mod/. /cache/go-mod/
          EOF

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_HASH=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          # STALE-BINARY FIX (unblocks the #3760 fix in the SHIPPED image).
          # The GHA cache scope below is keyed on the platform slug only
          # (linux-amd64 / linux-arm64), NOT the commit — so it persists across
          # every commit on the branch. `no-cache-filters: builder` alone rebuilt
          # a fresh /hive in the `builder` stage but let BuildKit serve the FINAL
          # (`runtime`) stage's `COPY --from=builder /hive` layer AND the
          # subsequent fresh-inode rewrite RUN from that persistent cache — so the
          # rebuilt binary was thrown away and the OLD binary (e.g. commit
          # 4d9c11c) shipped even though the manifest digest advanced. Listing the
          # `runtime` stage too forces those binary-bearing layers to re-run every
          # build, so the published /usr/local/bin/hive always matches HEAD.
          no-cache-filters: builder,runtime
          # #3760: DO NOT attach provenance/SBOM attestations. build-push-action
          # adds them by DEFAULT, and an attestation can only be carried by an
          # OCI image *index* — so the per-arch digest we push becomes
          # application/vnd.oci.image.index.v1+json instead of a plain image
          # manifest. That is exactly the OCI-index form the reporter measured on
          # the crash-looping image (his working fork build, same v4 code, is a
          # plain gzip-layer manifest and execs everywhere). The attestation/OCI-
          # index build path is what lets a COPY --from layer ship an overlayfs
          # metacopy redirect for /usr/local/bin/hive, which containerd/k3s and
          # rootless podman present as non-executable at the image path until
          # copy-up (a plain `cp` to any other path clears it). Forcing plain
          # image manifests removes that trigger. See the in-final-stage rewrite
          # in src/Dockerfile for the belt-and-suspenders defense.
          provenance: false
          sbom: false
          # Push the per-arch digest only for long-lived branches; on a PR
          # branch build without pushing so the image is still validated (CI
          # gate) but nothing lands on GHCR.
          outputs: type=image,name=ghcr.io/kubestellar/hive,push-by-digest=true,name-canonical=true,push=${{ needs.gate.outputs.push }},oci-mediatypes=false
          cache-from: type=gha,scope=${{ steps.slug.outputs.slug }}
          cache-to: type=gha,scope=${{ steps.slug.outputs.slug }},mode=max

      # Copy the (now warmed) cache mounts back OUT to the host so the
      # actions/cache post step persists them for the next build. Runs before
      # the freshness probe so a probe failure still saves the compile cache.
      # continue-on-error: cache plumbing must never block publishing.
      - name: Extract Go caches from BuildKit cache mounts
        continue-on-error: true
        run: |
          rm -rf "${{ runner.temp }}/gocache" && mkdir -p "${{ runner.temp }}/gocache"
          docker buildx build --no-cache --file - --output "type=local,dest=${{ runner.temp }}/gocache" "${{ runner.temp }}/gocache" <<'EOF'
          FROM golang:1.26-alpine@sha256:3889b425f035be855a72fb4755265311293b6d414521f0a519d819df32222d83 AS collect
          RUN --mount=type=cache,id=hive-go-build,target=/cache/go-build \
              --mount=type=cache,id=hive-go-mod,target=/cache/go-mod \
              mkdir -p /out/go-build /out/go-mod && \
              cp -a /cache/go-build/. /out/go-build/ && \
              cp -a /cache/go-mod/. /out/go-mod/
          FROM scratch
          COPY --from=collect /out/ /
          EOF

      # FRESHNESS ASSERTION (#3760 regression guard): run the image this job
      # just produced and assert the ldflags-embedded commit equals the commit
      # being built. `hive --version` prints "hive 3.0.0 (commit <short7>,
      # branch <b>)" where <short7> is baked from /repo/.git at compile time.
      #
      # - push builds: probe the EXACT pushed artifact by digest — the most
      #   direct possible evidence that what landed on GHCR is fresh.
      # - PR builds (push=false): nothing is pushed and push-by-digest output
      #   doesn't load into the local daemon, so re-run the build with --load.
      #   On this same builder every layer of the forced-fresh build above is
      #   in local cache, so the rebuild is seconds and yields those exact
      #   layers. If BuildKit ever resolved a STALE binary layer instead, the
      #   embedded hash would differ from github.sha and this step fails loudly
      #   — a stale layer can make this check fail, never silently pass.
      - name: Assert embedded commit matches build (freshness guard)
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ needs.gate.outputs.push }}" = "true" ]; then
            IMG="ghcr.io/kubestellar/hive@${{ steps.build.outputs.digest }}"
            docker pull "$IMG"
          else
            IMG=hive-freshness-probe:local
            docker buildx build --load \
              -f src/Dockerfile \
              --build-arg GIT_HASH="$EXPECTED_SHA" \
              --build-arg GIT_BRANCH="${{ github.ref_name }}" \
              -t "$IMG" .
          fi
          ACTUAL=$(docker run --rm --entrypoint /usr/local/bin/hive "$IMG" --version)
          echo "image reports: $ACTUAL"
          echo "expected commit: ${EXPECTED_SHA::7} (from $EXPECTED_SHA)"
          case "$ACTUAL" in
            *"commit ${EXPECTED_SHA::7},"*)
              echo "Freshness OK: embedded commit matches the built SHA"
              ;;
            *)
              echo "::error::STALE BINARY: image reports '$ACTUAL' but this build is $EXPECTED_SHA. The published/validated image does not contain the code of this commit."
              exit 1
              ;;
          esac

      - name: Export digest
        if: needs.gate.outputs.push == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: needs.gate.outputs.push == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ steps.slug.outputs.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The merge job exists only to create and push the <branch>-latest / <sha>
  # manifest tags, which only happens for long-lived branches. On a PR branch
  # the build job above still runs (validating the image builds) and this job
  # is skipped entirely.
  merge:
    if: needs.gate.outputs.push == 'true'
    runs-on: ubuntu-latest
    needs: [gate, build]
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify build commit is still HEAD of branch
        id: head-check
        run: |
          BRANCH="${{ github.ref_name }}"
          CURRENT_HEAD=$(git ls-remote https://github.com/${{ github.repository }} "$BRANCH" | awk '{print $1}')
          if [ "${{ github.sha }}" != "$CURRENT_HEAD" ]; then
            echo "Build is stale (built ${{ github.sha }} but $BRANCH HEAD is $CURRENT_HEAD) — skipping tag"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract git metadata
        if: steps.head-check.outputs.stale != 'true'
        id: meta
        run: |
          echo "git_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # Docker tags can't contain '/', but branch names can (feat/x).
          # Use the github.ref_name expression (reliably populated) and
          # sanitize '/' -> '-' so feat/x becomes tag feat-x-latest.
          REF_NAME='${{ github.ref_name }}'
          echo "branch_tag=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
          # RELEASE CHANNELS. stable/candidate/edge are moving pointers that must
          # always resolve to the newest good build of the RELEASE branch (v4).
          # They are emitted here, in the same imagetools create that publishes
          # <branch>-latest, so a channel is a RETAG of the digest we just built —
          # never a rebuild, and never a manual promotion step that can be
          # forgotten. Empty on every other branch, so a feature branch can never
          # move a channel out from under production.
          if [ "$REF_NAME" = "v4" ]; then
            echo "release_channels=stable candidate edge" >> "$GITHUB_OUTPUT"
          else
            echo "release_channels=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create manifest list and push
        if: steps.head-check.outputs.stale != 'true'
        working-directory: /tmp/digests
        run: |
          shopt -s nullglob
          digests=(*)
          if [ ${#digests[@]} -eq 0 ]; then
            echo "No digests to merge (per-arch builds published none) — skipping."
            exit 0
          fi
          docker buildx imagetools create \
            -t ghcr.io/kubestellar/hive:${{ steps.meta.outputs.branch_tag }}-latest \
            $(for c in ${{ steps.meta.outputs.release_channels }}; do printf -- '-t ghcr.io/kubestellar/hive:%s ' "$c"; done) \
            -t ghcr.io/kubestellar/hive:${{ steps.meta.outputs.git_short }} \
            $(printf 'ghcr.io/kubestellar/hive@sha256:%s ' "${digests[@]}")

  build-contributor:
    needs: gate
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Platform slug
        id: slug
        run: echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Build and push contributor image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/Dockerfile.contributor
          platforms: ${{ matrix.platform }}
          # #3760: no default provenance/SBOM attestations → plain image
          # manifests, not an OCI index. See the note on the main build above.
          provenance: false
          sbom: false
          outputs: type=image,name=ghcr.io/kubestellar/hive-contributor,push-by-digest=true,name-canonical=true,push=${{ needs.gate.outputs.push }},oci-mediatypes=false
          cache-from: type=gha,scope=contributor-${{ steps.slug.outputs.slug }}
          cache-to: type=gha,scope=contributor-${{ steps.slug.outputs.slug }},mode=max

      - name: Export digest
        if: needs.gate.outputs.push == 'true'
        run: |
          mkdir -p /tmp/contrib-digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/contrib-digests/${digest#sha256:}"

      - name: Upload digest
        if: needs.gate.outputs.push == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contrib-digests-${{ steps.slug.outputs.slug }}
          path: /tmp/contrib-digests/*
          if-no-files-found: error
          retention-days: 1

  merge-contributor:
    if: needs.gate.outputs.push == 'true'
    runs-on: ubuntu-latest
    needs: [gate, build-contributor]
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/contrib-digests
          pattern: contrib-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify build commit is still HEAD of branch
        id: head-check
        run: |
          BRANCH="${{ github.ref_name }}"
          CURRENT_HEAD=$(git ls-remote https://github.com/${{ github.repository }} "$BRANCH" | awk '{print $1}')
          if [ "${{ github.sha }}" != "$CURRENT_HEAD" ]; then
            echo "Build is stale (built ${{ github.sha }} but $BRANCH HEAD is $CURRENT_HEAD) — skipping tag"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract git metadata
        if: steps.head-check.outputs.stale != 'true'
        id: meta
        run: |
          echo "git_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # Docker tags can't contain '/', but branch names can (feat/x).
          # Use the github.ref_name expression (reliably populated) and
          # sanitize '/' -> '-' so feat/x becomes tag feat-x-latest.
          REF_NAME='${{ github.ref_name }}'
          echo "branch_tag=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
          # RELEASE CHANNELS. stable/candidate/edge are moving pointers that must
          # always resolve to the newest good build of the RELEASE branch (v4).
          # They are emitted here, in the same imagetools create that publishes
          # <branch>-latest, so a channel is a RETAG of the digest we just built —
          # never a rebuild, and never a manual promotion step that can be
          # forgotten. Empty on every other branch, so a feature branch can never
          # move a channel out from under production.
          if [ "$REF_NAME" = "v4" ]; then
            echo "release_channels=stable candidate edge" >> "$GITHUB_OUTPUT"
          else
            echo "release_channels=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create contributor manifest list and push
        if: steps.head-check.outputs.stale != 'true'
        working-directory: /tmp/contrib-digests
        run: |
          shopt -s nullglob
          digests=(*)
          if [ ${#digests[@]} -eq 0 ]; then
            echo "No digests to merge (per-arch builds published none) — skipping."
            exit 0
          fi
          docker buildx imagetools create \
            -t ghcr.io/kubestellar/hive-contributor:latest \
            -t ghcr.io/kubestellar/hive-contributor:${{ steps.meta.outputs.branch_tag }}-latest \
            $(for c in ${{ steps.meta.outputs.release_channels }}; do printf -- '-t ghcr.io/kubestellar/hive-contributor:%s ' "$c"; done) \
            -t ghcr.io/kubestellar/hive-contributor:${{ steps.meta.outputs.git_short }} \
            $(printf 'ghcr.io/kubestellar/hive-contributor@sha256:%s ' "${digests[@]}")

  build-hub:
    needs: gate
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Platform slug
        id: slug
        run: echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Build and push hub image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/Dockerfile.hub
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_HASH=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          # STALE-BINARY FIX (see the main build step). The hub image also does
          # `COPY --from=builder /hive` into a `runtime` final stage, and its GHA
          # cache scope (hub-<slug>) is likewise branch-persistent — so without
          # busting `runtime` the hub could ship an old hive that self-upgrades
          # against the wrong SHA. Bust both binary-bearing stages.
          no-cache-filters: builder,runtime
          # #3760: no default provenance/SBOM attestations → plain image
          # manifests, not an OCI index. See the note on the main build above.
          provenance: false
          sbom: false
          outputs: type=image,name=ghcr.io/kubestellar/hive-hub,push-by-digest=true,name-canonical=true,push=${{ needs.gate.outputs.push }},oci-mediatypes=false
          cache-from: type=gha,scope=hub-${{ steps.slug.outputs.slug }}
          cache-to: type=gha,scope=hub-${{ steps.slug.outputs.slug }},mode=max

      - name: Export digest
        if: needs.gate.outputs.push == 'true'
        run: |
          mkdir -p /tmp/hub-digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/hub-digests/${digest#sha256:}"

      - name: Upload digest
        if: needs.gate.outputs.push == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hub-digests-${{ steps.slug.outputs.slug }}
          path: /tmp/hub-digests/*
          if-no-files-found: error
          retention-days: 1

  merge-hub:
    if: needs.gate.outputs.push == 'true'
    runs-on: ubuntu-latest
    needs: [gate, build-hub]
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/hub-digests
          pattern: hub-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify build commit is still HEAD of branch
        id: head-check
        run: |
          BRANCH="${{ github.ref_name }}"
          CURRENT_HEAD=$(git ls-remote https://github.com/${{ github.repository }} "$BRANCH" | awk '{print $1}')
          if [ "${{ github.sha }}" != "$CURRENT_HEAD" ]; then
            echo "Build is stale (built ${{ github.sha }} but $BRANCH HEAD is $CURRENT_HEAD) — skipping tag"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract git metadata
        if: steps.head-check.outputs.stale != 'true'
        id: meta
        run: |
          echo "git_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # Docker tags can't contain '/', but branch names can (feat/x).
          # Use the github.ref_name expression (reliably populated) and
          # sanitize '/' -> '-' so feat/x becomes tag feat-x-latest.
          REF_NAME='${{ github.ref_name }}'
          echo "branch_tag=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
          # RELEASE CHANNELS. stable/candidate/edge are moving pointers that must
          # always resolve to the newest good build of the RELEASE branch (v4).
          # They are emitted here, in the same imagetools create that publishes
          # <branch>-latest, so a channel is a RETAG of the digest we just built —
          # never a rebuild, and never a manual promotion step that can be
          # forgotten. Empty on every other branch, so a feature branch can never
          # move a channel out from under production.
          if [ "$REF_NAME" = "v4" ]; then
            echo "release_channels=stable candidate edge" >> "$GITHUB_OUTPUT"
          else
            echo "release_channels=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create hub manifest list and push
        if: steps.head-check.outputs.stale != 'true'
        working-directory: /tmp/hub-digests
        run: |
          shopt -s nullglob
          digests=(*)
          if [ ${#digests[@]} -eq 0 ]; then
            echo "No digests to merge (per-arch builds published none) — skipping."
            exit 0
          fi
          docker buildx imagetools create \
            -t ghcr.io/kubestellar/hive-hub:latest \
            -t ghcr.io/kubestellar/hive-hub:${{ steps.meta.outputs.branch_tag }}-latest \
            $(for c in ${{ steps.meta.outputs.release_channels }}; do printf -- '-t ghcr.io/kubestellar/hive-hub:%s ' "$c"; done) \
            -t ghcr.io/kubestellar/hive-hub:${{ steps.meta.outputs.git_short }} \
            $(printf 'ghcr.io/kubestellar/hive-hub@sha256:%s ' "${digests[@]}")
