  build-contributor:
    needs: gate
    # Push-only, same as `build` above (#4965).
    # `release-gate/*` is excluded for the same reason `merge*` already skips
    # it (gate forces push=false there): these builds publish NOTHING for the
    # scratch branch. They are not merely wasted — branch protection evaluates
    # the whole check SUITE, so while any job in it runs the `gate` context is
    # not treated as satisfied even though its check-run is already `success`.
    # The release job's merge waits 120s and a multi-arch build takes ~10min,
    # so the merge could never win that race (#5339, 8th recurrence).
    if: >-
      github.event_name != 'pull_request' &&
      !startsWith(github.ref_name, 'release-gate/')
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Platform slug
        id: slug
        run: echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Build and push contributor image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/Dockerfile.contributor
          platforms: ${{ matrix.platform }}
          labels: |
            io.kubestellar.hive.github-actions-run-number=${{ github.run_number }}
            org.opencontainers.image.revision=${{ github.sha }}
          # #3760: no default provenance/SBOM attestations → plain image
          # manifests, not an OCI index. See the note on the main build above.
          provenance: false
          sbom: false
          # Owner-derived image name (dual-publish) — see the main build step.
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/hive-contributor,push-by-digest=true,name-canonical=true,push=${{ needs.gate.outputs.push }},oci-mediatypes=false
          cache-from: type=gha,scope=contributor-${{ steps.slug.outputs.slug }}
          cache-to: type=gha,scope=contributor-${{ steps.slug.outputs.slug }},mode=max

      - name: Export digest
        if: needs.gate.outputs.push == 'true'
        run: |
          mkdir -p /tmp/contrib-digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/contrib-digests/${digest#sha256:}"

      - name: Upload digest
        if: needs.gate.outputs.push == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contrib-digests-${{ steps.slug.outputs.slug }}
          path: /tmp/contrib-digests/*
          if-no-files-found: error
          retention-days: 1

  merge-contributor:
    if: needs.gate.outputs.push == 'true'
    runs-on: ubuntu-latest
    needs: [gate, build-contributor]
    steps:
      - name: Checkout tag publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
