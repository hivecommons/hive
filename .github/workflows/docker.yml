name: Build and Push Docker Image

on:
  push:
    # Run on every branch so a PR's image still BUILDS as a CI gate (proving it
    # compiles), but only long-lived branches PUSH to GHCR — see the "Push
    # policy" step below. Exclude bot branches so dependency PRs don't consume
    # image CI; they build on the base branch when merged.
    branches:
      - '**'
      - '!dependabot/**'
      - '!copilot/**'
  # `gate` is the ONLY status context v4 branch protection requires, and a
  # push-only workflow cannot produce it for a pull request from a FORK: the
  # push event fires in the contributor's repo, not here, so `gate` never
  # attaches to the head SHA this repo evaluates and protection blocks the
  # merge waiting for a check that cannot arrive (#4965). Six green fork PRs
  # were structurally unmergeable; maintainers never saw it because
  # enforce_admins is false, so an admin merge silently bypasses the same
  # missing check.
  #
  # This trigger exists to produce that one context. It deliberately runs
  # NOTHING else on a pull request — every build job below is skipped for this
  # event — so it adds no image CI. The heavyweight builds stay push-only,
  # exactly as the comment above describes.
  #
  # No `paths:` or `branches:` filter, on purpose. A required context must
  # attach to EVERY pull request; a filtered one silently never runs on the
  # changes it does not match, and protection then waits forever. That is also
  # why the already PR-triggered `build-and-test` is not a drop-in replacement
  # for `gate` in the required list — v2-ci.yml path-filters it.
  #
  # Leaving the filter off also keeps this workflow's `unpinned: '**'` contract
  # in .github/release-lines.yml intact: that guard requires every `branches:`
  # filter here to stay a wildcard, so a fixed base-branch list would fail it.
  pull_request:
  workflow_dispatch:

# Serialize Docker builds per branch so concurrent merges don't race. Do NOT
# cancel in-progress builds: on a fast-merging release branch (v2 saw ~34 merges
# in 2h), cancel-in-progress meant every build was killed by the next merge and
# NONE ever completed, freezing <branch>-latest and blocking all deploys. With
# cancel-in-progress:false the builds queue and each runs to completion. Each
# completed build publishes an immutable SHA tag; publish-image-tags.sh uses a
# per-tag workflow generation to advance moving tags without either starving
# during a merge burst or regressing when queued runs execute out of order.
concurrency:
  group: docker-build-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Decide once whether this run pushes images to GHCR, and expose it as an
  # output every other job consumes (needs.gate.outputs.push). Only long-lived
  # branches that a hive can be assigned to via the hub's branch switcher push:
  # the release lines and standing experimental branches. Every OTHER branch
  # still BUILDS (the image is a per-PR CI gate) but does not push — otherwise a
  # temporary PR branch leaves an orphaned <branch>-latest tag on GHCR when it
  # merges and is deleted. workflow_dispatch always pushes so a throwaway branch
  # can be published for a hive on demand before merge.
  #
  # EXCEPTION: `release-gate/*` (#5072). tagged-release.yml pushes its
  # release commit to a throwaway `release-gate/v<version>` branch to earn a
  # `gate` check on
  # that exact SHA before pushing to protected `v4` (see docs/releases.md,
  # "Satisfying branch protection"). That push uses the job's default
  # GITHUB_TOKEN, and GitHub's documented recursive-workflow guard means a
  # GITHUB_TOKEN push never fires another workflow's `push` trigger — so
  # tagged-release.yml has to fall back to explicitly dispatching this
  # workflow via `gh workflow run docker.yml --ref release-gate/v<version>`
  # instead. Without
  # this exception, that dispatch would hit the `workflow_dispatch` branch
  # below and force push=true on a branch nothing should ever publish images
  # for: a full two-platform GHCR push under a one-off scratch branch name,
  # solely to obtain a status check that only needs `gate` (a five-second job)
  # to run. `release-gate/*` branches are deliberately never in LONG_LIVED and
  # are deleted immediately after use (tagged-release.yml's `trap ... EXIT`),
  # so this
  # exception cannot leave a stray moving tag behind — it only ever prevents
  # one from being created in the first place.
  #
  # The long-lived branch set is defined ONCE below (LONG_LIVED). To add or
  # remove one, edit only that list — the whole workflow derives from this job's
  # output, so nothing else changes.
  #
  # It is not a trigger filter, so it hand-writes the release lines a second
  # time, and going stale here fails GREEN: the image would keep building on a
  # new release line and never publish its <branch>-latest tag (#4462). The
  # release-line guard asserts this list against .github/release-lines.yml —
  # see the `env_lists` entry there and src/docs/release-line-guard.md.
  #
  # NOTE (#5339/#5356): do not special-case `release-gate/*` pull requests in
  # this job. GITHUB_TOKEN-opened release PR runs may be recursion-blocked
  # before any job starts, and workflow_dispatch check-runs are not associated
  # with a PR even when dispatched after it exists. tagged-release.yml handles
  # that release-only gap by mirroring its verified check-run as a SHA-scoped
  # commit status. Ordinary pull requests still need this job unchanged so
  # their head SHA receives the required `gate` check-run (#4965).
  gate:
    runs-on: ubuntu-latest
    outputs:
      push: ${{ steps.decide.outputs.push }}
      cross_org: ${{ steps.registries.outputs.cross_org }}
      cross_secret: ${{ steps.registries.outputs.cross_secret }}
    steps:
      - name: Decide push policy
        id: decide
        env:
          LONG_LIVED: "v2 v4 mk dd"
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          push=false
          case "$REF_NAME" in
            release-gate/*)
              # See the EXCEPTION comment above this job: this scratch branch
              # only ever exists to earn a `gate` check for
              # tagged-release.yml, never to publish an image, regardless of
              # trigger event.
              push=false
              ;;
            *)
              if [ "$EVENT" = "workflow_dispatch" ]; then
                push=true
              else
                for b in $LONG_LIVED; do
                  if [ "$b" = "$REF_NAME" ]; then push=true; break; fi
                done
              fi
              ;;
          esac
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "Push to GHCR: $push (branch=$REF_NAME event=$EVENT)"

      # DUAL-PUBLISH (kubestellar -> hivecommons org transfer). During the
      # transfer window every image publish is mirrored into the OTHER org's
      # GHCR namespace, so a hive pinned to either registry path keeps
      # resolving fresh tags no matter which side of the transfer the repo is
      # on. The NATIVE org is wherever this repo currently lives
      # (github.repository_owner — the only org this job's GITHUB_TOKEN can
      # write packages to); the CROSS org and the classic-PAT secret that can
      # write to it are derived here once, direction-agnostically, so the
      # workflow needs no edit when the transfer actually happens:
      #   owner=kubestellar -> cross=hivecommons, secret GHCR_HIVECOMMONS_PAT
      #   owner=hivecommons -> cross=kubestellar, secret GHCR_KUBESTELLAR_PAT
      # The merge jobs consume these outputs. Whether a MISSING secret is a
      # warning or a hard failure is decided there — see the asymmetry
      # comment on each "Check cross-registry credential" step.
      - name: Decide cross-registry mirror target
        id: registries
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$OWNER" = "kubestellar" ]; then
            cross_org=hivecommons
            cross_secret=GHCR_HIVECOMMONS_PAT
          else
            cross_org=kubestellar
            cross_secret=GHCR_KUBESTELLAR_PAT
          fi
          echo "cross_org=${cross_org}" >> "$GITHUB_OUTPUT"
          echo "cross_secret=${cross_secret}" >> "$GITHUB_OUTPUT"
          echo "Native org: ${OWNER}; mirroring publishes to ghcr.io/${cross_org} using secret ${cross_secret}."

  build:
    needs: gate
    # Skipped for `pull_request` (#4965): that trigger exists only so the
    # required `gate` context attaches to a fork PR's head SHA. The image build
    # stays push-only — and a PR is not left unbuilt by this, because
    # v2-ci.yml already runs on pull_request and builds src/Dockerfile with a
    # real `hive --version` smoke test (`docker`), plus `build-and-test`
    # (go build + go vet) and `overlayfs-exec-guard`. Building here too would
    # be a third image build of the same commit.
    # `release-gate/*` is excluded for the same reason `merge*` already skips
    # it (gate forces push=false there): these builds publish NOTHING for the
    # scratch branch. They are not merely wasted — branch protection evaluates
    # the whole check SUITE, so while any job in it runs the `gate` context is
    # not treated as satisfied even though its check-run is already `success`.
    # The release job's merge waits 120s and a multi-arch build takes ~10min,
    # so the merge could never win that race (#5339, 8th recurrence).
    #
    # No coverage is lost. A release commit modifies CHANGELOG.md and nothing
    # else — no source, no Dockerfile — so its tree is byte-identical to the v4
    # tip whose images this workflow already built, published and freshness-
    # checked minutes earlier. The `gate` job itself still runs on the scratch
    # branch; that is the whole reason the branch exists.
    if: >-
      github.event_name != 'pull_request' &&
      !startsWith(github.ref_name, 'release-gate/')
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Platform slug
        id: slug
        run: echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      # NOTE on Go compile caching (removed actions/cache transport, #4114):
      # measurement showed the Go compile in this image is only ~25-50s, and
      # the inject/extract transport never worked — every extract found the
      # cache mounts empty (each actions/cache save was 273 bytes), so every
      # "warm" run was actually cold while paying the transport's fixed cost.
      # src/Dockerfile keeps its BuildKit cache mounts (free, and a no-op when
      # empty) so any future runner-local BuildKit state still benefits, but we
      # no longer round-trip them through actions/cache.
      #
      # LAYER CACHE STRATEGY: `no-cache-filters: builder,runtime` (the #3760
      # stale-binary defense, see below) forces every layer of the builder and
      # runtime stages to re-execute on every build — so a whole-image
      # `cache-to: type=gha,mode=max` export bought almost nothing while
      # costing 2-4 minutes per job to upload multi-GB layer sets. The ONLY
      # stage that can legitimately be served from cache is `tmux-builder`
      # (pinned base image + pinned tmux tarball; not listed in
      # no-cache-filters). Warm exactly that stage: a targeted `--target
      # tmux-builder` build seeds the builder's local layer cache from a small
      # dedicated gha scope (and refreshes it with mode=max — cheap, tmux-stage
      # layers only). The main build then hits those layers locally and does
      # NO cache export at all. continue-on-error: pure optimization — if the
      # gha cache service hiccups, the main build just recompiles tmux.
      - name: Warm tmux-builder layer cache
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/Dockerfile
          platforms: ${{ matrix.platform }}
          target: tmux-builder
          provenance: false
          sbom: false
          cache-from: type=gha,scope=tmux-${{ steps.slug.outputs.slug }}
          cache-to: type=gha,scope=tmux-${{ steps.slug.outputs.slug }},mode=max

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_HASH=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          # Monotonic moving-tag guard metadata (#4804). This config label is
          # inherited by each platform manifest without changing its media type.
          # ORG-MIGRATION KEEP DECISION (kubestellar -> hivecommons): the
          # io.kubestellar.hive.* label PREFIX is deliberately NOT renamed. It is
          # a data-format identifier baked into every already-published manifest
          # and read back by consumers (the moving-tag guard and
          # src/deploy/test_standalone_runtime_parity.sh), not an org pointer;
          # renaming it would make old and new images disagree on the same
          # field. The identical labels in build-contributor and build-hub
          # below keep the prefix for the same reason.
          labels: |
            io.kubestellar.hive.github-actions-run-number=${{ github.run_number }}
            org.opencontainers.image.revision=${{ github.sha }}
          # STALE-BINARY FIX (unblocks the #3760 fix in the SHIPPED image).
          # `no-cache-filters: builder` alone rebuilt
          # a fresh /hive in the `builder` stage but let BuildKit serve the FINAL
          # (`runtime`) stage's `COPY --from=builder /hive` layer AND the
          # subsequent fresh-inode rewrite RUN from that persistent cache — so the
          # rebuilt binary was thrown away and the OLD binary (e.g. commit
          # 4d9c11c) shipped even though the manifest digest advanced. Listing the
          # `runtime` stage too forces those binary-bearing layers to re-run every
          # build, so the published /usr/local/bin/hive always matches HEAD.
          no-cache-filters: builder,runtime
          # #3760: DO NOT attach provenance/SBOM attestations. build-push-action
          # adds them by DEFAULT, and an attestation can only be carried by an
          # OCI image *index* — so the per-arch digest we push becomes
          # application/vnd.oci.image.index.v1+json instead of a plain image
          # manifest. That is exactly the OCI-index form the reporter measured on
          # the crash-looping image (his working fork build, same v4 code, is a
          # plain gzip-layer manifest and execs everywhere). The attestation/OCI-
          # index build path is what lets a COPY --from layer ship an overlayfs
          # metacopy redirect for /usr/local/bin/hive, which containerd/k3s and
          # rootless podman present as non-executable at the image path until
          # copy-up (a plain `cp` to any other path clears it). Forcing plain
          # image manifests removes that trigger. See the in-final-stage rewrite
          # in src/Dockerfile for the belt-and-suspenders defense.
          provenance: false
          sbom: false
          # Push the per-arch digest only for long-lived branches; on a PR
          # branch build without pushing so the image is still validated (CI
          # gate) but nothing lands on GHCR.
          # The image name is owner-derived (dual-publish, see the gate job):
          # GITHUB_TOKEN can only push packages in the org that hosts the
          # repo, so the build always targets the NATIVE org and the merge
          # job mirrors the finished manifest list into the cross org.
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/hive,push-by-digest=true,name-canonical=true,push=${{ needs.gate.outputs.push }},oci-mediatypes=false
          # tmux-builder layers come from the local cache warmed above; every
          # other stage is forced to re-execute by no-cache-filters, so there
          # is nothing worth exporting — deliberately NO cache-to here (the
          # whole-image mode=max export measured 130-225s per job for ~0 reuse)
          cache-from: type=gha,scope=tmux-${{ steps.slug.outputs.slug }}

      # FRESHNESS ASSERTION (#3760 regression guard): run the image this job
      # just produced and assert the ldflags-embedded commit equals the commit
      # being built. `hive --version` prints "hive 3.0.0 (commit <short7>,
      # branch <b>)" where <short7> is baked from /repo/.git at compile time.
      #
      # - push builds: probe the EXACT pushed artifact by digest — the most
      #   direct possible evidence that what landed on GHCR is fresh.
      # - PR builds (push=false): nothing is pushed and push-by-digest output
      #   doesn't load into the local daemon, so re-run the build with --load.
      #   On this same builder every layer of the forced-fresh build above is
      #   in local cache, so the rebuild is seconds and yields those exact
      #   layers. If BuildKit ever resolved a STALE binary layer instead, the
      #   embedded hash would differ from github.sha and this step fails loudly
      #   — a stale layer can make this check fail, never silently pass.
      - name: Assert embedded commit matches build (freshness guard)
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ needs.gate.outputs.push }}" = "true" ]; then
            IMG="ghcr.io/${{ github.repository_owner }}/hive@${{ steps.build.outputs.digest }}"
            docker pull "$IMG"
          else
            IMG=hive-freshness-probe:local
            docker buildx build --load \
              -f src/Dockerfile \
              --build-arg GIT_HASH="$EXPECTED_SHA" \
              --build-arg GIT_BRANCH="${{ github.ref_name }}" \
              -t "$IMG" .
          fi
          ACTUAL=$(docker run --rm --entrypoint /usr/local/bin/hive "$IMG" --version)
          echo "image reports: $ACTUAL"
          echo "expected commit: ${EXPECTED_SHA::7} (from $EXPECTED_SHA)"
          case "$ACTUAL" in
            *"commit ${EXPECTED_SHA::7},"*)
              echo "Freshness OK: embedded commit matches the built SHA"
              ;;
            *)
              echo "::error::STALE BINARY: image reports '$ACTUAL' but this build is $EXPECTED_SHA. The published/validated image does not contain the code of this commit."
              exit 1
              ;;
          esac

      # SECURITY (#3866, CWE-250/732): assert the REAL built image ships exactly
      # one setuid/setgid binary, the su-exec launcher helper.
      #
      # src/deploy/test_image_suid_inventory.sh runs this same assertion against
      # a fixture derived from src/Dockerfile on every PR that touches it (the
      # image-suid-inventory job in suid-contract.yml). That fixture covers the
      # base + apt layers, which is where the eleven world-executable
      # setuid/setgid binaries came from. This copy is the one that sees the
      # WHOLE image — every npm, pip and COPY layer included — so nothing can
      # slip a setuid bit in below the layers the fixture reproduces.
      #
      # The image is already local here: pushed builds pulled it by digest in
      # the step above, PR builds loaded it as hive-freshness-probe:local.
      - name: Assert image SUID/SGID inventory
        run: |
          set -euo pipefail
          if [ "${{ needs.gate.outputs.push }}" = "true" ]; then
            IMG="ghcr.io/${{ github.repository_owner }}/hive@${{ steps.build.outputs.digest }}"
          else
            IMG=hive-freshness-probe:local
          fi
          bash src/deploy/test_image_suid_inventory.sh --image "$IMG"

      - name: Export digest
        if: needs.gate.outputs.push == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: needs.gate.outputs.push == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ steps.slug.outputs.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The merge job exists only to create and push the <branch>-latest / <sha>
  # manifest tags, which only happens for long-lived branches. On a PR branch
  # the build job above still runs (validating the image builds) and this job
  # is skipped entirely.
  merge:
    if: needs.gate.outputs.push == 'true'
    runs-on: ubuntu-latest
    needs: [gate, build]
    steps:
      - name: Checkout tag publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        run: |
          src/scripts/publish-image-tags.sh \
            ghcr.io/${{ github.repository_owner }}/hive /tmp/digests \
            '${{ github.ref_name }}' '${{ github.sha }}' '${{ github.run_number }}' \
            v4 true candidate

      # ---- Cross-org mirror (kubestellar <-> hivecommons dual-publish) ----
      # Copy the tags just published above into the other org's GHCR
      # namespace BY DIGEST (`imagetools create -t <cross>:<tag>
      # <native>@<digest>`): both registries then serve the byte-identical,
      # digest-identical manifest list — no second build, no drift. The gate
      # job computed which org is "cross" and which secret can write to it.
      #
      # ASYMMETRY of the missing-secret handling, on purpose:
      #   - owner=hivecommons (post-transfer): a missing PAT would mean the
      #     OLD kubestellar registry silently stops receiving images while
      #     every spoke still pinned there keeps pulling stale tags — the
      #     dangerous one-sided publish — so it is a hard ::error failure.
      #   - owner=kubestellar (pre-transfer staging): the PAT may simply not
      #     exist yet; the mirror is purely additive and nothing that exists
      #     today degrades, so it is only a ::warning and the run stays green.
      - name: Check cross-registry credential
        id: crosspat
        env:
          # Env indirection: `if:` cannot read the secrets context, and the
          # secret NAME itself is computed by the gate job.
          CROSS_PAT: ${{ secrets[needs.gate.outputs.cross_secret] }}
          CROSS_ORG: ${{ needs.gate.outputs.cross_org }}
          CROSS_SECRET_NAME: ${{ needs.gate.outputs.cross_secret }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -n "$CROSS_PAT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [ "$OWNER" = "hivecommons" ]; then
            echo "::error::secret ${CROSS_SECRET_NAME} is not set, so this run cannot mirror to ghcr.io/${CROSS_ORG}. Post-transfer that is a silent one-sided publish (spokes pinned to the old org keep pulling stale tags), so this fails hard. Create a classic PAT with write:packages from a ${CROSS_ORG} member and store it as ${CROSS_SECRET_NAME}."
            exit 1
          fi
          echo "::warning::secret ${CROSS_SECRET_NAME} is not set — skipping the ghcr.io/${CROSS_ORG} mirror. Pre-transfer this is expected until that PAT is created; nothing that exists today degrades."

      # ghcr.io is ONE registry host and docker keeps one credential per
      # host, so this login REPLACES the GITHUB_TOKEN login above. Every
      # native-org write is already done (the publish step above was the
      # last one). Reading the native image back for the digest copy still
      # works: these packages are public, and the PAT is a valid ghcr.io
      # credential for public reads regardless of org.
      - name: Log in to GHCR as the cross-org publisher
        if: steps.crosspat.outputs.available == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets[needs.gate.outputs.cross_secret] }}

      - name: Mirror published tags into the cross-org registry (by digest)
        if: steps.crosspat.outputs.available == 'true'
        env:
          NATIVE_IMAGE: ghcr.io/${{ github.repository_owner }}/hive
          CROSS_IMAGE: ghcr.io/${{ needs.gate.outputs.cross_org }}/hive
          BRANCH: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
          # These three mirror publish-image-tags.sh's positional args in the
          # publish step above — keep them in lockstep with that call.
          INCLUDE_LATEST: "true"
          RELEASE_BRANCH: "v4"
          CHANNELS: "candidate"
        run: |
          set -euo pipefail
          # Same tag set publish-image-tags.sh manages for this image. Each
          # tag is copied from whatever the NATIVE tag currently points at,
          # so the monotonic moving-tag guard's decisions carry over: the
          # cross org can never regress a tag the native org did not.
          branch_tag="${BRANCH//\//-}"
          tags=("${GIT_SHA:0:7}" "${branch_tag}-latest")
          if [ "$INCLUDE_LATEST" = "true" ]; then tags+=("latest"); fi
          if [ "$BRANCH" = "$RELEASE_BRANCH" ] && [ -n "$CHANNELS" ]; then
            IFS=, read -ra channel_tags <<<"$CHANNELS"
            for ch in "${channel_tags[@]}"; do [ -n "$ch" ] && tags+=("$ch"); done
          fi
          for tag in "${tags[@]}"; do
            if ! digest=$(docker buildx imagetools inspect \
                "${NATIVE_IMAGE}:${tag}" --format '{{.Manifest.Digest}}' 2>&1); then
              # Distinguish "tag does not exist" (fine: e.g. the monotonic
              # guard published nothing this run) from a transport/auth
