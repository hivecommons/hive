        if: steps.crosspat.outputs.available == 'true'
        env:
          NATIVE_IMAGE: ghcr.io/${{ github.repository_owner }}/hive-contributor
          CROSS_IMAGE: ghcr.io/${{ needs.gate.outputs.cross_org }}/hive-contributor
