      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Platform slug
        id: slug
        run: echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Build and push contributor image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: v2/Dockerfile.contributor
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/kubestellar/hive-contributor,push-by-digest=true,name-canonical=true,push=${{ needs.gate.outputs.push }}
          cache-from: type=gha,scope=contributor-${{ steps.slug.outputs.slug }}
          cache-to: type=gha,scope=contributor-${{ steps.slug.outputs.slug }},mode=max

      - name: Export digest
        if: needs.gate.outputs.push == 'true'
        run: |
          mkdir -p /tmp/contrib-digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/contrib-digests/${digest#sha256:}"

      - name: Upload digest
        if: needs.gate.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: contrib-digests-${{ steps.slug.outputs.slug }}
          path: /tmp/contrib-digests/*
          if-no-files-found: error
          retention-days: 1

  merge-contributor:
    if: needs.gate.outputs.push == 'true'
    runs-on: ubuntu-latest
    needs: [gate, build-contributor]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/contrib-digests
          pattern: contrib-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify build commit is still HEAD of branch
        id: head-check
        run: |
          BRANCH="${{ github.ref_name }}"
          CURRENT_HEAD=$(git ls-remote https://github.com/${{ github.repository }} "$BRANCH" | awk '{print $1}')
          if [ "${{ github.sha }}" != "$CURRENT_HEAD" ]; then
            echo "Build is stale (built ${{ github.sha }} but $BRANCH HEAD is $CURRENT_HEAD) — skipping tag"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract git metadata
        if: steps.head-check.outputs.stale != 'true'
        id: meta
        run: |
          echo "git_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # Docker tags can't contain '/', but branch names can (feat/x).
          # Use the github.ref_name expression (reliably populated) and
          # sanitize '/' -> '-' so feat/x becomes tag feat-x-latest.
          REF_NAME='${{ github.ref_name }}'
          echo "branch_tag=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Create contributor manifest list and push
        if: steps.head-check.outputs.stale != 'true'
        working-directory: /tmp/contrib-digests
        run: |
          shopt -s nullglob
          digests=(*)
          if [ ${#digests[@]} -eq 0 ]; then
            echo "No digests to merge (per-arch builds published none) — skipping."
            exit 0
          fi
          docker buildx imagetools create \
            -t ghcr.io/kubestellar/hive-contributor:latest \
            -t ghcr.io/kubestellar/hive-contributor:${{ steps.meta.outputs.branch_tag }}-latest \
            -t ghcr.io/kubestellar/hive-contributor:${{ steps.meta.outputs.git_short }} \
            $(printf 'ghcr.io/kubestellar/hive-contributor@sha256:%s ' "${digests[@]}")

  build-hub:
    needs: gate
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Platform slug
        id: slug
        run: echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Build and push hub image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: v2/Dockerfile.hub
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_HASH=${{ github.sha }}
          outputs: type=image,name=ghcr.io/kubestellar/hive-hub,push-by-digest=true,name-canonical=true,push=${{ needs.gate.outputs.push }}
          cache-from: type=gha,scope=hub-${{ steps.slug.outputs.slug }}
          cache-to: type=gha,scope=hub-${{ steps.slug.outputs.slug }},mode=max

      - name: Export digest
        if: needs.gate.outputs.push == 'true'
        run: |
