name: OpenSSF Scorecard

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    # NOTE: the reusable scorecard action only supports the repository default
    # branch (v4); running on dd pushes fails structurally with
    # "refs/heads/dd not supported with push event".
    branches: [ "main", "v4" ]
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analysis:
    uses: kubestellar/infra/.github/workflows/reusable-scorecard.yml@1a04a3fd17771e78e5cf6d42a3fda84e3ba478f3 # kubestellar/infra main as of 2026-08-11
