name: OpenSSF Scorecard

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [ "main", "v4", "v5", "v6" ]
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analysis:
    # Scorecard only analyses the default branch; skip pushes to other release lines (#17392).
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    uses: hivecommons/infra/.github/workflows/reusable-scorecard.yml@f1c0b61675386f54e63c04cf07b3aa933cc963eb # hivecommons/infra main as of 2026-09-02
