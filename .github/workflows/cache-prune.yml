# Reclaim Actions cache quota from branches that no longer exist.
#
# Why this exists (kubestellar/hive#7031): the repo sits AT its 10 GB Actions
# cache ceiling (measured 2026-09-15: 10.44 GB across 549 entries). GitHub
# enforces that ceiling by evicting least-recently-used entries, and the entry
# that loses is always the smallest useful one — the offline apt package cache
# `.github/scripts/ci-install-tool.sh` uses to install gcc/libc6-dev without
# touching the Ubuntu mirrors (added in #7009, ported to v5 in #7019).
#
# That is why the #6648/#6870/#6935 "apt egress" failure class keeps coming
# back after being declared fixed: the offline fallback is real, but it is
# deleted within hours of being written, so every race shard is forced back
# onto the network. Verified directly — the seeded `hive-cgo-race-apt-*` entry
# was gone 11 hours later, and the v5 run that followed logged
# `Cache not found for input keys: hive-cgo-race-apt-Linux-X64-gcc-libc6-dev-v1`.
#
# The quota is consumed overwhelmingly by per-branch buildkit blobs from
# docker.yml's scoped `cache-to: type=gha,mode=max` exports. Those are worth
# keeping WHILE a branch is alive. Once the branch is deleted they can never be
# restored by anything, yet they keep occupying quota and evicting live entries.
# Measured at the time of writing: ~2.7 GB held by five already-merged branches.
#
# Deliberately NOT changing docker.yml's cache strategy. Those exports are
# already tuned with measurements recorded in comments there (whole-image
# mode=max was removed for costing 130-225s per job at ~0 reuse). Reclaiming
# dead-branch entries gets the quota back without touching a tuned hot path.
name: Cache Prune

on:
  # Reclaim a branch's caches the moment the branch goes away (#7124).
  #
  # A daily sweep is slower than the thing it is racing. The apt entry was
  # measured gone 11 hours after being written, so a once-a-day prune leaves a
  # window in which dead-branch blobs are still holding quota and still
  # evicting the entry whose absence forces race shards back onto the Ubuntu
  # mirrors. Deleting a branch is the exact moment its buildkit blobs become
  # permanently unrestorable, so it is also the cheapest moment to reclaim
  # them.
  #
  # This needs no change to the prune step: that step already decides purely on
  # whether a cache's branch still resolves, so a `delete` run simply finds the
  # just-deleted ref among the dead ones. Runs are serialized by the
  # `cache-prune` concurrency group below, so a burst of branch deletions
  # queues rather than racing, and a run with nothing to reclaim exits early.
  delete:
  schedule:
    # Every 6 hours. Bounds worst-case reclaim latency below the ~11h eviction
    # window above for branches that are merged but not deleted (and for the
    # buildkit exports of branches nobody ever deletes), which the `delete`
    # trigger alone cannot cover. Kept off the top of the hour to avoid
    # competing with the scheduled build/test fleet for API budget.
    - cron: '37 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be deleted without deleting it'
        type: boolean
        default: false
      quota_target_mb:
        description: 'Reclaim superseded buildkit blobs until usage is under this (MB)'
        type: string
        default: '8192'
      min_blob_age_days:
        description: 'Never reclaim a buildkit blob younger than this many days'
        type: string
        default: '3'

permissions:
  actions: write
  contents: read

concurrency:
  group: cache-prune
  cancel-in-progress: false

jobs:
  prune:
    # `delete` also fires for tags, and this repo cuts them frequently
    # (v4.35.0/v4.36.0/v4.36.1 inside a single day). A tag has no cache entries
    # of its own, so a tag deletion would spend a full sweep to reclaim
    # nothing. Schedule and manual runs are unaffected.
    if: github.event_name != 'delete' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Delete caches for branches that no longer exist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Defaults repeated here because scheduled and `delete`-triggered
          # runs have no inputs context at all (it is empty, not defaulted).
          QUOTA_TARGET_MB: ${{ inputs.quota_target_mb || '8192' }}
          MIN_BLOB_AGE_DAYS: ${{ inputs.min_blob_age_days || '3' }}
        run: |
          set -euo pipefail

          # Refs that must NEVER be pruned even if a branch lookup hiccups.
          # v4 is the default branch and v5 is the active next-gen line; their
          # caches are the ones we are trying to PROTECT, not reclaim.
          protected_branches="v4 v5 ${{ github.event.repository.default_branch }}"

          echo "::group::Collecting cache entries"
          # Paginate explicitly rather than with --paginate: the caches API
          # returns an object (not a bare array), so each page needs its own jq.
          : > /tmp/caches.tsv
          page=1
          while :; do
            count=$(gh api "repos/${REPO}/actions/caches?per_page=100&page=${page}" \
              --jq '.actions_caches | length')
            [ "$count" -gt 0 ] || break
            gh api "repos/${REPO}/actions/caches?per_page=100&page=${page}" \
              --jq '.actions_caches[] | [.id, .ref, .size_in_bytes, .key, .created_at] | @tsv' >> /tmp/caches.tsv
            page=$(( page + 1 ))
            # Hard stop so a pagination bug can never spin forever.
            [ "$page" -le 50 ] || { echo "::warning::stopping at page 50"; break; }
          done
          total=$(wc -l < /tmp/caches.tsv | tr -d ' ')
          echo "collected ${total} cache entries"
          echo "::endgroup::"

          # Resolve branch existence ONCE per distinct ref. A cache ref is either
          # refs/heads/<branch> or refs/pull/<n>/merge. Only refs/heads/* are
          # considered here: pull refs are reaped by GitHub with the PR and are
          # small (single-digit MB), so they are not worth the API calls or the
          # risk of racing an open PR.
          echo "::group::Resolving branches"
          : > /tmp/dead_refs.txt
          cut -f2 /tmp/caches.tsv | sort -u | while read -r ref; do
            case "$ref" in
              refs/heads/*) ;;
              *) continue ;;
            esac
            branch=${ref#refs/heads/}

            skip=0
            for p in $protected_branches; do
              if [ "$branch" = "$p" ]; then skip=1; fi
            done
            if [ "$skip" -eq 1 ]; then
              echo "keep (protected): ${branch}"
              continue
            fi

            # Fail CLOSED: only a definitive 404 marks a branch dead. Any other
            # error (rate limit, 5xx, network) keeps the cache. Deleting a live
            # branch's cache only costs a rebuild, but doing it on a transient
            # API blip would churn quota for no reason and make this job's
            # behaviour non-deterministic.
            if gh api "repos/${REPO}/branches/${branch}" --silent >/dev/null 2>&1; then
              echo "keep (branch alive): ${branch}"
            else
              status=$(gh api "repos/${REPO}/branches/${branch}" --include 2>&1 | head -1 || true)
              case "$status" in
                *404*)
                  echo "PRUNE (branch gone): ${branch}"
                  echo "$ref" >> /tmp/dead_refs.txt
                  ;;
                *)
                  echo "::warning::keeping ${branch} — branch lookup was inconclusive: ${status}"
                  ;;
              esac
            fi
          done
          echo "::endgroup::"

          if [ ! -s /tmp/dead_refs.txt ]; then
            echo "No caches on deleted branches."
          fi

          echo "::group::Deleting"
          reclaimed=0
          deleted=0
          : > /tmp/deleted_ids.txt
          while IFS=$'\t' read -r id ref size key created; do
            if [ -s /tmp/dead_refs.txt ] && grep -qxF "$ref" /tmp/dead_refs.txt; then
              mb=$(( size / 1048576 ))
              if [ "${DRY_RUN:-false}" = "true" ]; then
                echo "would delete ${mb}MB  ${ref}  ${key}"
              else
                if gh api -X DELETE "repos/${REPO}/actions/caches/${id}" --silent >/dev/null 2>&1; then
                  echo "deleted ${mb}MB  ${ref}  ${key}"
                  echo "$id" >> /tmp/deleted_ids.txt
                  deleted=$(( deleted + 1 ))
                  reclaimed=$(( reclaimed + size ))
                else
                  # A concurrent prune or GitHub's own eviction can remove an
                  # entry between listing and deleting. That is success, not
                  # failure — the quota is free either way.
                  echo "::notice::could not delete cache ${id} (already gone?)"
                fi
              fi
            fi
          done < /tmp/caches.tsv
          echo "::endgroup::"

          # ---------------------------------------------------------------
          # Second pass: reclaim quota from SUPERSEDED buildkit blobs (#7336)
          #
          # The dead-branch pass above cannot fix the eviction this file was
          # written to stop, because almost none of the quota is on dead
          # branches. Measured 2026-09-17, 392 entries totalling 10.89 GB —
          # already OVER the 10 GB ceiling, so LRU eviction is running
          # continuously:
          #
          #   refs/heads/v4 .......... 9.21 GB across 324 entries (PROTECTED)
          #   buildkit-blob-* ........ 10.54 GB across 293 entries (97%)
          #   hive-cgo-race-apt-* .... ABSENT
          #
          # The apt entry the header describes as "deleted within hours" was
          # not merely evicted, it did not exist at all — and the branch
          # holding the quota is v4, which the pass above will never touch by
          # design. Protecting v4's caches and reclaiming v4's quota are not
          # the same thing: docker.yml exports a fresh content-addressed blob
          # set on every push, and the superseded ones stay until LRU picks a
          # victim. The victim is always the smallest useful entry.
          #
          # Age is measured on created_at, NOT last_accessed_at. Every blob in
          # the repo showed a last_accessed_at inside 24h because buildkit
          # reads the cache manifest on every build, which refreshes the
          # timestamp for blobs it then does not use. created_at is the only
          # field that distinguishes a superseded blob from a live one.
          #
          # Deleting a buildkit blob costs a rebuild of that layer and nothing
          # else — they are content-addressed and re-exported by the next
          # docker.yml run. That is why this pass may touch protected branches
          # while the dead-branch pass must not: it reclaims a REBUILDABLE
          # export, never a branch's only copy of anything.
          #
          # Targeted, not unconditional: it deletes oldest-first only while
          # usage exceeds QUOTA_TARGET_MB, and never touches a blob younger
          # than MIN_BLOB_AGE_DAYS. At the measured population a 3-day floor
          # frees 2.50 GB (49 blobs), taking the repo to 8.39 GB — enough
          # headroom that a ~50 MB apt entry survives.
          echo "::group::Reclaiming buildkit quota"
          quota_target_mb="${QUOTA_TARGET_MB:-8192}"
          min_age_days="${MIN_BLOB_AGE_DAYS:-3}"
          # ISO-8601 UTC, compared as a STRING. mktime() is a gawk extension
          # and Ubuntu's default awk is mawk, so an epoch comparison would die
          # with "calling undefined function mktime" on the runner. These
          # timestamps are fixed-width, zero-padded and UTC, so they sort and
          # compare lexically — which also sidesteps the fractional seconds
          # GitHub includes (2026-09-17T14:33:32.300134Z).
          cutoff=$(date -u -d "${min_age_days} days ago" +%Y-%m-%dT%H:%M:%S 2>/dev/null \
            || date -u -v-"${min_age_days}"d +%Y-%m-%dT%H:%M:%S)

          # Recompute current usage from what SURVIVED the pass above.
          : > /tmp/live.tsv
          while IFS=$'\t' read -r id ref size key created; do
            # Explicit if/then, not `grep && continue`: under `set -e` the
            # exit status of a failed AND-OR list is treated inconsistently
            # across shells, and a no-match grep here is the NORMAL case.
            if grep -qxF "$id" /tmp/deleted_ids.txt 2>/dev/null; then
              continue
            fi
            printf '%s\t%s\t%s\t%s\t%s\n' "$id" "$ref" "$size" "$key" "$created" >> /tmp/live.tsv
          done < /tmp/caches.tsv

          used=$(awk -F'\t' '{s+=$3} END{print s+0}' /tmp/live.tsv)
          target=$(( quota_target_mb * 1048576 ))
          echo "usage after dead-branch pass: $(( used / 1048576 )) MB (target ${quota_target_mb} MB)"

          if [ "$used" -le "$target" ]; then
            echo "under target; no buildkit reclaim needed"
          else
            # Oldest-first: the least likely to be referenced by a current image.
            awk -F'\t' -v cutoff="$cutoff" '
              $4 ~ /^buildkit-blob/ && $5 < cutoff { print $5 "\t" $1 "\t" $3 "\t" $4 }
            ' /tmp/live.tsv | LC_ALL=C sort > /tmp/blob_candidates.tsv

            echo "$(wc -l < /tmp/blob_candidates.tsv | tr -d ' ') blob(s) older than ${min_age_days}d eligible"
            while IFS=$'\t' read -r created id size key; do
              [ "$used" -gt "$target" ] || break
              mb=$(( size / 1048576 ))
              if [ "${DRY_RUN:-false}" = "true" ]; then
                echo "would delete ${mb}MB  ${created}  ${key}"
                used=$(( used - size ))
                blob_reclaimed=$(( ${blob_reclaimed:-0} + size ))
                blob_deleted=$(( ${blob_deleted:-0} + 1 ))
              elif gh api -X DELETE "repos/${REPO}/actions/caches/${id}" --silent >/dev/null 2>&1; then
                echo "deleted ${mb}MB  ${created}  ${key}"
                used=$(( used - size ))
                blob_reclaimed=$(( ${blob_reclaimed:-0} + size ))
                blob_deleted=$(( ${blob_deleted:-0} + 1 ))
              else
                # Raced by GitHub's own eviction or a concurrent prune. The
                # quota is free either way, so this is success.
                echo "::notice::could not delete cache ${id} (already gone?)"
                used=$(( used - size ))
              fi
            done < /tmp/blob_candidates.tsv
          fi
          echo "final usage: $(( used / 1048576 )) MB"
          echo "::endgroup::"

          {
            echo "### Cache prune"
            echo ""
            echo "- Entries examined: **${total}**"
            echo "- Dead branch refs: **$(wc -l < /tmp/dead_refs.txt | tr -d ' ')**"
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "- Mode: **dry run** (nothing deleted)"
            else
              echo "- Caches deleted: **${deleted}**"
              echo "- Reclaimed: **$(( reclaimed / 1048576 )) MB**"
            fi
            echo ""
            echo "- Buildkit blobs reclaimed: **${blob_deleted:-0}** ($(( ${blob_reclaimed:-0} / 1048576 )) MB)"
            echo "- Usage after prune: **$(( used / 1048576 )) MB** (target ${quota_target_mb} MB)"
            echo ""
            echo "Protects the \`hive-cgo-race-apt-*\` offline package cache from LRU eviction (kubestellar/hive#7031, #7336)."
          } >> "$GITHUB_STEP_SUMMARY"
