  publish:
    needs: [build, windows-smoke, provider-containment]
    if: github.event_name == 'push' && needs.build.outputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hive-integrated-${{ github.sha }}
          path: .release/dist
      - name: Sign build provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            .release/dist/hive-integrated-*.tar.gz
            .release/dist/hive-integrated-*.tar.gz.sha256
            .release/dist/hive-integrated-*.zip
            .release/dist/hive-integrated-*.zip.sha256
            .release/dist/install-integrated.sh
            .release/dist/install-integrated.sh.sha256
            .release/dist/install-integrated.ps1
            .release/dist/install-integrated.ps1.sha256
      - name: Publish fork release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          VISUAL_HIVE_REF: ${{ needs.build.outputs.visual_hive_ref }}
        run: |
          set -euo pipefail
          resolve_tag_target() {
            local object_type="$1"
            local object_sha="$2"
            local depth=0
            while [[ "$object_type" == "tag" ]]; do
              depth=$((depth + 1))
              [[ "$depth" -le 8 ]] || { echo "Annotated tag chain is too deep." >&2; return 1; }
              tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
              object_type="$(jq -r '.object.type' <<<"$tag_object")"
              object_sha="$(jq -r '.object.sha' <<<"$tag_object")"
            done
            [[ "$object_type" == "commit" ]] || { echo "Release tag resolves to unsupported object type: $object_type" >&2; return 1; }
            printf '%s\n' "$object_sha"
          }
          # This exact helper is failure-smoked under transient query, deletion,
          # and still-present release conditions before publication.
          source v2/integrated-release-immutability.sh
          # cleanup_on_exit reads this global from the sourced helper.
          export release_verified=false

          # The tag push is the release authorization and the attestation's
          # immutable source ref. Never create a release tag from a branch-run
          # workflow, because consumers require refs/tags/$RELEASE_TAG.
          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          tag_target="$(resolve_tag_target "$(jq -r '.object.type' <<<"$tag_ref")" "$(jq -r '.object.sha' <<<"$tag_ref")")"
          [[ "$tag_target" == "$GITHUB_SHA" ]] || {
            echo "Refusing to publish: $RELEASE_TAG no longer targets $GITHUB_SHA." >&2
            exit 1
          }
          trap cleanup_on_exit EXIT
          gh release create "$RELEASE_TAG" \
            .release/dist/hive-integrated-*.tar.gz \
            .release/dist/hive-integrated-*.tar.gz.sha256 \
            .release/dist/hive-integrated-*.zip \
            .release/dist/hive-integrated-*.zip.sha256 \
            .release/dist/install-integrated.sh \
            .release/dist/install-integrated.sh.sha256 \
            .release/dist/install-integrated.ps1 \
            .release/dist/install-integrated.ps1.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Hive integrated $RELEASE_TAG" --generate-notes

          if ! verify_published_release_immutable; then
            echo "Refusing to retain a release that GitHub did not mark immutable." >&2
            exit 1
          fi

          verify_dir="$RUNNER_TEMP/hive-published-release-verification"
          install_home="$RUNNER_TEMP/hive-published-release-home"
          install_dir="$RUNNER_TEMP/hive-published-release-install"
          codex_home="$RUNNER_TEMP/hive-published-release-codex"
          mkdir -m 0700 -- "$verify_dir" "$install_home" "$codex_home"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$verify_dir"
          expected_assets=(
            "hive-integrated-${RELEASE_TAG}-linux-amd64.tar.gz"
            "hive-integrated-${RELEASE_TAG}-linux-amd64.tar.gz.sha256"
            "hive-integrated-${RELEASE_TAG}-windows-amd64.zip"
            "hive-integrated-${RELEASE_TAG}-windows-amd64.zip.sha256"
            "install-integrated.sh"
            "install-integrated.sh.sha256"
            "install-integrated.ps1"
            "install-integrated.ps1.sha256"
          )
          mapfile -t actual_assets < <(find "$verify_dir" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          mapfile -t sorted_expected < <(printf '%s\n' "${expected_assets[@]}" | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${sorted_expected[@]}") <(printf '%s\n' "${actual_assets[@]}")
          (cd "$verify_dir" && sha256sum --check --strict "hive-integrated-${RELEASE_TAG}-linux-amd64.tar.gz.sha256")
          (cd "$verify_dir" && sha256sum --check --strict "hive-integrated-${RELEASE_TAG}-windows-amd64.zip.sha256")
          (cd "$verify_dir" && sha256sum --check --strict install-integrated.sh.sha256)
          (cd "$verify_dir" && sha256sum --check --strict install-integrated.ps1.sha256)
          for subject in "${expected_assets[@]}"; do
            gh attestation verify "$verify_dir/$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/integrated-release.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --source-digest "$GITHUB_SHA" \
              --signer-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners >/dev/null
          done
          HOME="$install_home" CODEX_HOME="$codex_home" \
            sh "$verify_dir/install-integrated.sh" --repo "$GITHUB_REPOSITORY" --version "$RELEASE_TAG" --install-dir "$install_dir"
          "$install_dir/hive" --version | grep -Fx "Hive $RELEASE_TAG"
          "$install_dir/hive" --version | grep -Fx "commit: $GITHUB_SHA"
          "$install_dir/bin/visual-hive" --version >/dev/null
          jq -e --arg version "$RELEASE_TAG" --arg hive "$GITHUB_SHA" --arg visual "$VISUAL_HIVE_REF" \
            '.schema_version == "hive.integrated-distribution.v1" and .hive_version == $version and .hive_commit == $hive and .visual_hive_commit == $visual and .hosted_controller_protocol == 1 and .node_version == "v22.23.1"' \
            "$install_dir/distribution-manifest.json" >/dev/null
          HOME="$install_home" CODEX_HOME="$codex_home" "$install_dir/hive" setup \
            --repo DavidDiaz0317/hive-visual-hive-install-proof-20260713-234243 \
            --coverage comprehensive --automation advisory --provider codex --visual-hive --plan --json > "$verify_dir/setup-plan.json"
          jq -e --arg version "$RELEASE_TAG" --arg hive "$GITHUB_SHA" \
            '.plan.schema_version == "hive.setup-plan.v2" and .plan.execution_mode == "hosted" and .plan.read_only == true and .plan.hive_release_version == $version and .plan.hive_commit == $hive and .plan.hosted_controller_protocol == 1 and (.plan.distribution_manifest_sha256 | test("^[a-f0-9]{64}$")) and (.plan.hosted_workflow_sha256 | test("^[a-f0-9]{64}$")) and (.plan.hosted_state_branch | startswith("hive/state-"))' \
            "$verify_dir/setup-plan.json" >/dev/null
          export release_verified=true
          trap - EXIT
