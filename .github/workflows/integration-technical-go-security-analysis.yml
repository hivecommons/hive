# Generated by .github/scripts/generate-integration-ci.py; do not edit.
# Candidate-only technical CI. Ordinary and native CI remain in the source.
name: Integration candidate / Go Security Analysis
'on':
  workflow_call: null
permissions:
  contents: read
concurrency:
  group: ${{ true && 'integration-security' || github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
env:
  GO_CACHE_GUARD_BUILD_CACHE: ${{ 'job' || 'job' }}
jobs:
  required-context-scope:
    name: required context scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run-go-security: ${{ steps.scope.outputs.run-go-security }}
    steps:
    - name: Decide whether Go security checks need real scans
      id: scope
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [ "${{ true }}" = true ] &&
           { [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [[ "$GITHUB_REF" != refs/tags/hive-integration/* ]]; }; then
          echo "::error::Integration candidates require an explicitly dispatched immutable candidate tag"
          exit 1
        fi
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "run-go-security=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        : > changed-files.txt
        page=1
        api_root="${GITHUB_API_URL:-https://api.github.com}"
        while :; do
          curl -fsSL               -H "Authorization: Bearer ${GITHUB_TOKEN}"               -H "Accept: application/vnd.github+json"               "${api_root}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100&page=${page}"               -o changed-files-page.json
          python3 - <<'PYFILES' >> changed-files.txt
        import json
        with open('changed-files-page.json', encoding='utf-8') as f:
            for item in json.load(f):
                print(item['filename'])
        PYFILES
          count=$(python3 - <<'PYCOUNT'
        import json
        with open('changed-files-page.json', encoding='utf-8') as f:
            print(len(json.load(f)))
        PYCOUNT
        )
          [ "$count" -lt 100 ] && break
          page=$((page + 1))
        done
        rm -f changed-files-page.json
        run=false
        while IFS= read -r path; do
          case "$path" in
            CHANGELOG.md|changelog.d/*|src/*|NOTICE|.github/workflows/*|.github/scripts/*|.github/release-lines.yml)
              run=true
              ;;
          esac
        done < changed-files.txt
        echo "run-go-security=${run}" >> "$GITHUB_OUTPUT"
        if [ "$run" = true ]; then
          echo "Go security checks will run real scans."
        else
          echo "No Go security paths changed; required scan contexts will be skipped/success."
        fi
  govulncheck:
    needs: required-context-scope
    if: ${{ always() && (needs.required-context-scope.result != 'success' || needs.required-context-scope.outputs.run-go-security == 'true') && !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-gate/')) }}
    name: govulncheck (known vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Warm shared Go tool cache (serialize the cold-cache population)
      run: bash "$GITHUB_WORKSPACE/.github/scripts/go-toolcache-guard.sh"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        cache: false
        go-version-file: src/go.mod
    - name: Guard shared Go cache (fall back when the runner volume is full)
      run: bash "$GITHUB_WORKSPACE/.github/scripts/go-cache-guard.sh"
    - name: Download Go modules (retry transient proxy resets)
      uses: ./.github/actions/go-mod-download-retry
    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
    - name: Scan
      working-directory: src
      run: govulncheck ./... ./crux/...
  gosec:
    needs: required-context-scope
    if: ${{ always() && (needs.required-context-scope.result != 'success' || needs.required-context-scope.outputs.run-go-security == 'true') && !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-gate/')) }}
    name: gosec (insecure patterns)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Warm shared Go tool cache (serialize the cold-cache population)
      run: bash "$GITHUB_WORKSPACE/.github/scripts/go-toolcache-guard.sh"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        cache: false
        go-version-file: src/go.mod
    - name: Guard shared Go cache (fall back when the runner volume is full)
      run: bash "$GITHUB_WORKSPACE/.github/scripts/go-cache-guard.sh"
    - name: Download Go modules (retry transient proxy resets)
      uses: ./.github/actions/go-mod-download-retry
    - name: Install gosec
      run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
    - name: Scan
      working-directory: src
      continue-on-error: true
      run: gosec -concurrency 4 -exclude-generated ./... ./crux/...
  golangci-lint:
    needs: required-context-scope
    if: ${{ always() && (needs.required-context-scope.result != 'success' || needs.required-context-scope.outputs.run-go-security == 'true') && !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-gate/')) }}
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Warm shared Go tool cache (serialize the cold-cache population)
      run: bash "$GITHUB_WORKSPACE/.github/scripts/go-toolcache-guard.sh"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        cache: false
        go-version-file: src/go.mod
    - name: Guard shared Go cache (fall back when the runner volume is full)
      run: bash "$GITHUB_WORKSPACE/.github/scripts/go-cache-guard.sh"
    - name: Download Go modules (retry transient proxy resets)
      uses: ./.github/actions/go-mod-download-retry
    - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
      with:
        version: v2.13.1
        working-directory: src
        args: ./... ./crux/...
        skip-cache: true
  action-pins:
    name: action pins resolve
    needs: required-context-scope
    if: ${{ always() && (needs.required-context-scope.result != 'success' || needs.required-context-scope.outputs.run-go-security == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Action-pins gate self-test
      run: bash src/scripts/test-check-action-pins.sh
    - name: Check every pinned action SHA exists
      env:
        GH_TOKEN: ${{ github.token }}
      run: src/scripts/check-action-pins.sh .github/workflows
  notice-drift:
    name: NOTICE matches the module graph
    needs: required-context-scope
    if: ${{ always() && (needs.required-context-scope.result != 'success' || needs.required-context-scope.outputs.run-go-security == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Exercise NOTICE drift diagnostics
      run: src/scripts/test-check-notice-drift.sh
    - name: Exercise generated-NOTICE validation
      run: src/scripts/test-validate-generated-notice.sh
    - name: Warm shared Go tool cache (serialize the cold-cache population)
      run: bash "$GITHUB_WORKSPACE/.github/scripts/go-toolcache-guard.sh"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        cache: false
        go-version-file: src/go.mod
    - name: Guard shared Go cache (fall back when the runner volume is full)
      run: bash "$GITHUB_WORKSPACE/.github/scripts/go-cache-guard.sh"
    - name: Download Go modules (retry transient proxy resets)
      uses: ./.github/actions/go-mod-download-retry
    - name: Regenerate NOTICE from the current module graph
      run: src/scripts/generate-notice.sh /tmp/NOTICE.generated
    - name: Publish the regenerated NOTICE for the autofix workflow
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: notice-generated
        path: /tmp/NOTICE.generated
        retention-days: 1
        if-no-files-found: error
    - name: Record the PR number for the autofix workflow
      if: github.event_name == 'pull_request'
      run: echo "${{ github.event.pull_request.number }}" > /tmp/pr-number.txt
    - name: Publish the PR number for the autofix workflow
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: notice-pr-number
        path: /tmp/pr-number.txt
        retention-days: 1
        if-no-files-found: error
    - name: Fail if the committed NOTICE is stale
      run: src/scripts/check-notice-drift.sh NOTICE /tmp/NOTICE.generated
