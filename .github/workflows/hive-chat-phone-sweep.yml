# Hive Chat phone sweep (#11852) — drives the dashboard 💬 panel from a
# headless Chromium on the Playwright `Pixel 7` profile and sends every
# suggestion chip, every cheat-sheet chip and every `!help` command. It fails
# when one gets no reply, a `no deterministic handler` reply, `HTTP 4xx/5xx`
# text or an empty-argument error (the #11828/#11829/#11837 class that no Go
# test sees because it lives in the panel, the chip list and the reply text).
#
# By default the job boots its own throwaway hive (#11870): `hive` built from
# this checkout with a minimal config: the placeholder github.app_id (the
# supported dashboard-only boot, no GitHub credentials) and NO dashboard
# token. A token-secured hive answers a bare browser load of `/` with the
# device-flow sign-in page (the SPA only gets its token from the local
# gateway or a pasted prompt), so Playwright never reaches #hiveChatFab; the
# token-less boot is the documented open/dev mode that admits the loopback
# caller as owner. It lives for one job on an ephemeral runner, so the open
# dashboard is never reachable by anyone else, and the sweep needs no repo
# vars/secrets.
# Manual runs can still target a live v6 test hive (the src/test HIVE_URL +
# HIVE_TOKEN convention): dispatch with `live: true` (and optionally
# `live_url`), which reads vars.HIVE_CHAT_SWEEP_URL and
# secrets.HIVE_CHAT_SWEEP_TOKEN (or a seeded `hive_session` cookie in
# secrets.HIVE_CHAT_SWEEP_SESSION).
#
# Message-list heights at 412x839 and 412x480 (on-screen keyboard) are
# enforced against the MIN_MESSAGES_HEIGHT_* minimums below (post-#11857
# layout); measured vs minimum lands in the job summary. Non-required: not a
# branch-protection context.
name: Hive Chat phone sweep

on:
  schedule:
    - cron: '23 5,17 * * *'
  workflow_dispatch:
    inputs:
      live:
        description: 'Sweep a live test hive (vars.HIVE_CHAT_SWEEP_URL + secrets.HIVE_CHAT_SWEEP_TOKEN/SESSION) instead of a CI-booted one'
        type: boolean
        default: false
      live_url:
        description: 'Live hive URL (overrides vars.HIVE_CHAT_SWEEP_URL; implies live)'
        type: string
        default: ''
  pull_request:
    branches: [v6]
    paths:
      - '.github/scripts/hive-chat-phone-sweep.js'
      - '.github/workflows/hive-chat-phone-sweep.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sweep:
    if: github.repository == 'hivecommons/hive'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HIVE_RUNNER_LABELS || '["ubuntu-latest"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    continue-on-error: false
    env:
      SWEEP_LIVE: ${{ github.event_name == 'workflow_dispatch' && (inputs.live || inputs.live_url != '') }}
      LIVE_HIVE_URL: ${{ inputs.live_url || vars.HIVE_CHAT_SWEEP_URL }}
      SWEEP_OUT: ${{ github.workspace }}/hive-chat-sweep
      PLAYWRIGHT_VERSION: '1.55.0'
      CI_HIVE_PORT: '3001'
      # #hiveChatMessages height minimums (px). Rule (#11870 maintainer
      # decision): 90% of the post-#11857 measured height, rounded down to
      # 10px, never below 50% of viewport height at 412x839 or 35% at 412x480.
      # Floor-derived; replace with 90% of measured once a run is available —
      # no post-#11857 sweep run existed on v6 when these were set, so:
      #   412x839:              floor 50% x 839 = 419.5 -> 410
      #   412x480 (keyboard up): floor 35% x 480 = 168   -> 160
      # When raising them, record the measured `layout:` line here, e.g.
      #   measured 700px -> 90% = 630 -> 630.
      MIN_MESSAGES_HEIGHT_412x839: '410'
      MIN_MESSAGES_HEIGHT_412x480_KEYBOARD: '160'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Syntax check sweep script
        run: node --check .github/scripts/hive-chat-phone-sweep.js
      - name: Resolve sweep target
        id: cfg
        env:
          LIVE_TOKEN: ${{ secrets.HIVE_CHAT_SWEEP_TOKEN }}
          LIVE_SESSION: ${{ secrets.HIVE_CHAT_SWEEP_SESSION }}
        run: |
          if [ "$SWEEP_LIVE" != 'true' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'boot=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'boot=false' >> "$GITHUB_OUTPUT"
          if [ -z "$LIVE_HIVE_URL" ] || { [ -z "$LIVE_TOKEN" ] && [ -z "$LIVE_SESSION" ]; }; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Skipping live Hive Chat phone sweep: set live_url or vars.HIVE_CHAT_SWEEP_URL, and secrets.HIVE_CHAT_SWEEP_TOKEN (or HIVE_CHAT_SWEEP_SESSION), for a v6 test hive.'
            exit 0
          fi
          echo 'run=true' >> "$GITHUB_OUTPUT"
          {
            echo "HIVE_URL=$LIVE_HIVE_URL"
            echo "HIVE_TOKEN=$LIVE_TOKEN"
            echo "HIVE_SESSION=$LIVE_SESSION"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.cfg.outputs.boot == 'true'
        with:
          cache: false
          go-version-file: src/go.mod
      - name: Build hive
        if: steps.cfg.outputs.boot == 'true'
        working-directory: src
        run: go build -o "$RUNNER_TEMP/ci-hive/hive" ./cmd/hive
      - name: Boot throwaway hive (token-less open/dev dashboard)
        if: steps.cfg.outputs.boot == 'true'
        run: |
          dir="$RUNNER_TEMP/ci-hive"
          # The hive writes runtime state under /data; give the runner user one.
          [ -w /data ] || { sudo -n mkdir -p /data && sudo -n chown "$(id -u):$(id -g)" /data; } || true
          # Throwaway config: placeholder github.app_id is the supported
          # dashboard-only boot (no GitHub credentials, agents never start).
          # No dashboard token on purpose: with one set, GET / is the
          # device-flow sign-in page, not the SPA, and the sweep never finds
          # #hiveChatFab. Token-less, the dashboard admits the browser as
          # owner (pkg/dashboard/server.go authenticate, "open by design").
          cat > "$dir/hive.yaml" <<YAML
          project:
            org: hive-chat-sweep
            repos: [sweep]
            primary_repo: sweep
          github:
            app_id: 999999999
          agents:
            scanner:
              enabled: false
              backend: claude
              role: scanner
          dashboard:
            port: ${CI_HIVE_PORT}
          YAML
          # Unset so a runner-wide value can never turn the boot back into a
          # token-secured (sign-in page) dashboard.
          env -u HIVE_DASHBOARD_TOKEN -u DASHBOARD_AUTH_TOKEN HIVE_CONFIG="$dir/hive.yaml" \
            nohup "$dir/hive" --config "$dir/hive.yaml" > "$dir/hive.log" 2>&1 &
          echo $! > "$dir/hive.pid"
          url="http://127.0.0.1:${CI_HIVE_PORT}"
          for _ in $(seq 1 90); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url/" || true)"
            if [ "$code" = '200' ]; then
              echo "CI hive answering at $url (HTTP $code)"
              echo "HIVE_URL=$url" >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "$code" = '401' ]; then
              echo "::error::CI-booted hive answered GET / with HTTP 401 (sign-in page), so a dashboard token is configured; the sweep needs the token-less boot"
              tail -n 200 "$dir/hive.log"
              exit 1
            fi
            if ! kill -0 "$(cat "$dir/hive.pid")" 2>/dev/null; then break; fi
            sleep 2
          done
          echo '::error::CI-booted hive did not answer on its dashboard port'
          tail -n 200 "$dir/hive.log"
          exit 1
      - name: Install Playwright Chromium
        if: steps.cfg.outputs.run == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p sweep-deps && cd sweep-deps
          npm install --no-save --no-package-lock --ignore-scripts "playwright@${PLAYWRIGHT_VERSION}"
          npx --no-install playwright install --with-deps chromium
          echo "NODE_PATH=$PWD/node_modules" >> "$GITHUB_ENV"
      - name: Sweep chips and !help commands (Pixel 7)
        if: steps.cfg.outputs.run == 'true'
        run: node .github/scripts/hive-chat-phone-sweep.js
      - name: CI hive log
        if: always() && steps.cfg.outputs.boot == 'true'
        run: |
          dir="$RUNNER_TEMP/ci-hive"
          [ -f "$dir/hive.pid" ] && kill "$(cat "$dir/hive.pid")" 2>/dev/null || true
          mkdir -p "$SWEEP_OUT"
          [ -f "$dir/hive.log" ] && cp "$dir/hive.log" "$SWEEP_OUT/ci-hive.log" || true
      - name: Upload screenshots
        if: always() && steps.cfg.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hive-chat-phone-sweep
          path: hive-chat-sweep/
          if-no-files-found: ignore
          retention-days: 14
