name: Hive action tests

on:
  pull_request:
    paths:
      - '.github/actions/hive/**'
      - '.github/scripts/test-hive-action-app-handle.sh'
      - '.github/workflows/hive-action-smoke.yml'
      - '.github/workflows/hive-action-tests.yml'
  push:
    branches: [v6]
    paths:
      - '.github/actions/hive/**'
      - '.github/scripts/test-hive-action-app-handle.sh'
      - '.github/workflows/hive-action-smoke.yml'
      - '.github/workflows/hive-action-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  app-handle:
    name: App handle resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Hermetic (gh double, no network): the relay comment must mention the
      # configured App handle or the hive never sees the command (#9707).
      - name: Test hive action App handle
        run: bash .github/scripts/test-hive-action-app-handle.sh
