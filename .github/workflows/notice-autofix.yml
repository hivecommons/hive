# NOTICE Autofix — commit the regenerated NOTICE back onto Dependabot's own
# Go-module bump branches.
#
# WHY THIS WORKFLOW EXISTS (#5256)
#
# The "NOTICE matches the module graph" gate (go-security-analysis.yml, job
# notice-drift) compares the committed NOTICE byte-for-byte against a fresh
# regeneration from src/go.mod + src/go.sum. That comparison is correct and
# worth keeping — it is what surfaced an AGPL-3.0 dependency entering this
# Apache-2.0 project (#5016). But it fails on EVERY Dependabot gomod PR by
# construction: a version bump changes the module graph, so the committed
# NOTICE necessarily no longer matches, and Dependabot cannot regenerate it
# (that needs a Go toolchain and the pinned go-licenses). Result: 100% of
# gomod bumps arrive permanently red and each one needs a human to check out
# the branch, run the generator, and push.
#
# This workflow closes that loop. It does NOT weaken the gate: the gate still
# runs, still compares byte-for-byte, and still fails when NOTICE is stale.
# What changes is that for a Dependabot branch the staleness is repaired
# automatically, so the next run of the gate passes on a correct NOTICE
# rather than a human doing the same mechanical regeneration by hand.
#
# WHY workflow_run AND NOT pull_request_target
#
# The obvious implementation is a pull_request_target job that checks out the
# PR head and runs src/scripts/generate-notice.sh with a contents:write token.
# That is unsafe even when gated to Dependabot: generate-notice.sh resolves
# and downloads the module graph described by the PR's own go.mod/go.sum, so
# it executes tooling against attacker-influenceable inputs while holding a
# token that can write to the repository. `go install`, module resolution and
# go-licenses all run arbitrary upstream code paths.
#
# workflow_run splits the privilege from the untrusted work:
#
#   * go-security-analysis.yml's notice-drift job runs on `pull_request` —
#     read-only token, no secrets — and uploads its already-generated
#     /tmp/NOTICE.generated as an artifact. It was going to generate that
#     file anyway; it now publishes it.
#   * this workflow runs on `workflow_run`, so it executes the version of
#     itself committed on the DEFAULT branch, never the PR's version. It
#     downloads the artifact and commits it. It never checks out or runs any
#     code from the PR head.
#
# The artifact is data, not code, and it is validated below before use.
#
# WHY THE VALIDATION STEP IS NOT OPTIONAL
#
# Committing a generated file from an artifact means the artifact's content
# becomes the repository's attribution record. Three things are checked
# before anything is committed, and any failure aborts loudly rather than
# committing a degraded NOTICE:
#
#   1. The file must carry the generator's real header — a truncated or
#      empty artifact must never overwrite a good NOTICE.
#   2. No trailing-whitespace lines (#5064). The generator normalizes these,
#      but committing an unnormalized file would guarantee a permanent diff
#      against every future regeneration.
#   3. No unverified/missing license text, and no FORBIDDEN license class.
#      A copyleft dependency entering the tree must still stop the pipeline
#      and reach a human — auto-committing a NOTICE that records an AGPL
#      dependency would launder a license problem into a green check.
#
# WHY THE HELD RUNS ARE RELEASED AFTER THE PUSH (#11552)
#
# When the push above is made with GITHUB_TOKEN, the new head's `pull_request`
# `synchronize` runs carry `github-actions[bot]` as their actor. Under the
# repository's "require approval for first-time contributors" policy GitHub
# creates every one of those runs and immediately holds it
# (`conclusion=action_required`) — observed on hivecommons/hive#11552, where
# v2 CI, v2 Tests, Go Security Analysis and the rest sat held for two days
# while the Dependabot PR showed none of its required contexts. The old
# branch's green runs do not carry over: branch protection looks at the head
# SHA, and the head is now the autofix commit. Nothing merges that PR until
# somebody clicks "Approve and run" on every held run.
#
# So the same workflow that creates the held runs releases them, exactly as
# the top-up workflows do for the sync PRs they push (#7930). This needs
# `actions: write`; it approves only runs on the head this job just pushed,
# which is by construction a same-repository Dependabot branch. If Dependabot
# force-pushes a rebase the autofix commit is dropped and this workflow simply
# runs again.
#
# WHY THE PUSH PREFERS TOPUP_PUSH_TOKEN (#11923)
#
# A GITHUB_TOKEN push does not trigger `pull_request_target` workflows at all,
# so the required `verify PR contents` context (pr-verifier.yml, the only
# required context that runs on pull_request_target alone) never appears on
# the autofix head and the PR waits forever. Pushing with TOPUP_PUSH_TOKEN —
# the same optional PAT the top-up workflows use (#7930) — fires
# `pull_request` and `pull_request_target` normally. When the secret is unset
# the push falls back to GITHUB_TOKEN and this job records the verifier
# context itself as `skipped`: pr-verifier skips Dependabot heads by policy,
# and the autofix commit only regenerates NOTICE from the validated artifact.

name: NOTICE Autofix

on:
  workflow_run:
    workflows: ['Go Security Analysis']
    types: [completed]

# contents:write to push the regenerated NOTICE; actions:write to approve the
# `pull_request` runs GitHub holds on the head that push creates (#11552);
# checks:write to record the skipped verifier context on a GITHUB_TOKEN push
# (#11923).
permissions:
  contents: write
  actions: write
  checks: write

concurrency:
  group: notice-autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  regenerate-notice:
    name: Commit regenerated NOTICE for Dependabot
    runs-on: ${{ fromJSON(vars.HIVE_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    # Gate on the triggering run: a Dependabot-authored PR from a branch in
    # this repository. Dependabot never opens PRs from forks, so requiring
    # head_repository == repository closes the fork vector completely.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    steps:
      # Check out the DEFAULT branch state of the PR's branch — i.e. the
      # Dependabot branch itself, which contains only manifest/lockfile
      # changes. Nothing from it is executed; it is the commit target.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          # The push below uses these credentials. See "WHY THE PUSH PREFERS
          # TOPUP_PUSH_TOKEN" above; same optional-PAT convention as
          # changelog-fragment-guard.yml / v5-topup.yml.
          token: ${{ secrets.TOPUP_PUSH_TOKEN != '' && secrets.TOPUP_PUSH_TOKEN || github.token }}

      - name: Download the regenerated NOTICE
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notice-generated
          path: /tmp/notice-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate the regenerated NOTICE before trusting it
        run: src/scripts/validate-generated-notice.sh /tmp/notice-artifact/NOTICE.generated

      - name: Commit and push if NOTICE changed
        id: push
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          cp -- /tmp/notice-artifact/NOTICE.generated NOTICE
          if git diff --quiet -- NOTICE; then
            echo "NOTICE already matches the module graph — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- NOTICE
          # -s because this repository requires DCO sign-off on every commit.
          git commit -s -m "chore: regenerate NOTICE for dependency bump

          Regenerated by .github/workflows/notice-autofix.yml from the module
          graph in this branch's src/go.mod and src/go.sum. See #5256."
          git push origin "HEAD:${HEAD_BRANCH}"
          echo "pushed=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # See "WHY THE PUSH PREFERS TOPUP_PUSH_TOKEN" above. A GITHUB_TOKEN push
      # never triggers pr-verifier.yml (pull_request_target), so report its
      # required context here exactly as the verifier would for Dependabot.
      - name: Record skipped pull_request_target-only required contexts
        if: steps.push.outputs.pushed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD: ${{ steps.push.outputs.pushed }}
          HAS_PUSH_TOKEN: ${{ secrets.TOPUP_PUSH_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_PUSH_TOKEN" = "true" ]; then
            echo "Pushed with TOPUP_PUSH_TOKEN — pr-verifier runs on its own."
            exit 0
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="verify PR contents" \
            -f head_sha="$HEAD" \
            -f status=completed \
            -f conclusion=skipped \
            -f "output[title]=Skipped: autofix-pushed Dependabot head" \
            -f "output[summary]=This head was pushed by NOTICE Autofix (GITHUB_TOKEN) onto a Dependabot branch, which never triggers pull_request_target workflows. PR Verifier is skipped for dependabot[bot] by policy, so the context is recorded as skipped (#11923)." \
            >/dev/null
          echo "recorded skipped 'verify PR contents' on ${HEAD}"

      # See "WHY THE HELD RUNS ARE RELEASED AFTER THE PUSH" above. Approve the
      # held runs on the head just pushed and re-run 0-job startup failures;
      # real failures keep their jobs and are left alone (#7930 pattern).
      - name: Release the pushed head's held workflow runs
        if: steps.push.outputs.pushed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD: ${{ steps.push.outputs.pushed }}
        run: |
          set -euo pipefail
          released=0
          for attempt in 1 2 3 4 5 6; do
            sleep 20
            pending="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=${HEAD}&per_page=100" \
              --jq '.workflow_runs[] | select(.head_repository.full_name == "'"$GITHUB_REPOSITORY"'") | select(.conclusion == "action_required" or (.conclusion == "failure" and .run_attempt == 1)) | "\(.id) \(.conclusion)"')"
            if [ -z "$pending" ]; then
              [ "$attempt" -ge 3 ] && break
              continue
            fi
            while read -r id conclusion; do
              [ -n "$id" ] || continue
              if [ "$conclusion" = "action_required" ]; then
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/${id}/approve" >/dev/null && { echo "approved held run ${id}"; released=$((released+1)); }
              else
                jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${id}/jobs" --jq '.total_count')"
                if [ "$jobs" = "0" ]; then
                  gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/${id}/rerun" >/dev/null && { echo "re-ran 0-job startup failure ${id}"; released=$((released+1)); }
                fi
              fi
            done <<< "$pending"
          done
          echo "released ${released} run(s) for ${HEAD}"

