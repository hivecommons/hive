name: v2 CI

on:
  push:
    branches: [v2, v4, dd]
    # bin/** is in scope because the gh wrapper is a SECURITY boundary (it is the
    # merge gate behind the proxy hard-deny) and previously matched no path
    # filter at all — a change to it triggered no CI whatsoever.
    paths:
      - 'v2/**'
      - 'bin/**'
      - 'config/backends.conf'
      - 'dashboard/**'
      - 'examples/**'
      - '.gitattributes'
      - '.github/workflows/v2-ci.yml'
      - '.github/workflows/integrated-release.yml'
  pull_request:
    branches: [v2, v4, dd]
    # bin/** is in scope because the gh wrapper is a SECURITY boundary (it is the
    # merge gate behind the proxy hard-deny) and previously matched no path
    # filter at all — a change to it triggered no CI whatsoever.
    paths:
      - 'v2/**'
      - 'bin/**'
      - 'config/backends.conf'
      - 'dashboard/**'
      - 'examples/**'
      - '.gitattributes'
      - '.github/workflows/v2-ci.yml'
      - '.github/workflows/integrated-release.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.12'
          cache-dependency-path: v2/go.sum

      - name: Validate production workflows
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 120 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" ../.github/workflows/v2-ci.yml ../.github/workflows/integrated-release.yml
          HIVE_ACTIONLINT="$RUNNER_TEMP/actionlint" go test ./pkg/integrated -run '^TestGeneratedHostedControllerWorkflowActionlint$' -count=1 -timeout 2m

      - name: Build
        run: go build ./...

      - name: Test
        # -short is the documented CI contract: env-dependent integration tests
        # (rootless-podman etc.) guard on testing.Short and self-skip; without
        # it they hard-fail on runners lacking their prerequisites.
        run: go test ./... -short -count=1 -timeout 25m

      - name: Vet
        run: go vet ./...

      # The entrypoint decides which file a hive boots its config from. The
      # hive.yaml.bak -> hive.yaml.runtime migration must keep reading the
      # legacy name, or hives that have not saved since upgrading lose their
      # boot config silently. This executes the real resolver, so a regression
      # fails the PR rather than a deploy.
      - name: Entrypoint runtime-config migration tests
        run: bash deploy/test_entrypoint_runtime_config.sh

      # bin/gh-wrapper.sh is the merge gate standing behind the proxy hard-deny:
      # if its argument parsing is wrong, a prompt-injected agent merges
      # unvetted code. It had NO tests and matched no CI path filter. This
      # EXECUTES the wrapper against a stub gh and asserts on exit codes —
      # grepping the script text (as the entrypoint tests do) cannot catch a
      # parser bug, which is exactly how the audit's N7 bypass survived.
      - name: gh-wrapper gate tests
        working-directory: .
        run: bash bin/test_gh_wrapper_gates.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Proxy Tests
        run: cd proxy && npm ci && npm test

      # bin/contributor-relay.sh is JavaScript run by node despite the .sh
      # extension; node --check needs a .js path, so check a copy.
      - name: Contributor Relay Syntax + Tests
        working-directory: .
        run: |
          bash bin/contributor-agent.test.sh
          cp bin/contributor-relay.sh "${RUNNER_TEMP}/contributor-relay.js"
          node --check "${RUNNER_TEMP}/contributor-relay.js"
          node bin/contributor-relay.test.js

      # `just contribute-k8s` now emits a runnable contributor workload (#2549):
      # a headless Deployment (#2660) with a status-file probe. This runs the
      # real recipe and asserts the workload it produces, so a regression (a
      # dropped headless mode, a broken probe, a token leak into stdout) fails
      # the PR. Requires `just`; the test SKIPs cleanly if it is ever absent.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Contributor K8s Workload Generation
        working-directory: .
        run: bash v2/deploy/test_contribute_k8s_workload.sh
  create-issue-on-failure:
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/v2'
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create issue for test failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.substring(0, 7);
            const title = `[CI] v2 test failure on ${sha}`;

            // Avoid duplicates: check for an open issue with the same title prefix
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 10,
            });
            const dup = existing.data.find(i => i.title.startsWith('[CI] v2 test failure'));
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body: `Another failure on \`${sha}\`: ${runUrl}`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `## CI Failure\n\n- **Commit:** \`${context.sha}\`\n- **Run:** ${runUrl}\n- **Branch:** v2\n\nTests or coverage check failed on push. See the [workflow run](${runUrl}) for details.`,
              labels: ['ci-failure', 'kind/bug'],
            });

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Docker runtime prerequisites
        run: bash v2/deploy/test_dockerfile_visual_runtime.sh

      - name: Build Docker image
        run: docker build -f v2/Dockerfile -t hive:test .

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          name="hive-v2-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f -v "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          # --cap-add NET_ADMIN mirrors the production contract: the pod spec
          # grants it (SCC hive-netadmin) and the image binary carries
          # cap_net_admin+ep file caps (SO_MARK egress attribution), so exec
          # under docker's default cap set fails EPERM by design, not by bug.
          timeout --signal=TERM --kill-after=10s 60s \
            docker run --rm --name "$name" --network none --cap-add NET_ADMIN hive:test --version

  nightly-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    runs-on: ubuntu-latest
    needs: [build-and-test, docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: v2/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}/hive:nightly
            ghcr.io/${{ github.repository }}/hive:nightly-${{ github.sha }}
          build-args: |
            GIT_HASH=${{ github.sha }}
            GIT_SHORT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
