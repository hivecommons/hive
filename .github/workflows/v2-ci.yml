name: v2 CI

on:
  push:
    branches: [v2, v4]
    # bin/** is in scope because the gh wrapper is a SECURITY boundary (it is the
    # merge gate behind the proxy hard-deny) and previously matched no path
    # filter at all — a change to it triggered no CI whatsoever.
    paths: ['v2/**', 'bin/**', '.github/workflows/v2-ci.yml']
  pull_request:
    branches: [v2, v4]
    # bin/** is in scope because the gh wrapper is a SECURITY boundary (it is the
    # merge gate behind the proxy hard-deny) and previously matched no path
    # filter at all — a change to it triggered no CI whatsoever.
    paths: ['v2/**', 'bin/**', '.github/workflows/v2-ci.yml']

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: v2/go.sum

      - name: Build
        run: go build ./cmd/hive/

      - name: Vet
        run: go vet ./...

      # The entrypoint decides which file a hive boots its config from. The
      # hive.yaml.bak -> hive.yaml.runtime migration must keep reading the
      # legacy name, or hives that have not saved since upgrading lose their
      # boot config silently. This executes the real resolver, so a regression
      # fails the PR rather than a deploy.
      - name: Entrypoint runtime-config migration tests
        run: bash deploy/test_entrypoint_runtime_config.sh

      # #3760: the hive binary ships with NO file capability (a file cap EPERMs
      # on exec wherever the bounding set lacks NET_ADMIN); the entrypoint grants
      # NET_ADMIN as a bounding-set-gated AMBIENT cap instead. This unit-tests the
      # CapBnd bit-check (bit 12 / 0x1000) with positive+negative controls and
      # asserts the entrypoint keeps the ambient-cap grant + gosu fallback.
      - name: Entrypoint NET_ADMIN ambient-cap tests (#3760)
        run: bash deploy/test_entrypoint_netadmin_ambient.sh

      # Supply-chain pins regress SILENTLY. The PI_VERSION pin (#3443) landed on
      # v2, and a sync/v2-into-v4-* merge resolved the conflict in favour of the
      # older side and restored `ARG PI_VERSION=latest` — the fix commit is an
      # ancestor of v4, yet the pin was gone. Audit findings F14 and F18 both
      # died this way. This asserts the INVARIANT (nothing floats) rather than
      # any behaviour, so a merge that drops a pin fails the PR instead of
      # quietly shipping a build that trusts whatever npm/Docker Hub serves.
      - name: Supply-chain pin guard
        run: bash deploy/test_supply_chain_pins.sh

      # bin/gh-wrapper.sh is the merge gate standing behind the proxy hard-deny:
      # if its argument parsing is wrong, a prompt-injected agent merges
      # unvetted code. It had NO tests and matched no CI path filter. This
      # EXECUTES the wrapper against a stub gh and asserts on exit codes —
      # grepping the script text (as the entrypoint tests do) cannot catch a
      # parser bug, which is exactly how the audit's N7 bypass survived.
      - name: gh-wrapper gate tests
        working-directory: .
        run: bash bin/test_gh_wrapper_gates.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Proxy Tests
        run: cd proxy && npm ci && npm test

      # bin/contributor-relay.sh is JavaScript run by node despite the .sh
      # extension; node --check needs a .js path, so check a copy.
      - name: Contributor Relay Syntax + Tests
        working-directory: .
        run: |
          bash bin/contributor-agent.test.sh
          cp bin/contributor-relay.sh "${RUNNER_TEMP}/contributor-relay.js"
          node --check "${RUNNER_TEMP}/contributor-relay.js"
          node bin/contributor-relay.test.js

      # `just contribute-k8s` now emits a runnable contributor workload (#2549):
      # a headless Deployment (#2660) with a status-file probe. This runs the
      # real recipe and asserts the workload it produces, so a regression (a
      # dropped headless mode, a broken probe, a token leak into stdout) fails
      # the PR. Requires `just`; the test SKIPs cleanly if it is ever absent.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Contributor K8s Workload Generation
        working-directory: .
        run: bash v2/deploy/test_contribute_k8s_workload.sh
  create-issue-on-failure:
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/v2'
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create issue for test failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.substring(0, 7);
            const title = `[CI] v2 test failure on ${sha}`;

            // Avoid duplicates: check for an open issue with the same title prefix
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 10,
            });
            const dup = existing.data.find(i => i.title.startsWith('[CI] v2 test failure'));
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body: `Another failure on \`${sha}\`: ${runUrl}`,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `## CI Failure\n\n- **Commit:** \`${context.sha}\`\n- **Run:** ${runUrl}\n- **Branch:** v2\n\nTests or coverage check failed on push. See the [workflow run](${runUrl}) for details.`,
              labels: ['ci-failure', 'kind/bug'],
            });

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build -f v2/Dockerfile -t hive:test .

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          name="hive-v2-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f -v "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          # #3760: the binary carries NO file capability anymore, so it must exec
          # under docker's DEFAULT cap set (no --cap-add) — a self-hosted spoke
          # has exactly that bounding set. NET_ADMIN, when present, is raised by
          # the entrypoint as an ambient cap; the raw `--version` here needs none.
          # The old `--help || true` form could not fail and asserted nothing.
          timeout --signal=TERM --kill-after=10s 60s \
            docker run --rm --name "$name" --network none hive:test --version

  # #3760 REGRESSION GUARD — overlayfs/containerd in-place exec.
  #
  # The `docker` smoke above builds with plain `docker build` and runs under
  # docker/runc. That combination does NOT reproduce #3760: the crash-loop is a
  # BuildKit metacopy redirect that only manifests when (a) the image is pushed
  # in the OCI-index/attestation form the real pipeline produces AND (b) it is
  # run on the overlayfs snapshotter (containerd/k3s, rootless podman). This job
  # exercises exactly that path: build with buildx like docker.yml does, export
  # an OCI archive, import into CONTAINERD, and assert that
  # `/usr/local/bin/hive --version` execs AT ITS IMAGE PATH (no copy, caps
  # dropped) under the containerd overlayfs snapshotter — the runtime the
  # reporter confirmed fails. If the metacopy redirect ever returns (e.g. a
  # future re-enable of provenance/SBOM or removal of the in-stage rewrite), the
  # binary EPERMs here and the PR is blocked.
  overlayfs-exec-guard:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Build a single-arch image the SAME way docker.yml builds the shipped
      # image — buildx (BuildKit), attestations OFF (provenance:false/sbom:false
      # as in the #3760 fix) — and export it as an OCI archive so containerd
      # imports the real BuildKit layer layout (not the docker daemon's).
      - name: Build image via buildx (OCI archive, no attestations)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: v2/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          outputs: type=oci,oci-mediatypes=true,dest=/tmp/hive-oci.tar,tar=true
          build-args: |
            GIT_HASH=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}

      - name: Run under containerd/overlayfs and assert in-place exec
        shell: bash
        run: |
          set -euo pipefail
          # containerd ships on GitHub ubuntu runners; ensure it is up and using
          # the overlayfs snapshotter (its default) — that is what makes the
          # metacopy redirect observable.
          sudo systemctl start containerd 2>/dev/null || sudo containerd >/tmp/containerd.log 2>&1 &
          for i in $(seq 1 30); do
            if sudo ctr version >/dev/null 2>&1; then break; fi
            sleep 1
          done
          sudo ctr version
          # Confirm the overlayfs snapshotter is present (the failing runtime).
          sudo ctr plugins ls | grep -i overlayfs || {
            echo "overlayfs snapshotter not available on this runner" >&2; exit 1; }

          IMG="hive-3760-guard:test"
          # Import the OCI archive BuildKit produced into containerd. Resolve
          # the linux/amd64 platform (the archive is single-arch, but pin it so
          # the run below has a concrete manifest to unpack).
          sudo ctr images import --platform linux/amd64 --index-name "$IMG" /tmp/hive-oci.tar \
            || sudo ctr images import --index-name "$IMG" /tmp/hive-oci.tar
          sudo ctr images ls | grep "$IMG"

          # The assertion: exec /usr/local/bin/hive AT ITS IMAGE PATH, no copy,
          # under containerd's overlayfs snapshotter. --net-host keeps the run
          # simple; we deliberately do NOT add NET_ADMIN — a self-hosted spoke
          # has the docker/containerd default bounding set. Override the
          # entrypoint so we test the raw binary exec (the #3760 symptom is a
          # bare EPERM at execve of the binary, not an entrypoint failure).
          set +e
          out=$(sudo timeout 90s ctr run --rm --snapshotter overlayfs \
                  --net-host \
                  "$IMG" hive-3760-inplace \
                  /usr/local/bin/hive --version 2>&1)
          rc=$?
          set -e
          echo "----- hive --version (in-place, containerd/overlayfs) -----"
          echo "$out"
          echo "exit=$rc"
          if [ $rc -ne 0 ]; then
            echo "::error::#3760 regression: /usr/local/bin/hive failed to exec IN PLACE under containerd/overlayfs (rc=$rc). This is the BuildKit metacopy-redirect crash-loop — a plain build-side attestation/OCI-index change or a removed in-stage binary rewrite has reintroduced it." >&2
            exit 1
          fi
          case "$out" in
            *"Operation not permitted"*|*EPERM*)
              echo "::error::#3760 regression: hive execve returned Operation not permitted at its image path under containerd/overlayfs." >&2
              exit 1 ;;
          esac

          # STALE-BINARY GUARD. The exec check above passes even for an OLD hive
          # binary — a stale binary works fine, it just reports the WRONG commit.
          # A branch-persistent GHA cache once let BuildKit serve a cached
          # final-stage `COPY --from=builder /hive` layer, so the manifest digest
          # advanced but /usr/local/bin/hive was an old build (reported commit
          # 4d9c11c while HEAD had the #3760 fix). Assert the built binary's
          # embedded commit matches THIS build's commit so a stale-layer cache hit
          # is caught directly, not just an exec failure. `hive --version` prints
          # `hive 3.0.0 (commit <short7>, branch <branch>)`; main.gitShort is the
          # 7-char short SHA stamped from GIT_HASH=${{ github.sha }} at build.
          EXPECTED_SHORT="${GITHUB_SHA::7}"
          REPORTED_COMMIT=$(printf '%s\n' "$out" | sed -n 's/.*commit \([0-9a-f][0-9a-f]*\).*/\1/p' | head -n1)
          echo "expected commit=$EXPECTED_SHORT reported commit=$REPORTED_COMMIT"
          if [ -z "$REPORTED_COMMIT" ]; then
            echo "::error::stale-binary guard: could not parse commit from 'hive --version' output — version stamping is broken or the output format changed." >&2
            exit 1
          fi
          if [ "$REPORTED_COMMIT" != "$EXPECTED_SHORT" ]; then
            echo "::error::stale-binary guard: shipped hive reports commit '$REPORTED_COMMIT' but this build is '$EXPECTED_SHORT'. The binary is STALE — a cached final-stage COPY --from=builder layer shipped an old /usr/local/bin/hive (the bug that let #3760's fix miss the published image). Check no-cache-filters covers the runtime stage in docker.yml." >&2
            exit 1
          fi
          echo "OK: hive execs in-place under containerd/overlayfs (no copy, no NET_ADMIN) AND reports the current commit ($REPORTED_COMMIT)."

  nightly-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    runs-on: ubuntu-latest
    needs: [build-and-test, docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: v2/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # #3760: no default provenance/SBOM attestations → plain image
          # manifests, not an OCI index (which is what ships the overlayfs
          # metacopy redirect that makes /usr/local/bin/hive non-exec-able at
          # its image path under containerd/rootless-podman). See docker.yml.
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository }}:nightly
            ghcr.io/${{ github.repository }}:nightly-${{ github.sha }}
          build-args: |
            GIT_HASH=${{ github.sha }}
            GIT_SHORT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
