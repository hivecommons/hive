name: v5 Top-up

# Keeps the v5 GA candidate from going stale faster than the GA checklist can
# close (#7297).
#
# THE PROBLEM. Two rows on the v5 GA bar (#6016) are pinned to exact SHAs —
# "dual v4/v5 hub-spoke operation validation is linked with exact SHAs" and
# "GHCR shows `edge` digest-pinned to the GA candidate". Both are invalidated by
# the next top-up, so while v4 keeps shipping, those rows quietly re-open after
# every release and the candidate being soaked is never the candidate being
# validated. PR #7182 topped v5 up and merged at 16:02Z; ~14h later v4 was 58
# commits ahead again.
#
# THE POLICY THIS IMPLEMENTS. #7297 put two options to the maintainer: make the
# forward-merge a cadence, or slush v4 until GA designation. This is the first:
# forward-merge v4 into v5 immediately after every v4 release tag, mechanically,
# with no human step in the normal path. The slush was not chosen here because
# it halts everyone's v4 work to serve a checklist, and it is the option that
# cannot be undone by deleting a file.
#
# WHY IT CHAINS OFF "Tagged Release". Topping up on every v4 push would open a
# PR per merge and thrash. A release tag is the natural cadence: it is the point
# at which v4 has a name worth carrying forward, and it is exactly the boundary
# #7297 asked for. The daily schedule is a safety net for drift that arrives
# WITHOUT a release (dependency bumps, revert traffic), not the primary trigger.
#
# CONFLICTS ARE A HUMAN SIGNAL, NOT A RETRY. #7199 documented a structural
# divergence that blocked a top-up at only ~14 commits of drift. When the merge
# conflicts, this workflow stops and says so rather than forcing anything: a
# forward-merge that resolves itself wrongly is far worse than one that waits.
# Nothing is pushed in that case, so re-running after a manual top-up is safe.
#
# SECURITY POSTURE. Past top-ups have carried security fixes (grpc v1.83.2 /
# GO-2026-6443 arrived on v5 through a v4 merge), which is why letting v5 lag is
# not cosmetic and why this runs unattended.
#
# POST-FREEZE DISPOSITION (#7693, runbook §4). Once the freeze marshal sets the
# repository variable `V4_FEATURE_FREEZE`, the accepted v4 lifecycle policy
# (#6346) makes v4 -> v5 movement cherry-pick-only: no batch syncs. This
# workflow IS the batch sync, so behind that flag the `top-up` job is skipped
# on every trigger — schedule, release, and manual dispatch alike — and the
# `frozen` job runs instead to leave a visible record of why. Nothing here is
# deleted, so lifting the flag re-arms the cadence without a workflow change.

on:
  workflow_run:
    workflows: ["Tagged Release"]
    types: [completed]
    branches: [v4]
  schedule:
    # Daily safety net for drift that arrives without a release tag.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  top-up:
    # Only after a SUCCESSFUL release; a failed or superseded release run has
    # nothing to carry forward. The schedule and manual paths carry no
    # conclusion, so they are admitted explicitly.
    #
    # And never once v4 is feature-frozen: batch syncs are forbidden by the
    # accepted policy from that line on (see POST-FREEZE DISPOSITION above).
    if: >-
      vars.V4_FEATURE_FREEZE == '' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ${{ fromJSON(vars.HIVE_RUNNER_LABELS || '["ubuntu-latest"]') }}
    permissions:
      contents: write
      pull-requests: write
      # #7930: approve/re-run the PR's own held workflow runs.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a forward-merge needs both lines' commits, and a
          # shallow clone makes every merge look like an unrelated history.
          fetch-depth: 0
          # #7959: GITHUB_TOKEN can never push a commit that touches
          # .github/workflows/** ("refusing to allow a GitHub App to create
          # or update workflow ... without `workflows` permission") and no
          # `permissions:` key grants it, so every dependabot action-pin bump
          # on v4 made this job red until a human carried the sync by hand.
          # TOPUP_PUSH_TOKEN is a fine-grained PAT (Contents: write +
          # Workflows: write on this repo) that the push step uses when set;
          # unset, the job keeps GITHUB_TOKEN and the preflight below turns
          # the server-side rejection into an actionable error instead.
          token: ${{ secrets.TOPUP_PUSH_TOKEN != '' && secrets.TOPUP_PUSH_TOKEN || github.token }}

      - name: Identify the committer
        run: |
          git config user.name "hive-release[bot]"
          git config user.email "hive-release[bot]@users.noreply.github.com"

      - name: Check whether v5 is behind v4
        id: drift
        run: |
          set -euo pipefail
          git fetch --quiet origin v4 v5
          behind="$(git rev-list --count origin/v5..origin/v4)"
          echo "behind=${behind}" >> "$GITHUB_OUTPUT"
          if [ "${behind}" -eq 0 ]; then
            echo "v5 is already level with v4 — nothing to top up."
          else
            echo "v5 is ${behind} commit(s) behind v4."
          fi

      - name: Forward-merge v4 into the top-up branch
        id: merge
        if: steps.drift.outputs.behind != '0'
        run: |
          set -euo pipefail
          # Always rebuild the branch from v5's tip. Reusing a stale top-up
          # branch would replay an older merge and could resurrect commits v5
          # has since had reverted.
          git checkout -B sync/v4-to-v5 origin/v5

          # --signoff because dco-push-delta.yml and dco-post-merge.yml audit
          # v5's history, and a merge commit is a commit like any other.
          if git merge --no-ff --signoff origin/v4 \
               -m "🌱 Forward-merge v4 into v5 (${{ steps.drift.outputs.behind }} commits)"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            # Inventory the conflict BEFORE aborting (#7337). Aborting first
            # throws away the only cheap answer to the question the human
            # actually has: "how big is this, and which files do I need to
            # understand?" Without it every recurrence reports the same bare
            # "conflicts" and the work of sizing it is redone by hand.
            #
            # Hunk count and conflict-line count are reported separately
            # because they say different things. A file can hold two hunks and
            # 21,000 lines when the two lines have diverged wholesale, which is
            # a very different job from twelve small hunks in a doc.
            git diff --name-only --diff-filter=U > /tmp/conflicted.txt || true

            : > /tmp/conflict-rows.tsv
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              # A conflicted path is not necessarily a file with markers in it:
              # a delete/modify conflict leaves NO working-tree file, and grep
              # then exits 2, which is fatal under `set -e`. Those rows are
              # still worth reporting (they are a real decision for the human),
              # so they are counted as zero-hunk rather than skipped.
              hunks=0
              lines=0
              if [ -f "$f" ]; then
                hunks=$(grep -c "^<<<<<<<" "$f" < /dev/null 2>/dev/null) || hunks=0
                lines=$(awk "/^<<<<<<</,/^>>>>>>>/" "$f" 2>/dev/null | wc -l | tr -d " ") || lines=0
              fi
              printf "%s\t%s\t%s\n" "${hunks:-0}" "${lines:-0}" "$f" >> /tmp/conflict-rows.tsv
            done < /tmp/conflicted.txt
            LC_ALL=C sort -rn -k2 /tmp/conflict-rows.tsv -o /tmp/conflict-rows.tsv

            files=$(wc -l < /tmp/conflicted.txt | tr -d " ")
            total=$(awk -F"\t" "{s+=\$2} END{print s+0}" /tmp/conflict-rows.tsv)

            {
              echo "### v4 -> v5 forward-merge conflicts"
              echo ""
              echo "${{ steps.drift.outputs.behind }} commit(s) behind. Conflicting files, largest first:"
              echo ""
              echo "| conflicts | lines | file |"
              echo "| ---: | ---: | --- |"
              while IFS="$(printf "\t")" read -r hunks lines f; do
                [ -n "$f" ] || continue
                echo "| $hunks | $lines | \`$f\` |"
              done < /tmp/conflict-rows.tsv
              echo ""
              echo "**$files** conflicting file(s), **$total** conflicted line(s) in total."
            } > /tmp/conflict-report.md

            cat /tmp/conflict-report.md >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/conflict-report.md

            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report a conflicting top-up and stop
        if: steps.merge.outputs.conflict == 'true'
        run: |
          echo "::error::v4 -> v5 forward-merge conflicts and needs a human (see #7199 for the precedent)."
          echo "Nothing was pushed. Resolve locally:"
          echo "  git checkout -B sync/v4-to-v5 origin/v5"
          echo "  git merge --no-ff --signoff origin/v4"
          echo "  # resolve, then push and open a PR against v5"
          exit 1

      - name: Refuse a workflow-file delta the push credential cannot carry (#7959)
        if: steps.merge.outputs.conflict == 'false'
        env:
          HAS_PUSH_TOKEN: ${{ secrets.TOPUP_PUSH_TOKEN != '' }}
        run: |
          set -euo pipefail
          [ "${HAS_PUSH_TOKEN}" = "true" ] && exit 0
          touched="$(git diff --name-only origin/v5...HEAD -- .github/workflows/ || true)"
          [ -z "${touched}" ] && exit 0
          echo "::error::v4 -> v5 top-up touches workflow files and TOPUP_PUSH_TOKEN is not set — GITHUB_TOKEN cannot push them (#7959)."
          echo "Files: $(echo "${touched}" | tr '\n' ' ')"
          echo "Nothing was pushed. Either add repo secret TOPUP_PUSH_TOKEN (fine-grained PAT, Contents: write + Workflows: write) or carry the sync by hand:"
          echo "  git checkout -B sync/v4-to-v5 origin/v5"
          echo "  git merge --no-ff --signoff origin/v4"
          echo "  git push -u origin sync/v4-to-v5  # then open a PR against v5"
          exit 1

      - name: Push the top-up branch
        if: steps.merge.outputs.conflict == 'false'
        run: git push --force-with-lease origin sync/v4-to-v5

      - name: Ensure gh CLI is available
        if: steps.merge.outputs.conflict == 'false'
        run: |
          set -euo pipefail
          command -v gh >/dev/null 2>&1 && exit 0
          VER=2.63.2
          # #7976: pin and verify unconditionally (the v2-ci.yml `just`
          # convention). This job's checkout persists a push credential — a
          # workflows-write PAT when TOPUP_PUSH_TOKEN is set — so an
          # unverified binary here would run with the repo's most powerful
          # CI token in its working tree. Values from gh_${VER}_checksums.txt.
          SHA256_amd64=912fdb1ca29cb005fb746fc5d2b787a289078923a29d0f9ec19a0b00272ded00
          SHA256_arm64=0f31e2a8549c64b5c1679f0b99ce5e0dac7c91da9e86f6246adb8805b0f0b4bb
          ARCH="$(dpkg --print-architecture 2>/dev/null || uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          case "$ARCH" in
            amd64) SHA256="$SHA256_amd64" ;;
            arm64) SHA256="$SHA256_arm64" ;;
            *) echo "::error::no pinned gh checksum for arch ${ARCH}"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/cli/cli/releases/download/v${VER}/gh_${VER}_linux_${ARCH}.tar.gz" -o /tmp/gh.tgz
          echo "${SHA256}  /tmp/gh.tgz" | sha256sum -c -
          tar -xzf /tmp/gh.tgz -C /tmp
          mkdir -p "$HOME/.local/bin"
          install "/tmp/gh_${VER}_linux_${ARCH}/bin/gh" "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Open or refresh the top-up PR
        if: steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEHIND: ${{ steps.drift.outputs.behind }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --base v5 \
            --head sync/v4-to-v5 --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "PR #${existing} already open for this top-up; the force-push refreshed it."
            exit 0
          fi
          printf '%s\n' \
            "Automated v4 → v5 top-up (#7297)." \
            "" \
            "Carries ${BEHIND} commit(s) from v4 onto v5." \
            "" \
            "This runs after every v4 release tag, plus a daily safety net, so the v5 GA candidate stops drifting between the moment it is validated and the moment it is designated. The two SHA-pinned rows on #6016 can be read against this PR's merge commit." \
            "" \
            "Opened by .github/workflows/v5-topup.yml. If this PR conflicts the workflow fails instead of opening it — a conflicting forward-merge is a human decision (see #7199)." \
            > "$RUNNER_TEMP/v5-topup-body.md"
          gh pr create --repo "$GITHUB_REPOSITORY" --base v5 --head sync/v4-to-v5 \
            --title "🌱 Forward-merge v4 into v5 (${BEHIND} commits)" \
            --body-file "$RUNNER_TEMP/v5-topup-body.md"

      # #7930: a pull_request opened or refreshed by GITHUB_TOKEN carries
      # github-actions[bot] as its actor, and GitHub either holds every
      # pull_request run for approval (action_required) or lets it die at
      # workflow resolution with 0 jobs and the misleading "workflow file
      # issue" banner. Either way the PR shows no test evidence and gets
      # merged on faith. Release those runs here: approve the held ones and
      # re-run the 0-job startup failures. Real failures keep their jobs and
      # are left alone.
      - name: Release the top-up PR's held workflow runs (#7930)
        if: steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          released=0
          for attempt in 1 2 3 4 5 6; do
            sleep 20
            pending="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=${head}&per_page=100" \
              --jq '.workflow_runs[] | select(.conclusion == "action_required" or (.conclusion == "failure" and .run_attempt == 1)) | "\(.id) \(.conclusion)"')"
            [ -n "$pending" ] || { [ "$attempt" -ge 3 ] && break || continue; }
            while read -r id conclusion; do
              [ -n "$id" ] || continue
              if [ "$conclusion" = "action_required" ]; then
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/${id}/approve" >/dev/null && { echo "approved held run ${id}"; released=$((released+1)); }
              else
                jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${id}/jobs" --jq '.total_count')"
                if [ "$jobs" = "0" ]; then
                  gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/${id}/rerun" >/dev/null && { echo "re-ran 0-job startup failure ${id}"; released=$((released+1)); }
                fi
              fi
            done <<< "$pending"
          done
          echo "released ${released} run(s) for ${head}"

  frozen:
    # The visible half of the post-freeze disposition: when the flag is set
    # this job runs INSTEAD of top-up so the run log says why nothing was
    # merged, rather than the workflow silently doing nothing (#7693 §4).
    if: vars.V4_FEATURE_FREEZE != ''
    runs-on: ${{ fromJSON(vars.HIVE_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - name: Report the freeze
        env:
          V4_FEATURE_FREEZE: ${{ vars.V4_FEATURE_FREEZE }}
        run: |
          {
            echo "### v4 -> v5 batch top-up disabled: v4 is feature-frozen"
            echo ""
            echo "Freeze declared: \`${V4_FEATURE_FREEZE}\`. Per the accepted v4 lifecycle policy (#6346)"
            echo "v4 -> v5 movement is now cherry-pick-only; see src/docs/v4-freeze-runbook.md §4"
            echo "for the per-fix procedure. Unset the repository variable to re-arm this cadence."
          } | tee "$GITHUB_STEP_SUMMARY"
