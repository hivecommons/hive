name: Open PR Overlap

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [v5, v6]


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  overlap:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.HIVE_RUNNER_LABELS || '["ubuntu-latest"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Hermetic (local repos + gh double), under a second: a broken check
      # mislabels every open PR, so it must not ship untested (#9319).
      - name: Self-test overlap check
        run: bash .github/scripts/test-pr-overlap.sh
      - name: Check open PR overlap
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/pr-overlap.sh
