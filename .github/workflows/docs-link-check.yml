name: Docs Link Check

# Why this exists
#
# kubestellar/docs (the org's published docs site, Next.js on Netlify at
# kubestellar.io/docs/hive/*) pulls a growing subset of src/docs/*.md straight
# from this repo's `v4` branch on every site build
# (kubestellar/docs:scripts/sync-hive-docs.ts fetches the raw file over HTTP
# and rewrites relative links to site routes or GitHub blob URLs). That sync
# runs no Markdown linter and no link checker of its own — it trusts this
# source tree to already be internally consistent.
#
# That trust broke concretely once already: #5206 fixed three cross-reference
# anchors that a heading rename in design/tui.md had silently broken. Nothing
# failed red when it happened; a human had to notice. This job is the gate
# that catches the same class of break before merge, for every relative link
# and heading anchor inside src/docs/ — whether or not the file happens to be
# on the sync manifest today, since that manifest only grows over time.
#
# It intentionally does NOT validate http(s)/mailto links (network-dependent,
# and not what broke in #5206) and does not touch the sync manifest itself,
# which lives in the separate kubestellar/docs repository.
#
# The job also guards a second, differently-shaped surface: the wiki vault at
# src/deploy/data/wiki/. src/Dockerfile bakes that tree into the image and
# src/deploy/entrypoint.sh seeds it with `cp -rn /opt/hive/seed-data/* /data/`,
# so it is served FLAT from /data/wiki/ with nothing above it. A parent-
# relative link there resolves for a reviewer browsing this repo and 404s for
# the operator reading the deployed page — the repo view is the one that lies,
# which is what makes the break invisible in review (#5309). The wiki step
# therefore runs --vault-root, which treats the vault directory as the reader's
# whole filesystem and rejects any escape regardless of what exists in this
# checkout. Outbound wiki references belong in absolute blob/v4 URLs, which
# resolve identically in both views (#5308).

on:
  push:
    branches:
      - v4
    paths:
      - 'src/docs/**'
      - 'src/deploy/data/wiki/**'
      - 'docs/**'
      - 'src/scripts/check-docs-links.py'
      - 'src/scripts/test-check-docs-links.sh'
      - '.github/workflows/docs-link-check.yml'
  pull_request:
    branches:
      - v4
    paths:
      - 'src/docs/**'
      - 'src/deploy/data/wiki/**'
      - 'docs/**'
      - 'src/scripts/check-docs-links.py'
      - 'src/scripts/test-check-docs-links.sh'
      - '.github/workflows/docs-link-check.yml'

permissions:
  contents: read

jobs:
  link-check:
    name: relative links and anchors resolve
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","hive"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-test the checker against fixtures
        run: bash src/scripts/test-check-docs-links.sh

      - name: Check src/docs/ relative links and anchors
        run: python3 src/scripts/check-docs-links.py src/docs

      # Repo-root docs/ was covered by nothing until #5491: it was absent from
      # both paths: filters and had no step, so a PR breaking a relative link
      # or heading anchor in any of its files ran no link check at all, and no
      # later PR caught it either. Same shape as #5309 (the wiki vault) and the
      # exemptions swept in #5388 — the guard was correct and simply never
      # aimed at this surface.
      #
      # Plain mode, NOT --vault-root: root docs/ is served from the repository,
      # so its many parent-relative links out to src/, bin/, .github/ and the
      # root README resolve normally for a reader. The vault's flat-layout
      # containment rule would reject exactly the links that are correct here.
      - name: Check repo-root docs/ relative links and anchors
        run: python3 src/scripts/check-docs-links.py docs

      # The wiki vault is checked in --vault-root mode, which models the
      # DEPLOYED layout rather than this checkout. See the header comment and
      # check-docs-links.py's docstring: /data/wiki/ has nothing above it, so a
      # parent-relative link is rejected here even when the target exists in
      # the repo. Running the plain checker against this tree would pass
      # exactly the links that are broken in production (#5309).
      - name: Check wiki vault links against the deployed flat layout
        run: python3 src/scripts/check-docs-links.py src/deploy/data/wiki --vault-root
