name: Tagged Release

# Cuts a tagged, immutable release with NO human step in the normal path — the
# operator asked for releases to be "part of the CI's job automatically so we
# do not have to do it manually ever" and "a natural part of the hive's
# maturity". See src/docs/releases.md for the full contract; this header is
# the short version.
#
# TRIGGER: `workflow_run` on "Build and Push Docker Image" (docker.yml)
# completing successfully on branch v4. NOT a tag push — there is no tag until
# THIS workflow creates one. Chaining off docker.yml rather than a parallel
# `push: branches: [v4]` trigger means this workflow only ever runs after the
# continuous-delivery images for that exact commit are already published,
# which is also the digest this workflow retags — it can never race ahead of
# or duplicate that build.
#
# DECISION: src/scripts/derive-release-version.sh reads CHANGELOG.md's
# `## Unreleased` section (already the human-curated, PR-time judgment call
# for "is this release-worthy", not an emoji-prefix guess — see the script's
# own header for why that signal was rejected) and infers release=false
# (nothing under Unreleased => most merges) or release=true plus a
# major/minor/patch bump from which subsection headers are present. A
# CHANGELOG.md `<!-- release: none|major|minor|patch -->` marker is the human
# escape hatch when inference would be wrong.
#
# RACES (#5142, #5222): the gate-earning dance below takes minutes, and v4
# can advance underneath it. Two rules keep that from starving releases or
# painting red runs for normal traffic:
#   - SUPERSESSION IS DEFERRAL, NOT FAILURE. If v4 has already advanced past
#     this run's commit (precheck job), or advances mid-flight (the final
#     step's PR merge becomes non-mergeable because the base moved), this run
#     steps aside cleanly: the very merge that won triggered its own
#     docker.yml run, whose completion triggers a fresh release run for the
#     NEWER tip — and Unreleased is untouched, so that successor derives the
#     same release. Retrying here on the old tip could never succeed anyway:
#     the images were built from THIS commit, so rebasing the release commit
#     onto the new tip would tag content the published images do not
#     contain.
#   - MERGEABILITY SETTLING IS RETRIED. A direct `git push` to v4 (the
#     pre-#5222 approach) was retried on GH006 under the theory that branch
#     protection just needed a few seconds to ingest the gate check-run's
#     conclusion — but that check-run's check suite ran against the scratch
#     branch, not v4, and a direct push's required-status evaluation never
#     counts a check earned on a different ref for the same SHA, so no
#     amount of retrying could ever have worked (confirmed live: 15 retries
#     over 120s, gate green throughout, GH006 every time — run 33330740324).
#     The final step now opens a PR from the scratch branch into v4 and
#     merges it instead, which evaluates required status checks by SHA alone
#     — the same lookup this workflow's own wait-for-gate step already uses,
#     and the same path every ordinary contributor PR into v4 merges
#     through. That merge call is still retried for a bounded window in case
#     GitHub's required-status evaluation needs a moment to settle after the
#     gate check lands, which is a real (if short) async step on GitHub's
#     side independent of the #5222 root cause.
#   - THE MERGE IS SHA-KEYED, NOT AGGREGATE-KEYED (#5318/#5324). That merge
#     is performed by `gh api -X PUT .../pulls/{n}/merge -f sha=<head>`, NOT
#     by `gh pr merge`. `gh pr merge` refuses any PR whose AGGREGATE
#     `mergeStateStatus` is BLOCKED, and a pending NON-required commit
#     status is enough to force BLOCKED even when the only required context
#     is green: on release PR #5319, `gate` was success and `dco` was
#     success, but `tide` sat PENDING (Tide never reports on a PR it will
#     not act on), so `gh pr merge` returned "the base branch policy
#     prohibits the merge" on every attempt for the full retry window. The
#     API call is evaluated server-side against v4's ACTUAL required
#     contexts for that SHA — protection is still fully enforced, an
#     unsatisfied required check still yields 405 — it simply stops
#     consulting a status the repo does not require. This is the same
#     "trust the SHA lookup, not the aggregate or branch-scoped view"
#     reasoning as the wait-for-gate step, extended one step further.
#   - THE RELEASE PR MUST NOT RE-TRIGGER docker.yml (#5339, 7th). Opening the
#     PR below fires docker.yml again on the SAME SHA under `pull_request`.
#     That run is created by GITHUB_TOKEN, so GitHub's recursion guard never
#     starts its jobs and it fails with zero jobs in ~2s — and because
#     protection resolves a required context to the MOST RECENT check-run of
#     that name, it superseded the green `gate` earned seconds earlier and the
#     merge was refused (405) for the whole retry window with no way to
#     recover. docker.yml's `gate` job now skips `release-gate/*` pull_request
#     events so no competing check-run is ever created. If a future change
#     makes the release PR trigger a required check again, this failure comes
#     back looking exactly like a green gate that protection refuses to see.
#
# IDEMPOTENCY: this workflow's own release commit (moving Unreleased into a
# dated section) is what empties Unreleased, which re-triggers docker.yml on
# push, which re-triggers this workflow — and on that second pass Unreleased
# is empty, derive-release-version.sh returns release=false, and the workflow
# is a no-op. It never chases its own tail. `concurrency` below additionally
# serializes any two overlapping runs so two merges landing close together
# cannot race two tags for two different commits — imagetools create (via
# publish-image-tags.sh's monotonic run-number guard, same as docker.yml)
# never regresses a moving tag, and the immutable version tag is refused
# outright if it already exists (a re-run after a partial failure is a safe
# no-op, not a duplicate release).
# BACKSTOP (#5318): the workflow_run trigger alone cannot guarantee that a
# release-worthy commit ever gets a release opportunity. Two ways one is lost
# silently:
#   - A docker.yml run that is CANCELLED never fires workflow_run at all. A
#     multi-arch build takes ~10 minutes, so when merges arrive faster than
#     that, most commits never complete one.
#   - A run that DOES fire defers at `precheck` when v4 has already advanced,
#     on the reasoning that the successor releases instead. That reasoning is
#     sound per-run but has no terminating condition: under sustained merges
#     every successor applies the same test and defers again.
# Neither is a bug in the deferral itself — a superseded run genuinely must
# not release, because its images were built from the old tree (see RACES).
# The gap is that nothing ever comes back for the work left behind. The
# schedule below is that "come back": it runs against v4's CURRENT tip, whose
# images docker.yml has long since published, so it releases the accumulated
# Unreleased section without ever tagging content the images do not contain.
# On a healthy repo it is a no-op (Unreleased is empty => release=false).
on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]
  schedule:
    # Hourly, offset off the hour to avoid GitHub's :00 scheduling crush.
    - cron: "37 * * * *"
  workflow_dispatch:

concurrency:
  group: tagged-release-v4
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  # `actions: write` is required for the `release` job's `gh workflow run
  # docker.yml` call (#5072) — dispatching a workflow via the API needs this
  # scope on top of `contents: write`/`packages: write`, which only cover the
  # git push and image-tag operations this workflow already did.
  actions: write
  # `pull-requests: write` is required for the `release` job's PR-merge path
  # to v4 (#5222, 4th GH006 recurrence): a direct `git push` to v4 is
  # evaluated against required status checks by the push event, and never
  # sees the `gate` check-run earned on the scratch branch even though it is
  # on the identical SHA (see the "Merge release commit to v4" step for the
  # full mechanism). Merging a PR instead evaluates required status checks by
  # SHA lookup against ALL check-runs for that commit, independent of which
  # ref originally produced them — the same lookup every ordinary
  # contributor PR into v4 already relies on.
  pull-requests: write

jobs:
  decide:
    # workflow_run: only a successful docker.yml build of a real v4 push (a
    # workflow_dispatch build is the scratch-branch gate dance this workflow
    # itself starts — releasing off it would be releasing off our own tail).
    # schedule/workflow_dispatch: the #5318 backstop, which has no triggering
    # run to qualify and instead resolves v4's current tip below.
    if: >-
      github.event_name != 'workflow_run' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'v4' &&
      github.event.workflow_run.event != 'workflow_dispatch' )
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.derive.outputs.release }}
      version: ${{ steps.derive.outputs.version }}
      bump: ${{ steps.derive.outputs.bump }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      # workflow_run carries the exact commit docker.yml built. The backstop
      # has no such commit, so it resolves v4's tip — whose images are already
      # published (its docker.yml run completed long before an hourly tick),
      # which is what keeps the retag honest.
      - name: Resolve the commit to consider releasing
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            sha="${{ github.event.workflow_run.head_sha }}"
            echo "Triggered by docker.yml on ${sha}."
          else
            sha="$(gh api "repos/${{ github.repository }}/branches/v4" --jq .commit.sha)"
            echo "Backstop (${{ github.event_name }}): considering v4 tip ${sha}."
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout the commit docker.yml just built
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0 # full history + tags: derive-release-version.sh reads `git tag`

      # The backstop must not tag a commit whose images were never published:
      # it retags an existing digest, so a tip whose docker.yml run is still
      # running (or was cancelled) has nothing to retag. Stand down and let
      # the next tick take it — by then the build has settled either way.
      #
      # This stands down GREEN (an output the release job gates on), not by
      # failing. A tip whose build is still in flight is the ordinary state of
      # a busy branch, and an hourly job that paints the repo red for it would
      # be training everyone to ignore exactly the signal #5318 added.
      - name: Require published images for the backstop's target
        id: images
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ steps.target.outputs.sha }}"
          conclusion="$(gh api \
            "repos/${{ github.repository }}/actions/workflows/docker.yml/runs?head_sha=${sha}&status=completed" \
            --jq '[.workflow_runs[] | select(.event == "push")] | last | .conclusion // ""')"
          if [ "$conclusion" != "success" ]; then
            echo "::warning::Backstop standing down: docker.yml has no successful completed push run for v4 tip ${sha} (found '${conclusion:-none}'), so there is no published digest to retag. The next hourly tick will retry. If this persists, the images for v4's tip are not being built (#5318)."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "docker.yml succeeded on ${sha} — images are published, safe to retag."
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Derive whether this merge warrants a release
        id: derive
        if: github.event_name == 'workflow_run' || steps.images.outputs.published == 'true'
        run: src/scripts/derive-release-version.sh

  # Cheap supersession check BEFORE the expensive release job (#5142): if v4
  # already moved past the commit this run was triggered for, every minute
  # spent here is wasted — the final push can only ever be rejected
  # non-fast-forward — and worse, the `concurrency` group above serializes
  # release runs, so a doomed run delays the successor that CAN release. One
  # API call decides in seconds.
  #
  # #5318: this job used to claim the successor was GUARANTEED to exist ("the
  # merge that advanced v4 triggered docker.yml, whose completion triggers
  # tagged-release.yml for that newer tip"). That guarantee does not hold — a
  # cancelled docker.yml run fires no workflow_run at all, and a successor
  # that does fire applies this same test and defers again. Deferring is still
  # the right call for THIS run (its images were built from the old tree), so
  # the fix is not to stop deferring; it is that the schedule trigger above
  # now provides the terminating condition, and the deferral is logged as a
  # ::warning:: rather than a ::notice:: so a lost opportunity is visible in
  # the run list instead of silently disappearing.
  precheck:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.tip.outputs.proceed }}
    steps:
      - name: Defer to the successor run if v4 already advanced
        id: tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ needs.decide.outputs.sha }}"
          tip="$(gh api "repos/${{ github.repository }}/branches/v4" --jq .commit.sha)"
          if [ "$tip" = "$sha" ]; then
            echo "v4 is still at ${sha} — proceeding with the release."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release opportunity skipped for ${sha}: v4 is already at ${tip}. Deferring — this run's images were built from the older tree, so it must not tag. Unreleased is untouched, so nothing is dropped: either a successor run releases it, or the hourly backstop does. See the RACES note and the BACKSTOP note in this workflow's header (#5142/#5318)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [decide, precheck]
    if: needs.decide.outputs.release == 'true' && needs.precheck.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.decide.outputs.version }}
      SHA: ${{ needs.decide.outputs.sha }}
    steps:
      - name: Checkout the commit docker.yml just built
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      # Refuse outright rather than silently no-op, so a logic bug that
      # recomputes an already-released version is loud. The normal
      # idempotency path (Unreleased already emptied => release=false) never
      # reaches this step at all; reaching it with an existing tag means
      # something upstream disagrees with git's own tag list, which is worth
      # failing on rather than quietly walking past.
      - name: Refuse to reuse an existing tag
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::tag v${VERSION} already exists — refusing to re-release. If this is an unexpected repeat, investigate before re-running." >&2
            exit 1
          fi

      - name: Sanity-check the derived version is well-formed semver
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::derived version '${VERSION}' is not MAJOR.MINOR.PATCH" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # REUSE, NOT REBUILD: docker.yml already built and pushed this exact
      # commit's multi-arch images (that success is why this workflow is
      # running at all — see the workflow_run trigger). `imagetools create`
      # retags the already-published short-SHA digest as the immutable
      # version tag without touching a Dockerfile, a builder, or a single byte
      # of image content — the published v3.1.0 image is byte-identical to
      # the v4-latest / <sha> image docker.yml just pushed for this commit.
      # This is the same primitive src/scripts/publish-image-tags.sh uses for
      # the moving tags, applied here for one additional immutable tag per
      # image. A build-time VERSION ldflag is intentionally NOT used to
      # rebuild these images — see docker.yml's freshness-guard step, which
      # already proved the pushed digest's embedded commit matches this exact
      # SHA; rebuilding here would only reintroduce the risk that guard
      # exists to eliminate.
      - name: Tag immutable version images
        run: |
          set -euo pipefail
          short="${SHA:0:7}"
          for image in hive hive-contributor hive-hub; do
            src="ghcr.io/kubestellar/${image}:${short}"
            dst="ghcr.io/kubestellar/${image}:v${VERSION}"
            echo "Tagging ${dst} from ${src}"
            docker buildx imagetools create -t "$dst" "$src"
          done

      # "A release labelled differently from what it reports is worse than no
      # release" (the operator's framing). Because this workflow retags rather
      # than rebuilds (see above), there is no fresh --version output to check
      # against the tag the way docker.yml's freshness guard checks a commit
      # hash — the binary inside ghcr.io/kubestellar/hive:v${VERSION} was
      # built by an ordinary docker.yml run that never received a VERSION
      # build-arg, so today it always reports the "0.0.0-dev" fallback (see
      # cmd/hive/main.go and src/docs/releases.md, "What still blocks cutting
      # a real release"). Asserting equality here would therefore fail every
      # release until that gap closes, which is the wrong failure mode for a
      # tagging step. What this DOES assert: the image actually pulls, runs,
      # and answers --version at all (the tag is not silently pointing at
      # nothing), and it logs the mismatch plainly rather than the workflow
      # implying an equality check happened that it did not.
      - name: Confirm the newly tagged image runs, and report its embedded version
        run: |
          set -euo pipefail
          img="ghcr.io/kubestellar/hive:v${VERSION}"
          docker pull "$img"
          reported="$(docker run --rm --entrypoint /usr/local/bin/hive "$img" --version)"
          echo "image reports: ${reported}"
          if [[ "$reported" == "hive ${VERSION} "* ]]; then
            echo "Embedded version matches the release tag."
          else
            echo "::warning::v${VERSION} is tagged but the image's --version output does not embed that string (reports: ${reported}). This is the known gap in src/docs/releases.md — the image was built by an ordinary docker.yml run with no VERSION build-arg. The GHCR TAG is still correct and immutable; only the binary's self-report is stale."
          fi

      # NOT stable/candidate/edge. Channel promotion is deliberate, separate
      # policy (src/docs/release-channels.md) and this workflow must never
      # silently couple a version tag to it.
      - name: Confirm channel tags were not touched
        run: |
          echo "This workflow only ever writes vX.Y.Z tags. stable/candidate/edge are owned exclusively by docker.yml's merge jobs on every push to v4, independent of whether a release was cut here."

      # SBOM: a standalone release ARTIFACT, not an in-image attestation.
      #
      # docker.yml sets `provenance: false` / `sbom: false` on every
      # build-push-action step on purpose (#3760, guarded by
      # image-attestation-guard.yml): an attestation can only be carried by an
      # OCI image *index*, and that index form is what let a `COPY --from`
      # layer ship an overlayfs metacopy redirect for /usr/local/bin/hive,
      # which containerd/k3s and rootless podman present as non-executable
      # until copy-up — every hive pulling that image crash-looped at boot.
      # The published per-arch digest MUST stay a plain image manifest, so an
      # SBOM here is generated as an ordinary file and uploaded to the GitHub
      # Release, never attached to the GHCR image in any form.
      #
      # SOURCE: the already-published image digest, not the source tree. A
      # source-tree scan would report what go.mod/package.json ask for; an
      # image scan reports what the shipped filesystem actually contains —
      # the base OS packages (`apk add`, the eleven-setuid-binary inventory
      # the SUID contract already tracks), the Node/tmux layers built from
      # source, and the exact resolved Go module versions — which is the more
      # faithful record for a security consumer of a specific release.
      #
      # TOOL/FORMAT: Syft, SPDX JSON. SPDX is the format the OpenSSF Best
      # Practices badge and most downstream SBOM consumers (e.g. dependency-
      # track) expect natively; Syft needs no separate scan step from a
      # running daemon (unlike Trivy's default vuln-first posture) and reads
      # directly off a registry reference by digest.
      #
      # SCOPE / LIMITATION: `hive` and `hive-hub` are multi-arch
      # (linux/amd64, linux/arm64); this scans the linux/amd64 manifest of
      # each image only, not linux/arm64 separately. Go's cross-compiled
      # binaries and the apk/npm layers in this Dockerfile carry the same
      # package *versions* on both architectures — only the compiled machine
      # code differs, which an SBOM does not describe — so one architecture's
      # package manifest is representative of both. This is recorded here
      # AND in the generated release notes rather than silently shipping one
      # file and implying full multi-arch coverage.
      - name: Generate per-image SBOMs (SPDX JSON, Syft, linux/amd64)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/kubestellar/hive:v${{ env.VERSION }}
          output-file: hive-v${{ env.VERSION }}-sbom.spdx.json
          format: spdx-json
          artifact-name: "" # do not also attach to a GH Actions run artifact; the release upload below is the distribution point

      - name: Generate contributor image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/kubestellar/hive-contributor:v${{ env.VERSION }}
          output-file: hive-contributor-v${{ env.VERSION }}-sbom.spdx.json
          format: spdx-json
          artifact-name: ""

      - name: Generate hub image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/kubestellar/hive-hub:v${{ env.VERSION }}
          output-file: hive-hub-v${{ env.VERSION }}-sbom.spdx.json
          format: spdx-json
          artifact-name: ""

      # NOTICE: third-party license attribution for the Go module
      # dependencies compiled into these images, generated by
      # src/scripts/generate-notice.sh and kept fresh on every PR by
      # go-security-analysis.yml's notice-drift job (so the copy checked out
      # at this exact commit is already authoritative — nothing to
      # regenerate here). Attached the same way the SBOMs above are: a
      # standalone file on the GitHub Release, copied under a versioned name
      # for consistency with the SBOM naming convention rather than
      # generated fresh, since NOTICE (unlike the SBOMs, which scan the
      # published image) is a source-tree artifact CI already keeps in sync
      # with go.mod/go.sum.
      - name: Copy NOTICE under a versioned release-asset name
        run: cp NOTICE "hive-v${VERSION}-NOTICE"

      - name: Move CHANGELOG.md Unreleased section into a dated release entry
        run: |
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"
          python3 - "$today" <<'PYEOF'
          import re, sys
          today = sys.argv[1]
          version = __import__("os").environ["VERSION"]
          path = "CHANGELOG.md"
          with open(path, encoding="utf-8") as f:
              text = f.read()

          marker = "## Unreleased"
          start = text.index(marker)
          # Section body runs from just after the heading line to the next
          # "## " heading (or EOF).
          body_start = text.index("\n", start) + 1
          next_heading = re.search(r"\n## ", text[body_start:])
          body_end = body_start + next_heading.start() + 1 if next_heading else len(text)
          body = text[body_start:body_end]

          # Strip any release markers before filing the section under the
          # dated heading — they are release-decision metadata, not part of
          # the permanent record.
          body = re.sub(r"[ \t]*<!-- *release: *(none|major|minor|patch) *-->\n?", "", body)

          new_unreleased = f"{marker}\n\n"
          dated_heading = f"## {today} (v{version})\n"
          replacement = new_unreleased + dated_heading + body
          text = text[:start] + replacement + text[body_end:]
          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PYEOF

      - name: Commit the release changelog entry
        run: |
          set -euo pipefail
          git config user.name "hive-release-bot"
          git config user.email "actions@github.com"
          git add CHANGELOG.md
          git commit -s -m "🔖 release: v${VERSION}

          Automated release commit. Moves the CHANGELOG.md Unreleased section
          into a dated v${VERSION} entry. See src/docs/releases.md."

      # v4 branch protection requires the "gate" status check (the only
      # required context — see docker.yml) on the exact SHA being pushed.
      # `gate` only ever attaches to a commit via docker.yml's own `push` /
      # `pull_request` / `workflow_dispatch` triggers, so a commit created
      # here in-workflow and pushed straight to v4 has no check on it yet and
      # GitHub rejects the push outright (GH006, #5026) — it can never
      # fast-forward, on the first attempt or any retry, because nothing
      # about retrying produces the missing check.
      #
      # So: push this release commit to a scratch branch first, make
      # docker.yml run on that exact SHA, and wait for `gate` to succeed
      # there.
      #
      # #5072: the scratch push below uses this job's default GITHUB_TOKEN
      # (persisted by actions/checkout). GitHub deliberately does not trigger
      # *other* workflow runs from a GITHUB_TOKEN-authenticated push
      # (recursive-workflow prevention), so docker.yml's `push` trigger never
      # fires on the scratch branch — the original version of this step
      # pushed and then waited forever for a `gate` check that could never
      # exist. docker.yml does have a `workflow_dispatch` trigger that a
      # GITHUB_TOKEN CAN start via the API, so this step explicitly dispatches
      # it against the scratch branch right after pushing, and the resulting
      # run's check-runs attach to that branch's head SHA — the exact release
      # commit. (docker.yml's `gate` job carries a matching `release-gate/*`
      # exception so this dispatch cannot push a GHCR image or a moving tag
      # under the scratch branch name — see the EXCEPTION comment there.)
      - name: Push release commit to a scratch branch and wait for gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scratch="release-gate/v${VERSION}"
          commit_sha="$(git rev-parse HEAD)"

          # NOTE: no cleanup trap here — unlike the pre-#5222 version of this
          # step, the scratch branch must survive past this step so the next
          # step can open a PR from it. It is deleted after the PR merges (or
          # on any failure exit) below, not here.

          echo "Pushing release commit ${commit_sha} to scratch branch ${scratch} to earn a 'gate' check..."
          git push origin "HEAD:refs/heads/${scratch}"

          echo "Dispatching docker.yml on ${scratch} (GITHUB_TOKEN pushes don't trigger it — #5072)..."
          gh workflow run docker.yml --ref "${scratch}"

          echo "Waiting for docker.yml's 'gate' job to report success on ${commit_sha}..."
          deadline=$((SECONDS + 600)) # 10 minutes: gate itself is a ~5s shell job; this bounds queueing/runner delay plus the dispatch's own startup lag, not gate's own runtime
          conclusion=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            conclusion="$(gh api "repos/${{ github.repository }}/commits/${commit_sha}/check-runs" \
              --jq '[.check_runs[] | select(.name == "gate")] | sort_by(.started_at) | last | .conclusion // "pending"')"
            # GitHub treats success/skipped/neutral as satisfying a required
            # status check; only those three should let this proceed.
            case "$conclusion" in
              success|skipped|neutral)
                echo "gate concluded '${conclusion}' on ${commit_sha} — satisfies the required check."
                break
                ;;
              pending)
                ;;
              *)
                echo "::error::gate concluded '${conclusion}' on ${commit_sha} — cannot push to v4." >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          case "$conclusion" in
            success|skipped|neutral) ;;
            *)
              echo "::error::Timed out waiting for gate to succeed on ${commit_sha}. Check whether the workflow_dispatch run against ${scratch} actually started (Actions tab) — if it never queued, docker.yml's workflow_dispatch trigger or this job's actions:write permission may need attention." >&2
              exit 1
              ;;
          esac

      # #5222 (4th GH006 recurrence): a raw `git push origin
      # HEAD:refs/heads/v4` was retried here for up to 120s and rejected
      # EVERY time, even though `gate` had already concluded 'success' on
      # this exact SHA before the very first attempt (run 33330740324 — see
      # the issue for the full timeline). That ruled out propagation lag:
      # the check-runs API reported success from 19:28:18Z onward, and every
      # push from 19:28:19Z to 19:30:26Z was still rejected.
      #
      # Root cause, confirmed via the Checks API on that run's commit: the
      # `gate` check-run's check suite carries `head_branch:
      # "release-gate/v4.0.1"` — the scratch branch — never `v4`, because
      # that is genuinely the ref docker.yml ran against. A direct push to a
      # protected branch evaluates required status checks against reports
      # tied to THAT push/ref event; a check-run earned on a different
      # branch's push, even for the byte-identical commit SHA, never
      # registers as satisfying protection on v4 — there is no propagation
      # window to wait out, because that check-run was never going to count.
      #
      # A pull-request MERGE evaluates required status checks differently:
      # GitHub looks up check-runs by commit SHA alone (`GET
      # /commits/{sha}/check-runs`) against the PR's head SHA, independent of
      # which ref originally produced them — this is the exact lookup this
      # workflow's own wait-for-gate step above already uses, and the same
      # path every ordinary contributor PR into v4 merges through. So: open a
      # PR from the scratch branch (whose head SHA already carries the
      # successful `gate` check-run) into v4, then merge it via the API
      # instead of pushing the ref directly.
      - name: Open and merge a PR from the scratch branch into v4
        id: push_v4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scratch="release-gate/v${VERSION}"
          commit_sha="$(git rev-parse HEAD)"
          merged=false
          pr_number=""

          cleanup() {
            # Only close the PR if it never merged (closing a merged PR is
            # not meaningful and gh errors harmlessly on it). The scratch
            # branch is always deleted here — it has no purpose once this
            # step exits, merged or not.
            if [ "$merged" != true ]; then
              gh pr close "$pr_number" >/dev/null 2>&1 || true
            fi
            git push origin --delete "refs/heads/${scratch}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "Opening a PR from ${scratch} into v4..."
          pr_url="$(gh pr create \
            --base v4 \
            --head "${scratch}" \
            --title "release: v${VERSION}" \
            --body "Automated release PR (#5222). Merges the release commit for v${VERSION}, already carrying a successful gate check on ${commit_sha}." 2>&1)" \
            || { echo "::error::gh pr create failed: ${pr_url}" >&2; exit 1; }
          pr_number="$(grep -oE '[0-9]+$' <<<"$pr_url")"
          echo "Opened PR #${pr_number}: ${pr_url}"

          # #5318/#5324 (5th recurrence): this loop called `gh pr merge`, which
          # refuses to act on a PR whose aggregate `mergeStateStatus` is
          # BLOCKED, and reports `the base branch policy prohibits the merge`.
          # On release PR #5319 that aggregate was BLOCKED while every input
          # protection actually evaluates was green:
          #
          #     gate check-run on bb633caa   success   <- the ONLY required
          #                                               context on v4
          #     dco commit status            success
          #     tide commit status           PENDING   <- never resolves
          #     mergeable                    MERGEABLE
          #     mergeStateStatus             BLOCKED   <- caused by tide
          #
          # `tide` is NOT a required status context on v4 (protection lists
          # `gate` and nothing else), but a pending commit status still drags
          # the aggregate to BLOCKED, and Tide holds that status pending
          # indefinitely for a PR it is never going to act on. So the retry
          # loop waited out its whole window for a state that could not change
          # — the same shape of mistake as #5222, one layer up: waiting on an
          # aggregate/branch-scoped view instead of the SHA-keyed evidence.
          #
          # The fix is the same fix, applied to the merge call: PUT
          # /pulls/{n}/merge with the head SHA. The server still enforces
          # branch protection on that SHA — an unsatisfied REQUIRED context
          # is rejected with 405 — so this does not bypass the gate; it just
          # stops consulting a non-required status that never reports. `sha=`
          # additionally makes the call fail rather than merge if the PR head
          # moved out from under this run.
          #
          # The three failure modes of a merge attempt, and their remedies
          # (carried over from #5142's push-retry logic, now applied to the
          # merge call instead of a raw push):
          #
          #   "not mergeable"/mergeable_state transients (405 while GitHub
          #   finishes recomputing mergeability after the gate check landed,
          #   or a genuinely-unsatisfied required check that is still
          #   settling): retried for a bounded window.
          #
          #   non-fast-forward equivalents (base branch moved, merge
          #   conflict, 409 head-SHA mismatch): v4 advanced mid-flight.
          #   Retrying could never succeed — this release commit is parented
          #   on the old tip, and rebasing it forward would tag source the
          #   already-published images were not built from. Defer instead:
          #   exit green with a notice, push nothing (tag included), and let
          #   the successor run — triggered by the very merge that won — cut
          #   the release from ITS tip. The `pushed` output gates the
          #   GitHub-Release step below so a deferred run creates no release
          #   object either.
          #
          #   anything else: hard-fail.
          # RELEASE_PUSH_GH006_WINDOW is a test seam (test-release-push-retry.sh
          # drives the exhaustion path with 0); production always uses 120s.
          deadline=$((SECONDS + ${RELEASE_PUSH_GH006_WINDOW:-120}))
          while true; do
            # $GITHUB_REPOSITORY (runner-provided) rather than the
            # ${{ github.repository }} expression other steps use: this step's
            # script is extracted verbatim and run under plain bash by
            # test-release-push-retry.sh, where an unexpanded workflow
            # expression is a bash bad-substitution. Same value, and it keeps
            # the step testable.
            #
            # Do NOT write an empty workflow-expression delimiter pair in this
            # comment to illustrate the point. GitHub's workflow parser scans
            # the entire `run:` string for expressions and does not honour
            # shell comments, so an empty one is a hard parse error
            # ("An expression was expected") that fails the WHOLE workflow at
            # registration — not at runtime. That is #5339: the workflow
            # silently fell back to being named by its path, its `on:` block
            # was never read, and the workflow_run trigger stopped firing for
            # four days while every run looked merely "failed".
            if out="$(gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/merge" \
                        -f merge_method=merge -f sha="${commit_sha}" 2>&1)"; then
              echo "$out"
              merged=true
              break
            fi
            echo "$out"
            # 409 Conflict from this endpoint means either "Head branch was
            # modified" (the sha= guard fired) or "Base branch was modified" —
            # both are the base-moved case, not something a retry fixes.
            if grep -qiE 'base branch was modified|head branch was modified|is out of date|HTTP 409' <<<"$out"; then
              echo "::warning::Release opportunity skipped for ${SHA}: v4 advanced while this run was in flight — deferring (see the RACES note, #5142/#5222). Nothing was pushed; Unreleased is untouched, so either a successor run or the hourly backstop (#5318) releases it."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # 405 Method Not Allowed is GitHub's "not mergeable" for this
            # endpoint — including a required check that has not landed yet.
            if grep -qiE 'HTTP 405|not mergeable|required status check' <<<"$out"; then
              if [ "$SECONDS" -lt "$deadline" ]; then
                echo "PR #${pr_number} not mergeable yet (required-status evaluation still settling after gate succeeded) — retrying in 8s..."
                sleep 8
                continue
              fi
              echo "::error::PR #${pr_number} still not mergeable ${RELEASE_PUSH_GH006_WINDOW:-120}s after gate succeeded on ${commit_sha} — this is no longer a settling-time artifact. Note this merge is SHA-keyed (#5318/#5324), so a pending non-required status such as 'tide' is no longer the cause; check the REQUIRED contexts on v4 against the check-runs for ${commit_sha}." >&2
              exit 1
            fi
            echo "::error::merging PR #${pr_number} failed for an unrecognized reason (see the API response above) — not retrying." >&2
            exit 1
          done

          # The merge landed a NEW commit on v4 (a merge commit, or the same
          # tree via fast-forward depending on PR mergeability), so re-derive
          # the SHA actually on v4 before tagging — tagging the pre-merge
          # commit_sha would tag a commit v4 may not contain verbatim.
          git fetch origin v4
          v4_sha="$(git rev-parse origin/v4)"
          git tag "v${VERSION}" "$v4_sha"
          # Tag pushes have no protection race, only transient transport
          # failures — a plain bounded retry.
          for attempt in 1 2 3; do
            if git push origin "refs/tags/v${VERSION}"; then
              break
            fi
            [ "$attempt" -eq 3 ] && { echo "::error::tag push failed after 3 attempts" >&2; exit 1; }
            sleep 5
          done
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # --notes-file and --generate-notes have fragile combined behavior
      # across gh versions, so notes are built as one file: GitHub's own
      # auto-generated commit/PR summary first (fetched via `gh api
      # .../generate-notes`, the same content --generate-notes would have
      # produced), then the SBOM callout appended after it — rather than
      # relying on the two flags to compose correctly together.
      - name: Create GitHub Release
        if: steps.push_v4.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="v${VERSION}" \
            --jq .body > "$notes_file" || echo "(auto-generated notes unavailable)" > "$notes_file"
          {
            echo
            echo "---"
            echo
            echo "**SBOMs:** SPDX JSON, generated by Syft against the linux/amd64 image digest, attached below for \`hive\`, \`hive-contributor\`, and \`hive-hub\`. They cover linux/amd64 only — see [releases.md](https://github.com/${{ github.repository }}/blob/v4/src/docs/releases.md#software-bill-of-materials-sbom) for why linux/arm64 is not scanned separately."
            echo
            echo "**NOTICE:** third-party license attribution for the Go module dependencies compiled into these images, attached below. Does not cover base-image OS packages or the Node.js/tmux layers built from source — see [releases.md](https://github.com/${{ github.repository }}/blob/v4/src/docs/releases.md#third-party-notices) for the exact boundary."
          } >> "$notes_file"
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --title "v${VERSION}" \
            --notes-file "$notes_file" \
            --target v4 \
            "hive-v${VERSION}-sbom.spdx.json" \
            "hive-contributor-v${VERSION}-sbom.spdx.json" \
            "hive-hub-v${VERSION}-sbom.spdx.json" \
            "hive-v${VERSION}-NOTICE"
