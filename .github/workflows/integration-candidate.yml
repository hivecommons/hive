    - name: hive-discord.service does not execute planted code (#5435)
      working-directory: .
      run: bash src/deploy/test_hive_discord_unit_contract.sh
    - name: hive-snapshot.service does not execute planted code (#5483)
      working-directory: .
      run: bash src/deploy/test_hive_snapshot_unit_contract.sh
    - name: hive-deploy.service does not root-install planted code (#5936)
      working-directory: .
      run: bash src/deploy/test_hive_deploy_unit_contract.sh
    - name: Changelog reminder never blocks a merge (#4440)
      working-directory: .
      env:
        HIVE_TEST_REQUIRE_BEHAVIOURAL: '1'
      run: bash src/deploy/test_changelog_reminder.sh
    - name: Contributor identity relocation (#4408)
      working-directory: .
      run: bash src/deploy/test_contribute_move.sh
    - name: In-container attach hints name the real runtime (#5145)
      working-directory: .
      run: bash src/deploy/test_attach_hint_runtime.sh
    - name: Isolated contributor Compose contract (#9188)
      working-directory: .
      run: |
        # hive-runners lack python3-venv (ensurepip); the job's first step
        # already guarantees PyYAML for the system python3, so fall back to it.
        if python3 -m venv "$RUNNER_TEMP/isolated-contributor-tests" 2>/dev/null; then
          "$RUNNER_TEMP/isolated-contributor-tests/bin/pip" install PyYAML==6.0.2
          PY="$RUNNER_TEMP/isolated-contributor-tests/bin/python"
        else
          python3 -c "import yaml"
          PY=python3
        fi
        "$PY" src/deploy/test_isolated_contributor_compose.py
    - name: Contributor containers enforce resource limits (#6485)
      working-directory: .
      env:
        HIVE_TEST_REQUIRE_BEHAVIOURAL: '1'
      run: bash src/deploy/test_contributor_container_resources.sh
    - name: Contributor containers stage only the Claude credential and settings (#7836)
      working-directory: .
      env:
        HIVE_TEST_REQUIRE_BEHAVIOURAL: '1'
      run: bash src/deploy/test_contributor_claude_staging.sh
    - name: A skip is fatal where the caller guarantees the precondition (#5388)
      working-directory: .
      run: bash src/deploy/test_skip_discipline.sh
    - name: Entrypoint system gitconfig contract
      working-directory: .
      env:
        HIVE_TEST_REQUIRE_BEHAVIOURAL: '1'
      run: bash src/deploy/test_entrypoint_system_gitconfig.sh
    - name: Entrypoint Copilot token symlink contract (#5529)
      working-directory: .
      run: bash src/deploy/test_entrypoint_symlinks.sh
    - name: Entrypoint permission-guard survivability (#5730)
      working-directory: .
      run: bash src/deploy/test_entrypoint_perm_guard.sh
    - name: hivectl extraction route contract (#5646)
      working-directory: .
      run: bash src/deploy/test_hivectl_extraction_contract.sh
    - name: Entrypoint iptables append failure handling (#6003)
      working-directory: .
      run: bash src/deploy/test_entrypoint_iptables_gate.sh
    - name: Entrypoint egress ruleset result checks (#6003)
      working-directory: .
      run: bash src/deploy/test_entrypoint_egress_ruleset.sh
    - name: Entrypoint netfilter extension preflight (#6003)
      working-directory: .
      run: bash src/deploy/test_entrypoint_xt_module_preflight.sh
    - name: Every src/deploy/ test suite is wired into a workflow (#5529)
      working-directory: .
      run: bash src/deploy/test_deploy_suites_wired.sh
    - name: Runner labels are fork-portable (#6083)
      working-directory: .
      run: bash src/deploy/test_runner_labels_portable.sh
    name: build-and-test
    env:
      ACTIONS_CACHE_SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
      GO_CACHE_GUARD_BUILD_CACHE: ${{ 'job' || 'job' }}
  ci-docker:
    name: docker (${{ matrix.name }})
    needs:
    - subject
    - ci-required-context-scope
    if: ${{ always() && needs.subject.result == 'success' && (always() && (needs.ci-required-context-scope.result != 'success' || needs.ci-required-context-scope.outputs.run-ci == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: hive
          file: src/Dockerfile
          smoke: 'true'
        - name: hub
          file: src/Dockerfile.hub
          smoke: 'false'
        - name: contributor
          file: src/Dockerfile.contributor
          smoke: 'false'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: ${{ matrix.name == 'hub' && 0 || 1 }}
    - name: Skip non-hive images on push
      if: '!true && github.event_name != ''pull_request'' && matrix.name != ''hive'''
      run: echo "skip=true" >> "$GITHUB_ENV"
    - name: Set up Docker Buildx
      if: env.skip != 'true'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      with:
        driver-opts: network=host
    - name: Resolve base image registry (mirror.gcr.io with docker.io fallback)
      if: env.skip != 'true'
      uses: ./.github/actions/docker-base-registry
    - name: Build Docker image
      if: env.skip != 'true'
      run: docker buildx build --load --network host --build-arg BASE_REGISTRY="$BASE_REGISTRY" -f "${{ matrix.file }}" -t "hive-ci-${{ matrix.name }}:test" .
    - name: Smoke test
      if: env.skip != 'true' && matrix.smoke == 'true'
      shell: bash
      run: "set -euo pipefail\nname=\"hive-v2-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"\ncleanup() {\n  docker rm -f -v \"$name\" >/dev/null 2>&1 || true\n}\ntrap cleanup EXIT\n# #3760: the binary carries NO file capability anymore, so it must exec\n# under docker's DEFAULT cap set (no --cap-add) \u2014 a self-hosted spoke\n# has exactly that bounding set. NET_ADMIN, when present, is raised by\n# the entrypoint as an ambient cap; the raw `--version` here needs none.\n# The old `--help || true` form could not fail and asserted nothing.\ntimeout --signal=TERM --kill-after=10s 60s \\\n  docker run --rm --name \"$name\" --network none hive-ci-hive:test --version\n"
    env:
      ACTIONS_CACHE_SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
      GO_CACHE_GUARD_BUILD_CACHE: ${{ 'job' || 'job' }}
  ci-overlayfs-exec-guard:
    needs:
    - subject
    - ci-required-context-scope
    if: ${{ always() && needs.subject.result == 'success' && (always() && (needs.ci-required-context-scope.result != 'success' || needs.ci-required-context-scope.outputs.run-ci == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Resolve runner ref name
      id: ref_name
      run: |
        set -euo pipefail
        : "${GITHUB_REF_NAME:?GITHUB_REF_NAME is required}"
        echo "value=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
    - name: Resolve base image registry (mirror.gcr.io with docker.io fallback)
      uses: ./.github/actions/docker-base-registry
    - name: Build image via buildx (OCI archive, no attestations)
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: src/Dockerfile
        platforms: linux/amd64
        provenance: false
        sbom: false
        outputs: type=oci,oci-mediatypes=true,dest=/tmp/hive-oci.tar,tar=true
        cache-from: type=gha,scope=tmux-linux-amd64
        build-args: |
          BASE_REGISTRY=${{ env.BASE_REGISTRY }}
          GIT_HASH=${{ github.sha }}
          GIT_BRANCH=${{ steps.ref_name.outputs.value }}
    - name: Run under containerd/overlayfs and assert in-place exec
      shell: bash
      run: "set -euo pipefail\n# containerd ships on GitHub ubuntu runners; ensure it is up and using\n# the overlayfs snapshotter (its default) \u2014 that is what makes the\n# metacopy redirect observable.\nsudo systemctl start containerd 2>/dev/null || sudo containerd >/tmp/containerd.log 2>&1 &\nfor i in $(seq 1 30); do\n  if sudo ctr version >/dev/null 2>&1; then break; fi\n  sleep 1\ndone\nsudo ctr version\n# Confirm the overlayfs snapshotter is present (the failing runtime).\nsudo ctr plugins ls | grep -i overlayfs || {\n  echo \"overlayfs snapshotter not available on this runner\" >&2; exit 1; }\n\nIMG=\"hive-3760-guard:test\"\n# Import the OCI archive BuildKit produced into containerd. Resolve\n# the linux/amd64 platform (the archive is single-arch, but pin it so\n# the run below has a concrete manifest to unpack).\nsudo ctr images import --platform linux/amd64 --index-name \"$IMG\" /tmp/hive-oci.tar \\\n  || sudo ctr images import --index-name \"$IMG\" /tmp/hive-oci.tar\nsudo ctr images ls | grep \"$IMG\"\n\n# The assertion: exec /usr/local/bin/hive AT ITS IMAGE PATH, no copy,\n# under containerd's overlayfs snapshotter. --net-host keeps the run\n# simple; we deliberately do NOT add NET_ADMIN \u2014 a self-hosted spoke\n# has the docker/containerd default bounding set. Override the\n# entrypoint so we test the raw binary exec (the #3760 symptom is a\n# bare EPERM at execve of the binary, not an entrypoint failure).\nset +e\nout=$(sudo timeout 90s ctr run --rm --snapshotter overlayfs \\\n        --net-host \\\n        \"$IMG\" hive-3760-inplace \\\n        /usr/local/bin/hive --version 2>&1)\nrc=$?\nset -e\necho \"----- hive --version (in-place, containerd/overlayfs) -----\"\necho \"$out\"\necho \"exit=$rc\"\nif [ $rc -ne 0 ]; then\n  echo \"::error::#3760 regression: /usr/local/bin/hive failed to exec IN PLACE under containerd/overlayfs (rc=$rc). This is the BuildKit metacopy-redirect crash-loop \u2014 a plain build-side attestation/OCI-index change or a removed in-stage binary rewrite has reintroduced it.\" >&2\n  exit 1\nfi\ncase \"$out\" in\n  *\"Operation not permitted\"*|*EPERM*)\n    echo \"::error::#3760 regression: hive execve returned Operation not permitted at its image path under containerd/overlayfs.\" >&2\n    exit 1 ;;\nesac\n\n# STALE-BINARY GUARD. The exec check above passes even for an OLD hive\n# binary \u2014 a stale binary works fine, it just reports the WRONG commit.\n# A branch-persistent GHA cache once let BuildKit serve a cached\n# final-stage `COPY --from=builder /hive` layer, so the manifest digest\n# advanced but /usr/local/bin/hive was an old build (reported commit\n# 4d9c11c while HEAD had the #3760 fix). Assert the built binary's\n# embedded commit matches THIS build's commit so a stale-layer cache hit\n# is caught directly, not just an exec failure. `hive --version` prints\n# `hive 3.0.0 (commit <short7>, branch <branch>)`; main.gitShort is the\n# 7-char short SHA stamped from GIT_HASH=${{ github.sha }} at build.\nEXPECTED_SHORT=\"${GITHUB_SHA::7}\"\nREPORTED_COMMIT=$(printf '%s\\n' \"$out\" | sed -n 's/.*commit \\([0-9a-f][0-9a-f]*\\).*/\\1/p' | head -n1)\necho \"expected commit=$EXPECTED_SHORT reported commit=$REPORTED_COMMIT\"\nif [ -z \"$REPORTED_COMMIT\" ]; then\n  echo \"::error::stale-binary guard: could not parse commit from 'hive --version' output \u2014 version stamping is broken or the output format changed.\" >&2\n  exit 1\nfi\nif [ \"$REPORTED_COMMIT\" != \"$EXPECTED_SHORT\" ]; then\n  echo \"::error::stale-binary guard: shipped hive reports commit '$REPORTED_COMMIT' but this build is '$EXPECTED_SHORT'. The binary is STALE \u2014 a cached final-stage COPY --from=builder layer shipped an old /usr/local/bin/hive (the bug that let #3760's fix miss the published image). Check no-cache-filters covers the runtime stage in docker.yml.\" >&2\n  exit 1\nfi\necho \"OK: hive execs in-place under containerd/overlayfs (no copy, no NET_ADMIN) AND reports the current commit ($REPORTED_COMMIT).\"\n"
    name: overlayfs-exec-guard
    env:
      ACTIONS_CACHE_SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
      GO_CACHE_GUARD_BUILD_CACHE: ${{ 'job' || 'job' }}
  tests-required-context-scope:
    name: required context scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run-tests: ${{ steps.scope.outputs.run-tests }}
    steps:
    - name: Decide whether the test and coverage gates need the real suite
      id: scope
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [ "${{ true }}" = true ] &&
           { [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [[ "$GITHUB_REF" != refs/tags/hive-integration/* ]]; }; then
          echo "::error::Integration candidates require an explicitly dispatched immutable candidate tag"
          exit 1
        fi
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "run-tests=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        : > changed-files.txt
        page=1
        api_root="${GITHUB_API_URL:-https://api.github.com}"
        while :; do
          curl -fsSL               -H "Authorization: Bearer ${GITHUB_TOKEN}"               -H "Accept: application/vnd.github+json"               "${api_root}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100&page=${page}"               -o changed-files-page.json
          python3 - <<'PYFILES' >> changed-files.txt
        import json
        with open('changed-files-page.json', encoding='utf-8') as f:
            for item in json.load(f):
                print(item['filename'])
        PYFILES
          count=$(python3 - <<'PYCOUNT'
        import json
        with open('changed-files-page.json', encoding='utf-8') as f:
            print(len(json.load(f)))
        PYCOUNT
        )
          [ "$count" -lt 100 ] && break
          page=$((page + 1))
        done
        rm -f changed-files-page.json
        run=false
        while IFS= read -r path; do
          case "$path" in
            src/*|bin/*|config/*|Justfile|dashboard/openapi.json|CHANGELOG.md|changelog.d/*|.github/workflows/*|.github/scripts/*)
              run=true
              ;;
          esac
        done < changed-files.txt
        echo "run-tests=${run}" >> "$GITHUB_OUTPUT"
        if [ "$run" = true ]; then
          echo "v2 test/coverage gates will run real shards."
        else
          echo "No v2 test paths changed; required test/coverage contexts will report success without shards."
        fi
    needs:
    - subject
    if: ${{ always() && needs.subject.result == 'success' && (success()) }}
    env:
      CGO_ENABLED: '1'
      KUBERNETES_SERVICE_HOST: ''
      KUBERNETES_SERVICE_PORT: ''
      ACTIONS_CACHE_SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
      GO_CACHE_GUARD_BUILD_CACHE: ${{ 'job' || 'job' }}
  tests-test-hub:
    needs:
    - subject
    - tests-required-context-scope
    - tests-list-packages
    if: ${{ always() && needs.subject.result == 'success' && ((needs.tests-required-context-scope.result != 'success' || needs.tests-required-context-scope.outputs.run-tests == 'true') && !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-gate/'))) }}
    name: test (hub ${{ matrix.idx }}/4)
    strategy:
      fail-fast: false
      matrix:
        idx:
        - 1
        - 2
        - 3
        - 4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src
    steps:
    - name: Affected-package selection
      id: select
      working-directory: .
      env:
        SELECTION: ${{ needs.tests-list-packages.outputs.selection }}
        RUN_LANE: ${{ needs.tests-list-packages.outputs.run-hub }}
      run: |
        if [ "$SELECTION" = partial ] && [ "$RUN_LANE" = false ]; then
          echo "Affected-package selection: pkg/hub is not affected by this diff; reporting success without running tests. Push and scheduled runs test it in full."
          echo "run=false" >> "$GITHUB_OUTPUT"
        else
          echo "run=true" >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      if: steps.select.outputs.run == 'true'
      with:
        persist-credentials: false
    - name: Warm shared Go tool cache (serialize the cold-cache population)
      if: steps.select.outputs.run == 'true'
      run: bash "$GITHUB_WORKSPACE/.github/scripts/go-toolcache-guard.sh"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      if: steps.select.outputs.run == 'true'
      with:
        cache: false
        go-version-file: src/go.mod
    - name: Guard shared Go cache (fall back when the runner volume is full)
      if: steps.select.outputs.run == 'true'
      run: bash "$GITHUB_WORKSPACE/.github/scripts/go-cache-guard.sh"
    - name: Download Go modules (retry transient proxy resets)
      if: steps.select.outputs.run == 'true'
      uses: ./.github/actions/go-mod-download-retry
    - name: Install gotestsum
      if: steps.select.outputs.run == 'true'
      run: |
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        go install gotest.tools/gotestsum@v1.13.0
        "$(go env GOPATH)/bin/gotestsum" --version
    - name: Restore warm Go build cache
      if: ${{ steps.select.outputs.run == 'true' && (!contains('["ubuntu-latest"]', 'hive-runners')) }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/go-build
        key: hive-go-build-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: |
          hive-go-build-${{ runner.os }}-${{ runner.arch }}-
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      if: steps.select.outputs.run == 'true'
      with:
        node-version: '22'
    - name: Guard shared node tool cache (repair a half-written entry)
      if: ${{ steps.select.outputs.run == 'true' && (always()) }}
      run: |
        set -u
        command -v npm >/dev/null 2>&1 && exit 0
        for marker in "${RUNNER_TOOL_CACHE:-/nonexistent}"/node/*/x64.complete; do
          [ -e "$marker" ] || continue
          dir="${marker%.complete}"
          [ -x "$dir/bin/npm" ] && continue
          echo "::warning::node tool cache $dir has a .complete marker but no executable bin/npm; removing the marker so the next job on $RUNNER_NAME rebuilds it"
          rm -f "$marker"
        done
        echo "::error::npm is not on PATH after actions/setup-node on $RUNNER_NAME (half-written shared tool cache, see #10518); marker removed, re-run this job"
        exit 1
    - name: Restore cgo toolchain package cache
      if: steps.select.outputs.run == 'true'
      id: restore-cgo-apt-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .ci/apt-cache/cgo-race
        key: hive-cgo-race-apt-${{ runner.os }}-${{ runner.arch }}-gcc-libc6-dev-v2
        restore-keys: |
          hive-cgo-race-apt-${{ runner.os }}-${{ runner.arch }}-gcc-libc6-dev-
          hive-cgo-race-apt-${{ runner.os }}-${{ runner.arch }}-
          hive-cgo-race-apt-
    - name: Prepare cgo toolchain for race tests
      if: steps.select.outputs.run == 'true'
      id: prepare-cgo-toolchain
      env:
        HIVE_CI_APT_CACHE_DIR: ${{ github.workspace }}/.ci/apt-cache/cgo-race
        HIVE_CI_MISSING_TOOLCHAIN_SOFT_FAIL: ${{ !true && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
      run: |
        bash "$GITHUB_WORKSPACE/.github/scripts/ci-install-tool.sh" \
          --require gcc --for '-race tests' \
          --apt 'gcc libc6-dev' --apk 'gcc musl-dev' --verify 'gcc --version'
    - name: Save cgo toolchain package cache
      if: ${{ steps.select.outputs.run == 'true' && (always() && steps.restore-cgo-apt-cache.outputs.cache-hit != 'true' && steps.prepare-cgo-toolchain.outputs.apt-cache-populated == 'true') }}
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .ci/apt-cache/cgo-race
        key: hive-cgo-race-apt-${{ runner.os }}-${{ runner.arch }}-gcc-libc6-dev-v2
    - name: Test slice of pkg/hub
      if: ${{ steps.select.outputs.run == 'true' && (steps.prepare-cgo-toolchain.outputs.toolchain-ready == 'true') }}
      env:
        IDX: ${{ matrix.idx }}
        TOTAL: ${{ strategy.job-total }}
        HIVE_TEST_REQUIRE_BEHAVIOURAL: '1'
      run: "set -o pipefail\nROOT=\"$PWD\"\nexport LC_ALL=C # Regex length guards below must count bytes.\nexport TEST_PACKAGE=github.com/hivecommons/hive/pkg/hub\nexport TEST_DIR=\"$ROOT/pkg/hub\"\nexport TEST_BINARY=\"$ROOT/hub.test\"\ngo test -c -race -cover -o \"$TEST_BINARY\" ./pkg/hub\n(cd \"$TEST_DIR\" && \"$TEST_BINARY\" -test.short -test.list '.*') | grep -E '^(Test|Example|Fuzz)' | LC_ALL=C sort > all-tests.txt\nif [ ! -s all-tests.txt ]; then\n  echo \"::error::go test -list produced no test functions for pkg/hub \u2014 refusing to run an empty slice (fail closed)\"\n  exit 1\nfi\nawk -v n=\"$TOTAL\" -v i=\"$IDX\" 'NR % n == i - 1' all-tests.txt > slice.txt\necho \"slice $IDX/$TOTAL: $(wc -l < slice.txt) of $(wc -l < all-tests.txt) test functions\"\nif [ ! -s slice.txt ]; then\n  echo \"::error::empty hub slice \u2014 failing closed\"\n  exit 1\nfi\nexport CHUNK_DIR TEST_SHUFFLE=off\nCHUNK_DIR=$(mktemp -d \"$ROOT/test-chunks.XXXXXX\")\nsplit -l 1000 slice.txt \"$CHUNK_DIR/chunk-\"\nif [ \"$GITHUB_EVENT_NAME\" != \"pull_request\" ]; then TEST_SHUFFLE=on; fi\n# raw-command preserves one JUnit/flake report across all chunks.\n# gotestsum appends -test.run and package arguments on reruns.\ncat > \"$CHUNK_DIR/run.sh\" <<'RUNNER'\n#!/usr/bin/env bash\nset -uo pipefail\ncd \"$TEST_DIR\" || exit 1\nrun_chunk() {\n  local RUN=\"$1\" PROFILE=\"$2\"\n  # MAX_ARG_STRLEN is 131072 bytes; never approach it, even if a\n  # future test has an exceptionally long name. Guard before exec.\n  if [ \"${#RUN}\" -gt 120000 ]; then\n    echo \"::error::chunk regex exceeds 120000 bytes; reduce chunk size\" >&2\n    return 1\n  fi\n  go tool test2json -t -p \"$TEST_PACKAGE\" \"$TEST_BINARY\" \\\n    -test.short -test.count=1 -test.v=test2json -test.timeout=10m \\\n    -test.shuffle=\"$TEST_SHUFFLE\" \"$RUN\" -test.coverprofile=\"$PROFILE\"\n}\nif [ \"$#\" -gt 0 ]; then\n  # Reruns must not overwrite the first-pass coverage.\n  run_chunk \"$1\" \"$CHUNK_DIR/rerun.out\"\n  exit $?\n