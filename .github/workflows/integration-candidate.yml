      id: verify
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        SUBJECT_MANIFEST: ${{ inputs.manifest }}
        EXPECTED_METADATA_DIGEST: ${{ needs.subject.outputs.metadata_digest }}
        GITHUB_TOKEN: ${{ github.token }}
      with:
        script: |
          const policy = require('./.github/scripts/integration-governance.cjs');
          const subject = JSON.parse(process.env.SUBJECT_MANIFEST);
          const members = await policy.snapshot(github, subject);
          const actual = policy.digest(members);
          if (actual !== process.env.EXPECTED_METADATA_DIGEST) throw new Error('Member metadata drifted');
          core.setOutput('metadata_digest', actual);
          await policy.verify('dco', subject, members, github);
