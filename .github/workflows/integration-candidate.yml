  receipt:
    name: integration producer receipt
    needs:
    - subject
    - ci-required-context-scope
    - ci-build-and-test
    - ci-docker
    - ci-overlayfs-exec-guard
    - tests-required-context-scope
    - tests-test-hub
    - tests-test-sliced
    - tests-test-agent
    - tests-list-packages
    - tests-test-rest
    - tests-test-dashboard-shuffle
    - tests-test
    - tests-coverage
    - security-required-context-scope
    - security-govulncheck
    - security-gosec
    - security-golangci-lint
    - security-action-pins
    - security-notice-drift
    - governance-dco
    - governance-changelog
    - governance-contents
    - governance-attribution
    if: ${{ always() && needs.subject.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    steps:
    - name: Bind exact receipt bytes to this isolated finalizer job
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        SUBJECT_MANIFEST: ${{ inputs.manifest }}
        TECHNICAL_OUTCOMES: ${{ toJSON(needs) }}
        REQUIRED_CONTEXT_JOBS: '{"DCO": "governance-dco", "Sign-off survives the squash": "governance-attribution", "build-and-test": "ci-build-and-test", "changelog-fragment-guard": "governance-changelog", "coverage": "tests-coverage", "gate": "subject", "golangci-lint": "security-golangci-lint", "gosec (insecure patterns)": "security-gosec", "govulncheck (known vulnerabilities)": "security-govulncheck", "test": "tests-test", "verify PR contents": "governance-contents"}'
      with:
        script: |
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const subject = JSON.parse(process.env.SUBJECT_MANIFEST);
          const needs = JSON.parse(process.env.TECHNICAL_OUTCOMES);
          const metadataDigest = needs.subject.outputs.metadata_digest;
          if (!/^[a-f0-9]{64}$/.test(metadataDigest || '')) throw new Error('Missing exact member governance binding');
          for (const [id, job] of Object.entries(needs)) {
            if (id.startsWith('governance-') && job.outputs.metadata_digest !== metadataDigest) {
              throw new Error('Member metadata drifted during governance verification');
            }
          }
          const runID = Number(process.env.GITHUB_RUN_ID), attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
          const args = {...context.repo, run_id: runID};
          const {data: run} = await github.rest.actions.getWorkflowRun(args);
          const {data: jobs} = await github.rest.actions.listJobsForWorkflowRunAttempt({...args, attempt_number: attempt, per_page: 100});
          const {data: checks} = await github.rest.checks.listForRef({...context.repo, ref: context.sha, filter: 'all', per_page: 100});
          if (run.run_attempt !== attempt || run.head_sha !== context.sha ||
              jobs.total_count !== jobs.jobs.length || checks.total_count !== checks.check_runs.length) {
            throw new Error('Latest exact-attempt job/check cohort is unknown or truncated');
          }
          const contexts = {};
          for (const [name, id] of Object.entries(JSON.parse(process.env.REQUIRED_CONTEXT_JOBS))) {
            const matches = jobs.jobs.filter(job => job.name === name);
            if (matches.length !== 1) throw new Error(`Missing/ambiguous actual required job ${name}`);
            const job = matches[0], checkID = Number(job.check_run_url.split('/').at(-1));
            const check = checks.check_runs.find(item => item.id === checkID);
            if (!check || job.run_id !== runID || job.head_sha !== context.sha ||
                check.name !== name || check.head_sha !== context.sha || check.check_suite.id !== run.check_suite_id ||
                check.app.id !== 15368 || job.status !== 'completed' || check.status !== 'completed' ||
                check.conclusion !== job.conclusion || job.conclusion !== needs[id].result) {
              throw new Error(`Required context ${name} is not its actual exact-subject Actions producer`);
            }
            contexts[name] = {jobID: job.id, checkID, appID: check.app.id, suiteID: check.check_suite.id, conclusion: job.conclusion};
          }
          const payload = Buffer.from(JSON.stringify({
            schema: 2,
            protocol: 'integration-producer-receipt-v2',
            subject,
            runID: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            metadataDigest,
            contexts,
          }), 'utf8');
          const digest = crypto.createHash('sha256').update(payload).digest('hex');
          const token = await core.getIDToken(`hive-integration-producer-v1/${digest}`);
          core.setSecret(token);
          fs.mkdirSync('.integration-producer', {recursive: true});
          fs.writeFileSync('.integration-producer/receipt.json', JSON.stringify({
            schema: 1, payload: payload.toString('base64'), token,
          }), {flag: 'wx', mode: 0o600});
          core.info(`Recorded producer identity for ${subject.id}; passing CI and live policy require independent verification.`);
    - name: Publish immutable attempt-specific producer receipt
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: integration-producer-receipt-${{ github.run_attempt }}
        path: .integration-producer/receipt.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
