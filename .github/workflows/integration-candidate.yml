      run: "set -o pipefail\nROOT=\"$PWD\"\nexport LC_ALL=C # Regex length guards below must count bytes.\nexport TEST_PACKAGE=github.com/hivecommons/hive/crux/agent\nexport TEST_DIR=\"$ROOT/crux/agent\"\nexport TEST_BINARY=\"$ROOT/agent.test\"\ngo test -c -race -cover -o \"$TEST_BINARY\" ./crux/agent\n# Include Test/Example/Fuzz, but not opt-in benchmarks.\n(cd \"$TEST_DIR\" && \"$TEST_BINARY\" -test.short -test.list '.*') | grep -E '^(Test|Example|Fuzz)' | LC_ALL=C sort > all-tests.txt\nif [ ! -s all-tests.txt ]; then\n  echo \"::error::go test -list produced no test functions for crux/agent \u2014 refusing to run an empty slice (fail closed)\"\n  exit 1\nfi\nawk -v n=\"$TOTAL\" -v i=\"$IDX\" 'NR % n == i - 1' all-tests.txt > slice.txt\necho \"slice $IDX/$TOTAL: $(wc -l < slice.txt) of $(wc -l < all-tests.txt) test functions\"\nif [ ! -s slice.txt ]; then\n  echo \"::error::empty agent slice \u2014 failing closed\"\n  exit 1\nfi\nexport CHUNK_DIR TEST_SHUFFLE=off\nCHUNK_DIR=$(mktemp -d \"$ROOT/test-chunks.XXXXXX\")\nsplit -l 1000 slice.txt \"$CHUNK_DIR/chunk-\"\nif [ \"$GITHUB_EVENT_NAME\" != \"pull_request\" ]; then TEST_SHUFFLE=on; fi\n# raw-command preserves one JUnit/flake report across all chunks.\n# gotestsum appends -test.run and package arguments on reruns.\ncat > \"$CHUNK_DIR/run.sh\" <<'RUNNER'\n#!/usr/bin/env bash\nset -uo pipefail\ncd \"$TEST_DIR\" || exit 1\nrun_chunk() {\n  local RUN=\"$1\" PROFILE=\"$2\"\n  # MAX_ARG_STRLEN is 131072 bytes; never approach it, even if a\n  # future test has an exceptionally long name. Guard before exec.\n  if [ \"${#RUN}\" -gt 120000 ]; then\n    echo \"::error::chunk regex exceeds 120000 bytes; reduce chunk size\" >&2\n    return 1\n  fi\n  go tool test2json -t -p \"$TEST_PACKAGE\" \"$TEST_BINARY\" \\\n    -test.short -test.count=1 -test.v=test2json -test.timeout=10m \\\n    -test.shuffle=\"$TEST_SHUFFLE\" \"$RUN\" -test.coverprofile=\"$PROFILE\"\n}\nif [ \"$#\" -gt 0 ]; then\n  # Reruns must not overwrite the first-pass coverage.\n  run_chunk \"$1\" \"$CHUNK_DIR/rerun.out\"\n  exit $?\nfi\nstatus=0\nfor chunk in \"$CHUNK_DIR\"/chunk-*; do\n  RUN=\"-test.run=^($(paste -sd'|' \"$chunk\"))$\"\n  run_chunk \"$RUN\" \"$chunk.out\" || status=1\ndone\nexit \"$status\"\nRUNNER\nstatus=0\nif gotestsum --format=standard-verbose --rerun-fails=2 --rerun-fails-max-failures=5 \\\n  --rerun-fails-report=flaky-tests-agent-\"$IDX\".txt \\\n  --junitfile junit-agent-\"$IDX\".xml --raw-command -- bash \"$CHUNK_DIR/run.sh\" \\\n  2>&1 | grep --line-buffered -vE '^=== (RUN|PAUSE|CONT) ' | tee test-agent-\"$IDX\".log; then\n  :\nelse\n  status=1\nfi\n# The test binary runs under test2json, not the `go test` driver, so\n# nothing prints the `ok <pkg>` / `FAIL <pkg>` summary line the\n# coverage scorer classifies packages by (#14135). Append it.\nif [ \"$status\" -eq 0 ]; then\n  printf 'ok  \\t%s\\t(slice %s/%s)\\n' \"$TEST_PACKAGE\" \"$IDX\" \"$TOTAL\" >> test-agent-\"$IDX\".log\nelse\n  printf 'FAIL\\t%s\\t(slice %s/%s)\\n' \"$TEST_PACKAGE\" \"$IDX\" \"$TOTAL\" >> test-agent-\"$IDX\".log\nfi\n# Sum first-pass counters for identical blocks; never count reruns.\n# Do this even after test failure so the coverage gate has evidence.\nawk 'FNR == 1 { next } { key=$1 \" \" $2; hits[key]+=$3 }\n  END { print \"mode: atomic\"; for (key in hits) print key, hits[key] }' \\\n  \"$CHUNK_DIR\"/chunk-*.out > coverage-agent-\"$IDX\".out\nexit \"$status\"\n"
    - name: Surface flaky reruns
      id: flaky-reruns
      if: ${{ steps.select.outputs.run == 'true' && (always()) }}
      run: bash "$GITHUB_WORKSPACE/.github/scripts/ci-gotestsum-flake-summary.sh" "flaky-tests-agent-${{ matrix.idx }}.txt" "agent ${{ matrix.idx }}/5"
    - name: Upload flaky rerun report
      if: ${{ steps.select.outputs.run == 'true' && (always() && steps.flaky-reruns.outputs.has-flakes == 'true') }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: flaky-tests-agent-${{ matrix.idx }}
        path: src/flaky-tests-agent-${{ matrix.idx }}.txt
        if-no-files-found: error
        retention-days: 14
    - name: Slowest tests in this slice
      if: ${{ steps.select.outputs.run == 'true' && (always()) }}
      run: bash "$GITHUB_WORKSPACE/.github/scripts/slowest-tests.sh" "agent ${{ matrix.idx }}/5" test-agent-${{ matrix.idx }}.log
    - name: Upload shard coverage artifacts
      if: ${{ steps.select.outputs.run == 'true' && (always()) }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: test-shard-agent-${{ matrix.idx }}
        path: |
          src/coverage-agent-${{ matrix.idx }}.out
          src/test-agent-${{ matrix.idx }}.log
        if-no-files-found: warn
        retention-days: 1
    env:
      CGO_ENABLED: '1'
      KUBERNETES_SERVICE_HOST: ''
      KUBERNETES_SERVICE_PORT: ''
      ACTIONS_CACHE_SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
      GO_CACHE_GUARD_BUILD_CACHE: ${{ 'job' || 'job' }}
  tests-list-packages:
    needs:
    - subject
    - tests-required-context-scope
    if: ${{ always() && needs.subject.result == 'success' && ((needs.tests-required-context-scope.result != 'success' || needs.tests-required-context-scope.outputs.run-tests == 'true') && !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-gate/'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.partition.outputs.matrix }}
      selection: ${{ steps.select.outputs.selection }}
      selected: ${{ steps.select.outputs.selected }}
      run-hub: ${{ steps.select.outputs.run-hub }}
      run-agent: ${{ steps.select.outputs.run-agent }}
      run-dashboard: ${{ steps.select.outputs.run-dashboard }}
      run-scheduler: ${{ steps.select.outputs.run-scheduler }}
      crux-scope: ${{ steps.select.outputs.crux-scope }}
    defaults:
      run:
        working-directory: src
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 2
    - name: Warm shared Go tool cache (serialize the cold-cache population)
      run: bash "$GITHUB_WORKSPACE/.github/scripts/go-toolcache-guard.sh"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        cache: false
        go-version-file: src/go.mod
    - name: Guard shared Go cache (fall back when the runner volume is full)
      run: bash "$GITHUB_WORKSPACE/.github/scripts/go-cache-guard.sh"
    - name: Download Go modules (retry transient proxy resets)
      uses: ./.github/actions/go-mod-download-retry
    - name: Restore warm Go build cache
      if: ${{ !contains('["ubuntu-latest"]', 'hive-runners') }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/go-build
        key: hive-go-build-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: |
          hive-go-build-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore cgo toolchain package cache
      id: restore-cgo-apt-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .ci/apt-cache/cgo-race
        key: hive-cgo-race-apt-${{ runner.os }}-${{ runner.arch }}-gcc-libc6-dev-v2
        restore-keys: |
          hive-cgo-race-apt-${{ runner.os }}-${{ runner.arch }}-gcc-libc6-dev-
          hive-cgo-race-apt-${{ runner.os }}-${{ runner.arch }}-
          hive-cgo-race-apt-
    - name: Prepare cgo toolchain for race tests
      id: prepare-cgo-toolchain
      env:
        HIVE_CI_APT_CACHE_DIR: ${{ github.workspace }}/.ci/apt-cache/cgo-race
        HIVE_CI_MISSING_TOOLCHAIN_SOFT_FAIL: ${{ !true && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
      run: |
        bash "$GITHUB_WORKSPACE/.github/scripts/ci-install-tool.sh" \
          --require gcc --for '-race tests' \
          --apt 'gcc libc6-dev' --apk 'gcc musl-dev' --verify 'gcc --version'
    - name: Save cgo toolchain package cache
      if: always() && steps.restore-cgo-apt-cache.outputs.cache-hit != 'true' && steps.prepare-cgo-toolchain.outputs.apt-cache-populated == 'true'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .ci/apt-cache/cgo-race
        key: hive-cgo-race-apt-${{ runner.os }}-${{ runner.arch }}-gcc-libc6-dev-v2
    - name: Select affected packages
      id: select
      env:
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        SELECTION_SWITCH: ${{ 'false' }}
      run: "set -uo pipefail\nsel=../affected-pkgs.txt\nif [ \"$GITHUB_EVENT_NAME\" != pull_request ]; then\n  echo \"$GITHUB_EVENT_NAME run: full suite (only pull requests use affected-package selection).\"\n  echo all > \"$sel\"\nelif [ \"${SELECTION_SWITCH:-}\" = off ]; then\n  echo \"HIVE_AFFECTED_TEST_SELECTION=off: full suite.\"\n  echo all > \"$sel\"\nelif [ -z \"${PR_HEAD_SHA:-}\" ] || [ \"$(git rev-parse -q --verify 'HEAD^2' || true)\" != \"$PR_HEAD_SHA\" ]; then\n  echo \"::notice::checkout is not the PR merge commit of $PR_HEAD_SHA; running the full suite\"\n  echo all > \"$sel\"\nelse\n  bash \"$GITHUB_WORKSPACE/.github/scripts/affected-go-packages.sh\" 'HEAD^1' HEAD \"$sel\" || echo all > \"$sel\"\nfi\n[ -f \"$sel\" ] || echo all > \"$sel\"\n# src/go.work puts `go list -m` in workspace mode, where it prints\n# every workspace module; the selection file is keyed by the root\n# module's import paths, so ask for that module alone.\nmod=$(GOWORK=off go list -m)\ncrux_scope=full\nif [ \"$(head -n1 \"$sel\")\" = all ]; then\n  selection=full\n  run_hub=true run_agent=true run_dashboard=true run_scheduler=true\nelse\n  selection=partial\n  has() { grep -Fxq \"$mod/$1\" \"$sel\" && echo true || echo false; }\n  run_hub=$(has pkg/hub) run_agent=$(has crux/agent) run_dashboard=$(has pkg/dashboard) run_scheduler=$(has pkg/scheduler)\n  # Crux boundary filter (#13536) \u2014 see the header comment. Only a\n  # partial selection is ever narrowed; the script answers `full`\n  # for every fail-safe path and for anything it cannot read, and\n  # `full` leaves the selection exactly as the dependency analysis\n  # computed it.\n  crux_scope=$(bash \"$GITHUB_WORKSPACE/.github/scripts/crux-scope.sh\" 'HEAD^1' HEAD) || crux_scope=full\n  case \"$crux_scope\" in\n    crux-only)\n      run_hub=false run_dashboard=false run_scheduler=false run_agent=true\n      # Rest buckets: the selected Crux packages plus the always-on\n      # tree-scanning packages (mirrors ALWAYS_PATTERNS in\n      # affected-go-packages.sh); a failure here falls back to the\n      # unnarrowed selection.\n      if go list ./crux/... \\\n           ./internal/... ./pkg/config ./pkg/rotation > ../crux-pkgs.txt 2>/dev/null \\\n         && [ -s ../crux-pkgs.txt ]; then\n        grep -Fx -f ../crux-pkgs.txt \"$sel\" > \"$sel.crux\" || true\n        echo \"crux-only diff: narrowing $(grep -c . \"$sel\" || true) selected packages to $(grep -c . \"$sel.crux\" || true) Crux/always-on packages; hub, dashboard and scheduler slices and the dashboard shuffle lane will not run\"\n        mv \"$sel.crux\" \"$sel\"\n      else\n        echo \"::warning::crux-only diff but go list of the Crux set failed; keeping the unnarrowed selection\"\n        crux_scope=mixed\n      fi\n      ;;\n    none)\n      # Drop crux/agent from the selection too: the coverage job\n      # requires every selected package to have produced a result,\n      # and the agent slices are the only lane that tests it.\n      run_agent=false\n      grep -Fxv \"$mod/crux/agent\" \"$sel\" > \"$sel.nocrux\" || true\n      mv \"$sel.nocrux\" \"$sel\"\n      echo \"no Crux package changed: agent slices will not run\"\n      ;;\n    mixed|full) ;;\n    *)\n      echo \"::warning::unexpected crux-scope verdict '$crux_scope'; treating as mixed\"\n      crux_scope=mixed\n      ;;\n  esac\nfi\n{\n  echo \"selection=$selection\"\n  echo \"selected=$(paste -sd' ' \"$sel\")\"\n  echo \"run-hub=$run_hub\"\n  echo \"run-agent=$run_agent\"\n  echo \"run-dashboard=$run_dashboard\"\n  echo \"run-scheduler=$run_scheduler\"\n  echo \"crux-scope=$crux_scope\"\n} >> \"$GITHUB_OUTPUT\"\n{\n  echo \"## Go test selection\"\n  echo \"\"\n  if [ \"$selection\" = full ]; then\n    echo \"Full suite.\"\n  else\n    echo \"Affected packages only ($(grep -c . \"$sel\" || true)); crux-scope=$crux_scope; hub=$run_hub agent=$run_agent dashboard=$run_dashboard scheduler=$run_scheduler.\"\n    echo \"\"\n    sed 's/^/- /' \"$sel\"\n  fi\n} >> \"$GITHUB_STEP_SUMMARY\"\necho \"selection=$selection crux-scope=$crux_scope hub=$run_hub agent=$run_agent dashboard=$run_dashboard scheduler=$run_scheduler\"\n"
    - name: Partition packages into balanced buckets
      id: partition
      run: "R=4\n# Drop only the monolithic packages that have function-sliced jobs\n# of their own: pkg/hub (test-hub), pkg/dashboard and pkg/scheduler\n# (test-sliced). All their subpackages belong in the rest buckets\n# so coverage floors and the no-test-files gate apply to them too.\n# pkg/hubbackup, pkg/dashboard/webstatic et al. stay here.\n# ./internal/... carries the shared test helpers (internal/testutil)\n# and their contract tests, such as the time.Sleep ratchet in\n# sleep_ratchet_test.go. ./crux/... is the nested Crux module\n# (#13536), reachable from src/ through src/go.work; its manager\n# package crux/agent has the dedicated agent slices.\ngo list ./pkg/... ./cmd/... ./internal/... ./crux/... \\\n  | awk '$0 == \"github.com/hivecommons/hive/pkg/hub\" { next }\n         $0 == \"github.com/hivecommons/hive/pkg/dashboard\" { next }\n         $0 == \"github.com/hivecommons/hive/pkg/scheduler\" { next }\n         { print }' \\\n  | grep -Ev '^github\\.com/hivecommons/hive/crux/agent$' \\\n  | LC_ALL=C sort > rest-pkgs.txt\nif [ ! -s rest-pkgs.txt ]; then\n  echo \"::error::go list produced no rest packages \u2014 failing closed\"\n  exit 1\nfi\n# Affected-package selection narrows membership only after the\n# fail-closed check above ran on the full list. The bucket count\n# stays R, so every `test (rest i/R)` context still reports; a\n# bucket left empty succeeds without running (see test-rest).\nif [ \"$(head -n1 ../affected-pkgs.txt)\" != all ]; then\n  grep -Fx -f ../affected-pkgs.txt rest-pkgs.txt > rest-selected.txt || true\n  echo \"affected-package selection: $(wc -l < rest-selected.txt) of $(wc -l < rest-pkgs.txt) rest packages\"\n  mv rest-selected.txt rest-pkgs.txt\nfi\n\n# Weights = measured -short -race package wall seconds on the\n# hive-runners fleet, mean of two v5 push runs (40383615331 and\n# 40382244011, 2026-10-26, rounded). Re-measure with: for each\n# `test (rest i/R)` job log, grep the\n# `ok  github.com/hivecommons/hive/<pkg>  <N>s` lines. Anything\n# under ~5s is noise and takes the 1s default. Packages inside a\n# bucket run concurrently under one go test, so a bucket's wall\n# clock is its heaviest package plus compile time \u2014 the table\n# mainly has to keep the big ones apart, and the sum-based greedy\n# below does that while spreading the compile load. pkg/hub/spoke\n# is the floor now that pkg/dashboard and pkg/scheduler are sliced\n# (test-sliced above): the widest bucket can never be faster than\n# it. pkg/dashboard and pkg/scheduler are listed so a stale\n# exclusion above still yields a sane partition. pkg/github is\n# ~1s with ~1% coverage on push runs but 70s on pull requests (PR\n# 14407's run 40387365403), where it is weighed \u2014 measure it from a\n# PR run, not a push run.\nweight() {\n  case \"$1\" in\n    */pkg/dashboard)  echo 219 ;;\n    */pkg/scheduler)  echo 199 ;;\n    */pkg/hub/spoke)  echo 85 ;;\n    */pkg/config)     echo 82 ;;\n    */pkg/github)     echo 70 ;;\n    */cmd/hive)       echo 69 ;;\n    */crux/proxy)     echo 56 ;;\n    */pkg/dashboard/webstatic) echo 35 ;;\n    */pkg/hubbackup)  echo 30 ;;\n    */pkg/advisory)   echo 29 ;;\n    */internal/testutil) echo 22 ;;\n    */pkg/ioscan)     echo 16 ;;\n    */pkg/hivectl)    echo 15 ;;\n    */pkg/tui)        echo 14 ;;\n    */pkg/discord)    echo 12 ;;\n    */pkg/fleetreport) echo 11 ;;\n    */pkg/hivectl/commands) echo 10 ;;\n    */pkg/stageengine) echo 10 ;;\n    */pkg/apphealth)  echo 9 ;;\n    */pkg/rotation)   echo 9 ;;\n    */pkg/beads)      echo 8 ;;\n    */pkg/github/automerge) echo 8 ;;\n    */crux/api/callback) echo 6 ;;\n    */crux/inference) echo 6 ;;\n    */cmd/hive-backup) echo 5 ;;\n    */pkg/mint)       echo 5 ;;\n    */pkg/policies)   echo 5 ;;\n    *)                echo 1  ;;\n  esac\n}\n\n# Deterministic greedy LPT: stable-sort by weight desc (name asc on\n# ties), assign each package to the currently lightest bucket\n# (lowest index on ties).\nwhile read -r p; do\n  echo \"$(weight \"$p\") $p\"\ndone < rest-pkgs.txt | sort -k1,1nr -k2,2 > weighted.txt\n\ndeclare -a LOAD BUCKET\nfor ((i=0; i<R; i++)); do LOAD[i]=0; BUCKET[i]=\"\"; done\nwhile read -r w p; do\n  best=0\n  for ((i=1; i<R; i++)); do\n    if [ \"${LOAD[i]}\" -lt \"${LOAD[best]}\" ]; then best=$i; fi\n  done\n  BUCKET[best]=\"${BUCKET[best]} $p\"\n  LOAD[best]=$(( LOAD[best] + w ))\ndone < weighted.txt\n\nINCLUDE=\"\"\nfor ((i=0; i<R; i++)); do\n  pkgs=\"${BUCKET[i]# }\"\n  echo \"bucket $((i+1))/$R (weight ${LOAD[i]}): $pkgs\"\n  [ -n \"$INCLUDE\" ] && INCLUDE=\"$INCLUDE,\"\n  INCLUDE=\"$INCLUDE{\\\"idx\\\":$((i+1)),\\\"total\\\":$R,\\\"pkgs\\\":\\\"$pkgs\\\"}\"\ndone\necho \"matrix={\\\"include\\\":[$INCLUDE]}\" >> \"$GITHUB_OUTPUT\"\n"
    name: list-packages
    env:
      CGO_ENABLED: '1'
      KUBERNETES_SERVICE_HOST: ''
      KUBERNETES_SERVICE_PORT: ''
      ACTIONS_CACHE_SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
      GO_CACHE_GUARD_BUILD_CACHE: ${{ 'job' || 'job' }}
  tests-test-rest:
    if: ${{ always() && needs.subject.result == 'success' && ((needs.tests-required-context-scope.result != 'success' || needs.tests-required-context-scope.outputs.run-tests == 'true') && !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-gate/'))) }}
    name: test (rest ${{ matrix.idx }}/${{ matrix.total }})
    needs:
    - subject
    - tests-required-context-scope
    - tests-list-packages
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.tests-list-packages.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src
    steps:
    - name: Affected-package selection
      id: select
      working-directory: .
      env:
        SELECTION: ${{ needs.tests-list-packages.outputs.selection }}
        PKGS: ${{ matrix.pkgs }}
      run: |
        if [ "$SELECTION" = partial ] && [ -z "$PKGS" ]; then
          echo "Affected-package selection: no affected package landed in this bucket; reporting success without running tests. Push and scheduled runs test it in full."
          echo "run=false" >> "$GITHUB_OUTPUT"
        else
          echo "run=true" >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      if: steps.select.outputs.run == 'true'
      with:
        persist-credentials: false
    - name: Warm shared Go tool cache (serialize the cold-cache population)
      if: steps.select.outputs.run == 'true'
      run: bash "$GITHUB_WORKSPACE/.github/scripts/go-toolcache-guard.sh"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      if: steps.select.outputs.run == 'true'
      with:
        cache: false
        go-version-file: src/go.mod
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      if: steps.select.outputs.run == 'true'
      with:
        node-version: '22'
    - name: Guard shared node tool cache (repair a half-written entry)
      if: ${{ steps.select.outputs.run == 'true' && (always()) }}
      run: |
        set -u
        command -v npm >/dev/null 2>&1 && exit 0
        for marker in "${RUNNER_TOOL_CACHE:-/nonexistent}"/node/*/x64.complete; do
          [ -e "$marker" ] || continue
          dir="${marker%.complete}"
          [ -x "$dir/bin/npm" ] && continue
          echo "::warning::node tool cache $dir has a .complete marker but no executable bin/npm; removing the marker so the next job on $RUNNER_NAME rebuilds it"
          rm -f "$marker"
        done
        echo "::error::npm is not on PATH after actions/setup-node on $RUNNER_NAME (half-written shared tool cache, see #10518); marker removed, re-run this job"
        exit 1
    - name: Guard shared Go cache (fall back when the runner volume is full)
      if: steps.select.outputs.run == 'true'
      run: bash "$GITHUB_WORKSPACE/.github/scripts/go-cache-guard.sh"
    - name: Download Go modules (retry transient proxy resets)
      if: steps.select.outputs.run == 'true'
      uses: ./.github/actions/go-mod-download-retry
    - name: Install gotestsum
      if: steps.select.outputs.run == 'true'
      run: |
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        go install gotest.tools/gotestsum@v1.13.0
        "$(go env GOPATH)/bin/gotestsum" --version
    - name: Restore warm Go build cache
      if: ${{ steps.select.outputs.run == 'true' && (!contains('["ubuntu-latest"]', 'hive-runners')) }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/go-build
        key: hive-go-build-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: |
          hive-go-build-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore cgo toolchain package cache
      if: steps.select.outputs.run == 'true'
      id: restore-cgo-apt-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .ci/apt-cache/cgo-race
        key: hive-cgo-race-apt-${{ runner.os }}-${{ runner.arch }}-gcc-libc6-dev-v2
        restore-keys: |
          hive-cgo-race-apt-${{ runner.os }}-${{ runner.arch }}-gcc-libc6-dev-
          hive-cgo-race-apt-${{ runner.os }}-${{ runner.arch }}-
          hive-cgo-race-apt-
    - name: Prepare cgo toolchain for race tests
      if: steps.select.outputs.run == 'true'
      id: prepare-cgo-toolchain
      env:
        HIVE_CI_APT_CACHE_DIR: ${{ github.workspace }}/.ci/apt-cache/cgo-race
        HIVE_CI_MISSING_TOOLCHAIN_SOFT_FAIL: ${{ !true && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
      run: |
        bash "$GITHUB_WORKSPACE/.github/scripts/ci-install-tool.sh" \
          --require gcc --for '-race tests' \
          --apt 'gcc libc6-dev' --apk 'gcc musl-dev' --verify 'gcc --version'
    - name: Save cgo toolchain package cache
      if: ${{ steps.select.outputs.run == 'true' && (always() && steps.restore-cgo-apt-cache.outputs.cache-hit != 'true' && steps.prepare-cgo-toolchain.outputs.apt-cache-populated == 'true') }}
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .ci/apt-cache/cgo-race
        key: hive-cgo-race-apt-${{ runner.os }}-${{ runner.arch }}-gcc-libc6-dev-v2
    - name: Test
      if: ${{ steps.select.outputs.run == 'true' && (steps.prepare-cgo-toolchain.outputs.toolchain-ready == 'true') }}
      env:
        PKGS: ${{ matrix.pkgs }}
        HIVE_TEST_REQUIRE_BEHAVIOURAL: '1'
      run: "set -o pipefail\nif [ -z \"$PKGS\" ]; then\n  echo \"::error::empty package bucket \u2014 failing closed\"\n  exit 1\nfi\n# -timeout=20m: kept from when pkg/dashboard lived in these buckets\n# and nearly exhausted go test's default 10m on loaded PR runners\n# (#12113); a loaded runner can still stretch pkg/hub/spoke.\nSHUFFLE=\"\"\nif [ \"$GITHUB_EVENT_NAME\" != \"pull_request\" ]; then SHUFFLE=\"-shuffle=on\"; fi\n# shellcheck disable=SC2086 # PKGS and SHUFFLE are deliberate word-split lists\nbash \"$GITHUB_WORKSPACE/.github/scripts/ci-gotestsum-preserve-coverprofile.sh\" \\\n  gotestsum --format=standard-verbose --rerun-fails=2 --rerun-fails-max-failures=5 \\\n  --rerun-fails-report=flaky-tests-rest-${{ matrix.idx }}.txt \\\n  --packages=\"$PKGS\" --junitfile junit-rest-${{ matrix.idx }}.xml \\\n  -- -short -race -count=1 -timeout=20m -v $SHUFFLE -coverprofile=coverage-rest-${{ matrix.idx }}.out \\\n  2>&1 | grep --line-buffered -vE '^=== (RUN|PAUSE|CONT) ' | tee test-rest-${{ matrix.idx }}.log\n"
    - name: Surface flaky reruns
      id: flaky-reruns
      if: ${{ steps.select.outputs.run == 'true' && (always()) }}
      run: bash "$GITHUB_WORKSPACE/.github/scripts/ci-gotestsum-flake-summary.sh" "flaky-tests-rest-${{ matrix.idx }}.txt" "rest ${{ matrix.idx }}/${{ matrix.total }}"
    - name: Upload flaky rerun report
      if: ${{ steps.select.outputs.run == 'true' && (always() && steps.flaky-reruns.outputs.has-flakes == 'true') }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: flaky-tests-rest-${{ matrix.idx }}
        path: src/flaky-tests-rest-${{ matrix.idx }}.txt
        if-no-files-found: error
        retention-days: 14
    - name: Slowest tests in this bucket
      if: ${{ steps.select.outputs.run == 'true' && (always()) }}
      run: bash "$GITHUB_WORKSPACE/.github/scripts/slowest-tests.sh" "rest ${{ matrix.idx }}/${{ matrix.total }}" test-rest-${{ matrix.idx }}.log
    - name: Upload shard coverage artifacts
      if: ${{ steps.select.outputs.run == 'true' && (always()) }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: test-shard-rest-${{ matrix.idx }}
        path: |
          src/coverage-rest-${{ matrix.idx }}.out
          src/test-rest-${{ matrix.idx }}.log
        if-no-files-found: warn
        retention-days: 1
    env:
      CGO_ENABLED: '1'
      KUBERNETES_SERVICE_HOST: ''
      KUBERNETES_SERVICE_PORT: ''
      ACTIONS_CACHE_SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
      GO_CACHE_GUARD_BUILD_CACHE: ${{ 'job' || 'job' }}
  tests-test-dashboard-shuffle:
    needs:
    - subject
    - tests-required-context-scope
    - tests-list-packages
    if: ${{ always() && needs.subject.result == 'success' && ((needs.tests-required-context-scope.result != 'success' || needs.tests-required-context-scope.outputs.run-tests == 'true') && !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-gate/'))) }}
    name: test (dashboard shuffle ${{ matrix.idx }}/3)
    strategy:
      fail-fast: false
      matrix:
        idx:
        - 1
        - 2
        - 3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src
    steps:
    - name: Affected-package selection
      id: select
      working-directory: .
      env:
        SELECTION: ${{ needs.tests-list-packages.outputs.selection }}
        RUN_LANE: ${{ needs.tests-list-packages.outputs.run-dashboard }}
      run: |
        if [ "$SELECTION" = partial ] && [ "$RUN_LANE" = false ]; then
          echo "Affected-package selection: pkg/dashboard is not affected by this diff; reporting success without running tests. Push and scheduled runs test it in full."
          echo "run=false" >> "$GITHUB_OUTPUT"
        else
          echo "run=true" >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      if: steps.select.outputs.run == 'true'
      with:
        persist-credentials: false
    - name: Warm shared Go tool cache (serialize the cold-cache population)
      if: steps.select.outputs.run == 'true'
      run: bash "$GITHUB_WORKSPACE/.github/scripts/go-toolcache-guard.sh"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      if: steps.select.outputs.run == 'true'
      with:
        cache: false
        go-version-file: src/go.mod
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      if: steps.select.outputs.run == 'true'
      with:
        node-version: '22'
    - name: Guard shared node tool cache (repair a half-written entry)
      if: ${{ steps.select.outputs.run == 'true' && (always()) }}
      run: |
        set -u
        command -v npm >/dev/null 2>&1 && exit 0
        for marker in "${RUNNER_TOOL_CACHE:-/nonexistent}"/node/*/x64.complete; do
          [ -e "$marker" ] || continue
          dir="${marker%.complete}"
          [ -x "$dir/bin/npm" ] && continue
          echo "::warning::node tool cache $dir has a .complete marker but no executable bin/npm; removing the marker so the next job on $RUNNER_NAME rebuilds it"
          rm -f "$marker"
        done
        echo "::error::npm is not on PATH after actions/setup-node on $RUNNER_NAME (half-written shared tool cache, see #10518); marker removed, re-run this job"
        exit 1
    - name: Guard shared Go cache (fall back when the runner volume is full)
      if: steps.select.outputs.run == 'true'
      run: bash "$GITHUB_WORKSPACE/.github/scripts/go-cache-guard.sh"
    - name: Download Go modules (retry transient proxy resets)
      if: steps.select.outputs.run == 'true'
      uses: ./.github/actions/go-mod-download-retry
    - name: Install gotestsum
      if: steps.select.outputs.run == 'true'
      run: |
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        go install gotest.tools/gotestsum@v1.13.0
        "$(go env GOPATH)/bin/gotestsum" --version
    - name: Restore warm Go build cache
      if: ${{ steps.select.outputs.run == 'true' && (!contains('["ubuntu-latest"]', 'hive-runners')) }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/go-build
        key: hive-go-build-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: |
          hive-go-build-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore cgo toolchain package cache
      if: steps.select.outputs.run == 'true'
      id: restore-cgo-apt-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .ci/apt-cache/cgo-race
        key: hive-cgo-race-apt-${{ runner.os }}-${{ runner.arch }}-gcc-libc6-dev-v2
        restore-keys: |
          hive-cgo-race-apt-${{ runner.os }}-${{ runner.arch }}-gcc-libc6-dev-
          hive-cgo-race-apt-${{ runner.os }}-${{ runner.arch }}-
          hive-cgo-race-apt-
    - name: Prepare cgo toolchain for race tests
      if: steps.select.outputs.run == 'true'
      id: prepare-cgo-toolchain
      env:
        HIVE_CI_APT_CACHE_DIR: ${{ github.workspace }}/.ci/apt-cache/cgo-race
        HIVE_CI_MISSING_TOOLCHAIN_SOFT_FAIL: ${{ !true && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
      run: |
        bash "$GITHUB_WORKSPACE/.github/scripts/ci-install-tool.sh" \
          --require gcc --for '-race tests' \
          --apt 'gcc libc6-dev' --apk 'gcc musl-dev' --verify 'gcc --version'
    - name: Save cgo toolchain package cache
      if: ${{ steps.select.outputs.run == 'true' && (always() && steps.restore-cgo-apt-cache.outputs.cache-hit != 'true' && steps.prepare-cgo-toolchain.outputs.apt-cache-populated == 'true') }}
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .ci/apt-cache/cgo-race
        key: hive-cgo-race-apt-${{ runner.os }}-${{ runner.arch }}-gcc-libc6-dev-v2
    - name: Test pkg/dashboard in shuffled order
      if: ${{ steps.select.outputs.run == 'true' && (steps.prepare-cgo-toolchain.outputs.toolchain-ready == 'true') }}
      env:
        IDX: ${{ matrix.idx }}
        TOTAL: ${{ strategy.job-total }}
      run: "set -o pipefail\n# Sliced like test-hub (NR mod N \u2014 pairwise disjoint, jointly\n# exhaustive) so no single job carries the whole ~6-minute lane;\n# -shuffle still varies order within each slice every run.\nROOT=\"$PWD\"\nexport TEST_PACKAGE=github.com/hivecommons/hive/pkg/dashboard\nexport TEST_DIR=\"$ROOT/pkg/dashboard\"\nexport TEST_BINARY=\"$ROOT/dashboard.test\"\ngo test -c -race -o \"$TEST_BINARY\" ./pkg/dashboard\n(cd \"$TEST_DIR\" && \"$TEST_BINARY\" -test.short -test.list '.*') | grep -E '^(Test|Example|Fuzz)' | LC_ALL=C sort > all-tests.txt\nif [ ! -s all-tests.txt ]; then\n  echo \"::error::go test -list produced no test functions for pkg/dashboard \u2014 refusing to run an empty slice (fail closed)\"\n  exit 1\nfi\nawk -v n=\"$TOTAL\" -v i=\"$IDX\" 'NR % n == i - 1' all-tests.txt > slice.txt\necho \"slice $IDX/$TOTAL: $(wc -l < slice.txt) of $(wc -l < all-tests.txt) test functions\"\nif [ ! -s slice.txt ]; then\n  echo \"::error::empty dashboard slice \u2014 failing closed\"\n  exit 1\nfi\nexport CHUNK_DIR\nCHUNK_DIR=$(mktemp -d \"$ROOT/test-chunks.XXXXXX\")\nsplit -l 1000 slice.txt \"$CHUNK_DIR/chunk-\"\n# raw-command preserves one JUnit/flake report across all chunks.\n# gotestsum appends -test.run and package arguments on reruns.\ncat > \"$CHUNK_DIR/run.sh\" <<'RUNNER'\n#!/usr/bin/env bash\nset -uo pipefail\nexport LC_ALL=C # ${#RUN} must count bytes, not Unicode characters.\ncd \"$TEST_DIR\" || exit 1\nrun_chunk() {\n  local RUN=\"$1\"\n  # MAX_ARG_STRLEN is 131072 bytes; fail clearly before execve.\n  if [ \"${#RUN}\" -gt 120000 ]; then\n    echo \"::error::chunk regex exceeds 120000 bytes; reduce chunk size\" >&2\n    return 1\n  fi\n  # Bound t.Parallel to avoid exhausting httptest ephemeral ports.\n  go tool test2json -t -p \"$TEST_PACKAGE\" \"$TEST_BINARY\" \\\n    -test.short -test.count=1 -test.v=test2json -test.timeout=10m \\\n    -test.shuffle=on -test.parallel=4 \"$RUN\"\n}\nif [ \"$#\" -gt 0 ]; then\n  run_chunk \"$1\"\n  exit $?\nfi\nstatus=0\nfor chunk in \"$CHUNK_DIR\"/chunk-*; do\n  RUN=\"-test.run=^($(paste -sd'|' \"$chunk\"))$\"\n  run_chunk \"$RUN\" || status=1\ndone\nexit \"$status\"\nRUNNER\nif gotestsum --format=standard-verbose --rerun-fails=2 --rerun-fails-max-failures=5 \\\n  --rerun-fails-report=flaky-tests-dashboard-shuffle-\"$IDX\".txt \\\n  --junitfile junit-dashboard-shuffle-\"$IDX\".xml --raw-command -- bash \"$CHUNK_DIR/run.sh\" \\\n  2>&1 | grep --line-buffered -vE '^=== (RUN|PAUSE|CONT) ' | tee test-dashboard-shuffle-\"$IDX\".log; then\n  exit 0\nfi\n# Each chunk prints its own -test.shuffle seed immediately before\n# its tests; do not report the first chunk's seed for a later failure.\necho \"::error::pkg/dashboard failed (slice $IDX/$TOTAL); see the failing chunk's -test.shuffle seed in test-dashboard-shuffle-$IDX.log. Reproduce the failing test with: go test ./pkg/dashboard -short -race -count=1 -p 1 -parallel 4 -run '^TestName$' -shuffle=<seed>\"\nexit 1\n"
    - name: Surface flaky reruns
      id: flaky-reruns
      if: ${{ steps.select.outputs.run == 'true' && (always()) }}
      run: bash "$GITHUB_WORKSPACE/.github/scripts/ci-gotestsum-flake-summary.sh" "flaky-tests-dashboard-shuffle-${{ matrix.idx }}.txt" "dashboard shuffle ${{ matrix.idx }}/3"
    - name: Upload flaky rerun report
      if: ${{ steps.select.outputs.run == 'true' && (always() && steps.flaky-reruns.outputs.has-flakes == 'true') }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: flaky-tests-dashboard-shuffle-${{ matrix.idx }}
        path: src/flaky-tests-dashboard-shuffle-${{ matrix.idx }}.txt
        if-no-files-found: error
        retention-days: 14
    - name: Slowest tests in this lane
      if: ${{ steps.select.outputs.run == 'true' && (always()) }}
      run: bash "$GITHUB_WORKSPACE/.github/scripts/slowest-tests.sh" "dashboard shuffle ${{ matrix.idx }}/3" test-dashboard-shuffle-${{ matrix.idx }}.log
    - name: Upload shuffle log
      if: ${{ steps.select.outputs.run == 'true' && (failure()) }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: test-dashboard-shuffle-log-${{ matrix.idx }}
        path: src/test-dashboard-shuffle-${{ matrix.idx }}.log
        if-no-files-found: warn
        retention-days: 1
    env:
      CGO_ENABLED: '1'
      KUBERNETES_SERVICE_HOST: ''
      KUBERNETES_SERVICE_PORT: ''
      ACTIONS_CACHE_SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
      GO_CACHE_GUARD_BUILD_CACHE: ${{ 'job' || 'job' }}
  tests-test:
    if: ${{ always() && needs.subject.result == 'success' && (always() && !cancelled() && !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-gate/'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
    - subject
    - tests-required-context-scope
    - tests-list-packages
    - tests-test-hub
    - tests-test-sliced
    - tests-test-agent
    - tests-test-rest
    - tests-test-dashboard-shuffle
    steps:
    - name: Check shard results
      env:
        LIST_PACKAGES_RESULT: ${{ needs.tests-list-packages.result }}
        TEST_HUB_RESULT: ${{ needs.tests-test-hub.result }}
        TEST_SLICED_RESULT: ${{ needs.tests-test-sliced.result }}
        TEST_AGENT_RESULT: ${{ needs.tests-test-agent.result }}
        TEST_REST_RESULT: ${{ needs.tests-test-rest.result }}
        TEST_DASHBOARD_SHUFFLE_RESULT: ${{ needs.tests-test-dashboard-shuffle.result }}
        RUN_TESTS: ${{ needs.tests-required-context-scope.outputs.run-tests }}
        SCOPE_RESULT: ${{ needs.tests-required-context-scope.result }}
        SELECTION: ${{ needs.tests-list-packages.outputs.selection }}
        CRUX_SCOPE: ${{ needs.tests-list-packages.outputs.crux-scope }}
        RUN_HUB: ${{ needs.tests-list-packages.outputs.run-hub }}
        RUN_AGENT: ${{ needs.tests-list-packages.outputs.run-agent }}
        RUN_DASHBOARD: ${{ needs.tests-list-packages.outputs.run-dashboard }}
        RUN_SCHEDULER: ${{ needs.tests-list-packages.outputs.run-scheduler }}
      run: "set -euo pipefail\n\nif [ \"${SCOPE_RESULT:-}\" != success ]; then\n  echo \"::error::required-context-scope failed; refusing to report test success without a diff verdict\"\n  exit 1\nfi\n\nif [ \"${RUN_TESTS:-}\" != true ]; then\n  echo \"No v2 test paths changed; reporting required test context success without running shards.\"\n  exit 0\nfi\n\n# Lanes with nothing selected still ran (and succeeded) \u2014 see the\n# Affected-package selection step in each shard \u2014 so the fail-closed\n# result check below is unchanged by selection.\necho \"Go test selection: ${SELECTION:-<missing>} (partial = affected packages only on this PR; push and scheduled runs are always full)\"\n# Crux boundary filter (#13536): the lanes allowed to report success\n# without testing are exactly those whose run flag list-packages set\n# to false. Print that allowlist here so the verdict is auditable\n# from the aggregate log; a lane absent from it that did not test\n# would have failed its own selection step logic, and any shard\n# result other than success still fails this job below.\nif [ \"${SELECTION:-}\" = partial ]; then\n  allow=()\n  [ \"${RUN_HUB:-true}\" = false ] && allow+=(test-hub)\n  [ \"${RUN_AGENT:-true}\" = false ] && allow+=(test-agent)\n  [ \"${RUN_DASHBOARD:-true}\" = false ] && allow+=(test-dashboard-shuffle \"test-sliced (dashboard)\")\n  [ \"${RUN_SCHEDULER:-true}\" = false ] && allow+=(\"test-sliced (scheduler)\")\n  echo \"Crux scope: ${CRUX_SCOPE:-<missing>}; lanes allowed to succeed without testing: ${allow[*]:-<none>}\"\nfi\n\nshard_names=(\n  list-packages\n  test-hub\n  test-sliced\n  test-agent\n  test-rest\n  test-dashboard-shuffle\n)\nshard_results=(\n  \"${LIST_PACKAGES_RESULT:-}\"\n  \"${TEST_HUB_RESULT:-}\"\n  \"${TEST_SLICED_RESULT:-}\"\n  \"${TEST_AGENT_RESULT:-}\"\n  \"${TEST_REST_RESULT:-}\"\n  \"${TEST_DASHBOARD_SHUFFLE_RESULT:-}\"\n)\n\nfailures=()\nskipped=()\ncancelled=()\nunknown=()\n\nfor i in \"${!shard_names[@]}\"; do\n  name=${shard_names[$i]}\n  result=${shard_results[$i]}\n  printf '%-23s %s\\n' \"${name}:\" \"${result:-<missing>}\"\n  case \"$result\" in\n    success) ;;\n    failure) failures+=(\"$name\") ;;\n    skipped) skipped+=(\"$name\") ;;\n    cancelled) cancelled+=(\"$name\") ;;\n    *) unknown+=(\"$name=${result:-<missing>}\") ;;\n  esac\ndone\n\njoin_by_comma() {\n  local IFS=', '\n  echo \"$*\"\n}\n\nappend_summary() {\n  if [ -n \"${GITHUB_STEP_SUMMARY:-}\" ]; then\n    {\n      echo \"## v2 shard aggregate\"\n      echo \"\"\n      echo \"$1\"\n    } >> \"$GITHUB_STEP_SUMMARY\"\n  fi\n}\n\nif [ \"${#failures[@]}\" -gt 0 ] || [ \"${#skipped[@]}\" -gt 0 ] || [ \"${#unknown[@]}\" -gt 0 ]; then\n  if [ \"${#failures[@]}\" -gt 0 ]; then\n    echo \"::error::Failing shard(s): $(join_by_comma \"${failures[@]}\")\"\n  fi\n  if [ \"${#skipped[@]}\" -gt 0 ]; then\n    echo \"::error::Skipped shard(s): $(join_by_comma \"${skipped[@]}\"). A skipped shard means tests may not have run.\"\n  fi\n  if [ \"${#unknown[@]}\" -gt 0 ]; then\n    echo \"::error::Unknown shard result(s): $(join_by_comma \"${unknown[@]}\")\"\n  fi\n  if [ \"${#cancelled[@]}\" -gt 0 ]; then\n  echo \"::error::Candidate shards must all complete\"; exit 1\n    echo \"Cancelled shard(s) were also present: $(join_by_comma \"${cancelled[@]}\"). They are not treated as infrastructure-only because another shard failed, skipped, or reported an unknown state.\"\n  fi\n  append_summary \"\u274C At least one shard failed, skipped, or reported an unknown state. Cancelled shards, if any, were not allowed to mask that result.\"\n  exit 1\nfi\n\nif [ \"${#cancelled[@]}\" -gt 0 ]; then\n  echo \"::error::Candidate shards must all complete\"; exit 1\n  message=\"Infrastructure cancellation: shard(s) did not complete: $(join_by_comma \"${cancelled[@]}\"). No test failure was observed, but this run is not complete test evidence for those shard(s).\"\n  echo \"::warning title=Infrastructure cancellation::$message\"\n  append_summary \"\u26A0\uFE0F $message\"\n  exit 0\nfi\n\nappend_summary \"\u2705 All shards succeeded.\"\necho \"All shards succeeded.\"\n"
    name: test
    env:
      CGO_ENABLED: '1'
      KUBERNETES_SERVICE_HOST: ''
      KUBERNETES_SERVICE_PORT: ''
      ACTIONS_CACHE_SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
      GO_CACHE_GUARD_BUILD_CACHE: ${{ 'job' || 'job' }}
  tests-coverage:
    if: ${{ always() && needs.subject.result == 'success' && (always() && (true || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-gate/')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - subject
    - tests-required-context-scope
    - tests-list-packages
    - tests-test-hub
    - tests-test-sliced
    - tests-test-agent
    - tests-test-rest
    steps:
    - name: Report coverage not required for this diff
      if: ${{ needs.tests-required-context-scope.result == 'success' && needs.tests-required-context-scope.outputs.run-tests != 'true' }}
      run: echo "No v2 coverage paths changed; reporting required coverage context success."
    - name: Fail if scope failed or a required test shard did not complete
      if: ${{ needs.tests-required-context-scope.result != 'success' || (needs.tests-required-context-scope.outputs.run-tests == 'true' && (needs.tests-test-hub.result != 'success' || needs.tests-test-sliced.result != 'success' || needs.tests-test-agent.result != 'success' || needs.tests-test-rest.result != 'success')) }}
      run: |
        if [ "${{ needs.tests-required-context-scope.result }}" != success ]; then
          echo "::error::required-context-scope failed; refusing to report coverage success without a diff verdict"
          exit 1
        fi
        echo "::error::Coverage requires successful test shards (hub=${{ needs.tests-test-hub.result }}, sliced=${{ needs.tests-test-sliced.result }}, agent=${{ needs.tests-test-agent.result }}, rest=${{ needs.tests-test-rest.result }})"
        exit 1
    - name: Decide what coverage to score
      id: cov-scope
      if: ${{ needs.tests-required-context-scope.outputs.run-tests == 'true' }}
      env:
        SELECTION: ${{ needs.tests-list-packages.outputs.selection }}
        SELECTED: ${{ needs.tests-list-packages.outputs.selected }}
      run: |
        if [ "$SELECTION" = partial ] && [ -z "${SELECTED// /}" ]; then
          echo "Affected-package selection chose no Go package; no coverage to score. Push and scheduled runs score the full suite."
          echo "score=false" >> "$GITHUB_OUTPUT"
        else
          echo "Coverage scoring: ${SELECTION:-<missing>} selection."
          echo "score=true" >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      if: ${{ steps.cov-scope.outputs.score == 'true' }}
      with:
        persist-credentials: false
    - name: Warm shared Go tool cache (serialize the cold-cache population)
      if: ${{ steps.cov-scope.outputs.score == 'true' }}
      run: bash "$GITHUB_WORKSPACE/.github/scripts/go-toolcache-guard.sh"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      if: ${{ steps.cov-scope.outputs.score == 'true' }}
      with:
        go-version-file: src/go.mod
        cache-dependency-path: |
          src/go.sum
          src/crux/go.sum
    - name: Download Go modules (retry transient proxy resets)
      if: ${{ steps.cov-scope.outputs.score == 'true' }}
      uses: ./.github/actions/go-mod-download-retry
    - name: List packages present in checkout
      if: ${{ steps.cov-scope.outputs.score == 'true' }}
      working-directory: src
      env:
        SELECTION: ${{ needs.tests-list-packages.outputs.selection }}
      run: |
        # The coverage scorer consumes shard artifacts, but the package set it
        # scores must still be bounded by the checked-out tree for this run.
        # This mirrors coverage-hourly.yml, whose `go test` command can only
        # emit packages that exist in the checkout.
        go list ./pkg/... ./cmd/... ./internal/... ./crux/... | LC_ALL=C sort -u > ../existing-pkgs.txt
        if [ ! -s ../existing-pkgs.txt ]; then
          echo "::error::go list produced no packages for coverage scoring"
          exit 1
        fi
        # On a partial selection the shard logs only cover the selected
        # packages, so take the no-test-files gate from the whole tree
        # instead (cheap: go list only). Same definition as the `?` /
        # `coverage: 0.0%` lines a full run classifies below.
        : > ../no-test-pkgs.txt
        if [ "$SELECTION" = partial ]; then
          go list -f '{{if not (or .TestGoFiles .XTestGoFiles)}}{{.ImportPath}}{{end}}' ./pkg/... ./cmd/... ./crux/... \
            | { grep . || true; } | LC_ALL=C sort -u > ../no-test-pkgs.txt
        fi
    - name: Download shard coverage artifacts
      if: ${{ steps.cov-scope.outputs.score == 'true' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: test-shard-*
        path: shards
        merge-multiple: true
    - name: Check per-package coverage
      if: ${{ steps.cov-scope.outputs.score == 'true' }}
      working-directory: shards
      env:
        SELECTION: ${{ needs.tests-list-packages.outputs.selection }}
        SELECTED: ${{ needs.tests-list-packages.outputs.selected }}
      run: "THRESHOLD=90\nFAILED=\"\"\nBROKEN=\"\"\nREPORT=\"\"\n\n# Per-package threshold overrides. A handful of packages are heavily\n# coupled to the live runtime (fixed /data,/proc,/var/run paths, real\n# github.com/platform.claude.com device-flow, a live tmux agent buffer,\n# an in-cluster k8s serviceaccount) and cannot be exercised hermetically\n# in CI without invasive production seams. They get a documented lower\n# floor so the gate still catches regressions below their real ceiling,\n# rather than blocking forever on untestable code. Raise these toward 90\n# as seams are added; do not add new entries without justification here.\n#\n# KEEP IN SYNC with coverage-hourly.yml, which applies the same floors\n# on its hourly scheduled run.\ndeclare -A PKG_THRESHOLD=(\n  [dashboard]=84   # 86.2% on 2026-09-01; the residue is the inception tmux watcher + copilot/claude device-flow + /data file I/O + k8s\n  [hub]=87         # kubectl-shelling + live-GitHub paths; see #2355. Was 89 against v2's 89.9%; v4 measures 87.6%.\n  [crux/agent]=89  # pre-existing shortfall inherited from #2350, NOT a new regression. See #2355. Keyed crux/<pkg> since the module cut (#13536)\n\n  # \u2500\u2500 Floors recorded when the gate moved from v2 to v4 (#3903) \u2500\u2500\u2500\u2500\u2500\n  # A RATCHET, NOT A TARGET \u2014 see coverage-hourly.yml for the full\n  # rationale. Raise these toward 90 as tests land; never raise one to\n  # paper over a drop.\n  #\n  # \u2500\u2500 Ratchet turned for #4570 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  # sandbox/ioscan/pushbroker: tests added in the same PR, so the\n  #   floors move with the gain (67.6\u219298.5, 71.0\u219297.1, 72.8\u2192100.0).\n  # intent/tracing/dashboard: NO code change \u2014 these had drifted far\n  #   above floors recorded at d89121f5 and were no longer catching\n  #   anything. Re-measured on v4 at cd8aee5d and moved up to what\n  #   they actually hold, with ~1 point of headroom.\n  # scheduler (90.4) and escalation (93.2) now clear the 90% default\n  #   and no longer need an entry at all.\n  [intent]=87\n  [tracing]=85\n  [review]=80\n  [retro]=82\n  [github]=88      # 88.9% on 2026-10-05\n  [hivectl]=88\n  [knowledge]=89\n  [crux/proxy]=89\n  [ioscan]=96\n  [crux/sandbox]=98\n  [crux/pushbroker]=99\n  [crux/kubejob]=90    # new in #6311; sandbox.Launcher over the in-cluster API, tested against httptest\n\n  # \u2500\u2500 Stale module-path parser repaired on v5 (#6066) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  # These packages were pre-existing below-default floors that became\n  # visible again when the v2-tests coverage classifier was corrected\n  # from the old github.com/kubestellar/hive module path to\n  # github.com/hivecommons/hive. Record their current ceilings so the\n  # parser fix can gate new packages (pkg/effects, pkg/hub/spoke)\n  # without turning unrelated backlog into a blocker.\n  [convergence/mutation]=86   # 86.7% on PR #6076\n  [convergence/audit]=92      # measured 95.6% on v5 after #9930 (in-package Run/reconcile/publish tests, #9928); was 6 (seed tests only, #9688)\n  [dashboard/webstatic]=88  # 88.9% on PR #6076\n  [github/automerge]=88   # 88.6% on PR #6076\n  [mint]=89       # 89.1% on PR #6076\n  [turn]=87       # 87.1% on PR #6076\n\n  # \u2500\u2500 Ratchet turned for #7146 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  # spoke was unfloored and flapped across the 90 default (run\n  # 35026215085 at 89.6%, green runs either side, no spoke change\n  # between). #7130 covered the timing-dependent paths rather than\n  # lowering the floor; spoke now holds a flat 96.3% with zero variance\n  # over five runs. See coverage-hourly.yml for the full rationale.\n  [spoke]=95       # 96.3% on 2026-09-16 after #7130; was unfloored/flapping\n\n  # \u2500\u2500 ./cmd/... floors (#4701) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  # See coverage-hourly.yml for the rationale. cmd keys are prefixed\n  # (\"cmd/<name>\") so cmd/hivectl can never collide with\n  # pkg/hivectl's floor. Recorded just below what v4 measures after\n  # #4700/#4719 so the ratchet can turn as CLI tests land.\n  # \u2500\u2500 Ratchet turned 2026-09-01 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  # cmd/bd, cmd/hive, cmd/hive-backup, dashboard, github: NO code\n  #   change \u2014 each had drifted 4\u201320 points above its recorded floor\n  #   (cmd/hive most of all: 18.8 \u2192 37.5 as eval-cycle helpers grew\n  #   tests) and the gate was no longer catching a drop. Re-measured\n  #   on the 2026-09-01 hourly run and moved to ~2\u20134 points under\n  #   what they hold. cmd/apiproxy is unchanged at 13.9%.\n  # \u2500\u2500 Ratchet turned for #7407 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  # NO code change \u2014 re-measured on 2026-09-17 with `go test -cover\n  # ./cmd/... -short -count=1` (three runs, zero variance) and moved\n  # to ~2-3 points under the lower of the linux/darwin measurements.\n  # See coverage-hourly.yml for the full rationale and both numbers.\n  [cmd/bd]=92       # 95.7% on 2026-09-17; was 75\n  [cmd/hive]=42     # 44.8% on 2026-09-17; bulk is main()/run-loop wiring; was 35\n  [cmd/apiproxy]=92 # 95.6% on 2026-09-17; was 13\n  [cmd/hive-backup]=85 # 90.4% on 2026-09-17; was 78\n  [cmd/hivectl]=97  # 100.0% on 2026-09-17; was exempt as an untested main\n  [cmd/flue-fixture]=75 # 80.0% on 2026-09-22 (#8361): main() is the single uncovered statement; run() and signalContext() are tested in-process and the binary is smoke-tested as a child process, which yields no profile\n  [cmd/crux]=75     # 80.0% on 2026-10-23 (#13536): same shape as flue-fixture; main() is the one uncovered statement, run() is tested in-process. floor_key maps BOTH ./cmd/crux (root host) and ./crux/cmd/crux (the module's own binary, #14138) here; the module one measured 80.0% on 2026-10-25\n  [crux/cli]=92     # 97.8% on 2026-10-23 (#13536): the crux CLI against a fake crux.Runtime plus a real unix control socket; the residue is Main() and write-error branches\n\n  # \u2500\u2500 Crux module (#13536, Stage 2 step 4) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  # Packages of the nested module at src/crux are keyed \"crux/<path>\"\n  # (floor_key below): crux/agent, crux/proxy, crux/sandbox,\n  # crux/pushbroker, crux/kubejob and crux/cli above carried their\n  # pkg/<name> floors across the move unchanged. The module root\n  # package is keyed \"crux\". Every other crux/<pkg> takes the\n  # default.\n)\n\n# Thin flag-parsing mains with no test files, wrapping packages the\n# gate already floors. KEEP IN SYNC with coverage-hourly.yml. Any NEW\n# untested cmd package still hard-fails.\n#\n# Empty since #7407: cmd/hivectl, the only entry, gained tests in\n# a3f9842c, so no \"[no test files]\" line is emitted for it and the\n# exemption could never match. The mechanism itself is unchanged.\nUNTESTED_CMD_MAINS=''\n\n# Merge every shard profile: per-block counts are summed, so the N\n# partial crux/agent profiles combine into the package's true\n# coverage. Blocks are keyed by (location, statement count); package\n# = the directory of the block's file. Emits \"pkg pct\" lines plus a\n# TOTAL over ./pkg/... \u2014 the same statements-covered/statements\n# definition `go test -cover` prints, so floors are unchanged.\n#\n# Packages are selected by their \"/pkg/\" path segment rather than by\n# a hard-coded module prefix. The previous version matched the literal\n# module path, so the kubestellar -> hivecommons org rename silently\n# emptied every filter and disabled the whole gate. A segment match\n# survives any future rename, and only this repository's own packages\n# appear in these profiles, so it cannot over-match. The nested Crux\n# module's packages carry a \"/crux\" segment (github.com/<org>/hive/crux\n# and .../crux/<pkg>) and get a second, informational total.\nawk '\n  FNR == 1 { next }              # skip each file'\\''s \"mode:\" line\n  {\n    file = $1; sub(/:[^:]*$/, \"\", file)\n    pkg = file; sub(/\\/[^\\/]+$/, \"\", pkg)\n    key = pkg \"|\" $1 \"|\" $2\n    stmts[key] = $2; owner[key] = pkg\n    count[key] += $3\n  }\n  END {\n    for (k in count) {\n      p = owner[k]\n      tot[p] += stmts[k]\n      if (count[k] > 0) cov[p] += stmts[k]\n    }\n    gt = 0; gc = 0; xt = 0; xc = 0\n    for (p in tot) {\n      printf \"%s %.1f\\n\", p, cov[p] * 100 / tot[p]\n      if (p ~ /\\/pkg\\//) {\n        gt += tot[p]; gc += cov[p]\n      } else if (p ~ /\\/crux(\\/|$)/ && p !~ /\\/cmd\\//) {\n        xt += tot[p]; xc += cov[p]\n      }\n    }\n    if (gt > 0) printf \"TOTAL %.1f\\n\", gc * 100 / gt\n    if (xt > 0) printf \"CRUX_TOTAL %.1f\\n\", xc * 100 / xt\n  }\n' coverage-*.out > pkg-pcts.txt\n\nTOTAL=$(awk '$1 == \"TOTAL\" {print $2 \"%\"}' pkg-pcts.txt)\nCRUX_TOTAL=$(awk '$1 == \"CRUX_TOTAL\" {print $2 \"%\"}' pkg-pcts.txt)\necho \"Total coverage (./pkg/...): ${TOTAL:-unavailable}\"\necho \"Total coverage (./crux/...): ${CRUX_TOTAL:-unavailable}\"\
        \n\n# Partial selection (#12454): every number here covers the selected\n# packages only. Per-package floors still apply unchanged to each of\n# them; the total is informational and not comparable to the\n# repo-wide figure, so it is labelled rather than compared.\nPARTIAL=false\nSELECTED_SCORED=\"\"\nif [ \"$SELECTION\" = partial ]; then\n  PARTIAL=true\n  for p in $SELECTED; do\n    case \"$p\" in */pkg/*|*/cmd/*|*/crux|*/crux/*) ;; *) continue ;; esac\n    grep -Fxq \"$p\" ../existing-pkgs.txt && SELECTED_SCORED=\"$SELECTED_SCORED $p\"\n  done\n  echo \"Partial selection: scoring only the $(wc -w <<<\"$SELECTED_SCORED\") selected ./pkg/..., ./cmd/... and ./crux/... packages; the totals above are over the selected packages and are not comparable to the repo-wide totals.\"\n  if [ -z \"$TOTAL\" ] && ! grep -q '/pkg/' <<<\"$SELECTED_SCORED\"; then\n    TOTAL=\"n/a (no ./pkg/... package selected)\"\n  fi\nfi\n\n# Fail closed. Every step below is a filter, and an empty filter\n# result looks exactly like \"nothing was wrong\". This gate silently\n# scored zero packages for the whole window in which it still matched\n# the pre-rename module path github.com/kubestellar/hive, while the\n# module had become github.com/hivecommons/hive: TOTAL was\n# \"unavailable\", pkg-states.txt was empty, the scoring loop never ran\n# once, and the job reported success on every PR. A gate that cannot\n# see anything must fail, not pass.\nif [ -z \"$TOTAL\" ]; then\n  echo \"COVERAGE GATE FAILED: no coverage data parsed from the shard artifacts.\"\n  echo \"coverage-*.out was present but produced no ./pkg/... totals.\"\n  exit 1\nfi\n# Same guard for the Crux module on a full run: its shards (the\n# agent slices and the rest buckets holding ./crux/...) must have\n# produced profiles, or the module's floors are vacuously met.\nif [ \"$SELECTION\" != partial ] && [ -z \"$CRUX_TOTAL\" ]; then\n  echo \"COVERAGE GATE FAILED: no coverage data parsed for the Crux module (./crux/...).\"\n  exit 1\nfi\n\n# Classify every package exactly once from the combined logs. With\n# gotestsum reruns, a package can have an initial FAIL line followed\n# by a final ok line in the same successful shard; score the final\n# successful rerun rather than treating the surfaced flake as a\n# coverage-blocking broken package.\n# ./cmd/... is scored too (#4701): the shards have run cmd tests\n# since the partition change, but coverage floors previously applied\n# to ./pkg/... only, so a CLI package could lose all its tests\n# without the gate noticing. The TOTAL line remains ./pkg/...-only\n# for trend continuity.\ncat test-*.log > cover-run.log\nawk '\n      NR == FNR {\n        exists[$1] = 1\n        next\n      }\n      $1 == \"ok\" || $1 == \"FAIL\" || $1 == \"?\" {\n        if (!exists[$2]) next\n        if ($2 ~ /\\/(pkg|cmd)\\// || $2 ~ /\\/crux(\\/|$)/) {\n          seen[$2] = 1\n          if ($1 == \"ok\") ok[$2] = 1\n          else if ($1 == \"FAIL\") fail[$2] = 1\n          else if ($1 == \"?\") no_tests[$2] = 1\n        }\n        next\n      }\n      /^\\t.*\\t\\tcoverage: 0\\.0% of statements$/ {\n        if (exists[$1] && ($1 ~ /\\/(pkg|cmd)\\// || $1 ~ /\\/crux(\\/|$)/)) {\n          seen[$1] = 1\n          no_tests[$1] = 1\n        }\n      }\n      END {\n        for (pkg in seen) {\n          if (ok[pkg]) print \"ok\", pkg\n          else if (fail[pkg]) print \"FAIL\", pkg\n          else if (no_tests[pkg]) print \"?\", pkg\n        }\n      }\n    ' ../existing-pkgs.txt cover-run.log \\\n  | LC_ALL=C sort -u > pkg-states.txt\n\n# Second fail-closed guard, for the same reason as the TOTAL one:\n# an empty pkg-states.txt means the scoring loop never executes and\n# every floor is vacuously satisfied.\nif [ ! -s pkg-states.txt ] && { [ \"$PARTIAL\" != true ] || [ -n \"$SELECTED_SCORED\" ]; }; then\n  echo \"COVERAGE GATE FAILED: no package pass/fail states parsed from test-*.log.\"\n  echo \"No package could be scored against its floor.\"\n  exit 1\nfi\n\n# Partial selection: every selected package must have been run and\n# classified \u2014 a selected package missing here was never tested.\n# The no-test-files gate is taken from the whole tree (see \"List\n# packages present in checkout\") so an unselected untested package\n# still fails exactly as it would on a full run.\nif [ \"$PARTIAL\" = true ]; then\n  MISSING=\"\"\n  for p in $SELECTED_SCORED; do\n    awk -v p=\"$p\" '$2 == p { f = 1 } END { exit !f }' pkg-states.txt || MISSING=\"$MISSING $p\"\n  done\n  if [ -n \"$MISSING\" ]; then\n    echo \"COVERAGE GATE FAILED: selected package(s) produced no test result:$MISSING\"\n    exit 1\n  fi\n  while read -r p; do\n    [ -n \"$p\" ] || continue\n    awk -v p=\"$p\" '$2 == p { f = 1 } END { exit !f }' pkg-states.txt || echo \"? $p\" >> pkg-states.txt\n  done < ../no-test-pkgs.txt\nfi\n\n# Floor-map key: cmd packages get a \"cmd/\" prefix so cmd/hivectl can\n# never resolve to pkg/hivectl's floor; pkg packages are keyed by\n# their full path below pkg/ so a nested package can never alias the\n# top-level one sharing its name (v5 has both pkg/spoke and\n# pkg/hub/spoke); the nested Crux module's packages are keyed\n# \"crux/<path>\" (the module root package is \"crux\") so crux/config\n# can never alias pkg/config. See coverage-hourly.yml for the full\n# rationale.\nfloor_key() {\n  case \"$1\" in\n    */cmd/*)  echo \"cmd/${1##*/}\" ;;\n    */pkg/*)  echo \"${1##*/pkg/}\" ;;\n    */crux/*) echo \"crux/${1##*/crux/}\" ;;\n    */crux)   echo \"crux\" ;;\n    *)        echo \"${1##*/}\" ;;\n  esac\n}\n\nwhile read -r state pkgpath; do\n  pkg=$(floor_key \"$pkgpath\")\n  case \"$state\" in\n    ok)\n      # Package states are collapsed above, so an ok means either\n      # the package passed immediately or gotestsum reran its flakes\n      # to a successful final result.\n      pct=$(awk -v p=\"$pkgpath\" '$1 == p {print $2}' pkg-pcts.txt)\n      if [ -z \"$pct\" ]; then continue; fi\n      int_pct=${pct%.*}\n      pkg_threshold=${PKG_THRESHOLD[$pkg]:-$THRESHOLD}\n      if [ \"$int_pct\" -lt \"$pkg_threshold\" ]; then\n        FAILED=\"${FAILED}${pkg}: ${pct}% (floor ${pkg_threshold}%)\\n\"\n      fi\n      REPORT=\"${REPORT}${pkg}: ${pct}%\\n\"\n      ;;\n    FAIL)\n      BROKEN=\"${BROKEN}${pkg}: TESTS FAILING\\n\"\n      REPORT=\"${REPORT}${pkg}: FAIL\\n\"\n      ;;\n    \\?)\n      case \" $UNTESTED_CMD_MAINS \" in\n        *\" $pkg \"*)\n          REPORT=\"${REPORT}${pkg}: no tests (exempt thin main)\\n\"\n          ;;\n        *)\n          BROKEN=\"${BROKEN}${pkg}: NO TEST FILES\\n\"\n          REPORT=\"${REPORT}${pkg}: no tests\\n\"\n          ;;\n      esac\n      ;;\n  esac\ndone < pkg-states.txt\n\n{\n  echo \"## Per-package coverage\"\n  echo \"\"\n  echo \"Total (./pkg/...): ${TOTAL:-unavailable}\"\n  echo \"Total (./crux/...): ${CRUX_TOTAL:-unavailable}\"\n  echo \"\"\n  echo -e \"${REPORT}\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n\nif [ -n \"$BROKEN\" ] || [ -n \"$FAILED\" ]; then\n  {\n    [ -n \"$BROKEN\" ] && echo -e \"### Packages that cannot be scored\\n${BROKEN}\"\n    [ -n \"$FAILED\" ] && echo -e \"### Packages below their floor\\n${FAILED}\"\n  } >> \"$GITHUB_STEP_SUMMARY\"\n  echo \"\"\n  echo \"COVERAGE GATE FAILED:\"\n  [ -n \"$BROKEN\" ] && echo -e \"${BROKEN}\"\n  [ -n \"$FAILED\" ] && echo -e \"${FAILED}\"\n  exit 1\nfi\necho \"All packages meet their coverage floor\" >> \"$GITHUB_STEP_SUMMARY\"\n"
    name: coverage
    env:
      CGO_ENABLED: '1'
      KUBERNETES_SERVICE_HOST: ''
      KUBERNETES_SERVICE_PORT: ''
      ACTIONS_CACHE_SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
      GO_CACHE_GUARD_BUILD_CACHE: ${{ 'job' || 'job' }}
  security-required-context-scope:
    name: required context scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run-go-security: ${{ steps.scope.outputs.run-go-security }}
    steps:
    - name: Decide whether Go security checks need real scans
      id: scope
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [ "${{ true }}" = true ] &&
           { [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [[ "$GITHUB_REF" != refs/tags/hive-integration/* ]]; }; then
          echo "::error::Integration candidates require an explicitly dispatched immutable candidate tag"
          exit 1
        fi
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "run-go-security=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        : > changed-files.txt
        page=1
        api_root="${GITHUB_API_URL:-https://api.github.com}"
        while :; do
          curl -fsSL               -H "Authorization: Bearer ${GITHUB_TOKEN}"               -H "Accept: application/vnd.github+json"               "${api_root}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100&page=${page}"               -o changed-files-page.json
          python3 - <<'PYFILES' >> changed-files.txt
        import json
        with open('changed-files-page.json', encoding='utf-8') as f:
            for item in json.load(f):
                print(item['filename'])
        PYFILES
          count=$(python3 - <<'PYCOUNT'
        import json
        with open('changed-files-page.json', encoding='utf-8') as f:
            print(len(json.load(f)))
        PYCOUNT
        )
          [ "$count" -lt 100 ] && break
          page=$((page + 1))
        done
        rm -f changed-files-page.json
        run=false
        while IFS= read -r path; do
          case "$path" in
            CHANGELOG.md|changelog.d/*|src/*|NOTICE|.github/workflows/*|.github/scripts/*|.github/release-lines.yml)
              run=true
              ;;
          esac
        done < changed-files.txt
        echo "run-go-security=${run}" >> "$GITHUB_OUTPUT"
        if [ "$run" = true ]; then
          echo "Go security checks will run real scans."
        else
          echo "No Go security paths changed; required scan contexts will be skipped/success."
        fi
    needs:
    - subject
    if: ${{ always() && needs.subject.result == 'success' && (success()) }}
    env:
      GO_CACHE_GUARD_BUILD_CACHE: ${{ 'job' || 'job' }}
  security-govulncheck:
    needs:
    - subject
    - security-required-context-scope
    if: ${{ always() && needs.subject.result == 'success' && (always() && (needs.security-required-context-scope.result != 'success' || needs.security-required-context-scope.outputs.run-go-security == 'true') && !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-gate/'))) }}
    name: govulncheck (known vulnerabilities)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Warm shared Go tool cache (serialize the cold-cache population)
      run: bash "$GITHUB_WORKSPACE/.github/scripts/go-toolcache-guard.sh"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        cache: false
        go-version-file: src/go.mod
    - name: Guard shared Go cache (fall back when the runner volume is full)
      run: bash "$GITHUB_WORKSPACE/.github/scripts/go-cache-guard.sh"
    - name: Download Go modules (retry transient proxy resets)
      uses: ./.github/actions/go-mod-download-retry
    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
    - name: Scan
      working-directory: src
      run: govulncheck ./... ./crux/...
    env:
