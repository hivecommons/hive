name: PR Verifier

# REQUIRED CONTEXT on v5: `verify PR contents` must report on the final head
# of every PR. On #16567 changelog-fragment-guard's autofix pushed b9cd4bac
# with github.token (a Dependabot-triggered `pull_request` run sees no Actions
# secrets, so TOPUP_PUSH_TOKEN was empty; every run on that head reports
# actor=github-actions[bot]). That push fired the `pull_request` workflows
# but NOT this `pull_request_target` one, no label event followed for three
# days, and the context stayed "expected" until a human closed and reopened
# the PR — BLOCKED the whole time (#16567, #17036). A PAT or App-token push
# fires both event kinds, so the gap is specific to github.token pushes.
# Two things close it:
#   - `labeled`/`unlabeled` (and `ready_for_review`) are listed, mirroring
#     native-queue-policy.yml, so any App- or PAT-made label flip re-runs the
#     verifier on the current head (github.token label flips fire nothing).
#   - `workflow_dispatch`: changelog-fragment-guard dispatches this workflow
#     on the PR branch right after a github.token autofix push.
#     workflow_dispatch is one of the two events a github.token may trigger,
#     and the run's check lands on the branch tip, i.e. the pushed head. Only
#     same-repo branches are ever dispatched (the autofix never pushes to
#     forks); such a run uses the GitHub-hosted ARM runner like fork PRs do.
# The concurrency group below bounds the cost without cancelling anything.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Number of the same-repo PR whose branch tip this run verifies (#17036)
        required: true
        type: string

# Required context: never CANCEL a run on the head SHA (#18578). GitHub scores
# every check-run of a required name on a commit, so one cancelled sibling
# leaves the PR BLOCKED beside a green survivor and Tide jams on it (#11250).
# A per-PR group with cancel-in-progress let every label flip (lgtm, approved,
# size, stage) cancel the run in flight, and a queued run in a shared group is
# cancelled by the next one to queue even with cancel-in-progress false. So:
#   - the group carries the head SHA, so runs on different commits never meet;
#   - events that re-check the same head (labeled, unlabeled, edited,
#     reopened, ready_for_review) also carry github.run_id: each runs in its
#     own group and can neither cancel nor be cancelled. The wrapper is green
#     whatever the label set (every verdict step is continue-on-error; only a
#     verifier that could not WRITE its checks fails it, #18764), and
#     the label types stay for #17036, not for the verdict.
#   - runs on a superseded commit finish (10 min cap) rather than being
#     cancelled; their verdict lands on that old SHA, which never merges.
# .github/scripts/test-required-check-concurrency.py enforces this.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}${{ contains(fromJSON('["labeled","unlabeled","edited","reopened","ready_for_review"]'), github.event.action) && format('-{0}-{1}', github.event.action, github.run_id) || '' }}
  cancel-in-progress: false

permissions:
  checks: write
  pull-requests: read
  packages: read

jobs:
  verify:
    name: verify PR contents
    # This pinned v0.4.3 mirror is linux/arm64 only. Reuse the native ARM64
    # override, never the general amd64 pool; forks stay on GitHub-hosted VMs.
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON(vars.HIVE_ARM64_RUNNER || '["ubuntu-24.04-arm"]') || 'ubuntu-24.04-arm' }}
    timeout-minutes: 10
    env:
      PR_VERIFIER_IMAGE: ghcr.io/hivecommons/pr-verifier@sha256:8c2b63817c4bfa7de510ab699b154637f27a42f87826c98083903daf2a539943
    steps:
      # A dispatched run has no pull_request payload. Rebuild one from the API
      # for the verifier image, and bail out (green, nothing verified, said so)
      # when the PR head is no longer this ref's tip: whoever moved it fired
      # the normal events, and a verdict on a non-head commit is noise.
      - name: Reconstruct the pull_request payload for a dispatched run
        if: github.event_name == 'workflow_dispatch'
        id: dispatch_event
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::pr_number must be a PR number, got '$PR_NUMBER'"
            exit 1
          fi
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr")"
          head_sha="$(jq -r '.head.sha' <<<"$pr")"
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::#${PR_NUMBER} comes from ${head_repo}; only same-repo PRs may be dispatched"
            exit 1
          fi
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo "::notice::#${PR_NUMBER} head is ${head_sha}, not this run's ${GITHUB_SHA}; the push that moved it fired pr-verifier itself — nothing verified here (#17036)."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          repo="$(gh api "repos/${GITHUB_REPOSITORY}")"
          jq -n --argjson pr "$pr" --argjson repo "$repo" \
            '{action: "synchronize", number: $pr.number, pull_request: $pr, repository: $repo}' \
            > "${RUNNER_TEMP}/pr-verifier-event.json"
          echo "event_path=${RUNNER_TEMP}/pr-verifier-event.json" >> "$GITHUB_OUTPUT"
      # Login and pull are advisory for the same reason the verification below
      # is: this check exists to report on PR CONTENTS, and a registry-side
      # failure (org rename, package visibility change, GHCR outage — #6085
      # documents 11 consecutive runs red on `manifest unknown` after the
      # kubestellar→hivecommons move) says nothing about the PR. Failing here
      # turns every open PR red at once before any content is examined, while
      # the one step allowed to have an opinion is continue-on-error. When the
      # image is unreachable the job logs it and stays green — an unreachable
      # verifier is strictly less informative than a verifier that ran and
      # objected, so it must not be treated more harshly.
      - name: Login to GHCR
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull verifier image
        id: pull
        continue-on-error: true
        run: |
          if [ "$RUNNER_ARCH" != "ARM64" ]; then
            echo "::error::The pinned PR Verifier requires native ARM64; HIVE_ARM64_RUNNER must not select $RUNNER_ARCH."
            exit 1
          fi
          docker pull "$PR_VERIFIER_IMAGE"
          image_platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$PR_VERIFIER_IMAGE")"
          if [ "$image_platform" != "linux/arm64" ]; then
            echo "::error::PR Verifier platform $image_platform does not match the required linux/arm64."
            exit 1
          fi
      - name: Report unreachable verifier image
        if: steps.pull.outcome != 'success'
        run: |
          echo "::warning::PR Verifier image $PR_VERIFIER_IMAGE was unavailable or incompatible — verification was SKIPPED, not passed. Inspect the pull/platform error; this is a runner/registry/image problem, not a PR problem (#6085)."
      - name: Verifier action
        if: steps.pull.outcome == 'success' && steps.dispatch_event.outputs.stale != 'true'
        id: verifier
        continue-on-error: true
        env:
          # A dispatched run presents itself to the image as the
          # pull_request_target run it stands in for (see dispatch_event).
          VERIFIER_EVENT_NAME: ${{ github.event_name == 'workflow_dispatch' && 'pull_request_target' || github.event_name }}
          VERIFIER_EVENT_PATH: ${{ steps.dispatch_event.outputs.event_path || github.event_path }}
        # The output is kept so the settle step below can name the reason
        # when the verifier could not write a check run (#18764).
        run: |
          set -o pipefail
          docker run --rm \
            -e INPUT_GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_ACTIONS="true" \
            -e GITHUB_EVENT_NAME="$VERIFIER_EVENT_NAME" \
            -e GITHUB_EVENT_PATH="/github/event.json" \
            -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -e GITHUB_REF="$GITHUB_REF" \
            -e GITHUB_WORKSPACE="/github/workspace" \
            -v "$VERIFIER_EVENT_PATH:/github/event.json:ro" \
            -v "$GITHUB_WORKSPACE:/github/workspace:ro" \
            "$PR_VERIFIER_IMAGE" 2>&1 | tee "${RUNNER_TEMP}/pr-verifier.log"
      - name: Report verifier failure
        if: steps.verifier.outcome == 'failure'
        run: |
          echo "::warning::PR Verifier returned a failure. This wrapper is advisory: inspect the individual PR checks and verifier log; a green wrapper does not prove those checks passed."
      # `PR Type` and `PR Issue` are required, and the verifier creates them
      # in_progress and then PATCHes the result. When that PATCH fails (404 on
      # #18667, both attempts of run 44069761061) the check runs stayed
      # in_progress for ever, the PR could never merge, and this job went
      # green (#18764). A required check must end in a definite state, so:
      #   - every PR Type / PR Issue check run in THIS run's check suite that
      #     is not completed is concluded `failure` with the reason; if that
      #     PATCH fails too, a completed `failure` run of the same name is
      #     created on the same head (the newest run of a name is the one
      #     GitHub and Tide score), and
      #   - this job FAILS whenever the verifier could not write a result.
      # Only this run's suite is touched: a sibling run on the same head owns
      # its own check runs. A verdict the verifier did write (pass or fail)
      # is never changed here. .github/scripts/test-pr-verifier-settle.py
      # exercises this step with a stubbed gh.
      - name: Settle PR Type and PR Issue check runs
        if: steps.verifier.outcome == 'success' || steps.verifier.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIER_LOG: ${{ runner.temp }}/pr-verifier.log
        run: |
          set -uo pipefail
          names_filter='.name == "PR Type" or .name == "PR Issue"'
          write_errors=""
          if [ -f "$VERIFIER_LOG" ]; then
            write_errors="$(grep -E 'unable to (create|get|reset|update|duplicate) check run' "$VERIFIER_LOG" || true)"
          fi
          if ! suite="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.check_suite_id')" \
            || ! [[ "$suite" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read this run's check suite, so PR Type / PR Issue may be left in progress. Re-run this job (#18764)."
            exit 1
          fi
          if ! stuck="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/check-suites/${suite}/check-runs?filter=all&per_page=100" \
            --jq ".check_runs[] | select(${names_filter}) | select(.status != \"completed\") | [.id, .name, .head_sha] | @tsv")"; then
            echo "::error::Could not list this run's PR Type / PR Issue check runs, so they may be left in progress. Re-run this job (#18764)."
            exit 1
          fi
          reason="PR Verifier could not record its result for this check, so it is marked failed instead of being left in progress."
          if [ -n "$write_errors" ]; then
            reason="${reason} Verifier said: $(printf '%s' "$write_errors" | sed -E 's/^.*(unable to)/\1/' | tr '\n' ' ')"
          fi
          reason="${reason} Re-run the PR Verifier workflow, or edit the PR title, to get a real result (#18764)."
          failed=0
          while IFS=$'\t' read -r id name head_sha; do
            [ -n "$id" ] || continue
            failed=1
            completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if gh api -X PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${id}" \
              -f status=completed -f conclusion=failure -f completed_at="$completed_at" \
              -f "output[title]=PR Verifier could not write its result" -f "output[summary]=$reason" >/dev/null; then
              echo "::error::${name} (check run ${id}) was left in progress by the verifier; concluded it as failure. ${reason}"
            elif gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" \
              -f name="$name" -f head_sha="$head_sha" -f status=completed -f conclusion=failure \
              -f completed_at="$completed_at" \
              -f "output[title]=PR Verifier could not write its result" -f "output[summary]=$reason" >/dev/null; then
              echo "::error::${name} (check run ${id}) was left in progress and could not be updated; created a failed ${name} check run on ${head_sha} in its place. ${reason}"
            else
              echo "::error::${name} (check run ${id}) is stuck in progress and could neither be updated nor replaced. ${reason}"
            fi
          done <<<"$stuck"
          if [ -n "$write_errors" ] && [ "$failed" -eq 0 ]; then
            failed=1
            echo "::error::PR Verifier could not write a check run result: $(printf '%s' "$write_errors" | tr '\n' ' ')(#18764)"
          fi
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "PR Type / PR Issue check runs from this run all reached a conclusion."
