name: PR Verifier

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

permissions:
  checks: write
  pull-requests: read
  packages: read

jobs:
  verify:
    name: verify PR contents
    # This pinned v0.4.3 mirror is linux/arm64 only. Reuse the native ARM64
    # override, never the general amd64 pool; forks stay on GitHub-hosted VMs.
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON(vars.HIVE_ARM64_RUNNER || '["ubuntu-24.04-arm"]') || 'ubuntu-24.04-arm' }}
    timeout-minutes: 10
    env:
      PR_VERIFIER_IMAGE: ghcr.io/hivecommons/pr-verifier@sha256:8c2b63817c4bfa7de510ab699b154637f27a42f87826c98083903daf2a539943
    steps:
      # Login and pull are advisory for the same reason the verification below
      # is: this check exists to report on PR CONTENTS, and a registry-side
      # failure (org rename, package visibility change, GHCR outage — #6085
      # documents 11 consecutive runs red on `manifest unknown` after the
      # kubestellar→hivecommons move) says nothing about the PR. Failing here
      # turns every open PR red at once before any content is examined, while
      # the one step allowed to have an opinion is continue-on-error. When the
      # image is unreachable the job logs it and stays green — an unreachable
      # verifier is strictly less informative than a verifier that ran and
      # objected, so it must not be treated more harshly.
      - name: Login to GHCR
        continue-on-error: true
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull verifier image
        id: pull
        continue-on-error: true
        run: |
          if [ "$RUNNER_ARCH" != "ARM64" ]; then
            echo "::error::The pinned PR Verifier requires native ARM64; HIVE_ARM64_RUNNER must not select $RUNNER_ARCH."
            exit 1
          fi
          docker pull "$PR_VERIFIER_IMAGE"
          image_platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$PR_VERIFIER_IMAGE")"
          if [ "$image_platform" != "linux/arm64" ]; then
            echo "::error::PR Verifier platform $image_platform does not match the required linux/arm64."
            exit 1
          fi
      - name: Report unreachable verifier image
        if: steps.pull.outcome != 'success'
        run: |
          echo "::warning::PR Verifier image $PR_VERIFIER_IMAGE was unavailable or incompatible — verification was SKIPPED, not passed. Inspect the pull/platform error; this is a runner/registry/image problem, not a PR problem (#6085)."
      - name: Verifier action
        if: steps.pull.outcome == 'success'
        id: verifier
        continue-on-error: true
        run: |
          docker run --rm \
            -e INPUT_GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_ACTIONS="true" \
            -e GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            -e GITHUB_EVENT_PATH="/github/event.json" \
            -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -e GITHUB_REF="$GITHUB_REF" \
            -e GITHUB_WORKSPACE="/github/workspace" \
            -v "$GITHUB_EVENT_PATH:/github/event.json:ro" \
            -v "$GITHUB_WORKSPACE:/github/workspace:ro" \
            "$PR_VERIFIER_IMAGE"
      - name: Report verifier failure
        if: steps.verifier.outcome == 'failure'
        run: |
          echo "::warning::PR Verifier returned a failure. This wrapper is advisory: inspect the individual PR checks and verifier log; a green wrapper does not prove those checks passed."
