# Generated by .github/scripts/generate-integration-ci.py; do not edit.
# Candidate-only technical CI. Ordinary and native CI remain in the source.
name: Integration candidate / v2 CI
'on':
  workflow_call: null
permissions:
  contents: read
concurrency:
  group: ${{ true && 'integration-ci' || github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
env:
  ACTIONS_CACHE_SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
  GO_CACHE_GUARD_BUILD_CACHE: ${{ 'job' || 'job' }}
jobs:
  required-context-scope:
    name: required context scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run-ci: ${{ steps.scope.outputs.run-ci }}
    steps:
    - name: Decide whether build-and-test needs the real CI lane
      id: scope
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [ "${{ true }}" = true ] &&
           { [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [[ "$GITHUB_REF" != refs/tags/hive-integration/* ]]; }; then
          echo "::error::Integration candidates require an explicitly dispatched immutable candidate tag"
          exit 1
        fi
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "run-ci=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        : > changed-files.txt
        page=1
        api_root="${GITHUB_API_URL:-https://api.github.com}"
        while :; do
          curl -fsSL               -H "Authorization: Bearer ${GITHUB_TOKEN}"               -H "Accept: application/vnd.github+json"               "${api_root}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100&page=${page}"               -o changed-files-page.json
          python3 - <<'PYFILES' >> changed-files.txt
        import json
        with open('changed-files-page.json', encoding='utf-8') as f:
            for item in json.load(f):
                print(item['filename'])
        PYFILES
          count=$(python3 - <<'PYCOUNT'
        import json
        with open('changed-files-page.json', encoding='utf-8') as f:
            print(len(json.load(f)))
        PYCOUNT
        )
          [ "$count" -lt 100 ] && break
          page=$((page + 1))
        done
        rm -f changed-files-page.json
        run=false
        while IFS= read -r path; do
          case "$path" in
            CHANGELOG.md|changelog.d/*|src/*|bin/*|config/*|README.md|docs/*|.github/scripts/*|.github/workflows/*)
              run=true
              ;;
          esac
        done < changed-files.txt
        echo "run-ci=${run}" >> "$GITHUB_OUTPUT"
        if [ "$run" = true ]; then
          echo "v2 build-and-test will run."
        else
          echo "No v2 CI paths changed; build-and-test will be reported as skipped/success."
        fi
  build-and-test:
    needs: required-context-scope
    if: ${{ always() && (needs.required-context-scope.result != 'success' || needs.required-context-scope.outputs.run-ci == 'true') && !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-gate/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: src
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Ensure PyYAML on self-hosted runners
      working-directory: .
      run: |
        python3 -c "import yaml" 2>/dev/null && exit 0
        # A stale or unreachable third-party apt index (e.g. a PPA 503) must not block the install.
        sudo apt-get update -qq || true
        sudo apt-get install -y -qq python3-yaml && exit 0
        # Noble (Python 3.12) refuses --user installs under PEP 668 without --break-system-packages.
        python3 -m pip install --user -q --break-system-packages pyyaml \
          || { curl -sS https://bootstrap.pypa.io/get-pip.py | python3 - --user -q --break-system-packages && python3 -m pip install --user -q --break-system-packages pyyaml; }
    - name: Check readonly candidate CI generation
      working-directory: .
      run: python3 .github/scripts/generate-integration-ci.py --check
    - name: Warm shared Go tool cache (serialize the cold-cache population)
      run: bash "$GITHUB_WORKSPACE/.github/scripts/go-toolcache-guard.sh"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        cache: false
        go-version-file: src/go.mod
    - name: Guard shared Go cache (fall back when the runner volume is full)
      run: bash "$GITHUB_WORKSPACE/.github/scripts/go-cache-guard.sh"
    - name: Download Go modules (retry transient proxy resets)
      uses: ./.github/actions/go-mod-download-retry
    - name: Restore warm Go build cache
      if: ${{ !contains('["ubuntu-latest"]', 'hive-runners') }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/go-build
        key: hive-go-build-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: |
          hive-go-build-${{ runner.os }}-${{ runner.arch }}-
    - name: Build
      run: go build ./cmd/hive/
    - name: Build crux (root host and standalone module)
      run: |
        go build -o /dev/null ./cmd/crux
        (cd crux && GOWORK=off go build -o /dev/null ./cmd/crux)
    - name: Crux module smoke (crux serve over a unix socket)
      working-directory: src/crux
