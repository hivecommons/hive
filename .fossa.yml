# FOSSA CLI configuration for hivecommons/hive.
# Reference: https://github.com/fossas/fossa-cli/blob/master/docs/references/files/fossa-yml.md
version: 3

project:
  # Stable project name in the CNCF FOSSA org (the action's `project:` input
  # mirrors this so UI and CI agree).
  name: hivecommons/hive
  # Team NAME in the CNCF FOSSA org (team id 207492). Only applied when the
  # project is first created; later changes must be made in the FOSSA UI.
  team: Hive Commons
  url: https://github.com/hivecommons/hive
  link: https://hivecommons.dev

# The Go workspace lives under src/ (src/go.work: root module + src/crux).
# FOSSA auto-discovers every manifest; list the shipped components explicitly
# so a future re-layout does not silently drop one. Shipped: the two Go
# modules, the spoke's runtime Node proxy (src/proxy) and the dashboard.
# Deliberately out of scope as repo tooling, not shipped code:
# discord/package.json and .github/scripts/package.json.
targets:
  only:
    - type: gomod
      path: src
    - type: gomod
      path: src/crux
    - type: npm
      path: src/proxy
    - type: npm
      path: dashboard

paths:
  exclude:
    - src/test
    - src/examples
    - examples
    - docs
