services:
  gateway:
    image: nginx:alpine
    container_name: hive-gateway
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "7681:7681"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - gateway-upstream:/etc/nginx/upstream
    depends_on:
      hive:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  hive:
    image: ghcr.io/kubestellar/hive:v2-latest
    build:
      context: ..
      dockerfile: v2/Dockerfile
      args:
        GIT_HASH: ${GIT_HASH:-unknown}
        GIT_SHORT: ${GIT_SHORT:-unknown}
    container_name: hive
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    expose:
      - "3001"
      - "3002"
      - "7681"
    volumes:
      - ./hive.yaml:/etc/hive/hive.yaml
      - hive-data:/data
      - ./secrets:/secrets:ro
    environment:
      - HIVE_GITHUB_TOKEN=${HIVE_GITHUB_TOKEN}
      - HIVE_DASHBOARD_TOKEN=${HIVE_DASHBOARD_TOKEN}
      - NTFY_SERVER=${NTFY_SERVER}
      - NTFY_TOPIC=${NTFY_TOPIC}
      - HIVE_LEVEL=${HIVE_LEVEL:-}
      - HIVE_REPO=${HIVE_REPO:-}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3002/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s

  watchtower:
    # Pinned to v1.7.1 by BOTH tag AND digest to prevent supply-chain risk.
    # The image mounts the Docker socket, so a compromised image = full host
    # control. Pin by digest so a tag repoint or malicious registry push cannot
    # silently deliver a different image. Bump deliberately by verifying the
    # release at https://github.com/containrrr/watchtower/releases and updating
    # both the tag AND the digest below (compute with:
    #   docker inspect --format='{{index .RepoDigests 0}}' containrrr/watchtower:1.7.1
    # or check the release announcement for the canonical digest).
    image: containrrr/watchtower:1.7.1@sha256:6dd50763bbd632a83cb154d5451700530d1e44200b268a4e9488fefdfcf2b038
    container_name: hive-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_LABEL_ENABLE=true
    profiles:
      - auto-update

volumes:
  hive-data:
  gateway-upstream:
