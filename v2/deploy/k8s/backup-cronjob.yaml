# Hive hub disaster-recovery backup.
#
# Captures hub state, the four out-of-PVC Kubernetes Secrets, and every spoke's
# authoritative config (hive.yaml.runtime, gh-app-key*.pem, hive-id), encrypts the
# result with AES-256-GCM and uploads it to OCI Object Storage.
#
# See docs/HUB_DISASTER_RECOVERY.md before deploying. In particular:
#   HIVE_BACKUP_KEY MUST be escrowed OUTSIDE the cluster (password manager /
#   offline). A backup encrypted with a key that only exists inside the hub is
#   worthless after the hub is destroyed.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hive-hub-backup
  namespace: hive-hub
---
# Least-privilege RBAC (see #3708). The backup reads Secrets ONLY in its own
# namespace (hive-hub) and execs into spoke pods that live in per-spoke
# namespaces across the cluster.
#
# Secrets access is intentionally NOT cluster-wide: it is granted through a
# namespaced Role + RoleBinding scoped to hive-hub, so a compromised backup pod
# cannot enumerate or read Secrets in any other namespace.
#
# pods, pods/exec, and namespaces remain in a ClusterRole because spoke pods
# live in arbitrary per-spoke namespaces (e.g. vllm-d) that cannot be
# enumerated ahead of time, and `namespaces` is itself a cluster-scoped
# resource. This ClusterRole no longer grants any secrets access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hive-hub-backup
  namespace: hive-hub
rules:
  # Read the four out-of-PVC Secrets that live in hive-hub (backup key is
  # injected via env; these are the Secrets the backup archives directly).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hive-hub-backup
  namespace: hive-hub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hive-hub-backup
subjects:
  - kind: ServiceAccount
    name: hive-hub-backup
    namespace: hive-hub
---
# Minimal ClusterRole: only what genuinely must reach across namespaces.
# Spoke pods live in per-spoke namespaces, so listing pods and creating
# pod/exec sessions requires cluster scope, as does listing namespaces to
# discover spokes. No secrets access here (moved to the namespaced Role above).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hive-hub-backup
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hive-hub-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hive-hub-backup
subjects:
  - kind: ServiceAccount
    name: hive-hub-backup
    namespace: hive-hub
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hive-hub-backup
  namespace: hive-hub
  labels:
    app.kubernetes.io/name: hive-hub-backup
    app.kubernetes.io/component: backup
spec:
  # 03:17 UTC daily — off the hour to avoid contending with other cron traffic.
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      # A hung spoke exec must not leave the job running until the next fire.
      activeDeadlineSeconds: 3600
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: hive-hub-backup
          restartPolicy: Never
          containers:
            - name: backup
              # Digest-pinned (see #3709) so a mutable-tag poisoning attack on
              # v4-latest cannot silently deliver a hostile backup container.
              # Recompute the digest deliberately at each release, matching the
              # Watchtower pinning pattern.
              image: ghcr.io/kubestellar/hive:v4-latest@sha256:e3f9ee8fd3852499f732414cd9b85d9278103e3e8ac7fb8629cf14488b90ec23
              command: ["/usr/local/bin/hive-backup", "run"]
              env:
                # AES-256 key for the archive. MUST be escrowed outside the
                # cluster. No default: an unset key aborts the backup rather
                # than writing plaintext.
                - name: HIVE_BACKUP_KEY
                  valueFrom:
                    secretKeyRef:
                      name: hive-hub-backup-key
                      key: backup-key
                - name: HIVE_BACKUP_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: hive-hub-backup-config
                      key: bucket
                - name: HIVE_BACKUP_RETENTION
                  valueFrom:
                    configMapKeyRef:
                      name: hive-hub-backup-config
                      key: retention
              # OCI credentials for Object Storage, reusing the Secret the hub
              # already uses for File Storage provisioning.
              envFrom:
                - secretRef:
                    name: oci-api-key
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: kubeconfigs
                  mountPath: /etc/hive/kubeconfigs
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            # The hub PVC, mounted read-only: the backup never writes to it.
            - name: data
              persistentVolumeClaim:
                claimName: hive-hub-data-rwx
                readOnly: true
            # Kubeconfigs for remote spoke clusters (e.g. vllm-d). Without
            # this, spokes on remote clusters cannot be captured.
            - name: kubeconfigs
              secret:
                secretName: hive-hub-kubeconfigs
                # SECURITY (audit N5, CWE-732/522): default projection is 0644.
                # These kubeconfigs carry cluster-admin credentials for remote
                # spokes. 0400 (not the 0440 used for the hive pod) because this
                # is a single-purpose backup pod running as the image's default
                # user with no agent UIDs in it — nothing here needs group read.
                defaultMode: 0400
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-hub-backup-config
  namespace: hive-hub
data:
  bucket: "hive-hub-backups"
  retention: "30"
