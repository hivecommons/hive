apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive
  namespace: hive
  labels:
    app.kubernetes.io/name: hive
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hive
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hive
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: hive
      securityContext:
        # Limit syscall attack surface without breaking su-exec UID switching.
        # runAsNonRoot is intentionally omitted: the entrypoint starts as root
        # before su-exec drops to dev (UID 1001) and then to per-agent UIDs.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hive
          image: hive:latest
          args:
            - "--config"
            - "/etc/hive/hive.yaml"
          ports:
            - name: dashboard
              containerPort: 3002
              protocol: TCP
            - name: api
              containerPort: 3002
              protocol: TCP
            - name: ttyd
              containerPort: 7681
              protocol: TCP
          env:
            - name: HIVE_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hive-secrets
                  key: HIVE_GITHUB_TOKEN
                  optional: true
            - name: HIVE_DASHBOARD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hive-secrets
                  key: HIVE_DASHBOARD_TOKEN
                  optional: true
            - name: HIVE_VLLM_ENDPOINT
              value: "http://vllm-svc.hive-inference.svc.cluster.local:8000"
            - name: HIVE_LLMD_ENDPOINT
              value: "http://llm-d-epp.hive-inference.svc.cluster.local:8000"
            - name: HIVE_VLLM_MODELS
              value: "qwen2.5-0.5b-instruct"
            - name: HIVE_LLMD_MODELS
              value: "qwen2.5-0.5b-instruct"
          volumeMounts:
            - name: config
              mountPath: /etc/hive
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: data
              mountPath: /data
          # startupProbe holds the liveness clock off until the process has
          # finished booting, so a slow start can never race the liveness
          # timer into a restart loop. failureThreshold x periodSeconds
          # (30 x 5s = 150s) is the boot budget.
          startupProbe:
            httpGet:
              path: /api/health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            # /api/livez checks that the HTTP server responds AND that the
            # heartbeat loop is still *attempting* sends — i.e. it only fails
            # when the process is genuinely wedged, which a restart fixes.
            # It deliberately does NOT fail on a stale heartbeat: an
            # unreachable hub is a connectivity problem no restart can fix,
            # and gating liveness on it crash-loops healthy pods on
            # firewalled clusters. That signal lives in /api/health/deep.
            # See pkg/dashboard/server.go handleLivez.
            httpGet:
              path: /api/livez
              port: api
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            # Drop NET_RAW: hive never sends raw packets. Keep SETUID/SETGID
            # and allowPrivilegeEscalation because the SUID su-exec helper
            # switches from dev (UID 1001) to per-agent UIDs at runtime.
            # readOnlyRootFilesystem is not set: hive writes logs/data to disk.
            allowPrivilegeEscalation: true
            capabilities:
              drop:
                - NET_RAW
      volumes:
        - name: config
          configMap:
            name: hive-config
        - name: secrets
          secret:
            secretName: hive-secrets
            optional: true
        - name: data
          persistentVolumeClaim:
            claimName: hive-data
