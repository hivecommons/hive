apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive
  namespace: hive
  labels:
    app.kubernetes.io/name: hive
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hive
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hive
        app.kubernetes.io/component: controller
    spec:
      containers:
        - name: hive
          image: hive:latest
          # SECURITY: drop the ambient root capability set down to only what the
          # runtime actually needs, and pin the default seccomp profile. This
          # container CANNOT run fully unprivileged: it starts as root to set up
          # the ACMM MITM proxy's iptables (NET_ADMIN) and to switch each agent to
          # its own UID via su-exec (SETUID/SETGID/SETPCAP), and it writes agent
          # scratch state to /tmp, /run and /home — so runAsNonRoot and
          # readOnlyRootFilesystem are intentionally NOT set (they would break
          # agent launch). Everything else is dropped.
          #
          # allowPrivilegeEscalation is deliberately NOT set to false (C6): the
          # agent-UID switch runs through the SUID su-exec helper, and
          # `allowPrivilegeEscalation: false` sets the kernel no_new_privs bit,
          # which DISABLES all SUID binaries — it would break agent launch
          # outright. C6 is instead mitigated in the image (v2/Dockerfile): the
          # su-exec source is pinned by commit SHA + SHA256-verified, and the
          # helper is chmod 4750 root:hive-launch (launcher-group-only, not
          # world-exec 4755), so only the `dev` launcher — not agent UIDs — can
          # exec it. Fully removing SUID (dev switches UIDs via CAP_SETUID
          # instead) is not viable here: it needs ambient/inheritable caps that
          # the hub's netadmin_reconcile would wipe when it JSON-Patch-replaces
          # the whole securityContext with {NET_ADMIN} on drift. See PR body.
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN # ACMM proxy iptables redirect of outbound :443
                - SETUID # su-exec dev->per-agent UID switch
                - SETGID
                - SETPCAP
                - CHOWN # chown per-agent dirs/beads to the agent UID
                - DAC_OVERRIDE
          args:
            - "--config"
            - "/etc/hive/hive.yaml"
          ports:
            - name: dashboard
              containerPort: 3002
              protocol: TCP
            - name: api
              containerPort: 3002
              protocol: TCP
            # ttyd (:7681) is loopback-only inside the pod (reached via the
            # authenticating /terminal proxy), so it is not declared as a
            # containerPort — nothing should target it directly.
          env:
            - name: HIVE_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hive-secrets
                  key: HIVE_GITHUB_TOKEN
                  optional: true
            - name: HIVE_DASHBOARD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hive-secrets
                  key: HIVE_DASHBOARD_TOKEN
                  optional: true
            - name: HIVE_VLLM_ENDPOINT
              value: "http://vllm-svc.hive-inference.svc.cluster.local:8000"
            - name: HIVE_LLMD_ENDPOINT
              value: "http://llm-d-epp.hive-inference.svc.cluster.local:8000"
            - name: HIVE_VLLM_MODELS
              value: "qwen2.5-0.5b-instruct"
            - name: HIVE_LLMD_MODELS
              value: "qwen2.5-0.5b-instruct"
          volumeMounts:
            - name: config
              mountPath: /etc/hive
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: data
              mountPath: /data
          # startupProbe holds the liveness clock off until the process has
          # finished booting, so a slow start can never race the liveness
          # timer into a restart loop. failureThreshold x periodSeconds
          # (30 x 5s = 150s) is the boot budget.
          startupProbe:
            httpGet:
              path: /api/health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            # /api/livez checks that the HTTP server responds AND that the
            # heartbeat loop is still *attempting* sends — i.e. it only fails
            # when the process is genuinely wedged, which a restart fixes.
            # It deliberately does NOT fail on a stale heartbeat: an
            # unreachable hub is a connectivity problem no restart can fix,
            # and gating liveness on it crash-loops healthy pods on
            # firewalled clusters. That signal lives in /api/health/deep.
            # See pkg/dashboard/server.go handleLivez.
            httpGet:
              path: /api/livez
              port: api
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: hive-config
        - name: secrets
          secret:
            secretName: hive-secrets
            optional: true
        - name: data
          persistentVolumeClaim:
            claimName: hive-data
