apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive
  namespace: hive
  labels:
    app.kubernetes.io/name: hive
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hive
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hive
        app.kubernetes.io/component: controller
    spec:
      containers:
        - name: hive
          image: hive:latest
          # SECURITY: drop the ambient root capability set down to only what the
          # runtime actually needs, and pin the default seccomp profile. This
          # container CANNOT run fully unprivileged: it starts as root to set up
          # the ACMM MITM proxy's iptables (NET_ADMIN) and to switch each agent to
          # its own UID via su-exec (SETUID/SETGID/SETPCAP), and it writes agent
          # scratch state to /tmp, /run and /home — so runAsNonRoot and
          # readOnlyRootFilesystem are intentionally NOT set (they would break
          # agent launch). Everything else is dropped.
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN # ACMM proxy iptables redirect of outbound :443
                - SETUID # su-exec dev->per-agent UID switch
                - SETGID
                - SETPCAP
                - CHOWN # chown per-agent dirs/beads to the agent UID
                - DAC_OVERRIDE
          args:
            - "--config"
            - "/etc/hive/hive.yaml"
          ports:
            - name: dashboard
              containerPort: 3002
              protocol: TCP
            - name: api
              containerPort: 3002
              protocol: TCP
            # ttyd (:7681) is loopback-only inside the pod (reached via the
            # authenticating /terminal proxy), so it is not declared as a
            # containerPort — nothing should target it directly.
          env:
            - name: HIVE_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hive-secrets
                  key: HIVE_GITHUB_TOKEN
                  optional: true
            - name: HIVE_DASHBOARD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hive-secrets
                  key: HIVE_DASHBOARD_TOKEN
                  optional: true
            - name: HIVE_VLLM_ENDPOINT
              value: "http://vllm-svc.hive-inference.svc.cluster.local:8000"
            - name: HIVE_LLMD_ENDPOINT
              value: "http://llm-d-epp.hive-inference.svc.cluster.local:8000"
            - name: HIVE_VLLM_MODELS
              value: "qwen2.5-0.5b-instruct"
            - name: HIVE_LLMD_MODELS
              value: "qwen2.5-0.5b-instruct"
          volumeMounts:
            - name: config
              mountPath: /etc/hive
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: data
              mountPath: /data
          livenessProbe:
            # /api/livez includes a heartbeat-staleness check (in addition to
            # everything /api/health checks) so a heartbeat goroutine that
            # dies silently while the HTTP server stays up gets caught and
            # the pod restarted, instead of staying 1/1 Running forever with
            # the hub showing it offline. See pkg/dashboard/server.go
            # handleLivez. Hives with no hub configured are unaffected.
            httpGet:
              path: /api/livez
              port: api
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: hive-config
        - name: secrets
          secret:
            secretName: hive-secrets
            optional: true
        - name: data
          persistentVolumeClaim:
            claimName: hive-data
