worker_processes 1;

events {
    worker_connections 256;
}

http {
    server_tokens off;

    upstream hive_api {
        server hive:3001;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # SECURITY (#3906): rate-limit auth-sensitive endpoints to prevent brute-force
    # and token-enumeration attacks. Two zones:
    #   auth_limit   — strict, covers OAuth token exchange and dashboard login:
    #                  5 requests/minute per IP with a burst of 10. Exceeding the
    #                  burst returns 429 (Too Many Requests).
    #   api_limit    — permissive background cap: 120 req/s per IP with burst=200
    #                  to absorb legitimate heavy API use (live-tail, SSE) while
    #                  still blocking sustained floods.
    # Zone memory: 10 MB supports ~160,000 concurrent IPs; negligible overhead.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/s;
    limit_req_status 429;

    # Compress JSON API responses (70-90% reduction)
    gzip on;
    gzip_types application/json text/plain text/event-stream;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_vary on;

    server {
        listen 3001;
        # Also bind the IPv6 loopback/wildcard. This file is mounted over
        # /etc/nginx/nginx.conf and has no `include /etc/nginx/conf.d/*.conf`,
        # so the nginx:alpine 10-listen-on-ipv6-by-default.sh fixup (which only
        # patches conf.d/default.conf) never reaches this server block. Without
        # this line, anything resolving "localhost" to ::1 -- container
        # healthchecks, IPv6 clients -- gets ECONNREFUSED. See issue #2774.
        listen [::]:3001;

        location /api/auth/ {
            # SECURITY (#3906): strict rate-limiting on the OAuth device-flow
            # callback and related auth endpoints. 5 req/min burst=10 per IP;
            # exceeding the burst yields 429. This does not affect legitimate
            # interactive flows: a real browser login touches this path once.
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://hive_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_hide_header Cache-Control;
            proxy_hide_header Pragma;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

            proxy_intercept_errors on;
            error_page 502 503 504 =503 @api_error;
        }

        location /api/ {
            # SECURITY (#3906): background rate cap for all other API paths.
            # 120 req/s with burst=200 allows legitimate heavy use (SSE, live-tail,
            # WebSocket upgrades) while blocking sustained floods.
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://hive_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_hide_header Cache-Control;
            proxy_hide_header Pragma;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;

            # Defence-in-depth headers (issue #3822). X-Frame-Options is
            # deliberately NOT set here: the Go dashboard (server.go) already
            # sets it per-route (DENY, or omitted in favour of a CSP
            # frame-ancestors allowlist for /api/snapshot/frame-ancestors), and
            # a blanket nginx XFO would collide with that per-document logic.
            # CSP is out of scope here too -- tracked separately as #3315.
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

            proxy_intercept_errors on;
            error_page 502 503 504 =503 @api_error;
        }

        location @api_error {
            default_type application/json;
            return 503 '{"error":"service starting up, please retry","ok":false}';
        }

        location / {
            proxy_pass http://hive_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_hide_header Cache-Control;
            proxy_hide_header Pragma;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;

            # Defence-in-depth headers (issue #3822). See the /api/ location
            # above for why X-Frame-Options and CSP are intentionally absent.
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        }
    }
}

# SECURITY: the raw stream{} proxy that exposed ttyd (:7681) directly, with no
# authentication, has been removed. ttyd is a writable terminal into the
# credential-holding container; its only reachable path is now the Node proxy's
# /terminal route (which authenticates first) and ttyd binds to loopback. Do NOT
# reintroduce a direct :7681 proxy — it bypasses that gate.
